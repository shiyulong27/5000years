# 人物详卷非法夹具（schema v1）。
# 集中覆盖 TASK-002 校验器必须拦截的每类错误；每处错误以 err: 注释标号。
# 「invalid-sample」人物本身由测试用合成 figures 数据提供。
schema_version: 2            # err-01 schema_version 必须为 1
id: invalid-sample

profile:
  gender: 未知性别            # err-02 gender 不在 GENDERS 枚举
  fields: [文学, 美食]        # err-03 fields 含不在 FIELDS 内的值
  roles: "诗人"              # err-04 roles 须为数组
  summary: 测试用非法人物

timeline:
