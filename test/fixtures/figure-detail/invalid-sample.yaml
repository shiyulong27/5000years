    stage_order: 1
    title: 未知却带年份
    date:
      text: 不详
      year: 701              # err-05 precision=未知 时禁止携带 year
      precision: 未知
    summary: 摘要
  - stage: 阶段二
    stage_order: 2
    title: 范围倒置
    date:
      text: 720—710年之间
      year: 720
      range_end: 710         # err-06 范围起止倒置（year > range_end）
      precision: 范围
    summary: 摘要
    related_event_id: no-such-event   # err-07 关联事件不存在
    source_ids: [src-test-001]

