  original_text: |
    大荒东北隅中，有山名曰凶犁土丘。应龙处南极，杀蚩尤与夸父，不得复上，故下数旱，旱而为应龙之状，乃得大雨。
  translation: |
    在大荒的东北角，有一座凶犁土丘山。应龙居住在最南极，大战中诛杀了蚩尤与夸父，因神力消耗无法重返天庭。人间如果遭遇大旱，只要做成应龙的模样祈雨，便能降下滂沱大雨。
