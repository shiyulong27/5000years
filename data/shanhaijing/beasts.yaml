- id: beast-qiongqi
  name: 穷奇
  pinyin: qióng qí
  category: 异兽
  book: 海内北经
  mountain: 邽山
  auspicious: 凶兆
  appearance: 其状如虎，有翼，身披刺猬毛，叫声如犬吠。
  abilities: 喜助恶除善，食人从首始；上古四大凶兽之一。
  summary: 抑善扬恶的凶烈异兽，长着翅膀的老虎，若见人争斗便食正直之士，被称为上古四凶之一。
  original_text: |
    穷奇状如虎，有翼，食人从首始，所食被发，在蜪犬北。一曰从足。
  translation: |
    穷奇外形像老虎，长着一对翅膀，吃人时从头部开始吞食，被吃的人披散着头发。另一种说法是从脚开始吃。
