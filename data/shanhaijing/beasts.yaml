- id: beast-dijiang
  name: 帝江 (浑沌)
  pinyin: dì jiāng (hùn dùn)
  category: 灵神
  book: 西山经
  mountain: 天山
  auspicious: 祥瑞
  appearance: 其状如黄囊，赤如丹火，六足四翼，浑敦无面目。
  abilities: 通晓歌舞，为天山神鸟，天然混沌一体。
  summary: 西方天山上的神鸟，通体赤红如火，六只脚四只翅膀，虽无耳目五官，却极其懂得音律歌舞。
  original_text: |
    又西三百五十里，曰天山，多金玉，有青雄黄。英水出焉，而西南流注于汤谷。有神焉，其状如黄囊，赤如丹火，六足四翼，浑敦无面目，是识歌舞，实为帝江也。
  translation: |
    再向西三百五十里，是天山。山中多金玉和雄黄。山里有一种神，形状像黄色口袋，浑身红如炽烈炭火，长着六只脚和四只翅膀，混沌一片没有五官面目，却通晓歌舞音律，它就是帝江。
  tags:
    - 天山
    - 六足四翼
    - 浑敦
    - 识歌舞
    - 神鸟
  image: /images/shanhaijing/digital_art/dijiang.png
