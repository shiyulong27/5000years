- id: beast-jiuweihu
  name: 九尾狐
  pinyin: jiǔ wěi hú
  category: 异兽
  book: 南山经
  mountain: 青丘之山
  auspicious: 祥瑞
  appearance: 其状如狐而九尾，其音如婴儿。
  abilities: 能食人；食者不蛊（不逢妖邪毒气），佩之不惑。
  summary: 青丘之山著名神兽，兼具祥瑞与勇猛之气，上古部族图腾，象征子孙繁衍与吉祥。
  original_text: |
    又东三百里，曰青丘之山，其阳多玉，其阴多青䨼。有兽焉，其状如狐而九尾，其音如婴儿，能食人，食者不蛊。
  translation: |
    再往东三百里，是青丘山。山南盛产美玉，山北多产青垩石。山中有一种野兽，形状像狐狸却长着九条尾巴，啼叫声宛如婴儿哭泣，能吃人，人吃了它的肉就可以不受妖邪蛊惑之气侵害。
  tags:
    - 九尾
    - 祥瑞
    - 食者不蛊
    - 青丘
    - 狐仙
  image: /images/shanhaijing/digital_art/jiuweihu.png
