- id: beast-baize
  name: 白泽
  pinyin: bái zé
  category: 异兽
  book: 传世山海补遗
  mountain: 东海流沙
  auspicious: 祥瑞
  appearance: 虎首朱发，身具双翼与多目，头顶独角。
  abilities: 能言语，通晓天下万物神鬼精怪之形貌名讳与驱避之道。
  summary: 至高无上的祥瑞圣兽，逢圣王出世而现身，曾献《白泽图》助黄帝降服天下万千鬼神。
  original_text: |
    东望山有泽，兽名白泽，能言，达万物之情，晓天下鬼神万物之状貌。黄帝巡狩至海滨，白泽出，能言，达于万物之情。
  translation: |
    东望山有神兽名为白泽，能通晓人类语言，洞彻天地万物的情理与秘密，熟知天下万种鬼神精怪的相貌和驱避法门。黄帝巡游至海边时白泽现身，作图以昭示天下。
