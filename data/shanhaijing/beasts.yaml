- id: beast-zhulong
  name: 烛龙 (烛九阴)
  pinyin: zhú lóng (zhú jiǔ yīn)
  category: 灵神
  book: 大荒北经
  mountain: 钟山
  auspicious: 灵神
  appearance: 人面蛇身而赤，身长千里，直目正乘。
  abilities: 视为昼，瞑为夜，吹为冬，呼为夏；不饮不食不息，息为大风。
  summary: 钟山之神，照耀极北无日之地的创世级自然神祇，睁眼即为白天，闭眼即为黑夜。
  original_text: |
    西北海之外，赤水之北，有章尾山。有神，人面蛇身而赤，直目正乘，其瞑乃晦，其视乃明，不食不寝不息，风雨是谒。是烛九阴，是谓烛龙。
  translation: |
    在西北海的外围，赤水的北岸，有座章尾山。山中有位神人，长着人的面孔、红色的蛇身，两眼垂直正向。他闭上眼天地就陷入黑暗，睁开眼天地就一片光明；不进食、不睡觉、不呼吸，能招来狂风暴雨。这就是照亮九阴幽冥的烛龙。
  tags:
    - 创世神
    - 钟山
    - 昼夜之神
    - 千里红蛇
    - 司时
  image: /images/shanhaijing/digital_art/zhulong.png
  video:
    title: 动画科普《山海经·钟山之神烛九阴》
    url: https://www.bilibili.com/video/BV1sW411j77u
    embed_url: https://player.bilibili.com/player.html?isOutside=true&bvid=BV1sW411j77u
  image_ancient: /images/shanhaijing/beasts/zhulong.png
  image_refined: /images/shanhaijing/digital_art/zhulong.png
- id: beast-taotie
  name: 饕餮 (狍鸮)
  pinyin: tāo tiè (páo xiāo)
  category: 异兽
  book: 北山经
  mountain: 钩吾之山
  auspicious: 凶兆
  appearance: 其状如羊身人面，其目在腋下，虎齿人爪，其音如婴儿。
  abilities: 贪食无厌，食人；上古四大凶兽之一。
  summary: 钩吾之山的大凶之兽，后世常铸于青铜礼器之上，作为威严与戒贪的象征图腾。
  original_text: |
    钩吾之山，其上多玉，其下多铜。有兽焉，其状如羊身人面，其目在腋下，虎齿人爪，其音如婴儿，名曰狍鸮，是食人。
  translation: |
    钩吾山上盛产玉石，山下多产铜矿。山里有一种野兽，形状为羊身人面，眼睛长在腋窝下面，长着老虎的牙齿和人的手爪，叫声像婴儿啼哭，名叫狍鸮（饕餮），会吃人。
  tags:
