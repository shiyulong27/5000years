    尧在位七十年，祗支之国献重明之鸟，一名双睛，言又目中各有两眸。状如鸡，鸣似凤。时解落毛羽，肉翮而飞。能搏逐猛兽虎狼，使妖灾群恶不能为害。
  translation: |
    尧帝在位七十年时，祗支国进献重明鸟，又称“双睛”，因为每只眼睛里都有两个瞳孔。形状像公鸡，啼叫如同凤凰。它能搏杀猛虎豺狼，使天下妖邪恶气无法为害百姓。
