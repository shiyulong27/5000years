- id: beast-luwu
  name: 陆吾 (开明之神)
  pinyin: lù wú
  category: 灵神
  book: 西山经
  mountain: 昆仑之丘
  auspicious: 灵神
  appearance: 其神状虎身而九尾，人面而虎爪。
  abilities: 司天之九部及帝之囿时，威镇昆仑丘。
  summary: 天帝在昆仑天都的大总管，统管天上九域及天帝的花园神苑，庄严神圣。
  original_text: |
    西南四百里，曰昆仑之丘，是实惟帝之下都，神陆吾司之。其神状虎身而九尾，人面而虎爪；是神也，司天之九部及帝之囿时。
  translation: |
    向西南四百里是昆仑之丘，这里正是天帝在人间的都城，由神祇陆吾统管。陆吾神虎身九尾，人面虎爪，执掌天界九大区域及天帝花园的节气四时。
  tags:
