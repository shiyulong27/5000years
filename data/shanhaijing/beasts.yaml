- id: beast-huashe
  name: 化蛇
  pinyin: huà shé
  category: 异兽
  book: 中山经
  mountain: 阳山
  auspicious: 凶兆
  appearance: 其状如人面而豺身，鸟翼而蛇行。
  abilities: 其音如叱呼，见则其邑大水。
  summary: 阳山之凶物，人面豺身，生有飞鸟羽翼却如蛇般贴地游走，叫声如人在厉声斥责，是引发滔天洪水的大凶异兆。
  original_text: |
    又西二百里，曰阳山，多石，无草木。阳水出焉，而北流注于伊水。其中多化蛇，其状如人面而豺身，鸟翼而蛇行，其音如叱呼，见则其邑大水。
  translation: |
    再往西二百里是阳山，满山乱石，寸草不生。阳水发源于此，向北流入伊水。水中有很多化蛇，长着人一样的脸孔、豺狼的躯体、飞鸟的双翅，像蛇一样游行，叫声宛如厉声呼喝，出现则当地必遭特大洪水。
  tags:
    - 大水之兆
    - 人面蛇身
    - 飞翅
    - 凶异
    - 阳山
  image: /images/shanhaijing/digital_art/huashe.png
