- id: beast-bifang
  name: 毕方
  pinyin: bì fāng
  category: 神禽
  book: 西山经
  mountain: 章莪之山
  auspicious: 凶兆
  appearance: 其状如鹤，一足，赤文青质而白喙。
  abilities: 见则其邑有讹火（火灾）；侍从黄帝出巡。
  summary: 木精与火灵化身的神鸟，青色羽毛布满红斑，仅生独足，它的出现往往预示着不寻常的火灾。
  original_text: |
    章莪之山，无草木，多瑶碧。有鸟焉，其状如鹤，一足，赤文青质而白喙，名曰毕方，其鸣自叫也，见则其邑有讹火。
  translation: |
    章莪山寸草不生，多美玉。山中有一种鸟，形状像鹤却只有一只脚，青绿色的羽毛上长着红斑，白色的嘴喙，名叫毕方。它的叫声如同呼唤自己的名字，一旦出现，当地就会发生离奇大火。
  tags:
