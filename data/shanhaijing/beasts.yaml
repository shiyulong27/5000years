  name: 鯥
  pinyin: lù
  category: 水族
  book: 南山经
  mountain: 柢山
  auspicious: 祥瑞
  appearance: 其状如牛，陵居，蛇尾有翼，其羽在魼下，其音如留牛。
  abilities: 冬死而夏生，食之无肿疾（吃了它可以不生痈肿脓疮）。
  summary: 柢山彭水中的陆行两栖神鱼，牛身蛇尾生双翅，冬眠若死夏则复苏，是治疗痈肿疮毒的上古神药。
  original_text: |
    柢山，多水，无草木。彭水出焉，而西流注于芘湖之水，中多鯥，其状如牛，陵居，蛇尾有翼，其羽在魼下，其音如留牛，冬死而夏生，食之无肿疾。
  translation: |
    柢山到处是水，没有草木。彭水发源于此西流注入芘湖。水中有很多鯥鱼，外形像牛却居住在陆地上，蛇尾生翅，翅膀长在肋下，叫声如小牛鸣啼，冬天冬眠休眠夏天苏醒复活，吃了它的肉不会生毒疮痈肿。
