  original_text: |
    英鞮之山，涴水出焉，而南流注于陵羊之泽。其中多冉遗之鱼，鱼身而蛇首六足，其目如马耳，食之使人不眯，可以御凶。
  translation: |
    英鞮山中，涴水发源于此南流注入陵羊之泽。水中生长着很多冉遗鱼，鱼的身躯却长着蛇的头和六只脚，眼睛像马的耳朵，人吃了它可以不做噩梦魇魅，还能辟除凶灾。
