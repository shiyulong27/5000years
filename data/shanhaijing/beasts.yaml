- id: beast-taowu
  name: 梼杌
  pinyin: táo wù
  category: 异兽
  book: 西次三经
  mountain: 翼望之山
  auspicious: 凶兆
  appearance: 其状如虎而犬毛，长二尺，人面，虎足，猪口牙，尾长一丈八尺。
  abilities: 桀骜不驯，勇悍不可挫，顽固不化；四大凶兽之一。
  summary: 荒野顽兽，性情暴烈凶悍，从不退缩屈服，后世用以指代冥顽不灵与凶暴蛮横之徒。
  original_text: |
    西方荒中有兽焉，其状如虎而犬毛，长二尺，人面虎足，猪口牙，尾长一丈八尺，搅乱荒中，名曰梼杌。
  translation: |
    西方荒野中有一种异兽，长相像老虎却长着狗一样的长毛，身长两尺，人面虎足，长着野猪一样的獠牙，尾巴长达一丈八尺，在荒野中横行肆虐，名叫梼杌。
