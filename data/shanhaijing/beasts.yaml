  original_text: |
    钦山，多金玉而无石。师水出焉，而北流注于皋泽。有兽焉，其状如豚而有牙，其名曰当康，其鸣自叫，见则天下大穰。
  translation: |
    钦山盛产金玉而没有碎石。师水发源于此北流注入皋泽。山中有一种异兽，外形像小猪却长着四枚突出的长獠牙，名字叫当康，它的叫声如同呼唤自己的名字，一旦出现就预示着天下大丰收。
