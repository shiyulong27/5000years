- id: beast-jingwei
  name: 精卫
  pinyin: jīng wèi
  category: 神禽
  book: 北山经
  mountain: 发鸠之山
  auspicious: 异象
  appearance: 其状如乌，文首，白喙，赤足。
  abilities: 衔西山之木石以填东海，誓不罢休。
  summary: 炎帝少女女娃溺水东海后所化，日夜衔木石填海，成为百折不挠、坚韧不屈的中华精神象征。
  original_text: |
    发鸠之山，其上多柘木。有鸟焉，其状如乌，文首、白喙、赤足，名曰精卫，其鸣自詨。是炎帝之少女，名曰女娃。女娃游于东海，溺而不返，故为精卫，常衔西山之木石，以堙于东海。
  translation: |
    发鸠山上长满柘树。山中有一种鸟，形状像乌鸦，头部有花纹，白嘴巴，红爪子，名叫精卫，叫声就像在呼唤自己。她是炎帝的小女儿女娃所化。女娃在东海游泳溺水未返，化为精卫鸟，常常衔着西山的树枝和石子去填平东海。
  tags:
    - 精卫填海
    - 炎帝之女
    - 坚韧不拔
    - 悲壮
    - 神禽
