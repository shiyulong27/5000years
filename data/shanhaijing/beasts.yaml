- id: beast-kaimingshou
  name: 开明兽
  pinyin: kāi míng shòu
  category: 灵神
  book: 海内西经
  mountain: 昆仑之虚
  auspicious: 灵神
  appearance: 身大类虎而九首，皆人面，东向立博望上。
  abilities: 洞察万物，守护昆仑九重神门，神兽之长。
  summary: 镇守昆仑九门的神兽，身躯如巨大猛虎长有九个头颅，九颗人首皆面朝东方，威视天下妖邪。
  original_text: |
    昆仑南渊深三百仞。开明兽身大类虎而九首，皆人面，东向立博望上。海内昆仑之虚，在西北，帝之下都。昆仑之虚，方八百里，高万仞。
  translation: |
    昆仑山南面的深渊深达三百仞。开明兽体型巨大如猛虎，长着九个头，全是人面，面朝东方威立在博望山上，日夜守护着巍峨的天帝之都。
  tags:
