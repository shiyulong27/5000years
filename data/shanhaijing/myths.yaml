- id: myth-yuzhishui
  title: 鲧禹治水与盗息壤
  pinyin: gǔn yǔ zhì shuǐ yǔ dào xī rǎng
  book: 海内经
  figures:
    - 鲧
    - 禹
    - 祝融
  spirit: 舍身救民、顺应自然、疏堵相济的华夏治世大智慧
  summary: 洪水滔天之际，鲧盗取天帝自生不息的息壤去围堵洪水，被天帝命火神祝融殛杀于羽山；禹继承遗志，改堵为疏，导江疏川终平天下水患。
  original_text: |
    洪水滔天。鲧窃帝之息壤以堙洪水，不待帝命。帝令祝融杀鲧于羽郊。鲧复生禹。帝乃命禹卒布土以定九州。
  translation: |
    上古大洪水漫无边际淹没天地。鲧私自盗取了天帝能够不断自生膨胀的“息壤”神土去堵塞洪水，没有等待天帝的旨意。天帝震怒，派遣火神祝融在羽山郊野将鲧诛杀。鲧死后躯体孕育诞生了大禹。天帝于是命令大禹巡行大地铺展神土、疏通河川，最终平定天下九州大水。
  cultural_meaning: 从“鲧之堵”到“禹之疏”，标志着中华先民告别蛮荒，建立水利文明、划分九州格局的关键历史跨越。
  tags:
    - 大禹治水
    - 鲧盗息壤
    - 祝融
    - 定九州
    - 治水史诗
