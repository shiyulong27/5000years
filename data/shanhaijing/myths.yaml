- id: myth-gonggong
  title: 共工怒触不周山
  pinyin: gòng gōng nù chù bù zhōu shān
  book: 西山经·大荒西经
  figures:
    - 共工
    - 颛顼
  spirit: 震撼寰宇的宇宙倾斜与地势演化神话
  summary: 水神共工与颛顼争帝位落败，怒撞天地支柱不周山，导致天柱折断、地维破损，天倾西北、地陷东南，日月星辰与百川皆依此归流。
  original_text: |
    昔者共工与颛顼争为帝，怒而触不周之山，天柱折，地维绝。天倾西北，故日月星辰移焉；地不满东南，故水潦尘埃归焉。
  translation: |
    从前水神共工与颛顼帝争夺帝位失败，盛怒之下猛烈撞击不周之山，导致撑天之柱崩折，系地之绳断绝。苍天向西北方向倾斜，因此日月星辰都向西北运转；大地在东南方向塌陷，因此天下江河流水泥沙都汇聚流向东南大海。
  cultural_meaning: 华夏先民对中国“西高东低”地理大势与星辰东升西落天文运行规律的浪漫神话解释。
  tags:
    - 共工
    - 不周山
    - 天倾西北
    - 地陷东南
    - 颛顼
