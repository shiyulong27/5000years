- id: myth-kuafu
  title: 夸父逐日
  pinyin: kuā fù zhú rì
  book: 海外北经·大荒北经
  figures:
    - 夸父
  spirit: 追逐光明、征服自然、死而不休的悲壮气魄
  summary: 巨人夸父立志追赶落日，与太阳在禺谷赛跑；渴饮黄河渭水不足，北饮大泽未至道渴而死，弃其手杖化为邓林桃林。
  original_text: |
    夸父与日逐走，入日；渴，欲得饮，饮于河、渭；河、渭不足，北饮大泽。未至，道渴而死。弃其杖，化为邓林。
  translation: |
    巨人夸父追赶太阳赛跑，一直追到太阳落下的地方；他口渴难耐想要喝水，便痛饮黄河和渭水；黄河和渭水的水喝干了仍不解渴，又向北去喝大泽之水。还没赶到大泽，就在半路极度焦渴而倒下死去。他死前抛弃的手杖，在荒原上化作了一片郁郁葱葱的桃林（邓林）。
  cultural_meaning: 表现了早期人类探索自然、向往光明烈日的雄奇浪漫与不屈斗志，手杖化桃林寓意造福后世追光之人。
  tags:
    - 逐日
    - 邓林
    - 巨人族
    - 追光者
    - 悲壮
