- id: myth-chiyou
  title: 涿鹿之战 (黄帝大战蚩尤)
  pinyin: zhuō lù zhī zhàn (huáng dì dà zhàn chī yóu)
  book: 大荒北经·大荒东经
  figures:
    - 黄帝
    - 蚩尤
    - 应龙
    - 女魃
    - 风伯
    - 雨师
  spirit: 华夏部族融合与秩序奠基史诗
  summary: 蚩尤率九黎部落起兵，呼唤风伯雨师纵漫天大雾暴雨；黄帝命应龙蓄水、天女魃止雨，最终破阵斩蚩尤，统一华夏诸部。
  original_text: |
    蚩尤作兵伐黄帝，黄帝乃令应龙攻之冀州之野。应龙蓄水。蚩尤请风伯雨师，纵大风雨。黄帝乃下天女曰魃，雨止，遂杀蚩尤。
  translation: |
    蚩尤制造兵器兴兵讨伐黄帝，黄帝命应龙在冀州原野迎战。应龙施展神力蓄积大水。蚩尤请来风伯与雨师，刮起狂风降下漫天暴雨。黄帝于是召请天女魃下界，暴雨瞬间止息，黄帝大军遂一举斩杀蚩尤平定天下。
  cultural_meaning: 上古神话与信史交界处的最大规模战争叙事，汇聚了翼龙、旱神、风雨之神，奠定了华夏共祖的文明格局。
  tags:
    - 涿鹿之战
    - 黄帝
    - 蚩尤
    - 应龙
    - 女魃
    - 华夏起源
