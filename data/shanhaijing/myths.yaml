- id: myth-sunmoon
  title: 羲和浴日与常羲浴月
  pinyin: xī hé yù rì yǔ cháng xī yù yuè
  book: 大荒南经·大荒西经
  figures:
    - 帝俊
    - 羲和
    - 常羲
  spirit: 上古天象崇拜与时序更迭的瑰丽想象
  summary: 太阳女神羲和在甘渊为十个太阳沐浴，月亮女神常羲在荒野为十二个月亮沐浴，生动构建了十日干与十二地支的早期历法神格。
  original_text: |
    东南海之外，甘水之间，有羲和之国。有女子名曰羲和，方日浴于甘渊。羲和者，帝俊之妻，生十日。有女子方浴月。帝俊妻常羲，生月十有二，此始浴之。
  translation: |
    在东南海的外面，甘水之间，有一个羲和之国。有一位女子名叫羲和，正在甘渊温泉中给太阳洗澡。羲和是天帝帝俊的妻子，生下了十个太阳。又有女子正在给月亮洗澡，她是帝俊的妻子常羲，生下了十二个月亮，这是她开始为月亮沐浴的所在。
  cultural_meaning: 反映了远古先民对天体运行规律的拟人化观察，十日即十天干周期的萌芽，十二月即一年十二个朔望月的历法映射。
  tags:
    - 羲和
    - 常羲
    - 浴日
    - 浴月
    - 帝俊
    - 天文历法
