- id: myth-nuwa
  title: 女娲造人与炼石补天
  pinyin: nǚ wā zào rén yǔ liàn shí bǔ tiān
  book: 大荒西经
  figures:
    - 女娲
  spirit: 创世之母与拯救苍生的博大母爱
  summary: 创世女神抟土造人、繁衍华夏生息；当天塌地陷、洪水猛兽横行时，炼五色石以补苍天，断鳌足以立四极。
  original_text: |
    往古之时，四极废，九州裂，天不兼覆，地不周载。火爁焱而不灭，水浩洋而不息。猛兽食颛民，鸷鸟攫老弱。于是女娲炼五色石以补苍天，断鳌足以立四极，杀黑龙以济冀州，积芦灰以止淫水。
  translation: |
    远古时代，支撑天地的四根天柱倒塌，九州大地崩裂，天不能完全覆盖大地，地不能完全承载万物。烈火熊熊燃烧不熄，洪水滔天泛滥不止。猛兽吞食善良百姓，凶鸟抓走老弱妇孺。于是女娲炼化五色石来修补苍天，砍下巨鳌的四足树立为撑天的四极，斩杀兴风作浪的黑龙解救冀州，堆积芦苇灰烬堵住泛滥的洪水。
  cultural_meaning: 华夏文明中关于母性创世、重构天地秩序的最伟大史诗，体现了先民战胜洪荒灾难的坚定决心。
  tags:
    - 补天
    - 造人
    - 五色石
    - 创世母神
    - 四极
