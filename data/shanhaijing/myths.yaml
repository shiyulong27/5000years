- id: myth-jingwei
  title: 精卫填海
  pinyin: jīng wèi tián hǎi
  book: 北山经
  figures:
    - 女娃
    - 精卫
    - 炎帝
  spirit: 誓不向浩瀚命运低头的不屈抗争信念
  summary: 炎帝小女儿女娃溺死东海，化作红爪白喙的精卫神鸟，日夜衔西山木石企图填平波涛浩瀚的东海。
  original_text: |
    发鸠之山，其上多柘木。有鸟焉，其状如乌，文首、白喙、赤足，名曰精卫，其鸣自詨。是炎帝之少女，名曰女娃。女娃游于东海，溺而不返，故为精卫，常衔西山之木石，以堙于东海。
  translation: |
    发鸠山山顶长满柘树。山中有一种鸟，形状像乌鸦，头部生有花纹，长着白色的嘴和赤红的脚爪，名叫精卫，鸣叫如自呼其名。她是炎帝的小女儿女娃。女娃在东海泛舟游泳溺水没有回来，化作了精卫鸟，常常口衔西山的树枝石子，飞去填塞辽阔的东海。
  cultural_meaning: 陶渊明诗云“精卫衔微木，将以填沧海”，精卫成为中华民族坚韧意志、百折不挠对抗命运的千古图腾。
  tags:
    - 精卫
    - 填海
    - 炎帝少女
    - 坚韧意志
    - 东海
