- id: myth-xingtian
  title: 刑天舞干戚
  pinyin: xíng tiān wǔ gān qī
  book: 海外西经
  figures:
    - 刑天
    - 黄帝
  spirit: 纵使身首异处亦永不屈服的战神意志
  summary: 勇士刑天与天帝争夺神位，被斩去头颅埋于常羊山；刑天仍以双乳为目、以肚脐为口，手握巨斧与盾牌狂怒挥舞战斗。
  original_text: |
    刑天与帝至此争神，帝断其首，葬之於常羊之山。乃以乳为目，以脐为口，操干戚以舞。
  translation: |
    刑天与黄帝在此地争夺至高神位，黄帝斩断了他的头颅，埋葬在常羊山下。刑天失去头颅后，竟以双乳化为眼睛，以肚脐化为嘴巴，双手紧握盾牌与大斧，在天地间永不停息地怒吼挥舞。
  cultural_meaning: “刑天舞干戚，猛志固常在”，无头战神刑天的形象树立了华夏神话中最纯粹、最具冲击力的抗争英雄丰碑。
  tags:
    - 刑天
    - 舞干戚
    - 常羊山
    - 无头战神
    - 不屈猛志
