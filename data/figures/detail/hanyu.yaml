relations:
  - relation_type: 挚友
    target_id: liuzongyuan
    direction: 双向
    period:
      text: 约803年同官监察御史订交，至819年柳宗元卒
      year: 803
      range_end: 819
      precision: 范围
    evidence: 二人同倡古文运动、贞元十九年先后为监察御史，同列旧书卷160本传。旧书韩愈传同时载有批评语境：「南人妄以柳宗元为罗池神，而愈撰碑以实之」，列为愈文之纰缪例——韩柳交谊与史臣对其罗池庙碑的非议一并照录，不作删削。
    confidence: 存疑
    dispute: 直接交往细节（书信唱和、柳卒后愈为撰祭文墓志）主要见于别集而非两唐书正文，本条以正史同传并列与共同事业为主要证据。
    source_ids: [src-jts-vol160]
  - relation_type: 思想影响
    target_id: dufu
    direction: 单向
    period:
      text: 中唐对盛唐诗学的追认与继承
      precision: 未知
    evidence: 调张籍「李杜文章在，光焰万丈长」，尊杜推李并斥谤伤者为蚍蜉撼树；韩愈奇崛险怪的诗风被视为杜诗沉郁顿挫之外的又一变径。此为单向的接受关系，非交往证据。
    inferred: true
    confidence: 存疑
    dispute: 韩愈接受杜甫的具体路径与程度属文学史推论，非史料明文记载的师承或交谊。
    source_ids: [src-qts-hanyu]

reception:
  - era: 同时代
    evaluator: 时人与后学（旧唐书本传）
    quote: 后学之士，取为师法。当时作者甚众，无以过之，故世称「韩文」焉。
    text_display: excerpt
    comment: 旧书载其务反近体、抒意立言自成一家新语，世称韩文焉——以姓氏冠文体之称，唐代文人中仅此一人。
    source_ids: [src-jts-vol160]
  - era: 同时代
    evaluator: 旧唐书史臣
    quote: 韩、李二文公，于陵迟之末，遑遑仁义；有志于持世范，欲以人文化成，而道未果也。至若抑杨、墨，排释、老，虽于道未弘，亦端士之用心也。
    text_display: excerpt
    comment: 五代史臣对韩李二人的总评原貌：肯定其扶植仁义的端士用心而不讳其道未果，与其对刘柳蹈道不谨的贬语形成对照。旧书另录「恃才肆意亦有盩孔孟之旨」（罗池神碑、讳辨、毛颖传诸例）与顺宗实录遭当代非议诸端，本卷一并存照。
    source_ids: [src-jts-vol160]
  - era: 历代批评
    evaluator: 新唐书赞
    quote: 自愈没，其言大行，学者仰之如泰山、北斗云。
    text_display: excerpt
    comment: 宋祁赞语称其拨衰反正功齐孟子、以六经之文为诸儒倡——新旧两书评价落差本身就是接受史的标本。
    source_ids: [src-xts-vol176]
  - era: 历代批评
    evaluator: 苏轼
    quote: 文起八代之衰，而道济天下之溺。
    text_display: excerpt
    comment: 出自苏轼潮州韩文公庙碑，为传统社会对韩愈的终极定位。碑文为公版原文，但该碑来源尚未在本项目注册，source_ids 暂留空以待补登记。
    source_ids: []
  - era: 近现代学术
    evaluator: 学界综述
    quote: ""
    text_display: none
    comment: 近现代研究围绕古文运动的理论构造与历史定位、韩愈排佛与道统说的儒学复兴意义、以文为诗的得失评价翻转等议题展开；具体论著引文须逐条取得许可后补入，本卷暂作中立转述。
    source_ids: []
  - era: 教科书与公共文化
    evaluator: 通用语文教育与大众传播
    quote: ""
    text_display: none
    comment: 师说、马说、早春呈水部张十八员外、左迁至蓝关示侄孙湘等长期入选中小学语文教材；文起八代之衰与韩文公祠成为其公共文化符号。教材版本信息随学期变动，录入时须另行核验当期篇目。
    source_ids: []
  - era: 影视与网络
    evaluator: 暂无可考记录
    quote: ""
    text_display: none
    comment: 未检索到权威影视正剧改编记录；网络传播集中于教材名篇与潮州韩文公祠文旅内容，暂不著录具体条目。
    source_ids: []

