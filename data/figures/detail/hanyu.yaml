    summary: 袁州之俗男女隶于人者逾约则没入出钱之家。愈至设法赎其所没男女归其父母，削其俗法不许隶人；新书计其数为七百余人。
    source_ids: [src-jts-vol160, src-xts-vol176]

  # ── 阶段七：晚年重臣 ──────────────────────────────
  - stage: 晚年重臣
    stage_order: 22
    title: 征为国子祭酒，转兵部侍郎
    date:
      text: "约820年"
      year: 820
      precision: 约
    place: 长安
    summary: 元和十五年征为国子祭酒，转兵部侍郎。
    source_ids: [src-jts-vol160]
  - stage: 晚年重臣
    stage_order: 23
    title: 只身宣谕镇州王庭凑，勇夺三军之帅
    date:
      text: "约822年"
      year: 822
      precision: 约
    place: 镇州
    summary: 镇州乱杀田弘正立王庭凑，诏愈宣抚。既行众皆危之，元稹言韩愈可惜穆宗亦悔，诏愈度事从宜无必入。愈至，廷凑严兵迓之甲士陈廷，愈大声责以逆顺，历数安史李希烈子孙无一存者、田弘正刘悟李祐归顺受旌节事，众讙曰善。廷凑虑众变疾麾使去，即出牛元翼围。愈归奏其语帝大悦，转吏部侍郎。
    confidence: 存疑
    dispute: 宣谕确年在长庆二年，两书均无明书月份；对话实录独详于新书，史笔润饰程度不可知。
    source_ids: [src-jts-vol160, src-xts-vol176]
  - stage: 晚年重臣
    stage_order: 24
    title: 转京兆尹，李绅台参之争，复为吏部侍郎
    date:
      text: "约823年"
      year: 823
      precision: 约
    place: 长安
    summary: 转京兆尹兼御史大夫，以不台参为御史中丞李绅所劾。绅愈性皆褊僻，文刺往还纷然不止，乃出绅浙西观察使愈亦罢尹为兵部侍郎；穆宗怜绅面辞泣涕，追制绅为兵部侍郎，愈复为吏部侍郎。
    source_ids: [src-jts-vol160]
  - stage: 晚年重臣
    stage_order: 25
    title: 卒于长安，赠礼部尚书谥曰文
    date:
      text: "824年（长庆四年十二月）"
      year: 824
      precision: 精确
    place: 长安
    summary: 长庆四年十二月卒时年五十七，赠礼部尚书谥曰文。有文集四十卷，婿李汉为之序。旧书评其性弘通与人交荣悴不易，诱厉后进馆之者十六七，凡嫁内外及友朋孤女仅十人。
    source_ids: [src-jts-vol160, src-xts-vol176]

works:
  - work_id: shi-shuo
    title: 师说
    alt_titles: []
    genre: 说（论说文）
    date:
      text: "约802年"
      year: 802
      precision: 约
    place: 长安
    context: 任四门博士前后，针对当时耻学于师的门第风气而作，提出学者必有师、传道受业解惑、道之所存师之所存的师道纲领。新书将其与原道原性并举为奥衍闳深佐佑六经之篇。
    attribution: 确凿
    excerpt: 古之学者必有师。师者，所以传道受业解惑也。……是故无贵无贱，无长无少，道之所存，师之所存也。
    text_display: excerpt
    themes: [教育, 论道]
    influence: 中国教育史上论师的经典文本，长期入选语文教材。
    confidence: 存疑
    dispute: 系年从贞元十八年四门博士任上的通说；正文摘句据通行公版文本，别集底本来源尚未注册。
    source_ids: [src-xts-vol176]
  - work_id: za-shuo-si-ma-shuo
    title: 杂说四·马说
    alt_titles: [马说]
    genre: 说（杂文）
    date:
      text: 不详
      precision: 未知
    place: ""
    context: 以千里马常有而伯乐不常有托物寓怀，写才士不遇与识者之难，为其杂著中最传诵的一篇。
    attribution: 确凿
    excerpt: 世有伯乐，然后有千里马。千里马常有，而伯乐不常有。故虽有名马，祇辱于奴隶人之手，骈死于槽枥之间，不以千里称也。
    text_display: excerpt
    themes: [托物寓怀, 人才]
    influence: 伯乐与千里马成为中国人才观的核心意象之一。
    confidence: 存疑
    dispute: 作年无考；正文摘句据通行公版文本，别集来源尚未注册待核。
    source_ids: []
  - work_id: jin-xue-jie
    title: 进学解
    alt_titles: []
    genre: 解（论辩文）
    date:
      text: "约813年"
      year: 813
      precision: 约
    place: 长安
    context: 才高数黜复为国子博士后，设国子先生与诸生答难以自嘲反讽，业精于勤荒于嬉与障百川而东之回狂澜于既倒俱出此篇。执政览其文而怜之，改比部郎中史馆修撰——一篇牢骚换来升迁。
    attribution: 确凿
    excerpt: 业精于勤，荒于嬉；行成于思，毁于随。……沈浸醲郁，含英咀华，作为文章，其书满家。……障百川而东之，回狂澜于既倒。
    text_display: excerpt
    themes: [治学, 自嘲]
    influence: 劝学与逆境自处的千古格言渊薮，两唐书本传全文转录足见唐人已视为代表作。
    confidence: 存疑
    dispute: 作年诸谱互有出入；摘句以旧唐书本传引文为主。
    source_ids: [src-jts-vol160, src-xts-vol176]
  - work_id: ji-shi-lang-wen
    title: 祭十二郎文
    alt_titles: [祭侄十二郎老成文]
    genre: 祭文
    date:
      text: "约803年"
      year: 803
      precision: 约
    place: 长安
    context: 闻侄韩老成死讯后的破体之作，不循骈俪祭文程式，以家常语写生离死别，一在天之涯一在地之角写尽骨肉参商。
    attribution: 确凿
    excerpt: 呜呼！吾少孤，及长，不省所怙，惟兄嫂是依。……一在天之涯，一在地之角。
    text_display: excerpt
    themes: [哀祭, 亲情]
    influence: 破体为文的抒情典范，被誉为祭文中千年绝调。
    confidence: 存疑
    dispute: 系年从贞元十九年通说；正文据通行公版文本，别集来源尚未注册。
    source_ids: []
  - work_id: ping-huai-xi-bei
    title: 平淮西碑
    alt_titles: [韩碑]
    genre: 碑文
    date:
      text: "约818年"
      year: 818
      precision: 约
    place: 长安
    context: 淮西平后奉诏撰碑以颂宪宗武功，辞多叙统帅裴度事。先入蔡州擒吴元济的李愬不平，其妻出入禁中诉碑辞不实，诏令磨去韩文，命段文昌重撰勒石。一碑两刻、磨石易主，为唐代碑刻史最著名的公案。
    attribution: 确凿
    excerpt: ""
    text_display: none
    themes: [颂功, 史笔]
    influence: 碑虽被磨，李商隐咏史诗韩碑与历代翻案之议使其影响反胜段碑。
    confidence: 存疑
    dispute: 撰碑确月无载；韩碑本文未收（本卷只收已实取核验文本），碑文归属与叙功是非历代聚讼。
    source_ids: [src-jts-vol160]
  - work_id: lun-fo-gu-biao
    title: 论佛骨表
    alt_titles: [谏迎佛骨表]
    genre: 奏表
    date:
      text: "819年"
      year: 819
      precision: 精确
    place: 长安
    context: 宪宗迎法门寺佛骨入禁中，举国狂热供养。愈上表历数上古帝王无佛而寿、汉明帝以后事佛者运祚不长、梁武帝舍身而饿死台城，乞以枯朽之骨付之水火，末云佛如有灵能作祸祟宜加臣身。宪宗怒甚将加极法，赖裴度崔群营救得贬潮州。
    attribution: 确凿
    excerpt: 事佛求福，乃更得祸。由此观之，佛不足信，亦可知矣。……佛如有灵，能作祸祟，凡有殃咎，宜加臣身。上天鉴临，臣不怨悔。
    text_display: excerpt
    themes: [排佛, 直谏]
    influence: 唐代反佛论的巅峰文献，直接触发其一生最大政治挫折。
    confidence: 存疑
    dispute: 表文两唐书均全文收录而文字小异，摘句以旧书为主。
    source_ids: [src-jts-vol160, src-xts-vol176]
  - work_id: ji-e-yu-wen
    title: 祭鳄鱼文
    alt_titles: []
    genre: 檄文式祭文
    date:
      text: "约819年"
      year: 819
      precision: 约
    place: 潮州
    context: 至潮州问民疾苦，知恶溪鳄鱼为患，自往视之，令判官秦济以一豚一羊投溪水而读此文，限鳄鱼三日乃至七日南徙于海，否则操劲弓毒矢与鳄鱼从事。祝之夕暴风雷起，数日水尽涸西徙六十里。
    attribution: 确凿
    excerpt: 今天子神圣，四海之外，抚而有之。况扬州之境，刺史县令之所治……鳄鱼岂可与刺史杂处此土哉？……今与鳄鱼约，三日乃至七日，如顽而不徙，须为物害，则刺史选材伎壮夫，操劲弓毒矢，与鳄鱼从事矣！
    text_display: excerpt
    themes: [为民除患, 谐趣庄严]
    influence: 以庄词谐事著称的名文，潮州鳄溪由此得名韩江的传说源头。
    confidence: 存疑
    dispute: 文字两书所录互异，摘句以旧书为主；鳄鱼西徙事的信史程度见timeline相应条目dispute。
    source_ids: [src-jts-vol160, src-xts-vol176]
  - work_id: zuo-qian-zhi-lan-guan
    title: 左迁至蓝关示侄孙湘
    alt_titles: []
    genre: 七言律诗
    date:
      text: "819年"
      year: 819
      precision: 精确
    place: 蓝关
    context: 谏佛骨一封朝奏夕贬八千里的诗化总结，雪拥蓝关马不前写尽忠而获罪之悲，好收吾骨瘴江边预作身后之托。
    attribution: 确凿
    excerpt: 一封朝奏九重天，夕贬潮阳路八千。欲为圣朝除弊事，肯将衰朽惜残年。云横秦岭家何在？雪拥蓝关马不前。知汝远来应有意，好收吾骨瘴江边。
    text_display: full
    themes: [贬谪, 直谏]
    influence: 与论佛骨表互证的传记性名篇，颈联为秦岭蓝关的经典意象。
    confidence: 存疑
    dispute: 首联次句通行本亦有作「一封朝奏九重天」与此一致；颔联「圣朝」一本作「圣明」，异文从全唐诗通行文本。
    source_ids: [src-qts-hanyu, src-jts-vol160]
  - work_id: ba-yue-shi-wu-ye-zeng-zhang-gong-cao
    title: 八月十五夜赠张功曹
    alt_titles: []
    genre: 七言古诗
    date:
      text: "约805年"
      year: 805
      precision: 约
    place: 郴州（北归候命期间）
    context: 永贞革新之际赦令下而二人同滞郴州候命，中秋对酌，代张署抒迁谪之愤，一年明月今宵多以旷语收束悲音。
    attribution: 确凿
    excerpt: 纤云四卷天无河，清风吹空月舒波。沙平水息声影绝，一杯相属君当歌。……一年明月今宵多，人生由命非由他，有酒不饮奈明何。
    text_display: excerpt
    themes: [中秋, 迁谪]
    influence: 唐人中秋诗中以气格胜的代表。
    confidence: 存疑
    dispute: 作地郴州与作年永贞元年从通行编年说；摘句据通行公版文本，全唐诗来源待核验。
    source_ids: [src-qts-hanyu]
  - work_id: shan-shi
    title: 山石
    alt_titles: []
    genre: 七言古诗
    date:
      text: "约800年"
      year: 800
      precision: 约
    place: 洛阳西惠林寺一带（通说）
    context: 记黄昏到寺至天明独去的游踪，不假雕绘而境界清绝，人生如此自可乐岂必局束为人鞿为散文名篇山石的同一机杼。
    attribution: 确凿
    excerpt: 山石荦确行径微，黄昏到寺蝙蝠飞。升堂坐阶新雨足，芭蕉叶大栀子肥。……人生如此自可乐，岂必局束为人鞿。
    text_display: excerpt
    themes: [纪游, 清景]
    influence: 以文为诗、单行直写的代表性作品。
    confidence: 存疑
    dispute: 系年诸说在贞元十五年至十八年之间，本卷取其一并注明。
    source_ids: [src-qts-hanyu]
  - work_id: tiao-zhang-ji
    title: 调张籍
    alt_titles: []
    genre: 五言古诗
    date:
      text: 约815—820年之间
      year: 815
      range_end: 820
      precision: 范围
    place: ""
    context: 为回应时人谤伤李杜而作，李杜文章在光焰万丈长的并尊宣言，蚍蜉撼大树可笑不自量成为嘲讽不自量力的成语。
    attribution: 确凿
    excerpt: 李杜文章在，光焰万丈长。不知群儿愚，那用故谤伤。蚍蜉撼大树，可笑不自量。
    text_display: excerpt
    themes: [论诗, 尊崇李杜]
    influence: 奠定李杜并尊格局的中唐关键表述。
    confidence: 存疑
    dispute: 系年有元和与长庆两说并存；摘句据通行公版文本。
    source_ids: [src-qts-hanyu]
  - work_id: zao-chun-cheng-shui-bu-zhang-shiba
    title: 早春呈水部张十八员外
    alt_titles: [早春呈水部张十八员外二首（其一）]
    genre: 七言绝句
    date:
      text: "约823年"
      year: 823
      precision: 约
    place: 长安
    context: 长庆三年早春邀张籍游曲江而作，草色遥看近却无以似有还无之色状早春之神，为其晚年闲适期的清丽小品。
    attribution: 确凿
    excerpt: 天街小雨润如酥，草色遥看近却无。最是一年春好处，绝胜烟柳满皇都。
    text_display: full
    themes: [早春, 咏景]
    influence: 咏早春第一名篇，长期入选语文教材。
    confidence: 存疑
    dispute: 系年从长庆三年通说。
    source_ids: [src-qts-hanyu]

