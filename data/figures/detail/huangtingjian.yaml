# 黄庭坚全景详卷（schema v1）
# 史料审计表（实取证据；来源登记见 data/sources.yaml）：
#
# | 事实点 | 宋史·卷444·文苑六·黄庭坚传（维基文库实取 https://zh.wikisource.org/wiki/宋史/卷444 ） | 结论与置信 |
# |---|---|---|
# | 名号籍贯 | 黃庭堅字魯直洪州分寧人 | 确定 |
# | 幼年警敏 | 幼警悟讀書數過輒成誦；舅李常過其家取架上書問之無不通常驚以為一日千里 | 确定 |
# | 及第释褐 | 舉進士調葉縣尉 | 确定；及第年份正史无载（通行治平四年1067），标推定 |
# | 生年 | 本传不载卒年六十一 | 生年1045系学界据享年六十一与卒年1105倒推的通说，标推定 |
# | 《庄子》得名答语 | 本传无载；宋人笔记层有问名"庭坚"出处的传说，本次未能在维基文库定位可靠公版原文 | 不采信，待核 |
# | 苏轼称叹 | 蘇軾嘗見其詩文以為超軼絕塵獨立萬物之表世久無此作由是聲名始震 | 确定；相识年份正史无载 |
# | 北京国子监教授 | 熙寧初舉四京學官第文為優教授北京國子監留守文彥博才之留再任 | 确定 |
# | 太和治绩 | 知太和縣以平易治；時課頒鹽筴諸縣爭占多數太和獨否吏不悅而民安之 | 确定 |
# | 元祐入馆 | 哲宗立召為校書郎、《神宗實錄》檢討官；踰年遷著作佐郎加集賢校理；《實錄》成擢起居舍人 | 确定 |
# | 笃孝 | 丁母艱；母病彌年晝夜視顏色衣不解帶；及亡廬墓下哀毀得疾幾殆 | 确定 |
# | 铁龙爪案 | 庭堅書「用鐵龍爪治河有同兒戲」至是首問焉；對曰庭堅時官北都嘗親見之真兒戲耳；凡有問皆直辭以對聞者壯之；貶涪州別駕黔州安置言者猶以處善地為骫法 | 确定 |
# | 移戎州 | 以親嫌遂移戎州；庭堅泊然不以遷謫介意；蜀士慕從之遊講學不倦 | 确定 |
# | 徽宗起复与骤罢 | 徽宗即位起監鄂州稅簽書寧國軍判官知舒州以吏部員外郎召皆辭不行；丐郡得知太平州至之九日罷主管玉隆觀 | 确定 |
# | 承天院记案 | 在河北與趙挺之有微隙；挺之執政轉運判官陳舉承風旨上其所作《荊南承天院記》指為幸災；復除名羈管宜州 | 确定；除名年份正史无载（通说崇宁二三年间1102—1103），标推定 |
# | 卒 | 三年徙永州未聞命而卒年六十一 | 确定；卒年1105（崇宁四年）与享年六十一闭合 |
# | 文艺定评 | 學問文章天成性得；陳師道謂其詩得法杜甫學甫而不為者；善行草書楷法亦自成一家；與張耒晁補之秦觀俱游蘇軾門天下稱為四學士而庭堅于文章尤長於詩蜀江西君子以庭堅配軾故稱蘇黃；軾為侍從時舉以自代其詞有「瓌偉之文妙絕當世孝友之行追配古人」之語 | 确定 |
# | 自号由来 | 初遊灊皖山谷寺石牛洞樂其林泉之勝因自號山谷道人云 | 确定 |
# | 作品文本 | 诗：寄黄几复／登快阁／清明／牧童诗／雨中登岳阳楼望君山／病起荆江亭即事 各维基文库单篇页实取；词：山谷集（四库全书本）/词 卷实取（定风波、鹧鸪天、清平乐、虞美人、千秋岁并序等） | 通行本层；清明、鹧鸪天、清平乐存在异文，逐条 dispute 标注 |
