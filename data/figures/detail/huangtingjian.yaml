works:
  - work_id: ji-huang-jifu
    title: 寄黄几复
    alt_titles: []
    genre: 七言律诗
    date:
      text: 元丰八年（1085），诗题自注乙丑年德平镇作
      year: 1085
      precision: 精确
    place: 德州德平镇
    context: 我居北海君南海，寄雁传书谢不能——与少年旧友黄几复一在齐鲁海滨一在岭南，雁不能传书；颔联桃李春风一杯酒江湖夜雨十年灯为千古名句。
    attribution: 确凿
    excerpt: 桃李春风一杯酒，江湖夜雨十年灯。……想得读书头已白，隔溪猿哭瘴烟藤。
    text_display: excerpt
    themes: [怀旧, 友朋, 江湖流落]
    influence: 桃李春风一杯酒江湖夜雨十年灯被视为以熟语炼成的绝唱，是宋诗以故为新主张的最佳注脚。
    source_ids: [src-shanGuji]

  - work_id: deng-kuaige
    title: 登快阁
    alt_titles: []
    genre: 七言律诗
    date:
      text: 约元丰五年（1082）知太和县时作
      year: 1082
      precision: 约
    place: 太和县快阁
    context: 痴儿了却公家事，快阁东西倚晚晴；落木千山天远大澄江一道月分明一联洗尽铅华，是其山水诗的最高境界。
    attribution: 确凿
    excerpt: 痴儿了却公家事，快阁东西倚晚晴。落木千山天远大，澄江一道月分明。……万里归船弄长笛，此心吾与白鸥盟。
    text_display: excerpt
    themes: [登览, 归隐之志, 澄澈之境]
    influence: 公认的黄诗第一名篇，历代选家必收；尾联白鸥盟成为士大夫归隐心结的经典意象。
    confidence: 存疑
    dispute: 系年通行元丰五年太和任上说，亦有异说；方回瀛奎律髓卷一收录并加评点，为历代批评重要载体。
    source_ids: [src-shanGuji]

  - work_id: qingming-huangtingjian
    title: 清明
    alt_titles: []
    genre: 七言律诗
    date:
      text: 创作年代不详
      precision: 未知
    place: ""
    context: 佳节清明桃李笑，野田荒冢只生愁——以乐景衬哀景；颈联人乞祭余骄妾妇士甘焚死不公侯用两则典故对照贤愚，结句满眼蓬蒿共一丘归于齐物之叹。
    attribution: 确凿
    excerpt: 佳节清明桃李笑，野田荒冢只生愁。……贤愚千载知谁是，满眼蓬蒿共一丘。
    text_display: excerpt
    themes: [清明, 生死之思, 用典]
    influence: 长期入选传统蒙学与大众读本千家诗（卷四），为其传播最广的节令诗。
    confidence: 存疑
    dispute: 维基文库所据千家诗本作野田荒隴紙生愁，纸字显系形误，通行本作荒冢只生愁；荒陇与荒冢、纸与只均有版本差异，此处从通行本并标注异文。
    source_ids: [src-shanGuji]

  - work_id: mu-tong-shi
    title: 牧童诗
    alt_titles: []
    genre: 七言绝句
    date:
      text: 传为七岁时作，年代不可确考
      precision: 未知
    place: ""
    context: 多少长安名利客，机关用尽不如君——以牧童短笛反讽长安名利场，机锋早熟。
    attribution: 存疑
    excerpt: 骑牛远远过前村，短笛横吹隔陇闻。多少长安名利客，机关用尽不如君。
    text_display: full
    themes: [讽喻, 名利之辨]
    influence: 流传极广的题画式小诗，常被视为山谷早慧的证据。
    confidence: 有争议
    dispute: 七岁作之说出桐江诗话世传之语，属笔记层传闻；苕溪渔隐丛话引桐江诗话并存录，且该诗另见托名于他处（如后世小说引为他作），著作权难成定论，故标有争议。
    source_ids: [src-shanGuji]

  - work_id: yuzhong-dengyueyanglou-wangjunshan
    title: 雨中登岳阳楼望君山（其一）
    alt_titles: []
    genre: 七言绝句
    date:
      text: 约1102年放还东归途经岳阳时
      year: 1102
      precision: 约
    place: 岳阳楼
    context: 投荒万死鬓毛斑，生入瞿塘滟滪关——历尽贬谪侥幸生还，未到江南先一笑，岳阳楼上对君山；劫后余生的旷达一啸。
    attribution: 确凿
    excerpt: 投荒万死鬓毛斑，生入瞿塘滟滪关。未到江南先一笑，岳阳楼上对君山。
    text_display: excerpt
    themes: [贬谪生还, 旷达, 山水]
    influence: 晚年诗风愈老愈苍的代表，投荒万死与先一笑的对撞被视为绝境重生的千古名句。
    confidence: 存疑
    dispute: 东归途经岳阳的具体年份据行迹推定，约1102年前后。
    source_ids: [src-shanGuji]

  - work_id: bingqi-jingjiangting-jishi
    title: 病起荆江亭即事（其二）
    alt_titles: []
    genre: 七言律诗
    date:
      text: 约1102年寓居荆南时
      year: 1102
      precision: 约
    place: 荆南
    context: 闭门觅句陈无己，对客挥毫秦少游——以八字速写两位挚友的创作姿态，成为陈师道秦观的经典画像；尾联正字不知温饱未，西风吹泪古藤州哭悼客死藤州的秦观。
    attribution: 确凿
    excerpt: 闭门觅句陈无己，对客挥毫秦少游。正字不知温饱未，西风吹泪古藤州。
    text_display: excerpt
    themes: [友朋追怀, 论诗绝句笔法]
    influence: 闭门觅句对客挥毫自此成为陈秦二人的定型评语，开后来论诗绝句体式的先声。
    confidence: 存疑
    dispute: 系年从崇宁初寓荆南通说。
    source_ids: [src-shanGuji]

  - work_id: ding-fengbo-ci-gaozuocang
    title: 定风波·次高左藏使君韵
    alt_titles: [定风波·万里黔中一漏天]
    genre: 词
    date:
      text: 黔州安置期间重阳作，约1097—1098年
      year: 1097
      range_end: 1098
      precision: 范围
    place: 黔州
    context: 万里黔中一漏天，屋居终日似乘船——瘴雨连绵的贬所里，却写出莫笑老翁犹气岸的倔强，戏马台前追两谢，驰射风清犹拍古人肩。
    attribution: 确凿
    excerpt: 万里黔中一漏天，屋居终日似乘船。……莫笑老翁犹气岸，君看，几人白发上华颠。
    text_display: excerpt
    themes: [贬谪, 倔强旷达, 重阳]
    influence: 贬谪词中以气骨胜的代表作，老翁犹气岸为其黔中人格写照。
    confidence: 存疑
    dispute: 系年框定在黔中期间，确切重阳无考。
    source_ids: [src-shanGuji]

  - work_id: qingping-le-chungui-hechu
    title: 清平乐·晚春
    alt_titles: [清平乐·春归何处]
    genre: 词（小令）
    date:
      text: 创作年代不详
      precision: 未知
    place: ""
    context: 春归何处？寂寞无行路——向春天发痴问，唤取归来同住；问取黄鹂而百啭无人能解，因风飞过蔷薇，以无理之趣写惜春痴情。
    attribution: 确凿
    excerpt: 春归何处？寂寞无行路。若有人知春去处，唤取归来同住。……百啭无人能解，因风飞过蔷薇。
    text_display: excerpt
    themes: [惜春, 痴语, 无理而妙]
    influence: 其小令中最脍炙人口的一首，春归何处成为送春题材的经典发问。
    confidence: 存疑
    dispute: 结句文本有异：维基文库白香词谱箋本作因风飞过蔷薇，四库本山谷集词作因风吹过蔷薇，一字之差各有所据。
    source_ids: [src-shanGuji]

  - work_id: zhegu-tian-huangju-zhitou
    title: 鹧鸪天·黄菊枝头生晓寒
    alt_titles: []
    genre: 词
    date:
      text: "1100年，戎州席上"
      year: 1100
      precision: 精确
    place: 戎州
    context: 小序云座中有眉山隐客史应之和前韵，即席答之。醉里簪花倒着冠、黄花白发相牵挽，付与时人冷眼看——以狂态傲世，是晚年风骨的自塑。
    attribution: 确凿
    excerpt: 黄菊枝头生晓寒，人生莫放酒杯乾。……黄花白发相牵挽，付与时人冷眼看。
    text_display: excerpt
    themes: [狂傲, 秋兴, 冷眼处世]
    influence: 与史应之和韵唱酬的名场，醉里簪花倒着冠成为后世画家反复图写的意象。
    confidence: 存疑
    dispute: 维基文库单篇页作身建在且加餐無裙歌板盡清歡付與時人冷眼看，四库本山谷集词作身健在且加飡舞裙歌板盡情歡付與傍人冷眼看，健／建、舞／無、傍／时有明显异文，从四库本并标注。
    source_ids: [src-shanGuji]

  - work_id: yumeiren-yizhou-jianmei
    title: 虞美人·宜州见梅作
    alt_titles: []
    genre: 词
    date:
      text: 约1105年初春，宜州羁管中
      year: 1105
      precision: 约
    place: 宜州
    context: 天涯也有江南信，梅破知春近——岭外绝域忽见梅花，结拍平生个里愿杯深，去国十年老尽少年心，十年贬谪的心史一笔收束。
    attribution: 确凿
    excerpt: 天涯也有江南信，梅破知春近。……平生个里愿杯深，去国十年老尽少年心。
    text_display: excerpt
    themes: [贬谪, 梅花, 心史]
    influence: 绝笔期词作的代表作，去国十年老尽少年心为其晚年心境的定谳之句。
    confidence: 存疑
    dispute: 系年从宜州最后一年早春说，亦有作于赴宜途中之异说。
    source_ids: [src-shanGuji]

  - work_id: qianqiusui-zhuihe-qinshaoyou
    title: 千秋岁·追和秦少游
    alt_titles: [千秋岁·苑边花外]
    genre: 词
    date:
      text: 崇宁甲申（1104）道过衡阳
      year: 1104
      precision: 精确
    place: 衡阳
    context: 词序自记：少游得谪尝梦中作词云醉卧古藤阴下了不知南北，竟以元符庚辰死于藤州光华亭上；崇宁甲申庭坚窜宜州道过衡阳，览其遗墨，始追和其千秋岁词。飞骑轧鸣珂碎齐歌云绕扇赵舞风回带忆当年同朝之乐，结以洒泪谁能会，醉卧藤阴盖，人已去词空在——苏门凋零的挽歌。
    attribution: 确凿
    excerpt: 苑边花外，记得同朝退。……人已去，词空在……重感慨，波涛万顷珠沉海。
    text_display: excerpt
    themes: [悼亡, 苏门情谊, 今昔之感]
    influence: 追和秦观千秋岁的名作，词序本身即秦观临终谶语的原始文献，为苏门交谊最沉痛的见证。
    source_ids: [src-shanGuji]

