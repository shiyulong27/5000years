relations:
  - relation_type: 师承
    target_id: sushi
    direction: 双向
    period:
      text: 元丰间苏轼称赏其诗文始知名，至1101年苏轼卒
      year: 1080
      range_end: 1101
      precision: 范围
    evidence: 本传明载蘇軾嘗見其詩文以為超軼絕塵獨立萬物之表世久無此作由是聲名始震；又載與張耒晁補之秦觀俱游蘇軾門天下稱為四學士；軾為侍從時舉以自代其詞有瓌偉之文妙絕當世孝友之行追配古人之語其重之也如此。
    source_ids: [src-songshi-vol444]

  - relation_type: 挚友
    target_id: qinguan
    direction: 双向
    period:
      text: 元祐同朝共事，至1100年秦观卒
      year: 1086
      range_end: 1100
      precision: 范围
    evidence: 本传载二人俱游苏轼门天下称为四学士；病起荆江亭即事以闭门觅句陈无己对客挥毫秦少游并称陈秦，尾联西风吹泪古藤州哭秦观客死；崇宁甲申道过衡阳览秦观遗墨作千秋岁追和，词序自记其事。
    source_ids: [src-songshi-vol444, src-shanGuji]

  - relation_type: 思想影响
    target_id: dufu
    direction: 单向
    period:
      text: 后世对其诗学谱系的公论
      year: 1105
      precision: 约
    evidence: 本传引陈师道语谓其诗得法杜甫学甫而不为者；江西诗派尊杜为一祖、以庭坚为一宗，即由此脉而来。
    confidence: 存疑
    dispute: 与杜甫无现实交集，此为诗学承传关系而非人际交往；一祖三宗之说出自方回瀛奎律髓评点（公版文献，原文未逐条实取，暂以中立转述著录）。
    source_ids: [src-songshi-vol444]

reception:
  - era: 同时代
    evaluator: 苏轼
    quote: 超轶绝尘，独立万物之表，世久无此作。
    text_display: excerpt
    comment: 本传直引的苏轼评语，是苏黄订交的起点，也把黄庭坚一举推入第一流诗人之列。
    source_ids: [src-songshi-vol444]
  - era: 同时代
    evaluator: 苏轼
    quote: 瓌伟之文，妙绝当世；孝友之行，追配古人。
    text_display: excerpt
    comment: 本传载轼为侍从时举庭坚自代的荐词，才与行并举，其重之也如此。
    source_ids: [src-songshi-vol444]
  - era: 同时代
    evaluator: 陈师道及天下公论
    quote: 其诗得法杜甫，学甫而不为者。……蜀、江西君子以庭坚配轼，故称苏、黄。
    text_display: excerpt
    comment: 本传引陈师道论定其诗学渊源，又记当时人以之配苏轼并称苏黄，生前已是诗坛并峙的双峰。
    source_ids: [src-songshi-vol444]
  - era: 历代批评
    evaluator: 方回《瀛奎律髓》及江西诗派论
