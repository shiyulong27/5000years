    summary: 忽族子自外至，遽言侂胄用兵事。萬里慟哭失聲，亟呼紙書曰：「韓侂胄姦臣，專權無上，動兵殘民，謀危社稷，吾頭顱如許，報國無路，惟有孤憤！」又書十四言別妻子，筆落而逝。明年（本传叙事序次）升寶謨閣學士，卒，年八十三，贈光祿大夫。
    confidence: 存疑
    dispute: 卒年从开禧二年（1206）通行说，与 figures.yaml 登记闭合；本传卒于升宝谟阁学士同年而记事稍歧，寿数八十三与1127年生年不合（按1127年生享年八十），寿数存疑。
    source_ids: [src-yangwanli-zhuan]
  - stage: 光宗朝与退居东园
    stage_order: 21
    title: 学者称诚斋先生，赐谥文节
    date:
      text: 卒后赐谥，具体年份本传未载
      year: 1206
      precision: 约
    place: ""
    summary: 萬里精於詩，嘗著《易傳》行於世。光宗嘗為書「誠齋」二字，學者稱「誠齋先生」，賜諡「文節」。身后以诗名与节义并传。
    confidence: 存疑
    dispute: 赐谥文节的年份本传未系年，通说在嘉定年间追赐，待核。
    source_ids: [src-yangwanli-zhuan]

works:
  - work_id: xiao-chi
    title: 小池
    alt_titles: []
    genre: 七言绝句
    date:
      text: 创作年代无定说
      precision: 未知
    place: ""
    context: 泉眼无声惜细流，树阴照水爱晴柔，以一个惜字一个爱字赋予泉眼树阴以情，小荷才露尖尖角早有蜻蜓立上头，截取初夏池畔一瞬生机。
    attribution: 确凿
    excerpt: 泉眼無聲惜細流，樹陰照水愛晴柔。小荷纔露尖尖角，早有蜻蜓立上頭。
    text_display: full
    themes: [自然小品, 生机, 诚斋体]
    influence: 诚斋体最负盛名的样本之一，小荷才露尖尖角成为汉语中新生事物的经典意象；长期入选语文教材。
    source_ids: [src-chengzhaiji]

  - work_id: xiao-chu-jing-ci-song-lin-zifang
    title: 晓出净慈寺送林子方
    alt_titles: [西湖绝句（一说苏轼题名）]
    genre: 七言绝句
    date:
      text: 创作年代无定说，多系于淳熙后杭州时期
      year: 1187
      precision: 约
    place: 临安西湖净慈寺
    context: 送别诗而不写离情，纯以六月西湖大景压卷：接天蓮葉無窮碧，映日荷花別樣紅。
    attribution: 确凿
    excerpt: 畢竟西湖六月中，風光不與四時同。接天蓮葉無窮碧，映日荷花別樣紅。
    text_display: full
    themes: [送别, 西湖荷花, 大景白描]
    influence: 咏荷千古绝唱，接天莲叶无穷碧成为西湖夏日名片；长期入选语文教材。
    confidence: 有争议
    dispute: 维基文库该页标注此诗一说苏轼作、题西湖绝句；作者归属主流定为杨万里，惟存在异说。系年为约值无定论。
    source_ids: [src-chengzhaiji]

  - work_id: su-xin-shi-xu-gong-dian
    title: 宿新市徐公店二首（其一）
    alt_titles: [宿新市徐公店]
    genre: 七言绝句
    date:
      text: 创作年代无定说
      precision: 未知
    place: 新市徐公店
    context: 篱落疏疏一径深的村店春景，儿童急走追黄蝶飞入菜花无处寻，以蝶色菜花一色难辨收束童趣。
    attribution: 确凿
    excerpt: 籬落疏疏一逕深，樹頭新綠未成陰。兒童急走追黃蝶，飛入菜花無處尋。
    text_display: full
    themes: [田园, 童趣, 春景]
    influence: 追黄蝶入菜花是古代儿童诗的名场面，长期入选小学语文教材。
    confidence: 有争议
    dispute: 第二句维基文库本作樹頭新綠未成陰，通行教材本多作樹頭花落未成陰，异文并存未定孰为原本。
    source_ids: [src-chengzhaiji]

  - work_id: xian-ju-chu-xia-wu-shui-qi
    title: 闲居初夏午睡起二绝句（其一）
    alt_titles: [闲居初夏午睡起]
    genre: 七言绝句
    date:
      text: 创作年代无定说
      precision: 未知
    place: ""
    context: 梅子留酸软齿牙，芭蕉分绿与窗纱，以味觉与色彩写初夏午睡起的慵懒，闲看儿童捉柳花收于一片闲静。
    attribution: 确凿
    excerpt: 梅子留酸軟齒牙，芭蕉分綠與窗紗。日長睡起無情思，閑看兒童捉柳花。
    text_display: full
    themes: [初夏, 闲适, 生活趣味]
    influence: 诚斋体以生活琐事入诗的代表，闲看儿童捉柳花为历代传诵的名句。
    confidence: 有争议
    dispute: 其第二句维基文库本作戲掬清泉濂蕉葉，通行本或作灑蕉葉，濂字疑为形误或版本异文，未深校善本。
    source_ids: [src-chengzhaiji]

  - work_id: guo-song-yuan-chen-chui-qi-gong-dian
    title: 过松源晨炊漆公店（其五）
    alt_titles: [过松源晨炊漆公店六首（其五）]
    genre: 七言绝句
    date:
      text: 通说系于绍熙年间江东任职往返山中途中，无定说
      year: 1190
      range_end: 1192
      precision: 范围
    place: 松源、漆公店（皖浙山区道中）
    context: 莫言下嶺便無難，賺得行人空喜歡。正入萬山圈子裡，一山放出一山攔。以行山喻人生困难重重，议论与形象浑然一体。
    attribution: 确凿
    excerpt: 莫言下嶺便無難，賺得行人空喜歡。正入萬山圈子裡，一山放出一山攔。
    text_display: full
    themes: [行旅, 哲理, 山川拟人]
    influence: 以俚语入理趣的诚斋体名篇，一山放出一山拦成为常用的人生譬喻；入选语文教材。
    confidence: 存疑
    dispute: 组诗首数各本著录不一（五首／六首），系年无定说，取江东任内通行推定。
    source_ids: [src-chengzhaiji]

  - work_id: chu-ru-huai-he-si-jue-ju
    title: 初入淮河四绝句
    alt_titles: []
    genre: 七言绝句（组诗）
    date:
      text: "约1190年（绍熙元年接伴金使北行途中）"
      year: 1190
      precision: 约
    place: 淮河沿线
    context: 奉使北上亲见绍兴和议后以淮水为界的中流之痛：兩岸舟船各背馳，波痕交涉亦難為。衹餘鷗鷺無拘管，北去南來自在飛。以鸥鹭之自由反衬南北之阻隔。
    attribution: 确凿
    excerpt: 船離洪澤岸頭沙，人到淮河意不佳。何必桑乾方是遠，中流以北即天涯。……兩岸舟船各背馳，波痕交涉亦難為。衹餘鷗鷺無拘管，北去南來自在飛。
    text_display: excerpt
    themes: [使金, 南北分界, 家国之痛]
    influence: 南宋使北诗中的代表作，鸥鹭无拘管之叹被视为以轻笔写沉痛的典范。
    confidence: 存疑
    dispute: 组诗系于绍熙元年接伴之行系据本传使命与诗境互证的通行系年，非本传明载。
    source_ids: [src-chengzhaiji, src-yangwanli-zhuan]

  - work_id: zhao-jun-yuan-yong-he-shang-yu
    title: 昭君怨·咏荷上雨
    alt_titles: []
    genre: 词（小令）
    date:
      text: 创作年代无定说
      precision: 未知
    place: 西湖（词境）
    context: 午梦扁舟花底起笔，却是池荷跳雨，散了真珠还聚，聚作水银窝，泛清波，以跳、散、聚、泛四个动词写尽雨点荷叶的动感。
    attribution: 确凿
    excerpt: 午夢扁舟花底，香滿西湖煙水。急雨打篷聲，夢初驚。卻是池荷跳雨，散了真珠還聚。聚作水銀窩，泛清波。
    text_display: full
    themes: [咏物, 夏雨, 动感白描]
    influence: 诚斋体活法移之于词的样本，咏荷上雨为宋词咏物小令中的巧思之作。
    source_ids: [src-chengzhaiji]

  - work_id: han-que
    title: 寒雀
    alt_titles: []
    genre: 七言绝句
    date:
      text: 创作年代无定说
      precision: 未知
    place: ""
    context: 百千寒雀下空庭，小集梅梢话晚晴，特地作团喧杀我，忽然惊散寂无声，写寒雀群喧乍寂的瞬间，如闻其声。
    attribution: 确凿
    excerpt: 百千寒雀下空庭，小集梅梢話晚晴。特地作團喧殺我，忽然驚散寂無聲。
    text_display: full
    themes: [咏物, 冬景, 谐趣]
    influence: 诚斋体以口语写物态生趣的小品代表。
    source_ids: [src-chengzhaiji]

  - work_id: xiao-xing-wang-yun-shan
    title: 晓行望云山
    alt_titles: []
    genre: 七言绝句
    date:
      text: 创作年代无定说
      precision: 未知
    place: ""
    context: 却有一峰忽然长，方知不动是真山，以动写静、以幻衬真，破晓时分云山莫辨的一悟。
    attribution: 确凿
    excerpt: 霽天欲曉未明間，滿目奇峯總可觀。却有一峯忽然長，方知不動是真山。
    text_display: full
    themes: [山水, 观物之理, 诚斋体]
    influence: 活法诗学的典型样本——于寻常晓行中翻出真幻之辨。
    source_ids: [src-chengzhaiji]

  - work_id: ou-cheng-zhen-qin-yin-pen-chi
    title: 偶成（珍禽饮盆池）
    alt_titles: []
    genre: 五言绝句
    date:
      text: 创作年代无定说
      precision: 未知
    place: ""
    context: 珍禽饮盆池，将扇扑窗户。一声惊得飞，再声惊不去。二十字写小鸟与人相狎的瞬间情态，机趣盎然。
    attribution: 确凿
    excerpt: 珍禽飲盆池，將扇撲窗戶。一聲驚得飛，再聲驚不去。
    text_display: full
    themes: [咏物, 小品, 谐趣]
    influence: 五绝小品的诚斋体样本，可见其观物之细。
    source_ids: [src-chengzhaiji]

