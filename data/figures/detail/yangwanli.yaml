# 杨万里全景详卷（schema v1）
# 史料审计表（实取证据；来源登记见 data/sources.yaml）：
#
# | 事实点 | 宋史·卷433·列传192·儒林三·杨万里传（维基文库实取） | 结论与置信 |
# |---|---|---|
# | 名号籍贯 | 楊萬里，字廷秀，吉州吉水人 | 确定 |
# | 及第释褐 | 中紹興二十四年進士第，為贛州司戶，調永州零陵丞 | 确定；及第年份1154可精确 |
# | 诚斋之诲 | 時張浚謫永，杜門謝客，萬里三往不得見，以書力請，始見之。浚勉以正心誠意之學，萬里服其教終身，乃名讀書之室曰「誠齋」 | 确定 |
# | 荐起与县治 | 浚入相，薦之朝。除臨安府教授，未赴，丁父憂。改知隆興府奉新縣，戢追胥不入鄉……縣以大治 | 确定 |
# | 抗疏留栻 | 侍講張栻以論張說出守袁，萬里抗疏留栻……而公論偉之 | 确定 |
# | 广东平盗与仁者之勇 | 盜沈師犯南粵，帥師往平之。孝宗稱之曰「仁者之勇」，遂有大用意，就除提點刑獄。請於潮、惠二州築外砦 | 确定 |
# | 地震应诏上书 | 淳熙十二年五月，以地震，應詔上書曰：臣聞言有事於無事之時，不害其為忠…… | 确定 |
# | 东宫侍读 | 東宮講官闕，帝親擢萬里為侍讀。宮僚以得端人相賀……太子深敬之 | 确定 |
# | 献人才名录 | 即疏朱熹、袁樞以下六十人以獻，淮次第擢用之 | 确定 |
# | 直谏获谴 | 萬里上疏詆之，力言張浚當預，且謂邁無異指鹿為馬。孝宗覽疏不悅，曰：「萬里以朕為何如主？」由是以直秘閣出知筠州 | 确定 |
# | 铁钱忤意不复出 | 萬里疏其不便，不奉詔，忤宰相意，改知贛州，不赴，乞祠……提舉萬壽宮，自是不復出矣 | 确定 |
# | 拒为南园记 | 屬萬里為之記，許以掖垣。萬里曰：「官可棄，記不可作也。」……臥家十五年，皆其柄國之日也 | 确定 |
# | 临终恸哭 | 萬里慟哭失聲，亟呼紙書曰：「韓侂胄姦臣，專權無上，動兵殘民，謀危社稷，吾頭顱如許，報國無路，惟有孤憤！」又書十四言別妻子，筆落而逝 | 确定 |
# | 卒年寿数 | 明年，升寶謨閣學士，卒，年八十三，贈光祿大夫 | 卒于开禧二年（1206）确定；惟「年八十三」与通行生年1127不合（按1127年生则享年八十），寿数存疑 |
# | 光宗书斋名 | 光宗嘗為書「誠齋」二字，學者稱「誠齋先生」，賜諡「文節」 | 确定；谥号赐予年份本传未系年 |
# | 诗才著述 | 萬里精於詩，嘗著《易傳》行於世 | 确定；《千虑策》不见本传，通行说法待另行核实（存疑） |
# | 作品文本 | 小池、曉出淨慈寺送林子方、宿新市徐公店、閑居初夏午睡起、過松源晨炊漆公店、初入淮河四絕句、昭君怨咏荷上雨、寒雀、曉行望雲山、偶成均取维基文库单篇页公版原文 | 通行本层；个别异文（宿新市「新綠／花落」、闲居「濂／灑蕉葉」）已逐条标注 |
#
