  - stage: 天变之争与两罢相
    stage_order: 13
    title: 王韶开熙河，解玉带赐安石
    date:
      text: 约熙宁五年至六年之间（1072—1073）
      year: 1072
      range_end: 1073
      precision: 范围
    place: 熙河、汴京
    summary: 王韶开熙河奏功，帝以安石主议解所服玉带赐之。同年前后开封民避保甲有截指断腕者、东明民遮宰相马诉助役钱，安石皆强辩折之，本传评曰其强辩背理率类此。
    confidence: 存疑
    dispute: 开熙河系年从熙河之役通说；截指断腕等事本传采自旧党一面记录，读者须知史源立场。
    source_ids: [src-songshi-vol327]
  - stage: 天变之争与两罢相
    stage_order: 14
    title: 郑侠流民图与天变之争，首次罢相
    date:
      text: 熙宁七年春（1074）
      year: 1074
      precision: 精确
    place: 汴京
    summary: 天下久旱饥民流离，帝欲尽罢法度之不善者，安石曰水旱常数尧汤所不免。监安上门郑侠绘流民扶老携幼困苦之状为图以献曰旱由安石所致去安石天必雨。慈圣宣仁二太后流涕谓帝曰安石乱天下，帝亦疑之。遂罢为观文殿大学士知江宁府。本传又录其「天变不足畏祖宗不足法人言不足恤」之语为论敌概括其立场。
    source_ids: [src-songshi-vol327]
  - stage: 天变之争与两罢相
    stage_order: 15
    title: 复相与吕惠卿交恶
    date:
      text: 熙宁八年二月至九年间（1075—1076）
      year: 1075
      range_end: 1076
      precision: 范围
    place: 汴京
    summary: 韩绛吕惠卿守其成谋时号传法沙门护法善神；惠卿实欲自得政忌安石复来，陷其弟安国。绛觉其意密白帝请召之，八年二月复拜相，《三经义》成加尚书左仆射兼门下侍郎。后惠卿发安石私书有无使上知者，子雱愤恚疽发背死。
    confidence: 存疑
    dispute: 无使上知私书事发之月日本传未细系，范围据再相起讫推定。
    source_ids: [src-songshi-vol327]
  - stage: 天变之争与两罢相
    stage_order: 16
    title: 子雱死后力请解机务，再罢退居江宁
    date:
      text: 熙宁九年（1076）
      year: 1076
      precision: 精确
    place: 汴京、江宁
    summary: 再相以来屡谢病求去，及子雱死尤悲伤不堪力请解几务，上益厌之。罢为镇南军节度使同平章事判江宁府，从此离朝，居江宁城东与钟山之间，自号半山。
    source_ids: [src-songshi-vol327]

