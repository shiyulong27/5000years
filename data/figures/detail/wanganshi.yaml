    summary: 直集贤院同修起居注辞之累日至八九上章乃受，遂知制诰纠察在京刑狱自是不复辞官。以母忧去，终英宗世召不起，居江宁讲学授徒。守制讲学细节据文集与其门人记述，正史仅记召不起。
