    summary: 通判舒州。文彦博为相荐安石恬退乞不次进用以激奔竞之风；寻召试馆职不就。欧阳修荐为谏官以祖母年高辞，修以其须禄养言于朝用为群牧判官，请知常州，移提点江东刑狱。屡辞美官之名由是大起，士大夫恨不识其面。
