  # ── 阶段三：越次入对与拜相变法 ────────────────────────
  - stage: 越次入对与拜相变法
    stage_order: 8
    title: 神宗立，越次入对问治道
    date:
      text: 熙宁元年四月（1068）
      year: 1068
      precision: 精确
    place: 汴京
    summary: 神宗在藩邸时韩维每称维之友王安石之说，帝由是想见其人。甫即位命知江宁府数月召为翰林学士兼侍讲。熙宁元年四月始造朝入对，帝问为治所先对曰择术为先；帝举唐太宗，安石曰陛下当法尧舜何以太宗为哉。君臣问答即本传所载越次入对之实录。
    source_ids: [src-songshi-vol327]
  - stage: 越次入对与拜相变法
    stage_order: 9
    title: 拜参知政事，设制置三司条例司行新法
    date:
      text: 熙宁二年二月（1069）
      year: 1069
      precision: 精确
    place: 汴京
    summary: 二年二月拜参知政事。帝问所施设以何先，对曰变风俗立法度正方今之所急也。于是设制置三司条例司，令陈升之同领之，吕惠卿预其事；农田水利青苗均输保甲免役市易保马方田诸役相继并兴号为新法，遣提举官四十余辈颁行天下。
    related_event_id: wanganshi-reform-1069
    source_ids: [src-songshi-vol327]
  - stage: 越次入对与拜相变法
    stage_order: 10
    title: 青苗免役诸法推行与内容要目
    date:
      text: 熙宁二年至七年之间（1069—1074）
      year: 1069
      range_end: 1074
      precision: 范围
    place: 天下诸路
    summary: 本传分记诸法：青苗以常平籴本散与人户令出息二分春散秋敛；免役据家赀高下出钱雇人充役；市易赊贷官财出息十分之二；保甲籍乡村之民二丁取一十家为保教之战阵；保马户养官马一匹；方田东西南北各千步量地定税。四方争言农田水利古陂废堰悉务兴复。须注：本传继以「由是賦斂愈重而天下騷然矣」总评，系元修宋史的负面定性，本卷照录史源立场供读者对照，不作增删。
    confidence: 存疑
    dispute: 条目内容为正史明文，然宋史本传对变法整体持批评立场（论曰径引朱熹「流毒四海」语），诸法实际执行效果在史料层面存在旧党记录占优的结构性偏差。
    source_ids: [src-songshi-vol327]
  - stage: 越次入对与拜相变法
    stage_order: 11
    title: 吕诲弹章、司马光三诒书、韩琦谏疏
    date:
      text: 熙宁二年至三年之间（1069—1070）
      year: 1069
      range_end: 1070
      precision: 范围
    place: 汴京
    summary: 御史中丞吕诲论安石过失十事帝为出诲。韩琦谏疏至帝感悟欲从之，安石求去。司马光答诏有士夫沸腾黎民骚动之语，安石怒抗章自辨；安石与光素厚，光援朋友责善之义三诒书反复劝之，安石不乐。其后刘述程颢范纯仁等台谏相继去朝，骤用李定为御史又起争议。
    source_ids: [src-songshi-vol327]
  - stage: 越次入对与拜相变法
    stage_order: 12
    title: 拜同中书门下平章事
    date:
      text: 熙宁三年十二月（1070）
      year: 1070
      precision: 精确
    place: 汴京
    summary: 三年十二月拜同中书门下平章事，正式居首相之位主导变法。
    source_ids: [src-songshi-vol327]

