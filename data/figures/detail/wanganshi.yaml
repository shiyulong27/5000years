relations:
  - relation_type: 同僚
    target_id: sushi
    direction: 双向
    period:
      text: 熙宁、元丰间同朝为僚，政见相左而文章相知
      year: 1068
      range_end: 1086
      precision: 范围
    evidence: 苏轼因反对新法外放，乌台诗案系狱几死。本卷王安礼附传明载苏轼下御史狱势危甚无敢救者，安礼从容言自古大度之主不以言语罪人，轼以故得轻比；至于安石本人「岂有圣世而杀才士乎」之救轼语，仅见宋人笔记层，正史无征。二人晚年于江宁会晤唱和，苏轼有骑驴渺渺入荒陂想见先生未病时之句（文集层，未实取核验）。
    confidence: 存疑
    dispute: 安石救轼语属宋人笔记层，出处未经正史核验；江宁会晤与唱和诗文本尚未实取，引用时须降级展示。政敌而私谊有据的判断本身依赖多层史料拼接，故整条标存疑。
    source_ids: [src-songshi-vol327]
  - relation_type: 同僚
    target_id: ouyangxiu
    direction: 双向
    period:
      text: 庆历至熙宁间同朝，由奖掖而分歧
      year: 1042
      range_end: 1071
      precision: 范围
    evidence: 友生曾巩携安石文示欧阳修，修为之延誉；修又荐为谏官，安石以祖母年高辞，修以其须禄养言于朝用为群牧判官。及新法行，欧乞致仕冯京请留之，安石曰修附丽韩琦以琦为社稷臣如此人在一郡则坏一郡在朝廷则坏朝廷留之安用乃听之——奖掖与排斥均为本传明文。
    confidence: 确定
    source_ids: [src-songshi-vol327]

reception:
  - era: 同时代
    evaluator: 韩琦
    quote: 安石为翰林学士则有余，处辅弼之地则不可。
    text_display: excerpt
    comment: 本传论曰所引神宗问相时韩琦答语，代表旧党元老对其行政能力的保留意见；本卷照录以存史源，不代表项目立场。
    source_ids: [src-songshi-vol327]
  - era: 同时代
    evaluator: 司马光
    quote: 士夫沸腾，黎民骚动。
    text_display: excerpt
    comment: 新法初行时司马光答诏语，本传明载；光后又三致书反复论新法之害，二人由素厚之交转为政敌，为新旧党争最具象征性的对立。
    source_ids: [src-songshi-vol327]
  - era: 同时代
    evaluator: 吕诲（御史中丞）
    quote: ""
    text_display: none
    comment: 熙宁二年上疏论安石过失十事，为新法反对派的第一份系统性弹章；弹章全文见宋史吕诲传，本卷未逐条录入。
    source_ids: [src-songshi-vol327]
  - era: 同时代
    evaluator: 苏洵（本传引述，真伪有争）
    quote: 是不近人情者，鲜不为大奸慝。
    text_display: excerpt
    comment: 本传记安石未贵时蜀人苏洵作辩奸论刺之比之王衍卢杞合为一人。南宋以降学者多疑辩奸论系伪托，此处仅录宋史引述原貌并如实标注归属争议。
    confidence: 有争议
    dispute: 辩奸论是否苏洵所作、所指是否安石，历代聚讼未决；宋史采录入传本身反映元修史书的批判取向。
    source_ids: [src-songshi-vol327]
  - era: 历代批评
    evaluator: 元·脱脱等《宋史》论曰（引朱熹）
    quote: 以文章节行高一世，而尤以道德经济为己任。……而安石乃汲汲以财利兵革为先务，引用凶邪，排摈忠直，躁迫强戾……卒之群奸嗣虐，流毒四海。
    text_display: excerpt
    comment: 南宋理学家的否定性定调被元修宋史采为盖棺论论断，并与高宗停配享削王封的官方处置相表里，构成此后数百年「变乱祖宗法度」的主流评价；本卷照录原文以呈现传统史学的批判框架，不作增删。
    source_ids: [src-songshi-vol327]
  - era: 历代批评
    evaluator: 清代蔡上翔《王荆公年谱考略》以来的翻案脉络
    quote: ""
