  - stage: 江宁十年与身后
    stage_order: 19
    title: 身后荣辱翻覆：谥文、配享、追封到停罢削夺
    date:
      text: 绍圣至绍兴间（1094—1130年代）
      year: 1094
      range_end: 1138
      precision: 范围
    place: 汴京
    summary: 绍圣中谥曰文配享神宗庙庭；崇宁三年配食文宣王庙列于颜孟之次追封舒王；钦宗时杨时以为言诏停之；高宗用赵鼎吕聪问言停宗庙配享削其王封。一人之褒赠与剥夺随新旧党争政局三翻四覆，为宋代政治文化之缩影。
    confidence: 存疑
    dispute: 绍圣起讫上限取绍圣元年，高宗削封下限取绍兴年间赵鼎当政期，系据本传叙次推定。
    source_ids: [src-songshi-vol327]

works:
  - work_id: yuan-ri
    title: 元日
    alt_titles: []
    genre: 七言绝句
    date:
      text: 约熙宁初年拜相前后（1069年前后）
      year: 1069
      precision: 约
    place: 汴京（一说）
    context: 初执国柄力行新法之际咏岁元新象，爆竹屠苏桃符的更新意象与变法气象互映。
    attribution: 确凿
    excerpt: 爆竹声中一岁除，春风送暖入屠苏。千门万户曈曈日，总把新桃换旧符。
    text_display: full
    themes: [节令, 更新]
    influence: 咏春节第一诗，曈曈日与新桃旧符成为辞旧迎新的公共意象。
    confidence: 存疑
    dispute: 系年从熙宁初通说，无正史或编年确证；文本用通行公版，未逐页核对宋刻底本。
    source_ids: [src-wanganshi-ji]

  - work_id: bo-chuan-gua-zhou
    title: 泊船瓜洲
    alt_titles: []
    genre: 七言绝句
    date:
      text: 熙宁八年复相途中说为主流，另有晚年江宁说
      year: 1075
      precision: 约
    place: 瓜洲渡（今江苏扬州邗江南）
    context: 京口瓜洲一水间钟山只隔数重山——离乡赴阙之际回望钟山，春风又绿江南岸明月何时照还。
    attribution: 确凿
    excerpt: 京口瓜洲一水间，钟山只隔数重山。春风又绿江南岸，明月何时照我还？
    text_display: full
    themes: [思归, 江景]
    influence: 春风又绿江南岸为炼字典范，洪迈容斋随笔记其先作到过入满凡十字而后定为绿字。
    confidence: 存疑
    dispute: 作时有复相途中与晚年江宁两说；「绿」字屡改典故出自洪迈容斋随笔笔记层，本次未实取该书原文，姑存疑；文本用通行公版本未核宋刻底本。
    source_ids: [src-wanganshi-ji]

  - work_id: deng-fei-lai-feng
    title: 登飞来峰
    alt_titles: [登飞来峰（一作浙东纪行诗）]
    genre: 七言绝句
    date:
      text: 约皇祐二年前后知鄞县秩满往返杭州之际（约1050年前后）
      year: 1050
      precision: 约
    place: 杭州飞来峰（一说绍兴林山）
    context: 青年州县官登高明志之作，不畏浮云遮望眼与其后变法中不惧人言的姿态互为印证。
    attribution: 确凿
    excerpt: 飞来山上千寻塔，闻说鸡鸣见日升。不畏浮云遮望眼，自缘身在最高层。
    text_display: full
    themes: [登览, 明志]
    influence: 不畏浮云遮望眼成为不惧阻挠的经典格言，长期入选语文教材。
    confidence: 存疑
    dispute: 作地有杭州飞来峰与绍兴林山（应天塔）两说；异文「飞来山上」一作「飞来峰上千寻塔」、「自缘」一作「只缘」。文本用通行公版本未核宋刻底本。
    source_ids: [src-wanganshi-ji]

  - work_id: mei-hua-qiang-jiao
    title: 梅花
    alt_titles: []
    genre: 五言绝句
    date:
      text: 晚年退居江宁时期（约1077—1086）
      year: 1077
      range_end: 1086
      precision: 范围
    place: 江宁
    context: 罢相闲居以凌寒孤梅自况，为有暗香来写尽政治失意中的自持。
    attribution: 确凿
    excerpt: 墙角数枝梅，凌寒独自开。遥知不是雪，为有暗香来。
    text_display: full
    themes: [咏物, 自喻]
    influence: 咏梅绝唱之一，凌寒独自开成为人格操守的象征。
    confidence: 存疑
    dispute: 系年从退居江宁通说；文本用通行公版本未核宋刻底本。
    source_ids: [src-wanganshi-ji]

  - work_id: shu-hu-yin-xian-sheng-bi
    title: 书湖阴先生壁二首（其一）
    alt_titles: []
    genre: 七言绝句
    date:
      text: 晚年退居江宁时期（约1077—1086）
      year: 1077
      range_end: 1086
      precision: 范围
    place: 江宁钟山（湖阴先生杨德逢宅）
    context: 题隐居邻友杨德逢屋壁，一水护田将绿绕两山排闼送青来以山水有情写田园之趣。
    attribution: 确凿
    excerpt: 茅檐长扫净无苔，花木成畦手自栽。一水护田将绿绕，两山排闼送青来。
    text_display: excerpt
    themes: [田园, 咏景]
    influence: 对偶精工而自然，被推为绝句中炼句极致。
    confidence: 存疑
    dispute: 系年与受主杨德逢身份从江宁时期通说；其二未录。文本用通行公版本。
    source_ids: [src-wanganshi-ji]

  - work_id: shang-zhong-yong
    title: 伤仲永
    alt_titles: []
    genre: 散文（杂说）
    date:
      text: 庆历三年前后追记（约1043）
      year: 1043
      precision: 约
    place: 金溪（今江西金溪）
    context: 记金溪神童方仲永不使学而泯然众人的故事，结以受于人者不至之叹，申后天学习之重。
    attribution: 确凿
    excerpt: 金溪民方仲永，世隶耕。仲永生五年，未尝识书具，忽啼求之。……卒之为众人，则其受于人者不至也。
    text_display: excerpt
    themes: [劝学, 人才]
    influence: 长期入选语文教材，伤仲永成为天赋荒废的经典隐喻。
    confidence: 存疑
    exclude: false
    dispute: 所记之事在明道中（1032—1033），成文年份系据文中还自扬州的行迹推定的通说；文本已自维基文库《傷仲永》（据王臨川集卷071）实取核验。
    source_ids: [src-wanganshi-ji]

  - work_id: you-bao-chan-shan-ji
    title: 游褒禅山记
    alt_titles: []
    genre: 散文（游记）
    date:
      text: 至和元年七月（1054）
      year: 1054
      precision: 精确
    place: 和州褒禅山（今安徽含山）
    context: 与四人拥火探华阳洞不得极游，因发世之奇伟瑰怪非常之观常在于险远的求思之论，尽吾志而不能至者可以无悔矣——其志其力其物相之辨被视为变法精神的先声。
    attribution: 确凿
    excerpt: 夫夷以近，则游者众；险以远，则至者少。而世之奇伟瑰怪非常之观，常在于险远……尽吾志也，而不能至者，可以无悔矣。
    text_display: excerpt
    themes: [游记, 明志]
    influence: 借游说理的唐宋古文名篇，长期入选语文教材。
    confidence: 确定
    dispute: ""
    notes: 文末落款至和元年七月某日临川王某记，系年即作者自书明文。
    source_ids: [src-wanganshi-ji]

  - work_id: du-meng-chang-jun-chuan
    title: 读孟尝君传
    alt_titles: []
    genre: 散文（读史短论）
    date:
      text: 成文年份不详
      precision: 未知
    place: ""
    context: 全文不满百字而四转到底，翻世皆称孟尝君能得士之案，断言鸡鸣狗盗之出其门此士之所以不至也。
    attribution: 确凿
    excerpt: 世皆称孟尝君能得士，士以故归之，而卒赖其力，以脱于虎豹之秦。嗟乎！孟尝君特鸡鸣狗盗之雄耳，岂足以言得士？
    text_display: excerpt
    themes: [读史, 翻案]
    influence: 短文翻案的极致范本，长期入选语文教材与古文选本。
    confidence: 确定
    dispute: ""
    notes: 文本已自维基文库《讀孟嘗君傳》（据王臨川集卷071、古文观止卷11）实取核验；成文年代无载。
    source_ids: [src-wanganshi-ji]

  - work_id: gui-zhi-xiang-jin-ling-huai-gu
    title: 桂枝香·金陵怀古
    alt_titles: []
    genre: 词
    date:
      text: 居江宁时期（约熙宁年间）
      year: 1067
      range_end: 1076
      precision: 范围
    place: 江宁
    context: 登高晚秋览金陵形胜，千里澄江似练翠峰如簇；叹六朝旧事随流水，念门外楼头悲恨相续，借吊古警当世。
    attribution: 确凿
    excerpt: 登临送目，正故国晚秋，天气初肃。千里澄江似练，翠峰如簇。……六朝旧事随流水，但寒烟衰草凝绿。
    text_display: excerpt
    themes: [怀古, 咏史]
    influence: 以词怀古的开山杰作，历代词话推为金陵怀古绝调。
    confidence: 存疑
    dispute: 系年从居江宁通说无确证；结句异文「衰草」一作「芳草」。文本用通行公版本未核底本。
    source_ids: [src-wanganshi-ji]

