      year: 1077
      range_end: 1085
      precision: 范围
    place: 江宁
    summary: 判江宁府明年改集禧观使封舒国公；元丰二年复拜左仆射观文殿大学士换特进改封荆。训释诗书周礼既成颁之学官天下号新义；晚居金陵又作字说，本传评其多穿凿傅会其流入于佛老。哲宗立加司空。
    confidence: 存疑
    dispute: 封爵迁转依本传次序，元丰二年复拜左仆射为虚衔优礼；字说之学理评价历来聚讼，本传贬语照录。
    source_ids: [src-songshi-vol327]
  - stage: 江宁十年与身后
    stage_order: 18
    title: 司马光当国尽废新法，安石病逝江宁
    date:
      text: 元祐元年（1086）
      year: 1086
      precision: 精确
    place: 江宁
    summary: 哲宗立太皇太后垂帘，司马光执政相继罢免役青苗诸法，安石在江宁闻之默然，未几卒年六十八赠太傅。本传未直书废法与卒之关联，废法次第见司马光等传，此处从通说合叙。
    confidence: 存疑
    dispute: 安石对新法尽废的具体反应见于宋人笔记层而非本传明文；卒月日诸谱略有出入。
