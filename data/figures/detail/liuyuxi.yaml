    confidence: 存疑
    dispute: 幕府起讫年份据职历推定。
    source_ids: [src-jts-vol160]
  - stage: 入仕与永贞革新
    stage_order: 4
    title: 永贞革新核心，「二王刘柳」
    date:
      text: "805年"
      year: 805
      precision: 精确
    place: 长安
    summary: 王叔文于东宫用事，禹锡尤为叔文知奖以宰相器待之。顺宗即位久疾不任政事禁中文诰皆出于叔文，引禹锡及柳宗元入禁中与之图议言无不从。转屯田员外郎判度支盐铁案。侍御史窦群奏禹锡挟邪乱政不宜在朝群即日罢官。京师人士道路以目时号二王刘柳。
    source_ids: [src-jts-vol160]

  # ── 阶段二：朗州十年 ──────────────────────────────
  - stage: 朗州十年
    stage_order: 5
    title: 叔文败，贬连州再贬朗州司马
    date:
      text: 约805—806年之间
      year: 805
      range_end: 806
      precision: 范围
    place: 连州、朗州
    summary: 叔文败坐贬连州刺史，在道贬朗州司马。初禹锡宗元等八人犯众怒宪宗亦怒故再贬，制有逢恩不原之令。
    source_ids: [src-jts-vol160]
  - stage: 朗州十年
    stage_order: 6
    title: 朗州十年，为巫祝作新辞
    date:
      text: 约806—815年之间
      year: 806
      range_end: 815
      precision: 范围
    place: 朗州（武陵）
    summary: 地居西南夷士风僻陋无可与言者，唯以文章吟咏陶冶情性。蛮俗好巫每淫祠鼓舞必歌俚辞，禹锡依骚人之作为新辞以教巫祝，故武陵溪洞间夷歌率多禹锡之辞——此即其民歌词体创作的正史史源。
    source_ids: [src-jts-vol160]
  - stage: 朗州十年
    stage_order: 7
    title: 读张九龄文集而叙怨刺之意
    date:
      text: 贬谪期间，确切年份不详
      precision: 未知
    place: 湘澧间
    summary: 积岁在湘澧间郁悒不怡，因读张九龄文集乃叙其意，责曲江建言放臣不宜于善地多徙五溪不毛之乡，托讽禽鸟寄辞草树郁然与骚人同风。
    source_ids: [src-jts-vol160]

  # ── 阶段三：玄都观诗案与连州 ────────────────────────
  - stage: 玄都观诗案与连州
    stage_order: 8
    title: 元和十年召还，看花诗案复出播州
    date:
      text: "815年"
      year: 815
      precision: 精确
    place: 长安
    summary: 自武陵召还宰相复欲置之郎署，时禹锡作游玄都观咏看花君子诗语涉讥刺执政不悦复出为播州刺史。前篇有玄都观里桃千树总是刘郎去后栽之句。
    source_ids: [src-jts-vol160]
  - stage: 玄都观诗案与连州
    stage_order: 9
    title: 柳宗元请以柳州易播州，裴度奏老母改连州
    date:
      text: "815年"
      year: 815
      precision: 精确
    place: 长安
    summary: 御史中丞裴度奏禹锡有母年八十余播州西南极远恐伤陛下孝理之风，宪宗改容乃改授连州刺史。同卷柳宗元传并载宗元请以柳州授禹锡自往播州的执友情事。
    source_ids: [src-jts-vol160]
  - stage: 玄都观诗案与连州
    stage_order: 10
    title: 连州而后连剌数郡十余年
    date:
      text: 约815—826年之间
      year: 815
      range_end: 826
      precision: 范围
    place: 连州、夔州、和州
    summary: 去京师又十余年连刺数郡。夔州任上依朗州旧习作竹枝新辞，和州任上题陋室。任职次第据职历与诗集编年互证。
    confidence: 存疑
    dispute: 夔州和州起讫年份诸家谱系略有出入。
    source_ids: [src-jts-vol160, src-quantangshi-liuyuxi]

  # ── 阶段四：再征与晚年唱和 ──────────────────────────
  - stage: 再征与晚年唱和
    stage_order: 11
    title: 太和二年征还，再题玄都观
    date:
      text: "828年"
      year: 828
      precision: 精确
    place: 长安
    summary: 自和州刺史征还拜主客郎中。禹锡衔前事未已复作游玄都观诗序：重游兹观荡然无复一树唯兔葵燕麦动摇于春风。后篇有种桃道士今何在前度刘郎又到来之句（通行本作今又来），人嘉其才而薄其行。
    confidence: 存疑
    dispute: 后篇结句旧书引作「前度刘郎又到来」通行本作「前度刘郎今又来」，文本异文待核别集底本。
    source_ids: [src-jts-vol160]
  - stage: 再征与晚年唱和
    stage_order: 12
    title: 礼部郎中集贤学士，出刺苏州赐金紫
    date:
      text: 约829—836年之间
      year: 829
      range_end: 836
      precision: 范围
    place: 长安、苏州
    summary: 累转礼部郎中集贤院学士；裴度罢知政事禹锡求分司东都不得久处朝列，六月授苏州刺史就赐金紫。
    source_ids: [src-jts-vol160]
  - stage: 再征与晚年唱和
    stage_order: 13
    title: 与白居易唱和，诗豪之名定于白序
    date:
      text: 约826—842年之间
      year: 826
      range_end: 842
      precision: 范围
    place: 扬州、洛阳
    summary: 晚年与少傅白居易友善诗笔文章时无在其右者。白序曰彭城刘梦得诗豪者也其锋森然少敢当者，并举沉舟侧畔千帆过病树前头万木春为神妙之句，编唱和一百三十八首附两家文集。
    source_ids: [src-jts-vol160]
  - stage: 再征与晚年唱和
    stage_order: 14
    title: 卒于洛阳，赠户部尚书
    date:
      text: "842年"
      year: 842
      precision: 精确
    place: 洛阳
    summary: 开成初复为太子宾客分司俄授同州刺史，秩满检校礼部尚书太子宾客分司。会昌二年七月卒时年七十一赠户部尚书。子承雍登进士第亦有才藻。
    source_ids: [src-jts-vol160]

works:
  - work_id: qiu-ci
    title: 秋词二首（其一）
    alt_titles: []
    genre: 七言绝句
    date:
      text: 朗州贬谪期间，约806—815年之间
      year: 806
      range_end: 815
      precision: 范围
    place: 朗州
    context: 自古逢秋悲寂寥我言秋日胜春晴——贬谪逆境中的翻案之作，与其不服输的硬骨互证。
    attribution: 确凿
    excerpt: 自古逢秋悲寂寥，我言秋日胜春朝。晴空一鹤排云上，便引诗情到碧霄。
    text_display: full
    themes: [咏秋, 抒怀]
    influence: 一反悲秋传统的宣言式名篇。
    confidence: 存疑
    dispute: 系年从朗州时期通说。
    source_ids: [src-quantangshi-liuyuxi]

  - work_id: xi-kan-hua-junzi
    title: 元和十年自朗州承召至京戏赠看花诸君子
    alt_titles: [游玄都观]
    genre: 七言绝句
    date:
      text: "815年"
      year: 815
      precision: 精确
    place: 长安玄都观
    context: 召还京师游玄都观见道士手植红桃满观如烁晨霞，遂有诗以志一时之事。语涉讥刺执政不悦复出播州——一首诗换十四年再贬。
    attribution: 确凿
    excerpt: 紫陌红尘拂面来，无人不道看花回。玄都观里桃千树，尽是刘郎去后栽。
    text_display: full
    themes: [讽喻]
    influence: 中唐诗案与讽刺艺术的标志性文本。
    confidence: 存疑
    dispute: 末句通行本作「总是刘郎去后栽」旧书引作「总」字同而序文细节互有详略。
    source_ids: [src-jts-vol160, src-quantangshi-liuyuxi]
  - work_id: zai-you-xuandu-guan
    title: 再游玄都观（并序）
    alt_titles: []
    genre: 七言绝句
    date:
      text: "828年"
      year: 828
      precision: 精确
    place: 长安玄都观
    context: 十四年后以主客郎中再游兹观荡然无复一树唯兔葵燕麦动摇于春风，因再题二十八字以俟后游。旧书引结句作前度刘郎又到来。
    attribution: 确凿
    excerpt: 百亩庭中半是苔，桃花净尽菜花开。种桃道士归何处？前度刘郎今又来。
    text_display: full
    themes: [讽喻, 抒怀]
    influence: 不屈人格的二次宣言。
    confidence: 存疑
    dispute: 结句异文：通行本「今又来」与旧唐书引文「又到来」并存。
    source_ids: [src-jts-vol160, src-quantangshi-liuyuxi]
  - work_id: zhu-zhi-ci
    title: 竹枝词二首（其一）
    alt_titles: []
    genre: 乐府（竹枝）
    date:
      text: 夔州刺史任上约822—824年之间
      year: 822
      range_end: 824
      precision: 范围
    place: 夔州
    context: 朗州教巫祝新辞经验的延续与升华。东边日出西边雨道是无晴却有晴以民歌谐音写情。
    attribution: 确凿
    excerpt: 杨柳青青江水平，闻郎江上唱歌声。东边日出西边雨，道是无晴却有晴。
    text_display: full
    themes: [民歌, 恋歌]
    influence: 文人拟民歌体的巅峰，竹枝词自此成体。
    confidence: 存疑
    dispute: 作地有夔州说为主流；系年据职历推定。
    source_ids: [src-quantangshi-liuyuxi, src-jts-vol160]

  - work_id: chou-le-tian
    title: 酬乐天扬州初逢席上见赠
    alt_titles: []
    genre: 七言律诗
    date:
      text: 约826年冬
      year: 826
      precision: 约
    place: 扬州
    context: 罢和州刺史返洛阳与罢苏州刺史的白居易相逢扬州，白有赠诗禹锡酬之。沉舟侧畔千帆过病树前头万木春被白居易序举为神妙。
    attribution: 确凿
    excerpt: 巴山楚水凄凉地，二十三年弃置身。……沉舟侧畔千帆过，病树前头万木春。今日听君歌一曲，暂凭杯酒长精神。
    text_display: full
