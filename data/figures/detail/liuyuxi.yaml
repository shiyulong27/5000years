relations:
  - relation_type: 挚友
    target_id: baijuyi
    direction: 双向
    period:
      text: 约826年扬州初逢至842年禹锡卒，唱和不断
      year: 826
      range_end: 842
      precision: 范围
    evidence: 旧唐书载晚年与白居易友善诗笔文章时无在其右者；白序称彭城刘梦得诗豪者也其锋森然少敢当者，编唱和一百三十八首附两家文集，并举沉舟侧畔一联为神妙。
    source_ids: [src-jts-vol160]
  - relation_type: 社群
    target_id: dufu
    direction: 双向
    period:
      text: 无直接交往记载；同为贬谪诗史脉络的对照人物
      precision: 未知
    evidence: 刘杜无交往。此条实为占位性社群关系，建议后续批次引入柳宗元（liuzongyuan）后以「执友」条替换——旧书柳传载柳请以柳州易播州事为二人生死之交的正史记述。
    inferred: true
    confidence: 有争议
    dispute: 本条不应长期保留：目标人物入库后应删除并以柳宗元条目替代。
    source_ids: []

reception:
  - era: 同时代
    evaluator: 白居易
    quote: 彭城刘梦得，诗豪者也。其锋森然，少敢当者。
    text_display: excerpt
    comment: 白居易刘白唱和集序语（旧唐书直引），诗豪之称即出于此。
    source_ids: [src-jts-vol160]
  - era: 同时代
    evaluator: 江南文士与公卿大僚
    quote: ""
    text_display: none
    comment: 旧书载梦得尝为西塞怀古金陵五题等诗江南文士称为佳作虽名位不达公卿大僚多与之交。
    source_ids: [src-jts-vol160]
  - era: 历代批评
    evaluator: 旧唐书史臣
    quote: 贞元、太和之间，以文学耸动搢绅之伍者，宗元、禹锡而已。……而蹈道不谨，昵比小人，自致流离。
    text_display: excerpt
    comment: 五代史臣对刘柳才高而党败的双重评价，代表传统史学对其政治选择的批评立场，与后世对其诗歌的推崇并存。
    source_ids: [src-jts-vol160]
  - era: 近现代学术
    evaluator: 学界综述
    quote: ""
    text_display: none
    comment: 研究聚焦永贞革新的政治评价再检讨、竹枝词与民歌关系、玄都观两诗的自传性结构等议题；具体论著引文须取得许可后补入。
    source_ids: []
  - era: 教科书与公共文化
    evaluator: 通用语文教育与大众传播
    quote: ""
    text_display: none
    comment: 陋室铭酬乐天望洞庭乌衣巷秋词等长期入选语文教材；前度刘郎与诗豪形象成为坚韧人格的文化符号。教材篇目随学期变动录入时须另行核验。
    source_ids: []

