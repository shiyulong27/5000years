    influence: 沉舟侧畔一联为逆境自励的千古名句。
    confidence: 存疑
    dispute: 相逢地点扬州从通行编年说；「二十三年」起算点有自永贞元年与自朗州贬两解。
    source_ids: [src-jts-vol160, src-quantangshi-liuyuxi]
  - work_id: wu-yi-xiang
