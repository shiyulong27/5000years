      precision: 未知
    place: 和州
    context: 斯是陋室惟吾德馨。苔痕上阶绿草色入帘青。安贫乐道的居室自铭。
    attribution: 存疑
    excerpt: 山不在高，有仙则名。水不在深，有龙则灵。斯是陋室，惟吾德馨。
