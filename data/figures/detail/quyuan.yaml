    date:
      text: 迁谪期间，具体年份不详
      precision: 未知
    place: 江滨泽畔
    summary: 屈原至于江滨，被发行吟泽畔，颜色憔悴形容枯槁。渔父见而问之子非三闾大夫欤何故而至此？答曰举世混浊而我独清众人皆醉而我独醒是以见放；又宁赴常流而葬乎江鱼腹中耳，安能以皓皓之白而蒙世俗之温蠖乎。
    confidence: 存疑
    dispute: 问答场景史记本传与楚辞渔父篇文字互有小异（宁赴常流／宁赴湘流）；渔父篇作者归属历来有争议，问答是否实有其事亦带文学化叙事色彩。
    source_ids: [src-shiji-vol84, src-chuci]
  - stage: 顷襄王朝迁谪与自沉
    stage_order: 10
    title: 乃作怀沙之赋
    date:
