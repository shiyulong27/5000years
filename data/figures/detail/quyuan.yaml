    summary: 长子顷襄王立以其弟子兰为令尹。屈原既嫉之，虽放流眷顾楚国系心怀王不忘欲反，冀幸君之一悟俗之一改，一篇之中三致志焉。令尹子兰闻之大怒，卒使上官大夫短屈原于顷襄王，顷襄王怒而迁之。
    confidence: 存疑
    dispute: 迁谪确年正史无载，顷襄王初年系通说推定，亦有主顷襄王元年即迁与再迁江南两阶段说的分歧；迁往地域据楚辞地理意象推定。
    source_ids: [src-shiji-vol84, src-chuci]
  - stage: 顷襄王朝迁谪与自沉
    stage_order: 9
