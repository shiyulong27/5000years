    source_ids: [src-shiji-vol84]
  - stage: 身后影响
    stage_order: 13
    title: 贾谊渡湘投书吊屈原，楚辞成体
    date:
      text: "约前176年（自沉后百有余年）"
      year: -176
      precision: 约
    place: 湘水
    summary: 史记谓自屈原沈汨罗后百有余年汉有贾生为长沙王太傅，过湘水投书以吊屈原。太史公曰余读离骚天问招魂哀郢悲其志；适长沙观屈原所自沉渊未尝不垂涕想见其为人。汉人辑楚地歌辞成楚辞一书，骚体由此成为中国文学的源头性文体。
