    summary: 於是怀石遂自沈汨罗以死。卒年正史无载，通说系于前278年秦将白起拔郢、郢都陷落之后，以身殉国与殉都相终始。
    confidence: 有争议
    dispute: 卒年前278系与白起破郢相系的推定通说，另有前277等异说；正史传内并无纪年，自沉动机后世亦有多重诠释。
