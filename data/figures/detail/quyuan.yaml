  - stage: 身后影响
    stage_order: 14
    title: 端午纪念习俗层（传说）
    date:
      text: 起源时代与流变均存多说
      precision: 未知
    place: 汨罗江流域及全国
    summary: 五月五日龙舟竞渡食粽投江以吊屈原，为流传最广的民俗叙事层；民间并有粽叶裹饭护其遗体、渔舟抢救等口传情节。
    confidence: 传说
    dispute: 端午节的起源有多源之说（吴越龙图腾祭祀、恶月禳灾等学术假说），纪念屈原为后世层累附益的民俗叙事，先秦两汉早期文献并无此系记录，不可作为信史事实采信。
