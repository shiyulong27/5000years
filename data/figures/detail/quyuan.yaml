    place: 楚国
    summary: 史记谓屈平疾王听之不聪也谗谄之蔽明也，故忧愁幽思而作离骚，离骚者犹离忧也；信而见疑忠而被谤能无怨乎？屈平之作离骚盖自怨生也。又赞其文约辞微志洁行廉，举类迩而见义远。
    confidence: 存疑
    dispute: 离骚创作时地有被疏后作、怀王入秦前作、顷襄王迁江南后作诸说；史记系之于被疏之后，后世学者多有异解。
