      text: 约前313—前312年之间
      year: -313
      range_end: -312
      precision: 范围
    place: 丹阳、蓝田一线
    summary: 屈平既绌，秦欲伐齐而患齐楚从亲，遣张仪厚币委质事楚，许商於之地六百里以诱绝齐盟；楚绝齐而受地，仪诈曰仪与王约六里不闻六百里。怀王怒兴师伐秦，大破于丹淅斩首八万，悉发国中兵战于蓝田又败，齐竟怒不救楚，楚大困。
    confidence: 存疑
    dispute: 史记本传不系绝对年份，前313—前312系据战国纪年通史框架推定；传文以屈平既绌领起，寓贬黜与国运之因果判断。
    source_ids: [src-shiji-vol84]
  - stage: 怀王晚期的曲折与国难
    stage_order: 6
    title: 使于齐还，谏怀王何不杀张仪
    date:
      text: 约前311年
      year: -311
      precision: 约
    place: 郢都
    summary: 张仪以一仪而当汉中地请往如楚，厚币用事臣靳尚设诡辩于宠姬郑袖，怀王竟听郑袖复释去张仪。是时屈平既疏不复在位，使于齐，顾反谏怀王曰何不杀张仪？怀王悔，追张仪不及。
    confidence: 存疑
    dispute: 使齐与还谏年份据张仪行迹推定，正史传无纪年。
    source_ids: [src-shiji-vol84]
  - stage: 怀王晚期的曲折与国难
    stage_order: 7
    title: 谏阻入秦不听，怀王入秦不返
    date:
      text: "约前299年"
      year: -299
      precision: 约
    place: 武关
    summary: 秦昭王与楚婚欲与怀王会，怀王欲行，屈平曰秦虎狼之国不可信不如毋行。稚子子兰劝王行奈何绝秦欢，怀王卒行。入武关秦伏兵绝其后因留怀王以求割地，怀王怒不听，亡走赵赵不内，复之秦竟死于秦而归葬。楚人既咎子兰以劝怀王入秦而不反也。
    source_ids: [src-shiji-vol84]

