reception:
  - era: 同时代
    evaluator: 楚国朝野
    quote: ""
    text_display: none
    comment: 楚人既咎子兰以劝怀王入秦而不反也——迁谪之际楚人舆论站在屈原一边；史记又称其虽放流眷顾楚国系心怀王不忘欲反，可见其在楚国公众记忆中的忠臣形象当时已然确立。
    source_ids: [src-shiji-vol84]
  - era: 同时代
    evaluator: 渔父（传世文本中的对话者形象）
    quote: 举世混浊而我独清，众人皆醉而我独醒，是以见放。
    text_display: excerpt
    comment: 此为屈原在问答中的自述，借传世文本保存了同时代人对「何以见放」的追问与他的回答，构成屈原自我定位的第一人称史料。
    source_ids: [src-shiji-vol84, src-chuci]
  - era: 历代批评
    evaluator: 司马迁
    quote: 推此志也，虽与日月争光可也。
    text_display: excerpt
    comment: 史记屈原贾生列传中对屈原志节的最高定格，与太史公曰余读离骚天问招魂哀郢悲其志、适长沙观屈原所自沉渊未尝不垂涕的动情笔法一起，奠定了两千年屈原评价的基调。
    source_ids: [src-shiji-vol84]
  - era: 历代批评
    evaluator: 唐司马贞《索隐述赞》
    quote: 屈平行正，以事怀王。瑾瑜比洁，日月争光。忠而见放，谗者益章。赋骚见志，怀沙自伤。
    text_display: excerpt
    comment: 附于史记卷末的传统史评，浓缩正史系统对屈原「忠而被谗、以赋见志」的标准叙事，可与贾谊吊屈原赋同观的汉代以降接受链条。
    source_ids: [src-shiji-vol84]
  - era: 近现代学术
    evaluator: 学界综述
    quote: ""
    text_display: none
    comment: 近现代研究聚焦四大议题：生卒年推算（约前340—前278诸说）、生平两次放逐与行踪复原、渔父卜居等篇作者归属辨析、端午节起源与纪念屈原叙事的层累形成过程。均为中立综述，具体论著引文须取得许可后补入。
    source_ids: []
  - era: 教科书与公共文化
    evaluator: 通用语文教育与大众传播
    quote: ""
    text_display: none
    comment: 离骚节选长期入选中学语文教材，路漫漫其修远兮成为国民级格言；端午节（龙舟、食粽）以屈原纪念为核心文化符号广泛传承。教材篇目与非遗申报表述随年度变动，录入时须另行核验当期版本。
    source_ids: []
