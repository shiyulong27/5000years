works:
  - work_id: li-sao
    title: 离骚
    alt_titles: [离骚经]
    genre: 骚体长诗
    date:
      text: 创作年代众说纷纭，通说作于遭谗被疏之后
      precision: 未知
    place: 楚国
    context: 中国古代最长的抒情诗。史记称其上称帝喾下道齐桓中述汤武以刺世事，明道德之广崇治乱之条贯靡不毕见；王逸序谓善鸟香草以配忠贞恶禽臭物以比谗佞，开创香草美人比兴传统。
    attribution: 确凿
    excerpt: 帝高阳之苗裔兮，朕皇考曰伯庸。……长太息以掩涕兮，哀民生之多艰。亦余心之所善兮，虽九死其犹未悔。……路漫漫其修远兮，吾将上下而求索。
    text_display: excerpt
    themes: [美政理想, 香草美人, 求索]
    influence: 楚辞的开山与巅峰，「路漫漫其修远兮」成为中华求索精神的千古格言。
    confidence: 存疑
    dispute: 作者归属无争议（史记明言屈平之作离骚）；创作年代诸说并立；通行本「路漫漫」 wikisource 本作「路曼曼」，异文并存。
    source_ids: [src-shiji-vol84, src-chuci]

  - work_id: jiu-ge-guo-shang
    title: 九歌·国殇
    alt_titles: []
    genre: 楚辞（祭歌）
    date:
      text: 迁谪沅湘间所作说为主流，年代不详
      precision: 未知
    place: 沅湘之间
    context: 王逸序谓屈原放逐窜伏其域，出见俗人祭祀之礼歌舞之乐其词鄙陋，因为作九歌之曲。国殇一篇祭奠为国捐躯的将士，是九歌中唯一的人鬼之歌。
    attribution: 确凿
    excerpt: 操吴戈兮被犀甲，车错毂兮短兵接。旌蔽日兮敌若云，矢交坠兮士争先。……身既死兮神以灵，魂魄毅兮为鬼雄。
    text_display: excerpt
    themes: [祭奠将士, 悲壮]
    influence: 中国文学中最早正面礼颂阵亡将士的名篇，「魂魄毅兮为鬼雄」为后世反复吟咏。
    confidence: 存疑
    dispute: 九歌整体归属屈原为主流意见，然近代以来亦有主张其为楚地祭歌原始文本经屈原加工改写说；系年无载。
    source_ids: [src-chuci]

  - work_id: jiu-ge-xiang-fu-ren
    title: 九歌·湘夫人
    alt_titles: []
    genre: 楚辞（祭歌）
    date:
      text: 与九歌组诗同时，年代不详
      precision: 未知
    place: 沅湘洞庭之间
    context: 与湘君为姊妹篇，望夫不至的怅惘与袅袅秋风洞庭波木叶下的秋景交融，被视为中国情景交融传统的源头之一。
    attribution: 确凿
    excerpt: 帝子降兮北渚，目眇眇兮愁予。袅袅兮秋风，洞庭波兮木叶下。
    text_display: excerpt
    themes: [秋思, 企慕]
    influence: 「袅袅兮秋风，洞庭波兮木叶下」被誉为千古言秋之祖。
    confidence: 存疑
    dispute: 湘君湘夫人所指为尧女舜妃说、配偶神对祭说等历代聚讼；归属讨论同九歌条。
    source_ids: [src-chuci]

  - work_id: tian-wen
    title: 天问
    alt_titles: []
    genre: 骚体奇诗
    date:
      text: 放逐期间作说为主流，年代不详
      precision: 未知
    place: 楚地
    context: 王逸序谓屈原放逐彷徨山泽，见楚先王庙及公卿祠堂图画天地山川神灵古贤圣怪物行事，因书其壁呵而问之以泄愤懑。一口气连发一百七十余问，上问天文下诘历史。
    attribution: 确凿
    excerpt: 曰：遂古之初，谁传道之？上下未形，何由考之？……日月安属？列星安陈？
    text_display: excerpt
    themes: [宇宙之问, 疑古精神]
    influence: 中国文学史上罕见的系统性追问宇宙与历史的奇作，近代以来被视为理性怀疑精神的上古先声。
    confidence: 存疑
    dispute: 太史公已并举离骚天问招魂哀郢而读之，归属无疑义；创作缘起壁画说系王逸序的传闻式记述，作年无载。
    source_ids: [src-shiji-vol84, src-chuci]

  - work_id: jiu-zhang-huai-sha
    title: 九章·怀沙
    alt_titles: []
    genre: 骚体组诗（九章之一）
    date:
      text: 自沉前夕说为主流，年代不详
      precision: 未知
    place: 沅湘流域
    context: 史记本传于渔父问答之后全文引录此赋，随即记怀石自沉，故旧说视为绝笔。篇中变白为黑倒上以为下凤凰在笯鸡雉翔舞之愤，与知死不可让之决绝相终始。
    attribution: 确凿
    excerpt: 陶陶孟夏兮，草木莽莽。伤怀永哀兮，汩徂南土。……知死不可让兮，愿勿爱兮！明以告君子兮，吾将以为类兮。
    text_display: excerpt
    themes: [绝笔, 明志]
    influence: 因史记全录而成为确定屈原自沉心迹的第一手文献，怀沙绝笔遂成千古定谳式叙事。
    confidence: 存疑
    dispute: 史记所录与楚辞九章本文字句有异文；「临终绝笔」的定位系由史记编排方式导出的推断，九章各篇作年均无载。
    source_ids: [src-shiji-vol84, src-chuci]

  - work_id: yu-fu
    title: 渔父
    alt_titles: []
    genre: 辞赋体散文
    date:
      text: 迁谪江湘间事为背景，写作年代不详
      precision: 未知
    place: 江湘之间
    context: 屈原既放游于江潭行吟泽畔，与莞尔而笑鼓枻而去的渔父对答，沧浪之水清兮可以濯吾缨一曲收束，展现两种处世哲学的对话张力。
    attribution: 存疑
    excerpt: 屈原既放，游于江潭，行吟泽畔，颜色憔悴，形容枯槁。……沧浪之水清兮，可以濯吾缨；沧浪之水浊兮，可以濯吾足。
    text_display: excerpt
    themes: [处世抉择, 清醒与孤独]
    influence: 「沧浪之歌」化入中国士人出处进退的精神语汇，渔父自此成为隐逸象征原型。
    confidence: 有争议
    dispute: 作者归属历来有争议：汉人题屈原作，近现代学者多疑为楚人悼屈之作或后人拟托；史记本传已含问答雏形而文字互异，孰先孰后尚无定论。
    source_ids: [src-shiji-vol84, src-chuci]

  - work_id: bu-ju
    title: 卜居
    alt_titles: []
    genre: 辞赋体散文
    date:
      text: 放逐期间事为背景，写作年代不详
      precision: 未知
    place: 楚地
    context: 屈原既放三年心烦虑乱不知所从，往见太卜郑詹尹，连发八组宁可／将谁之问；詹尹释策而谢曰尺有所短寸有所长，用君之心行君之意龟策诚不能知事。
    attribution: 存疑
    excerpt: 吾宁悃悃款款朴以忠乎？将送往劳来斯无穷乎？……黄钟毁弃，瓦釜雷鸣；谗人高张，贤士无名。
    text_display: excerpt
    themes: [人格抉择, 讽世]
    influence: 黄钟毁弃瓦釜雷鸣成为针砭贤愚倒置的成语；设问自陈的文体为汉赋主客问答开先河。
    confidence: 有争议
    dispute: 作者归属与渔父同为悬案：传统题屈原，近现代多疑为拟托之作；篇中「屈原既放三年」的自述口吻本身即是疑点所在。
    source_ids: [src-chuci]

