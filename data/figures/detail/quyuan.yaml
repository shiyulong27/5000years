    place: 沅湘流域
    summary: 史记全文引录怀沙之赋：陶陶孟夏兮草木莽莽伤怀永哀兮汩徂南土；乱曰浩浩沅湘兮分流汨兮……定心广志余何畏惧兮；知死不可让兮愿勿爱兮明以告君子兮吾将以为类兮。绝笔明志之音凄怆。
