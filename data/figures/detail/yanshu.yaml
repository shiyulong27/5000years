    source_ids: [src-songshi-vol311]

works:
  - work_id: huan-xi-sha-yi-qu-xin-ci-jiu-yi-bei
    title: 浣溪沙·一曲新词酒一杯
    alt_titles: []
    genre: 词（小令）
    date:
      text: 创作年代不详
      precision: 未知
    place: ""
    context: 闲步小园而叹流光，夕阳西下几时回以寻常口吻问出不可挽回之事；无可奈何花落去似曾相识燕归来一联对仗天成，成为其词乃至宋词的标志性名句。
    attribution: 确凿
    excerpt: 一曲新词酒一杯，去年天气旧亭台，夕阳西下几时回？无可奈何花落去，似曾相识燕归来。小园香径独徘徊。
    text_display: full
    themes: [惜时, 春恨, 圆融观照]
    influence: 无可奈何花落去一联千古传诵；四库提要引复斋漫录指出二句先见于其七律示张寺丞王校勘腹联而后填入词内。
    confidence: 有争议
    dispute: 二句来历有两说并行：四库本珠玉词提要引复斋漫录谓出自其七律示张寺丞王校勘腹联复填入词；另通行笔记流传「与王琪联句得之」的本事，本次未能在维基文库实取该条原文，按存疑转述著录。异文与系年均无定论。
