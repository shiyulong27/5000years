    date:
      text: 创作年代不详
      precision: 未知
    place: ""
    context: 春残郊行之景：春风不解禁杨花蒙蒙乱扑行人面，结拍一场愁梦酒醒时斜阳却照深深院，以景语暗写迟暮。
    attribution: 确凿
    excerpt: 小径红稀，芳郊绿遍，高台树色阴阴见。春风不解禁杨花，蒙蒙乱扑行人面。　翠叶藏莺，朱帘隔燕，炉香静逐游丝转。一场愁梦酒醒时，斜阳却照深深院。
