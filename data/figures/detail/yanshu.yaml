    date:
      text: 创作年代不详
      precision: 未知
    place: ""
    context: 细叶坠、初尝醉、微寒银屏，全篇以淡笔写秋宵闲静，是其雍容和婉一路的本色小令。
    attribution: 确凿
    excerpt: 金风细细，叶叶梧桐坠。绿酒初尝人易醉，一枕小窗浓睡。　紫薇朱槿花残，斜阳却照阑干。双燕欲归时节，银屏昨夜微寒。
    text_display: full
    themes: [秋景, 闲淡]
