      precision: 未知
    place: ""
    context: 秋日小会而襟怀难尽，多少襟怀言不尽写向蛮笺曲调中——直言以词代书的写作姿态，此情千万重收束沉着。
    attribution: 确凿
    excerpt: 燕子欲归时节，高楼昨夜西风。求得人间成小会，试把金尊傍菊丛。歌长粉面红。　斜日更穿帘幕，微凉渐入梧桐。多少襟怀言不尽，写向蛮笺曲调中。此情千万重。
    text_display: full
