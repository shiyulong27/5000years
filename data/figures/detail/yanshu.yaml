  - work_id: cai-sang-zi-shi-guang-zhi-jie-cui-ren-lao
    title: 采桑子·时光只解催人老
    alt_titles: []
    genre: 词（小令）
    date:
      text: 创作年代不详
      precision: 未知
    place: ""
    context: 时光只解催人老不信多情，长恨离亭泪滴春衫酒易醒；下片梧桐昨夜西风急好梦频惊何处高楼雁一声，雁声破梦与蝶恋花同一机杼。
    attribution: 确凿
    excerpt: 时光只解催人老，不信多情，长恨离亭，泪滴春衫酒易醒。　梧桐昨夜西风急，淡月胧明，好梦频惊，何处高楼雁一声。
    text_display: full
    themes: [惜时, 别恨, 秋声]
    influence: 以声象收束愁绪的名篇，可见其惜时主题的另一写法。
    source_ids: [src-zhuyuci]

  - work_id: yu-lou-chun-chi-tang-shui-lv-feng-wei-nuan
    title: 玉楼春·池塘水绿风微暖
    alt_titles: []
    genre: 词（小令）
    date:
      text: 创作年代不详
      precision: 未知
    place: ""
    context: 忆旧游而伤聚散：重头歌韵响铮琮入破舞腰红乱旋写歌舞繁盛，结拍当时共我赏花人点检如今无一半，盛衰之感直贯而下。
    attribution: 确凿
    excerpt: 池塘水绿风微暖，记得玉真初见面。……当时共我赏花人，点检如今无一半。
