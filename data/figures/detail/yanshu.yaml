    title: 浣溪沙·一向年光有限身
    alt_titles: []
    genre: 词（小令）
    date:
      text: 创作年代不详
      precision: 未知
    place: ""
    context: 一向年光有限身等闲离别易销魂直逼人生有限之痛，而以满目山河空念远落花风雨更伤春宕开，结在不如怜取眼前人的旷达收束。
    attribution: 确凿
    excerpt: 一向年光有限身，等闲离别易销魂，酒筵歌席莫辞频。　满目山河空念远，落花风雨更伤春，不如怜取眼前人。
    text_display: full
    themes: [惜时, 离别, 旷达]
    influence: 不如怜取眼前人与无可奈何一联合为其惜时哲学的两面，历代传诵。
