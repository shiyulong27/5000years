reception:
  - era: 同时代
    evaluator: 宋仁宗
    quote: 帝虽临奠，以不视疾为恨，特罢朝二日，赠司空兼侍中，谥元献，篆其碑首曰「舊學之碑」。
    text_display: excerpt
    comment: 本传直录的身后哀荣——罢朝二日与御篆碑首「舊學之碑」，是东宫旧学之谊的最终注脚，也是人臣身后极遇。
    source_ids: [src-songshi-vol311]
  - era: 同时代
    evaluator: 本传史臣论
    quote: 得象浑厚有容，殊喜荐拔人物，乐善不倦，方之诸人，殊其最优乎！
    text_display: excerpt
    comment: 卷末论曰将晏殊置于同卷诸宰相之上，以荐拔人物乐善不倦为第一义，与传中兴学、进贤诸事互证。
    source_ids: [src-songshi-vol311]
  - era: 历代批评
    evaluator: 刘攽《中山诗话》（转引自冯煦《蒿庵论词》）
    quote: 元献喜冯延巳歌词，其所自作，亦不减延巳。
    text_display: excerpt
    comment: 宋人诗话对其词与冯延巳渊源的早期定位；本卷经由蒿庵论词转引实取，中山诗话原书条目待另行核验。
    confidence: 存疑
    dispute: 中山诗话原文未经独立实取，现按转引层著录。
    source_ids: [src-haoanlunci]
  - era: 历代批评
    evaluator: 冯煦《蒿庵论词》
    quote: 晏同叔去五代未远，馨烈所扇，得之最先，故左宫右徵，和婉而明丽，为北宋倚声家初祖。
    text_display: excerpt
    comment: 北宋倚声家初祖的定性即出于此——清代词论对其承南唐启北宋词统地位的代表性总结；蒿庵论词为清代公版文献，已在维基文库实取全文比对。
    confidence: 确定
    source_ids: [src-haoanlunci]
  - era: 近现代学术
    evaluator: 王国维《人间词话》
    quote: 古今之成大事业、大学问者，必经过三种之境界：「昨夜西风凋碧树。独上高楼，望尽天涯路。」此第一境也。
    text_display: excerpt
    comment: 三境界说以晏殊蝶恋花两句为第一境，使其词进入近现代人生哲学的经典话语；人间词话为公版文献（王国维1909年前后刊布），已在维基文库实取相关条目。
    confidence: 确定
    source_ids: [src-renjiancihua]
  - era: 教科书与公共文化
