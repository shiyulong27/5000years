    attribution: 确凿
    excerpt: 槛菊愁烟兰泣露，罗幕轻寒，燕子双飞去。明月不谙离恨苦，斜光到晓穿朱户。　昨夜西风凋碧树，独上高楼，望尽天涯路。欲寄彩笺无尺素，山长水阔知何处。
    text_display: full
    themes: [秋思, 怀远, 高远境界]
    influence: 王国维人间词话取其下片首二句为古今成大事业大学问者三种境界之第一境；维基文库四库本作欲寄彩笺无尺素，人间词话引作兼尺素，异文并存。
