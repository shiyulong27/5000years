    place: ""
    context: 说尽平生意而鸿雁在云鱼在水，惆怅此情难寄；结拍人面不知何处绿波依旧东流，以流水收束无处投递之情。
    attribution: 确凿
    excerpt: 红笺小字，说尽平生意。鸿雁在云鱼在水，惆怅此情难寄。　斜阳独倚西楼，遥山恰对帘钩。人面不知何处，绿波依旧东流。
