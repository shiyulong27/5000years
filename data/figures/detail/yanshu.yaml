  - work_id: shan-ting-liu-jia-zhu-xi-qin
    title: 山亭柳·赠歌者
    alt_titles: [山亭柳·家住西秦]
    genre: 词（慢词）
    date:
      text: 晚年说（约皇祐间知永兴军时期，通行推测）
      year: 1050
      precision: 约
    place: 永兴军（今西安，一说）
    context: 借歌者数年来往咸京道残杯冷炙谩消魂的身世，写若有知音见采不辞遍唱阳春的知音之叹，一曲当筵落泪重掩罗巾，寄托极深，风格在珠玉集中独见沉郁。
    attribution: 确凿
    excerpt: 家住西秦，赌博艺随身。……若有知音见采，不辞遍唱阳春。一曲当筵落泪，重掩罗巾。
    text_display: excerpt
    themes: [知音, 身世寄托]
    influence: 晏殊词中罕见的感慨身世之作，被视为晚年心境的注脚。
    confidence: 存疑
    dispute: 系年从晚年知永兴军时的通行推测，正史与词集均无明证。
    source_ids: [src-zhuyuci]

