# | 不欺 | 覆試詩賦論殊奏臣嘗私習此賦請試他題帝愛其不欺既成數稱善 | 确定 |
# | 释褐 | 擢秘書省正字秘閣讀書 | 确定 |
# | 真宗信任 | 為昇王府記室參軍為太子舍人尋知制誥為翰林學士帝每訪殊以事率用方寸小紙細書已答奏輒並稿上帝重其慎密 | 确定 |
# | 垂帘建言 | 宰相丁謂樞密使曹利用各欲獨見奏事殊建言群臣奏事太后者垂簾聽之皆毋得見議遂定 | 确定 |
# | 应天兴学 | 罷知宣州數月改應天府延范仲淹以教生徒自五代以來天下學校廢興學自殊始 | 确定；系年正史无载 |
# | 好贤进贤 | 平居好賢當世知名之士如范仲淹孔道輔皆出其門及為相益務進賢材而仲淹與韓琦富弼皆進用 | 确定 |
# | 与欧阳修 | 殊出歐陽修為河北都轉運諫官奏留不許 | 确定（本传仅此一事；修出其门下说属通行层） |
# | 论罢外任 | 孫甫蔡襄上言宸妃生聖躬為天下主而殊嘗被詔志宸妃墓沒而不言又奏論殊役官兵治僦舍以規利坐是降工部尚書知穎州然時以謂非殊罪 | 确定 |
# | 拜相 | 康定初知樞密院事遂為樞密使進同中書門下平章事慶歷中拜集賢殿學士同平章事兼樞密使 | 确定；本传作集賢殿學士非大學士 |
# | 性情文章 | 性剛簡奉養清儉善知人富弼楊察皆其婿也文章贍麗應用不窮尤工詩閒雅有情思晚歲篤學不倦 | 确定 |
# | 身后 | 已而薨帝雖臨奠以不視疾為恨特罷朝二日贈司空兼侍中諡元獻篆其碑首曰舊學之碑 | 确定；本传不系卒年不记享年 |
# | 词作文本 | 浣溪沙蝶戀花清平樂破陣子踏莎行采桑子玉樓春山亭柳等均取珠玉詞四庫全書本維基文库全文 | 确定（四庫全書本系统；异文未逐字校善本） |
# | 无可奈何二句本事 | 四庫本珠玉詞提要：浣溪沙春恨詞無可奈何花落去似曾相識燕歸來二句乃殊示張寺丞王校勘七言律中腹聫復齋漫錄嘗述之今復填入詞内 | 提要层确定（提要引复斋漫录）；「与王琪联句」另一说未实取，存疑转述 |
# | 冯煦评语 | 蒿庵論詞維基文库实取：晏同叔去五代未遠馨烈所扇得之最先故左宮右徵和婉而明麗為北宋倚聲家初祖 | 确定（公版清代词论） |
# | 王国维评语 | 人間詞話維基文库实取：古今之成大事業大學問者必經過三種之境界昨夜西風凋碧樹獨上高樓望盡天涯路此第一境也 | 确定（公版近现代词论） |
# | 生年 | 本传无载；通行据卒年1055与享年六十五倒推为991 | 推定层，标存疑 |
