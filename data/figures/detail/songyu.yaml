    title: 王逸定谳：屈原弟子说（章句序层）
    date:
      text: 东汉（王逸楚辞章句约成书于114—119年之后），宋玉事迹本身不可考
      year: 114
      range_end: 119
      precision: 约
    place: ""
    summary: 王逸九辩序：「宋玉者，屈原弟子也。閔惜其師，忠而放逐，故作〈九辯〉以述其志。」并称刘向、王褒咸悲其文依而作词，故号楚辞。弟子说自此成为通行叙事，但它是东汉章句序的追认，非汉代以前的史料。
    confidence: 存疑
    dispute: 史记仅言「祖屈原之从容辞令」，未言师授；弟子说是王逸层的推衍，后世沿袭与质疑并存。
