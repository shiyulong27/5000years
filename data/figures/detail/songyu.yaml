# 宋玉全景详卷（schema v1）
# 史料审计表（实取证据；来源登记见 data/sources.yaml）：
#
# 分层原则：宋玉无正史本传，生卒、生平细节均不可考。本卷严格分四层：
#   L1 正史一层：仅《史记·屈原贾生列传》一句；
#   L2 总集文本层：《楚辞·九辩》与《昭明文选》诸赋原文（作品内叙事不等于史实）；
#   L3 王逸章句序层：东汉王逸《九辩》序的「屈原弟子」说；
#   L4 汉宋笔记传说层：《汉书·艺文志》著录、《襄阳耆旧记》故里说等（本卷按转述层处理）。
#
# | 事实点 | 证据（实取） | 结论与置信 |
# |---|---|---|
# | 正史唯一记载 | 史記卷84实取：「屈原既死之後，楚有宋玉、唐勒、景差之徒者，皆好辭而以賦見稱；然皆祖屈原之從容辭令，終莫敢直諫。」 | 确定；此为正史对宋玉的全部记载，仅言时代与文学取向 |
# | 生卒 | 无任何正史记载 | 不可考；一切年份用「不可考/约」表达 |
# | 九辩文本与王逸序 | 楚辭卷第八实取：「悲哉，秋之爲氣也！蕭瑟兮，草木摇落而變衰」「坎廩兮，貧士失職而志不平。廓落兮，羇旅而無友生」；王逸序：「宋玉者，屈原弟子也。閔惜其師，忠而放逐，故作〈九辯〉以述其志」 | 文本层确定；弟子系 L3 传说层存疑（史记仅言「祖屈原之从容辞令」，未言师承） |
# | 风赋 | 維基文庫風賦(宋玉)实取：「夫風生於地，起於青蘋之末」「此獨大王之風耳，庶人安得而共之」 | 文本层确定；著作权存疑（后人拟托之说） |
# | 高唐赋/神女赋 | 維基文庫实取：「旦爲朝雲，暮爲行雨。朝朝暮暮，陽臺之下」（高唐）；「耀乎若白日初出照屋梁。其少進也，皎若明月舒其光」（神女） | 文本层确定；著作权存疑 |
# | 登徒子好色赋 | 維基文庫实取：「增之一分則太長，減之一分則太短」「然此女登牆闚臣三年，至今未許也」 | 文本层确定；自辩为赋家虚构叙事，非史实 |
# | 对楚王问 | 維基文庫實取（古文觀止版）：「其爲【陽春白雪】，國中屬而和者，不過數十人……是其曲彌高，其和彌寡」 | 文本层确定；著作权存疑 |
# | 故里鄢 | 《襄阳耆旧记》称宋玉鄢人——本次未在维基文库实取该条，按转述层著录 | L4 传说层存疑推定 |
# | 汉书艺文志著录 | 通行著录谓班固载「宋玉赋十六篇」——本次未实取，按转述层著录 | L4 转述层存疑 |
# | 杜甫评价 | 全唐詩卷230实取：「搖落深知宋玉悲，風流儒雅亦吾師」 | 确定（接受层） |
#
# 版权：本文件只收公版古籍原文与中立转述；无现代注释译文。
