relations:
  - relation_type: 师承
    target_id: quyuan
    direction: 双向
    period:
      text: 战国晚期，具体年份不可考；弟子说定型于东汉王逸序
      precision: 未知
    evidence: 王逸楚辞章句九辩序实取：「宋玉者，屈原弟子也。闵惜其师，忠而放逐，故作〈九辩〉以述其志。」史记卷84实取仅言「祖屈原之从容辞令」，未言师授；九辩悯师之旨亦属王逸层的读法。
    confidence: 存疑
    dispute: 师承关系出自东汉章句序层而非正史；史记只提供文学谱系上的继承（祖其辞令），故本组关系按传说层存疑著录，不作定谳。
    source_ids: [src-chuci, src-shiji-vol84]

reception:
  - era: 同时代
    evaluator: 司马迁《史记·屈原贾生列传》（西汉）
    quote: 屈原既死之后，楚有宋玉、唐勒、景差之徒者，皆好辞而以赋见称；然皆祖屈原之从容辞令，终莫敢直谏。
    text_display: excerpt
    comment: 关于宋玉最早的史料与评价，一褒一贬俱在其中：肯定其辞赋成就，指出其不敢直谏的局限。注：枚举所限归入同时代档，实际为汉代追记。
    source_ids: [src-shiji-vol84]
  - era: 同时代
    evaluator: 王逸《楚辞章句·九辩序》（东汉）
    quote: 宋玉者，屈原弟子也。闵惜其师，忠而放逐，故作〈九辩〉以述其志。
    text_display: excerpt
    comment: 弟子说的源头文本，奠定了宋玉作为屈原嫡传、九辩为悯师之作的千年叙事；注：同为汉代追认层。
    source_ids: [src-chuci]
  - era: 历代批评
    evaluator: 杜甫《咏怀古迹五首·其二》（全唐诗卷230）
    quote: 摇落深知宋玉悲，风流儒雅亦吾师。怅望千秋一洒泪，萧条异代不同时。江山故宅空文藻，云雨荒台岂梦思。
    text_display: excerpt
    comment: 唐人接受的高峰：杜甫以异代知音自任，风流儒雅亦吾师把宋玉正式请入诗歌传统的师承谱系；摇落深知宋玉悲浓缩了九辩开创的整个悲秋传统。文本经维基文库全唐诗卷230实取核验。
    source_ids: [src-quantangshi-vol230]
  - era: 近现代学术
    evaluator: 学界综述
    quote: ""
    text_display: none
    comment: 近现代研究聚焦两条主线——其一为著作权公案：自疑古思潮以来，九辩以外的题名宋玉诸赋多被考订为存疑乃至拟托，真伪之辨至今未有定谳；其二为文学史定位：作为屈原之后楚辞第一人与汉赋体制的先导，其讽谏方式（讽而不直）与悲秋母题被反复讨论。具体论著引文须取得许可后补入，本卷暂作中立转述。
    source_ids: []
  - era: 教科书与公共文化
    evaluator: 通用语文教育与大众传播
    quote: ""
    text_display: none
    comment: 阳春白雪、下里巴人、曲高和寡、巫山云雨、朝朝暮暮、登徒子等成语典故使其成为进入日常语言最深的先秦作家之一；屈宋并称与悲秋之祖是教科书叙事的两大支点。教材篇目随学期变动，录入时须另行核验当期版本。
    source_ids: []
  - era: 影视与网络
    evaluator: 大众传播综述
    quote: ""
    text_display: none
    comment: 影视剧中的宋玉形象多为美男子与才子传说的戏剧化敷演（多源自登徒子好色赋虚构层与后世附会），不作信史依据；网络传播集中于其成语典故与悲秋名句，暂无可靠专门条目可引。
