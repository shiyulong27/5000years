      precision: 约
    place: ""
    summary: 通行说法谓汉书艺文志诗赋略著录「宋玉赋十六篇」，为汉代书目对其赋家地位的确认；今存题名宋玉之作远少于此，真伪参差。该条本次未在维基文库实取，按转述层著录待核。
    confidence: 存疑
    dispute: 转述层未实取原文，专条来源待登记；此处暂挂正史层坐标——史记已确立其「以赋见称」的赋家地位，艺文志著录系该地位的目录学延伸。十六篇与今存篇目对应关系历来聚讼。
    source_ids: [src-shiji-vol84]
  - stage: 身后声名
    stage_order: 13
    title: 屈宋并称与唐勒景差之衬（接受层回望）
    date:
      text: 由汉至唐逐渐定型，具体时点不可考
      precision: 未知
    place: ""
    summary: 史记将宋玉置于唐勒、景差之首，汉人以降渐以「屈宋」并称尊之为楚辞嫡传。这一并称是历代接受的累积结果：正史那句「终莫敢直谏」同时划出了他与屈原的精神分界。
    source_ids: [src-shiji-vol84]
  - stage: 身后声名
