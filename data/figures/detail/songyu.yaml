    confidence: 存疑
    dispute: 纪念地均为后世附会层；另有湖南临澧等地说并存，无从裁定。
    source_ids: []

works:
  - work_id: jiu-bian
    title: 九辩
    alt_titles: []
    genre: 骚体抒情长诗（楚辞）
    date:
      text: 创作系年不可考
      precision: 未知
    place: ""
    context: 悲秋之祖。以秋气起兴写贫士失职、羁旅无友之悲，末以愿赐躯放游云中作结；楚辞卷第八收录，王逸序定为宋玉悯师之作。
    attribution: 确凿
    excerpt: 悲哉，秋之为气也！萧瑟兮，草木摇落而变衰。……坎廪兮，贫士失职而志不平。廓落兮，羁旅而无友生。
    text_display: excerpt
    themes: [悲秋, 士不遇, 羁旅]
    influence: 开中国文学悲秋传统之源，摇落、秋气从此成为士人感怀的经典语码；鲁迅以下文学史皆以九辩为宋玉代表作。
    confidence: 有争议
    dispute: 王逸章句定谳为宋玉作，传统从之；近现代学者仍有主张屈原或汉人拟作者，本卷从王逸传统标确凿而保留争议记录。
    source_ids: [src-chuci]

