    context: 高唐赋姊妹篇。写宋玉梦遇神女而白于王，极貌写神女之姣丽与怀贞亮之絜清、颃薄怒以自持的人神阻隔，欢情未接而惆怅垂涕。
    attribution: 存疑
    excerpt: 其始来也，耀乎若白日初出照屋梁。其少进也，皎若明月舒其光。……頩薄怒以自持兮，曾不可乎犯干。
    text_display: excerpt
    themes: [神女, 人神阻隔, 美的极致书写]
    influence: 中国美人描写的范式文本之一，直接滋养曹植洛神赋；神女的贞静自持确立了可望不可即的美学原型。
    confidence: 有争议
    dispute: 与高唐赋同属著作权存疑之作；文中王梦玉梦之纠缠历来异读纷纭。
    source_ids: [src-wenxuan]

  - work_id: deng-tu-zi-hao-se-fu
    title: 登徒子好色赋
    alt_titles: []
    genre: 大赋（并序，问答体）
    date:
      text: 创作系年不可考
      precision: 未知
    place: 楚宫（文本语境）
    context: 设登徒子谗短与宋玉自辩、章华大夫扬诗守礼三层问答。东家之子增一分太长减一分太短的描写成为中国写美人的极致笔法；登徒子之名则被冤枉性地变成好色者的代称。
    attribution: 存疑
    excerpt: 东家之子，增之一分则太长，减之一分则太短，著粉则太白，施朱则太赤。……然此女登墙窥臣三年，至今未许也。
    text_display: excerpt
    themes: [自辩, 美人描写, 守德]
    influence: 增之一分减之一分为后世写美的度量衡式经典；登徒子蒙冤成为语言史上著名公案，成语登徒子沿用至今。
    confidence: 有争议
    dispute: 后人拟托之说流行；赋中自辩为虚构叙事，不得引为宋玉生平或品行的史料。
    source_ids: [src-wenxuan]

  - work_id: dui-chu-wang-wen
    title: 对楚王问
    alt_titles: [宋玉对楚王问]
    genre: 对问体散文
    date:
      text: 创作系年不可考
      precision: 未知
    place: 郢中（文本语境）
    context: 答士民众庶不誉之甚之问，设郢中歌者层级递进：下里巴人和者数千，阳春白雪和者数十，曲弥高和弥寡；复以鲲凤自喻瑰意琦行。文选列入对问类之首，开东方朔答客难一路文体。
    attribution: 存疑
    excerpt: 客有歌于郢中者……其为阳春白雪，国中属而和者，不过数十人……是其曲弥高，其和弥寡。
    text_display: excerpt
    themes: [孤高自许, 雅俗之辨, 自辩]
    influence: 阳春白雪、下里巴人、曲高和寡三大成语皆出于此，是宋玉进入国民语言的直接通道。
    confidence: 有争议
    dispute: 本次所据维基文库页面为古文观止系统文本（与文选本文字小异）；著作权与系年均存疑。
    source_ids: [src-wenxuan]

