    confidence: 存疑
    dispute: 吕安为兄吕巽诬诉的具体罪名（本传言及安妻徐氏事者出别传系统）与本传文字简略，案发年份在262与263间尚有分歧。
    source_ids: [src-jinshu-vol49]
  - stage: 冤狱与东市
    stage_order: 11
    title: 缧绁之中作幽愤诗
    date:
      text: 约262—263年之间，系狱期间
      year: 262
      range_end: 263
      precision: 范围
    place: 洛阳狱中
    summary: 康性慎言行，一旦缧绁，乃作幽愤诗。诗自叙早孤任性抗心希古托好庄老，至昔惭柳惠今愧孙登内负宿心外恧良朋，末以采薇山阿散发岩岫颐神养寿明志。
    source_ids: [src-jinshu-vol49]
  - stage: 冤狱与东市
    stage_order: 12
    title: 钟会谮害，文帝昵听信会
    date:
      text: 约262—263年之间
      year: 262
      range_end: 263
      precision: 范围
    place: 洛阳
    summary: 会言于文帝曰嵇康卧龙也不可起，公无忧天下顾以康为虑耳；因谮康欲助毌丘俭赖山涛不听，又谓康安等言论放荡非毁典谟帝王者所不宜容宜因衅除之以淳风俗。帝既昵听信会，遂并害之。
    source_ids: [src-jinshu-vol49]
  - stage: 冤狱与东市
    stage_order: 13
    title: 太学生三千请以为师，弗许
    date:
      text: "约263年"
      year: 263
      precision: 约
    place: 洛阳
    summary: 康将刑东市，太学生三千人请以为师，弗许。士林之望至于如此，反促其死。
    confidence: 存疑
    dispute: 卒年有景元三年(262)与四年(263)两说，本卷从约263；figures.yaml 登记为262。太学生请师人数三千见于本传，别传系统文字略异。
    source_ids: [src-jinshu-vol49]
  - stage: 冤狱与东市
    stage_order: 14
    title: 顾视日影，索琴弹广陵散，年四十
    date:
      text: "约263年"
      year: 263
      precision: 约
    place: 洛阳东市
    summary: 康顾视日影，索琴弹之，曰昔袁孝尼尝从吾学广陵散吾每靳固之，广陵散于今绝矣！时年四十。本传又记其早年游洛西暮宿华阳亭，有古人夜授此曲誓不传人之异闻。
    confidence: 存疑
    dispute: 卒年两说见上条；华阳亭神授故事属志怪层，仅为本传自记之传说，不作信史。
    source_ids: [src-jinshu-vol49]

  # ── 阶段五：身后余响 ──────────────────────────────
  - stage: 身后余响
    stage_order: 15
    title: 海内痛之，向秀作思旧赋
    date:
      text: 约264年及以后
      year: 264
      precision: 约
    place: 洛阳、山阳
    summary: 康死后海内之士莫不痛之，帝寻悟而恨焉。同卷向秀传载秀应本郡计入洛，途经山阳旧居，日薄虞泉寒冰凄然，邻人吹笛发声寥亮，追想曩昔游宴之好，作思旧赋悼嵇生之永辞兮顾日影而弹琴。
    confidence: 存疑
    dispute: 思旧赋作于入洛对答文帝之后，系年约在康死后一两年间；帝寻悟而恨焉云云为唐修晋书之史论笔法。
    source_ids: [src-jinshu-vol49]

works:
  - work_id: yushanjuyuanjuejiaoshu
    title: 与山巨源绝交书
    alt_titles: [绝交书]
    genre: 书牍
    date:
      text: 约257年前后
      year: 257
      precision: 约
    place: 洛阳（推定）
    context: 山涛（字巨源）迁选官举康自代，康作书拒绝并举自陈不堪仕宦的九患，宣布决裂。书中每非汤武而薄周孔一句历来被视为触忌之尤，书行而知其不可羁屈。
    attribution: 确凿
    excerpt: 今但愿守陋巷，教养子孙，时与亲旧叙阔，陈说平生，浊酒一杯，弹琴一曲，志愿毕矣。……又每非汤武而薄周孔，在人闲不止，此事会显世教所不容，此甚不可一也。刚肠疾恶，轻肆直言，遇事便发，此甚不可二也。
    text_display: excerpt
    themes: [拒仕, 自我剖白]
    influence: 中国士人拒绝合作与人格独立的宣言书，历代传诵不绝。
    confidence: 存疑
    dispute: 作年有甘露年间与景元年间诸说；本传所录为节本，全文从文选系统实取核校。
    source_ids: [src-jinshu-vol49, src-jikangji]

  - work_id: yangshenglun
    title: 养生论
    alt_titles: [养生论（嵇康）]
    genre: 论说文
    date:
      text: 成年后至下狱前，具体年份不详
      precision: 未知
    place: ""
    context: 本传载康常修养性服食之事，以为神仙禀之自然非积学所得，至于导养得理则安期彭祖之伦可及，乃著养生论。向秀曾与之论养生辞难往复。
    attribution: 确凿
    excerpt: 精神之于形骸，犹国之有君也。神躁于中，而形丧于外，犹君昏于上，国乱于下也。……是以君子知形恃神以立，神须形以存，悟生理之易失，知一过之害生。
    text_display: excerpt
    themes: [养生, 形神]
    influence: 魏晋养生思想的代表作，与向秀往复辩难开名理之争的风气。
    source_ids: [src-jinshu-vol49, src-jikangji]

  - work_id: shengwuailelun
    title: 声无哀乐论
    alt_titles: []
    genre: 论说文
    date:
      text: 具体年份不详
      precision: 未知
    place: ""
    context: 设秦客与东野主人八难八答，主张声音自当以善恶为主则无关乎哀乐，哀乐自当以情感则无系于声音。本传评曰甚有条理。
    attribution: 确凿
    excerpt: 音声之作，其犹臭味在于天地闲。其善与不善，虽遭遇浊乱，其体自若而不变也。……然则心之与声，明为二物。
    text_display: excerpt
    themes: [音乐美学, 名理]
    influence: 中国音乐美学史上最系统的独立命题，与养生论并称嵇康论辩双璧，后世玄谈清议奉为经典。
    source_ids: [src-jinshu-vol49, src-jikangji]

  - work_id: qinfu
    title: 琴赋
    alt_titles: []
    genre: 赋
    date:
      text: 具体年份不详
      precision: 未知
    place: ""
    context: 推众器之中琴德最优，历写琴材之生、制器之工、演奏之妙与琴德之和，末缀乱辞。既见其音乐家的当行本色，亦与临刑索琴的命运互证。
    attribution: 确凿
    excerpt: 可以导养神气，宣和情志，处穷独而不闷者，莫近于音声也。……众器之中，琴德最优。……性洁静以端理，含至德之和平。
    text_display: excerpt
    themes: [音乐, 咏物]
    influence: 咏琴文学的巅峰之作，历代琴人书斋必读，广陵止息等曲名赖此以传。
    source_ids: [src-jinshu-vol49, src-jikangji]

  - work_id: youfenshi
    title: 幽愤诗
    alt_titles: []
    genre: 四言诗
    date:
      text: 约262—263年之间，系狱期间
      year: 262
      range_end: 263
      precision: 范围
    place: 洛阳狱中
    context: 一旦缧绁，自讼自陈之作。回望早孤任性、抗心希古的一生，愧对孙登昔日性烈才隽之诫，以颐神养寿之愿作结。全篇载于本传。
    attribution: 确凿
    excerpt: 嗟余薄祜，少遭不造，哀茕靡识，越在襁褓。……昔惭柳惠，今愧孙登，内负宿心，外恧良朋。……采薇山阿，散发岩岫，永啸长吟，颐神养寿。
    text_display: excerpt
    themes: [自省, 冤愤]
    influence: 其绝命前的心史，与临刑弹琴同为嵇康形象的两块基石。
    source_ids: [src-jinshu-vol49]

  - work_id: zengxiucairujun
    title: 赠秀才入军
    alt_titles: [兄秀才公穆入军赠诗]
    genre: 四言诗
    date:
      text: 具体年份不详
      precision: 未知
    place: ""
    context: 赠兄嵇喜入军的组诗，想象军旅行猎之乐。目送归鸿手挥五弦一联写名士风神，俯仰自得游心太玄申言玄学襟抱，为其四言诗最高成就。
    attribution: 确凿
    excerpt: 息徒兰圃，秣马华山。流磻平皋，垂纶长川。目送归鸿，手挥五弦。俯仰自得，游心太玄。
    text_display: excerpt
    themes: [赠答, 玄想]
    influence: 目送归鸿手挥五弦成为魏晋风度最凝练的意象之一。
    confidence: 存疑
    dispute: 文字据通行本嵇康集转写待逐字核验；目送归鸿联所在篇次从通说第十四首，组诗作年无考。
    source_ids: [src-jikangji]

  - work_id: taishizhen
    title: 太师箴
    alt_titles: []
    genre: 箴
    date:
      text: 具体年份不详
      precision: 未知
    place: ""
    context: 本传载复作太师箴，亦足以明帝王之道焉。借古太师之口箴规君主，寄其政治批判于扬榷上古。
    attribution: 确凿
    excerpt: ""
    text_display: none
    themes: [政论]
    influence: 与声无哀乐论等同为其借文体立言的代表。
    source_ids: [src-jinshu-vol49]

  - work_id: gaoshizhuan
    title: 高士传（传赞）
    alt_titles: []
    genre: 传记著作
    date:
      text: 具体年份不详
      precision: 未知
    place: ""
    context: 本传载撰上古以来高士为之传赞，欲友其人于千载也。以立传知古为友，是其慕隐逸尚奇节人格的系统表达。
    attribution: 确凿
    excerpt: ""
    text_display: none
    themes: [隐逸, 人物品题]
    influence: 开魏晋高士类传风气，原书已佚，后世辑本所收与原帙关系存争议。
    confidence: 存疑
    dispute: 本传仅言撰高士传赞；今传皇甫谧高士传与此书关系、及嵇著卷帙篇目均难确考。
    source_ids: [src-jinshu-vol49]

  - work_id: guanglingsan
    title: 广陵散
    alt_titles: [广陵止息]
    genre: 琴曲
    date:
      text: 曲出先秦汉魏间，具体来源不详
      precision: 未知
    place: ""
    context: 康临刑顾视日影索琴弹之，叹广陵散于今绝矣，曲与人俱成绝响符号。本传自记早年洛西华阳亭遇古人夜授此曲誓不传人的异闻，又记袁孝尼尝求学而靳固不予。
    attribution: 确凿
    excerpt: ""
    text_display: none
    themes: [音乐, 绝响]
    influence: 因其临刑一曲成为中国文化中壮烈与绝艺的代名词，琴谱后世复出，聂政刺韩王说流行，皆围绕此曲层累而成。
    confidence: 传说
    dispute: 华阳亭神授故事属志怪层不足信史；曲情本事有聂政刺韩相等说，今存谱本与嵇康所奏渊源难考。
    source_ids: [src-jinshu-vol49]

