reception:
  - era: 同时代
    evaluator: 晋书本传（录时人品目）
    quote: 龙章凤姿，天质自然。
    text_display: excerpt
    comment: 本传评价原貌——时人以龙凤喻其仪表天成而不假修饰，此四字遂成嵇康形象的定妆语。
    source_ids: [src-jinshu-vol49]
  - era: 同时代
    evaluator: 孙登
    quote: 君性烈而才隽，其能免乎！
    text_display: excerpt
    comment: 汲郡山中临别之言，本传引以预示其杀身之祸，是同时代人对嵇康性格命运最著名也最沉重的判断。
    source_ids: [src-jinshu-vol49]
  - era: 历代批评
    evaluator: 颜延之（五君咏·嵇中散）
    quote: 中散不偶世，本自餐霞人。……鸾翮有时铩，龙性谁能驯。
    text_display: excerpt
    comment: 南朝宋颜延之咏竹林五贤之作，鸾翮龙性一联确立嵇康刚烈不可驯的经典批评形象。诗句据通行本文选转写，来源条目待补登记，source_ids 暂留空（警告可接受）。
    confidence: 存疑
    dispute: 五君咏文字历代刊本小异；本条引文未经逐字实取，仅作接受史线索著录。
    source_ids: []
  - era: 近现代学术
    evaluator: 学界综述
    quote: ""
    text_display: none
    comment: 近现代研究聚焦玄学与名教之争框架下的嵇康思想定位、声无哀乐论的音乐美学重估、吕安案与司马氏政权性质的政治史再检讨、广陵散谱系源流考辨等议题；具体论著引文须逐条取得许可后补入，本卷暂作中立综述。
