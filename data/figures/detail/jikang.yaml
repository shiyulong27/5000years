      range_end: 260
      precision: 范围
    evidence: 本传载康所与神交者惟陈留阮籍、河内山涛，豫其流者河内向秀、沛国刘伶、籍兄子咸、琅邪王戎，遂为竹林之游，世所谓竹林七贤也。阮籍传同卷互证；绝交书中康自言阮嗣宗口不论人过吾每师之而未能及，知二人相知之深。
    source_ids: [src-jinshu-vol49, src-jikangji]
