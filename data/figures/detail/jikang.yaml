# 嵇康全景详卷（schema v1）
# 史料审计表（实取文本前置证据；来源登记见 data/sources.yaml）：
#
# | 事实点 | 晋书·卷四十九·嵇康传（J，维基文库实取） | 结论与置信 |
# |---|---|---|
# | 家世命氏 | 字叔夜，谯国铚人；其先姓奚，会稽上虞人，避怨徙焉；铚有嵇山，家于其侧因而命氏 | 确定(J) |
# | 才性形仪 | 早孤有奇才远迈不群；身长七尺八寸美词气有风仪，土木形骸不自藻饰，人以为龙章凤姿天质自然；恬静寡欲宽简有大量 | 确定(J) |
# | 学养 | 学不师受，博览无不该通，长好老庄 | 确定(J) |
# | 仕婚 | 与魏宗室婚，拜中散大夫（年份无载） | 确定(J)/系年存疑 |
# | 七贤 | 所与神交者惟阮籍、山涛，豫其流者向秀、刘伶、阮咸、王戎，遂为竹林之游，世所谓竹林七贤；戎自言与康居山阳二十年未尝见其喜愠之色 | 确定(J)；游处年代推定 |
# | 问学隐逸 | 采药游山泽；从孙登游，登曰君性烈而才隽其能免乎；又遇王烈得石髓素书异事 | 确定(J)/王烈事志怪层 |
# | 绝交书 | 山涛将去选官举康自代，康乃与涛书告绝（本传节录；全文另据文选系统实取核校） | 确定 |
# | 锻铁 | 性绝巧而好锻；宅中有一柳树甚茂激水圜之每夏月居其下以锻；居贫尝与向秀共锻于大树之下以自赡给 | 确定(J)；地点洛阳系推定 |
# | 钟会造访 | 会精练有才辩故往造焉，康不为之礼而锻不辍；何所闻而来／闻所闻而去问答；会以此憾之 | 确定(J) |
# | 构陷 | 会言于文帝曰嵇康卧龙也不可起；谮康欲助毌丘俭赖山涛不听；言论放荡非毁典谟宜因衅除之；帝昵听信遂并害之 | 确定(J) |
# | 吕安案 | 东平吕安服康高致每一相思辄千里命驾；后安为兄所枉诉以事系狱，辞相证引遂复收康 | 确定(J)；案情细节史文简略 |
# | 幽愤诗 | 康一旦缧绁乃作幽愤诗（全篇载本传） | 确定(J) |
# | 临刑 | 将刑东市，太学生三千人请以为师弗许；顾视日影索琴弹之曰广陵散于今绝矣；时年四十 | 确定(J) |
# | 广陵散来历 | 尝游洛西暮宿华阳亭引琴而弹，夜有客称是古人授广陵散誓不传人（本传自记此异闻） | 传说(J) |
# | 卒年 | 时年四十（本传无干支）；学界有景元三年(262)、四年(263)两说 | 有争议；本卷从约263 |
# | 身后 | 海内之士莫不痛之，帝寻悟而恨焉；同卷向秀传载秀经山阳旧居作思旧赋悼嵇生之永辞顾日影而弹琴 | 确定(J) |
#
