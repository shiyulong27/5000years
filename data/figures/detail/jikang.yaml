    date:
      text: 婚娶与拜官年份正史无载
      precision: 未知
    place: 洛阳（推定）
    summary: 本传载与魏宗室婚，拜中散大夫。中散大夫为王莽以来置散秩，魏晋沿置，无事而禄，与其不愿任事的姿态相合。
    confidence: 存疑
    dispute: 婚于何家、婚于何年均无明文；任职地点洛阳系依散官常居京师之制推定。
    source_ids: [src-jinshu-vol49]
  - stage: 竹林高蹈
    stage_order: 5
    title: 神交阮籍山涛，竹林之游成七贤
    date:
      text: 约249—260年之间
      year: 249
      range_end: 260
      precision: 范围
    place: 山阳（今河南焦作一带）
    summary: 本传载所与神交者惟陈留阮籍、河内山涛，豫其流者河内向秀、沛国刘伶、籍兄子咸、琅邪王戎，遂为竹林之游，世所谓竹林七贤也。戎自言与康居山阳二十年，未尝见其喜愠之色。
    confidence: 存疑
    dispute: 七贤聚合的起讫年份正史无载，系依高平陵事变后政局与卒年框定；山阳游处地望另有河内他说。
    source_ids: [src-jinshu-vol49]
  - stage: 竹林高蹈
    stage_order: 6
    title: 采药游山泽，从孙登游
    date:
      text: 正始至景元间，具体年份不详
      precision: 未知
    place: 汲郡山中（今豫北太行山地）
    summary: 康尝采药游山泽，会其得意忽焉忘反，樵苏者遇之咸谓神。至汲郡山中见孙登遂从之游；临去登曰君性烈而才隽其能免乎。又遇王烈共入山，得石髓素书异事，本传以见其神心所感每遇幽逸如此。
    confidence: 存疑
    dispute: 孙登所言系谶语式记载；王烈石髓素书情节属志怪笔法，采录仅以见本传叙事原貌。
    source_ids: [src-jinshu-vol49]

  # ── 阶段三：拒仕绝交 ──────────────────────────────
  - stage: 拒仕绝交
    stage_order: 7
    title: 居贫锻铁，与向秀共锻大树之下
    date:
      text: 具体年份不详
      precision: 未知
    place: 洛阳（推定）
    summary: 性绝巧而好锻。宅中有一柳树甚茂，乃激水圜之，每夏月居其下以锻。初康居贫，尝与向秀共锻于大树之下以自赡给，秀为之佐相对欣然傍若无人。
    confidence: 存疑
    dispute: 锻铁所在，本传兼载宅中柳树与大树之下两处而不系地名；洛阳说系依任职与交游圈推定，亦有主山阳说者。
    source_ids: [src-jinshu-vol49]
  - stage: 拒仕绝交
    stage_order: 8
    title: 钟会造访，锻不辍不为礼
    date:
      text: 具体年份不详
      precision: 未知
    place: 洛阳或山阳（推定）
    summary: 颍川钟会贵公子精练有才辨，故往造焉。康不为之礼而锻不辍，良久会去，康问何所闻而来何所见而去，会答闻所闻而来见所见而去，会以此憾之。后遂进谗于文帝。
    confidence: 存疑
    dispute: 造访年份无载；地点系依锻铁所在推定。钟会衔恨与后来构陷的因果关系出自本传叙事框架。
    source_ids: [src-jinshu-vol49]
  - stage: 拒仕绝交
    stage_order: 9
    title: 山涛举康自代，作与山巨源绝交书
    date:
      text: 约257年前后
      year: 257
      precision: 约
    place: 洛阳（推定）
    summary: 山涛将去选官，举康自代，康乃与涛书告绝。书中自陈必不堪者七甚不可者二，每非汤武而薄周孔，宣言今但愿守陋巷教养子孙浊酒一杯弹琴一曲志愿毕矣。此书既行，知其不可羁屈也。
    confidence: 有争议
    dispute: 绝交书作年有甘露年间（约257）与景元元年前（约260）诸说；非汤武而薄周孔一句被后世视为招祸之由，亦有学者认为系司马氏借吕安案诛异己的托辞。
    source_ids: [src-jinshu-vol49, src-jikangji]

