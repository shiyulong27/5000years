    stage_order: 6
    title: 孝宗召对，赐进士出身
    date:
      text: 约1163年
      year: 1163
      precision: 约
    place: 临安
    summary: 孝宗即位迁枢密院编修官兼编类圣政所检讨官。史浩黄祖舜荐游善词章谙典故，召见，上曰游力学有闻言论剀切，遂赐进士出身——以其科场被黜之辱得朝廷正式补偿。
    confidence: 存疑
    dispute: 赐出身在孝宗即位后，隆兴元年(1163)说为主流，精确月份无载。
