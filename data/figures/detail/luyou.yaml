      year: 1160
      range_end: 1162
      precision: 范围
    place: 临安
    summary: 除敕令所删定官后，力陈杨存中久掌禁旅非便，上嘉其言遂罢存中；又奏禁中贵人市北方珍玩亏損圣德乞严行禁绝；应诏言非宗室外家虽实有勋劳毋得辄加王爵。迁大理寺司直兼宗正簿。
