works:
  - work_id: shi-er
    title: 示儿
    alt_titles: []
    genre: 七言绝句
    date:
      text: 约1210年岁末临终
      year: 1210
      precision: 约
    place: 山阴
    context: 八十五岁临终绝笔，以家祭告乃翁嘱托王师北定，将个人生死与九州统一系于一诗。
    attribution: 确凿
    excerpt: 死去元知万事空，但悲不见九州同。王师北定中原日，家祭无忘告乃翁。
    text_display: full
    themes: [爱国, 绝笔]
    influence: 中国诗歌史上最著名的临终之作，爱国诗人形象的最终定格。
    confidence: 存疑
    dispute: 系于临终从通行编年说；文本各版本无异文之争。
    source_ids: [src-luyou-ji]

  - work_id: you-shan-xi-cun
    title: 游山西村
    alt_titles: []
    genre: 七言律诗
    date:
      text: 约1167年罢归山阴闲居期间
      year: 1167
      precision: 约
    place: 山阴
    context: 力说用兵免归后乡居，纪农家春社游村之乐，于闲适中仍存古风之思。
    attribution: 确凿
    excerpt: 莫笑农家腊酒浑，丰年留客足鸡豚。山重水复疑无路，柳暗花明又一村。箫鼓追随春社近，衣冠简朴古风存。从今若许闲乘月，拄杖无时夜叩门。
    text_display: full
    themes: [田园, 村野]
    influence: 山重水复柳暗花明成为困境转机的千古成语。
    confidence: 存疑
    dispute: 系年从乾道三年罢归通说。
    source_ids: [src-luyou-ji]

