    place: 建康、隆兴
    summary: 因向枢臣张燾言龙大渊曾覿招权植党事发，上怒，出通判建康府寻易隆兴府；言者论游交结台谏鼓唱是非力说张浚用兵，免归。张浚北伐符离之败后的和战风潮为其外放背景。
