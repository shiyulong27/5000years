      range_end: 1173
      precision: 范围
    place: 南郑
    summary: 吴璘子挺代掌兵颇骄恣倾财结士屡以过误杀人，炎莫谁何。游请以玠子拱代挺；炎谓拱怯而寡谋遇敌必败，游答使挺遇敌安保其不败就令有功愈不可驾驭。及挺子曦僭叛，游言始验。
    source_ids: [src-songshi-vol395]

