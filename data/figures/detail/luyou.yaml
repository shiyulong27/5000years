      precision: 约
    place: 山阴
    context: 回忆早岁北望与楼船夜雪瓜洲渡铁马秋风大散关的亲历岁月，塞上长城空自许是对壮志落空的自嘲。
    attribution: 确凿
    excerpt: 早岁那知世事艰，中原北望气如山。楼船夜雪瓜洲渡，铁马秋风大散关。……塞上长城空自许，镜中衰鬓已先斑。出师一表真名世，千载谁堪伯仲间。
    text_display: excerpt
    themes: [爱国, 抒愤]
    influence: 其军旅记忆最凝练的名联，也是研究南郑经历的第一诗证。
    source_ids: [src-luyou-ji]

  - work_id: guan-shan-yue
    title: 关山月
    alt_titles: []
    genre: 乐府
    date:
      text: 约1176—1177年蜀中时期
      year: 1176
      range_end: 1177
      precision: 范围
    place: 成都（一说）
    context: 以和戎诏下十五年总领全篇，朱门歌舞与遗民垂泪对写，是隆兴和议后主和局面的乐府式控诉。
    attribution: 确凿
    excerpt: 和戎诏下十五年，将军不战空临边。朱门沉沉按歌舞，厩马肥死弓断弦。……笛里谁知壮士心，沙头空照征人骨。
    text_display: excerpt
    themes: [爱国, 边塞, 讽喻]
    influence: 以旧题乐府写当代时局的代表作。
    confidence: 存疑
    dispute: 作地作年诸家有出入，蜀中淳熙间说为主流。
    source_ids: [src-luyou-ji]

  - work_id: chai-tou-feng
    title: 钗头凤·红酥手
    alt_titles: []
    genre: 词
    date:
      text: 约1155年沈园邂逅后（笔记层系年）
      year: 1155
      precision: 约
    place: 沈园
    context: 传统说法系于绍兴间沈园与前妻唐氏邂逅，错错错莫莫莫的悔恨成为其情事叙事的核心文本；此本事主要见于宋人笔记层而非正史。
    attribution: 存疑
    excerpt: 红酥手，黄縢酒。满城春色宫墙柳。东风恶，欢情薄。一怀愁绪，几年离索。错、错、错。……山盟虽在，锦书难托。莫、莫、莫！
    text_display: excerpt
    themes: [爱情, 悔恨]
    influence: 宋词中流传最广的情殇之作之一。
    confidence: 有争议
    dispute: 本事（沈园遇唐氏说）出自宋人笔记层（齐东野语等），早期文献著录与系年均非正史层面；亦有学者对词的本事提出另解。
    source_ids: [src-luyou-ji]

  - work_id: shen-yuan-er-shou
    title: 沈园二首（其一）
    alt_titles: []
    genre: 七言绝句
    date:
      text: 约1199年重游沈园时
      year: 1199
      precision: 约
    place: 沈园
    context: 晚年重游故地，伤心桥下春波绿曾是惊鸿照影来。周密齐东野语据此系出唐氏情事的笔记层叙述，诗人自述层面仅存于诗作本身。
    attribution: 确凿
    excerpt: 城上斜阳画角哀，沈园非复旧池台。伤心桥下春波绿，曾是惊鸿照影来。
    text_display: excerpt
    themes: [怀旧, 爱情]
    influence: 沈园因此诗成为中国文学中最著名的情殇纪念地。
    confidence: 存疑
    dispute: 诗作为本人作品无疑；然「悼唐琬」的解读依赖齐东野语笔记层，材料层级须与本诗本文区分。
    source_ids: [src-luyou-ji]

  - work_id: shi-yi-yue-si-feng-yu
    title: 十一月四日风雨大作（其二）
    alt_titles: []
    genre: 七言绝句
    date:
      text: "约1192年冬"
      year: 1192
      precision: 约
    place: 山阴
    context: 六十八岁退居山阴，风雨之夜卧听风吹雨而梦铁马冰河，乡居与恢复之志的典型合体。
    attribution: 确凿
    excerpt: 僵卧孤村不自哀，尚思为国戍轮台。夜阑卧听风吹雨，铁马冰河入梦来。
    text_display: full
    themes: [爱国, 梦境]
    influence: 夜阑卧听风吹雨为晚年爱国心境的最著名写照。
    confidence: 存疑
    dispute: 绍熙三年冬从通行编年说。
    source_ids: [src-luyou-ji]

  - work_id: lin-an-chun-yu
    title: 临安春雨初霁
    alt_titles: []
    genre: 七言律诗
    date:
      text: 约1186年春赴严州前客居临安时
      year: 1186
      precision: 约
    place: 临安
    context: 小楼一夜听春雨深巷明朝卖杏花的清丽背后，是世味年来薄似纱的倦怠与素衣莫起风尘叹的自持。
    attribution: 确凿
    excerpt: 世味年来薄似纱，谁令骑马客京华。小楼一夜听春雨，深巷明朝卖杏花。……素衣莫起风尘叹，犹及清明可到家。
    text_display: excerpt
    themes: [抒怀, 京华]
    influence: 江南春雨意象的经典化文本。
    confidence: 存疑
    dispute: 系年从淳熙十三年春通说。
    source_ids: [src-luyou-ji]

  - work_id: qiu-ye-jiang-xiao
    title: 秋夜将晓出篱门迎凉有感
    alt_titles: []
    genre: 七言绝句
    date:
      text: 约1192年秋
      year: 1192
      precision: 约
    place: 山阴
    context: 遗民泪尽胡尘里南望王师又一年，替沦陷区遗民立言，与其晚年乡居处境形成强烈张力。
    attribution: 确凿
    excerpt: 三万里河东入海，五千仞岳上摩天。遗民泪尽胡尘里，南望王师又一年。
    text_display: full
    themes: [爱国, 遗民]
    influence: 以山河气象托遗民之泪的爱国绝句典范。
    confidence: 存疑
    dispute: 绍熙三年秋从通行编年说。
    source_ids: [src-luyou-ji]

  - work_id: jian-men-dao-zhong
    title: 剑门道中遇微雨
    alt_titles: []
    genre: 七言绝句
    date:
      text: 约1172年冬自南郑调成都途中
      year: 1172
      precision: 约
    place: 剑门
    context: 此身合是诗人未细雨骑驴入剑门的自我叩问，恰是从军前线转入幕府文职的人生转折注脚。
    attribution: 确凿
    excerpt: 衣上征尘杂酒痕，远游无处不消魂。此身合是诗人未？细雨骑驴入剑门。
    text_display: full
    themes: [自况, 行旅]
    influence: 诗人身份自觉的标志性自画像。
    confidence: 存疑
    dispute: 乾道八年冬离南郑赴成都通说。
    source_ids: [src-luyou-ji]

  - work_id: bu-suan-zi-yong-mei
    title: 卜算子·咏梅
    alt_titles: []
    genre: 词
    date:
      text: 创作年代不详
      precision: 未知
    place: ""
    context: 驿外断桥边寂寞开无主的梅花，零落成泥碾作尘只有香如故，是其人格操守的自喻。
    attribution: 确凿
    excerpt: 零落成泥碾作尘，只有香如故。
    text_display: excerpt
    themes: [咏物, 言志]
    influence: 咏梅词中人格化的巅峰之作。
    source_ids: [src-luyou-ji]

