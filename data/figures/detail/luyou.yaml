reception:
  - era: 同时代
    evaluator: 孝宗赵昚
    quote: 卿笔力回斡甚善，非他人可及。
    text_display: excerpt
    comment: 宋史本传所记陛辞召对时的当面评价，代表朝廷对其文字才能的直接肯定。
    source_ids: [src-songshi-vol395]
  - era: 同时代
    evaluator: 朱熹
    quote: 其能太高，迹太近，恐为有力者所牵挽，不得全其晚节。
    text_display: excerpt
    comment: 宋史传直引朱熹语，对其晚年出处（韩侂胄南园阅古泉记事件）的预见性批评，与传尾见讥清议相呼应。
    source_ids: [src-songshi-vol395]
  - era: 历代批评
    evaluator: 元·宋史史臣论赞
    quote: 学广而望隆，晚为韩侂胄著堂记，君子惜之，抑《春秋》责贤者备也。
    text_display: excerpt
    comment: 卷395论赞对陆游的双重评价：既许其学识声望，又以春秋责贤之义惋惜其晚节瑕疵，代表传统史学的评价框架。
    source_ids: [src-songshi-vol395]
