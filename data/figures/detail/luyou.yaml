      range_end: 1164
      precision: 范围
    place: 临安
    summary: 隆兴和议将成之际，以书白二府：江左自吴以来未有舍建康他都者驻跸临安出于权宜形势不固馈饷不便海道逼近凛然意外之忧；主张建康临安皆係驻跸之地以便异日建都立国。
    source_ids: [src-songshi-vol395]
  - stage: 初仕东南与孝宗朝起落
    stage_order: 8
