    title: 生于相州汤阴农家
    date:
      text: 约1103年（由卒年三十九倒推的通行说）
      year: 1103
      precision: 约
    place: 相州汤阴
    summary: 岳飛字鵬舉，相州湯陰人。世力農。飛生時有大禽若鵠飛鳴室上，因以為名；未彌月河決內黃，母姚抱飛坐甕中衝濤及岸得免。生年本传不载，由卒年「時年三十九」按虚岁倒推定为1103年。
    confidence: 存疑
    dispute: 正史不载生年；1103年为据卒年三十九倒推的通行说，细部月份无考。
    source_ids: [src-songshi-vol365]
  - stage: 汤阴农家与四次从军
