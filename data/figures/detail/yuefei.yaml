    title: 家贫力学，学射周同
    date:
      text: 少年时期，具体年代不详
      precision: 未知
    place: 汤阴
    summary: 少負氣節，沈厚寡言，家貧力學，尤好左氏春秋、孫吳兵法。生有神力，未冠挽弓三百斤弩八石；學射於周同盡其術能左右射，同死朔望設祭於其冢。父義之曰汝為時用其徇國死義乎。
    source_ids: [src-songshi-vol365]
  - stage: 汤阴农家与四次从军
    stage_order: 3
    title: 宣和四年应真定府募敢战士，计擒陶俊
    date:
      text: "1122年（宣和四年）"
      year: 1122
      precision: 精确
    place: 真定府、相州
    summary: 宣和四年真定宣撫劉韐募敢戰士，飛應募。相有劇賊陶俊賈進和，飛請百騎滅之——遣卒偽為商入賊境，伏兵山下，陽北誘敵，擒俊及進和以歸。此为本传唯一系年的从军起点。
    confidence: 存疑
    dispute: 通俗叙述常称岳飞「四次从军」（真定、平定军等），系综合他书与年谱的合计说法；本传仅明书宣和四年应募一次及其后随刘浩、归宗泽等经历，「四次」之说引用时须注明非本传明文。
    source_ids: [src-songshi-vol365]
  - stage: 汤阴农家与四次从军
    stage_order: 4
    title: 招降吉倩，滑南斩枭将，迁秉义郎隶宗泽
    date:
      text: 约1126—1127年间（靖康之际）
      year: 1126
      range_end: 1127
      precision: 范围
    place: 相州、李固渡、滑州
    summary: 康王至相，飛因劉浩見，命招賊吉倩，倩以眾三百八十人降，補承信郎。以鐵騎三百往李固渡嘗敵敗之；與敵相持於滑南，獨馳迎敵斬舞刀梟將，敵大敗。遷秉義郎，隸留守宗澤。
    confidence: 存疑
    dispute: 此段战事系于靖康至建炎初，本传叙事连贯而不逐条系年，年份据康王开帅府时间推定。
    source_ids: [src-songshi-vol365]

