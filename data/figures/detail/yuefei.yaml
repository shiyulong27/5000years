# 岳飞全景详卷（schema v1）——首个 field=军事 的非文学人物适配性样板
# 史料审计表（实取证据；来源登记见 data/sources.yaml）：
#
# 【正史本传层】宋史·卷365·列传第一百二十四·岳飞传（维基文库实取，URL: https://zh.wikisource.org/wiki/宋史/卷365）
# | 事实点 | 本传原文（节录） | 结论与置信 |
# |---|---|---|
# | 名号籍贯 | 岳飛字鵬舉，相州湯陰人。世力農。父和，能節食以濟饑者 | 确定 |
# | 少年气质 | 少負氣節，沈厚寡言，家貧力學，尤好左氏春秋、孫吳兵法。生有神力，未冠，挽弓三百斤，弩八石。學射於周同 | 确定 |
# | 首次应募 | 宣和四年，真定宣撫劉韐募敢戰士，飛應募 | 确定（唯一系年的从军起点；「四次从军」为后世综述，见dispute） |
# | 宗泽麾下 | 戰開德、曹州皆有功，澤大奇之……授以陣圖。飛曰：「陣而後戰，兵法之常，運用之妙，存乎一心。」澤是其言 | 确定 |
# | 谏杜充南撤 | 杜充將還建康，飛曰：「中原地尺寸不可棄，今一舉足，此地非我有，他日欲復取之，非數十萬眾不可。」充不聽 | 确定 |
# | 军纪与口碑 | 軍無見糧，將士忍饑，不敢擾民。金所籍兵相謂曰：「此岳爺爺軍。」爭來降附；軍號「凍死不拆屋，餓死不鹵掠。」敵為之語曰：「撼山易，撼岳家軍難。」 | 确定（军事制度类条目入timeline之本传支撑） |
# | 收复建康 | 兀朮趨建康，飛設伏牛頭山待之……兀朮奔淮西，遂復建康 | 确定 |
# | 襄汉六郡 | 飛奏：「襄陽等六郡為恢復中原基本，今當先取六郡，以除心膂之病。」遂復郢隨襄陽鄧唐信陽 | 确定 |
# | 连结河朔 | 紹興五年，飛遣梁興等布德意，招結兩河豪傑……其所揭旗以「岳」為號……自燕以南，金號令不行 | 确定 |
# | 郾城大捷 | 兀朮有勁軍……號「拐子馬」……飛戒步卒以麻札刀入陣，勿仰視，第斫馬足……遂大敗之。兀朮大慟曰：「自海上起兵，皆以此勝，今已矣！」 | 确定 |
# | 背嵬军 | 貴將遊奕、雲將背嵬戰于城西；遣驍將以背嵬騎五百奮擊，大破之 | 确定（背嵬为岳飞亲军番号，本传三见） |
# | 朱仙镇 | 飛進軍朱仙鎮，距汴京四十五里，與兀朮對壘而陣 | 本传明载照录；近现代学者考辨为岳珂系统增饰（见dispute，属后世考证层） |
# | 直捣黄龙 | 飛大喜，語其下曰：「直抵黃龍府，與諸君痛飲爾！」 | 确定 |
# | 十二金牌 | 一日奉十二金字牌，飛憤惋泣下，東向再拜曰：「十年之力，廢於一旦。」民遮馬慟哭……哭聲震野 | 确定 |
# | 罢兵权 | 授樞密副使，位參知政事上，飛固請還兵柄 | 确定 |
# | 背刺四字 | 初命何鑄鞠之，飛裂裳以背示鑄，有「盡忠報國」四大字，深入膚理。既而閱實無左驗，鑄明其無辜。改命万俟禼 | 确定。注意：背刺原文是「盡忠報國」，「精忠報國」是后世混同高宗手書「精忠岳飛」旗而来的通俗说法 |
# | 死因与年龄 | 嵗暮，獄不成，檜手書小紙付獄，即報飛死，時年三十九 | 确定（本传仅记「歲暮」不系日；绍兴十一年岁暮合公历已入1142年初） |
# | 莫须有 | 獄之將上也，韓世忠不平，詣檜詰其實，檜曰：「飛子雲與張憲書雖不明，其事體莫須有。」世忠曰：「『莫須有』三字，何以服天下？」 | 确定。「莫须有」出自韩世忠问语中的秦桧答语，本传铁证 |
# | 身后平反 | 孝宗詔復飛官，以禮改葬……建廟於鄂，號忠烈。淳熙六年，謚武穆。嘉定四年，追封鄂王 | 确定。注意：本传无「改諡忠武」，该后续谥变属本传之外的文献层（见reception dispute） |
# | 五子与岳珂线索 | 五子：雲、雷、霖、震、霆。霖子珂，以淮西十五御札辯驗彙次……嘉定間，為籲天辯誣集五卷、天定錄二卷上之 | 确定（《金佗稡编》线索由本传附传导航：岳珂为霖之子，《籲天辯誣集》即金佗系统文献；金佗稡编原书站内检索未获独立全文页，本卷按转述层处理） |
# | 论赞 | 論曰：西漢而下……求其文武全器、仁智并施如宋岳飛者，一代豈多見哉……真有諸葛孔明之風，而卒死於秦檜之手……高宗忍自棄其中原，故忍殺飛，嗚呼冤哉！嗚呼冤哉！ | 确定（元代史臣论赞，入reception历代批评层） |
#
