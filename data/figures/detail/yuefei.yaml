    summary: 戰開德、曹州皆有功，澤大奇之曰爾勇智才藝古良將不能過然好野戰非萬全計，因授以陣圖。飛曰：「陣而後戰，兵法之常，運用之妙，存乎一心。」澤是其言——宋代军事思想史上最著名的将帅问答之一。
    confidence: 存疑
    dispute: 本传不系年，从宗泽任东京留守时段推定。
    source_ids: [src-songshi-vol365]
