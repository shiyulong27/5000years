      precision: 未知
    place: 鄂州军中
    summary: 師每休舍課將士注坡跳壕皆重鎧習之；卒有取民麻一縷以束芻者立斬以徇；卒夜宿民開門願納無敢入者。軍號「凍死不拆屋，餓死不鹵掠。」凡有頒犒均給軍吏秋毫不私。善以少擊眾，謀定而後戰故有勝無敗，敵為之語曰：「撼山易，撼岳家軍難。」又調軍食必蹙額曰東南民力耗敝極矣，募民營田歲省漕運之半——纪律、训练、后勤、屯田构成完整的治军制度体系。
    source_ids: [src-songshi-vol365]
  - stage: 襄汉六郡与郾城大捷
    stage_order: 14
    title: 连结河朔之谋：遣梁兴招结两河豪杰
    date:
      text: 自约1135年起布局，1140年收效
      year: 1135
      range_end: 1140
      precision: 范围
    place: 太行山、两河
    summary: 先是紹興五年飛遣梁興等布德意招結兩河豪傑，山砦韋銓孫謀等歛兵固堡以待王師，李通胡清李寶李興等舉眾來歸，金人動息山川險要一時皆得其實。紹興十年梁興會太行忠義及兩河豪傑累戰皆捷，自燕以南金號令不行，河北簽軍無一人從者，金帥烏陵思謀但諭其下曰毋輕動俟岳家軍來即降。
    source_ids: [src-songshi-vol365]
  - stage: 襄汉六郡与郾城大捷
    stage_order: 15
    title: 郾城大捷：麻札刀斫马足大破拐子马
    date:
      text: "1140年（绍兴十年）"
      year: 1140
      precision: 精确
    place: 郾城
    summary: 兀朮合龍虎大王蓋天大王與韓常之兵逼郾城。飛遣子雲領騎兵直貫其陣戒之曰不勝先斬汝，鏖戰數十合賊屍布野。初兀朮有勁軍皆重鎧貫以韋索三人為聯號拐子馬，是役以萬五千騎來，飛戒步卒以麻札刀入陣勿仰視第斫馬足，拐子馬相連一馬仆二馬不能行，官軍奮擊遂大敗之。兀朮大慟曰自海上起兵皆以此勝今已矣。
    confidence: 存疑
    dispute: 郾城之役本传系于绍兴十年明文；「三人相联号拐子马」的战术解释近现代学者（如邓广铭）另有专考商榷（转述层，见reception）。
    source_ids: [src-songshi-vol365]
  - stage: 襄汉六郡与郾城大捷
    stage_order: 16
    title: 颍昌背嵬决胜，进驻朱仙镇，「直抵黄龙府」
    date:
      text: "1140年（绍兴十年）"
      year: 1140
      precision: 精确
    place: 颍昌、朱仙镇
    summary: 方郾城再捷飛謂雲曰賊屢敗必還攻潁昌汝宜速援王貴。既而兀朮果至，雲以騎兵八百挺前決戰步軍張左右翼繼之，殺兀朮婿夏金吾，兀朮遁去。飛進軍朱仙鎮距汴京四十五里，遣驍將以背嵬騎五百奮擊大破之。飛大喜語其下曰：「直抵黃龍府，與諸君痛飲爾！」
    confidence: 存疑
    dispute: 朱仙镇之战本传明载照录；惟近现代学者（邓广铭等）考辨此役为岳珂《金佗稡编》系统的增饰，宋人当时文书未见其功（后世考证层转述），引用时须双注。
    source_ids: [src-songshi-vol365]

  # ── 阶段四：十二金牌与十年之功 ──────────────────────────────
  - stage: 十二金牌与十年之功
    stage_order: 17
    title: 一日奉十二金字牌班师：「十年之力，废于一旦」
    date:
      text: "1140年（绍兴十年）七月中旬前后"
      year: 1140
      precision: 约
    place: 郾城—朱仙镇一线
    summary: 方指日渡河，而檜欲畫淮以北棄之，風臺臣請班師；先請張俊楊沂中歸，而後言飛孤軍不可久留乞令班師。一日奉十二金字牌，飛憤惋泣下，東向再拜曰：「十年之力，廢於一旦。」民遮馬慟哭訴曰我等戴香盆運糧草以迎官軍金人悉知之相公去我輩無噍類矣。飛亦悲泣取詔示之曰吾不得擅留。哭聲震野，飛留五日以待其徙，從而南者如市。
    confidence: 存疑
    dispute: 「十二金字牌」之「十二」为本传明文；班师确切日期本传不载，「七月中旬前后」系据绍兴十年战程推定。
    source_ids: [src-songshi-vol365]

  # ── 阶段五：枢府罢权与风波狱 ──────────────────────────────
  - stage: 枢府罢权与风波狱
    stage_order: 18
    title: 明升暗夺：授枢密副使罢兵权
    date:
      text: "1141年（绍兴十一年）四月"
      year: 1141
      precision: 约
    place: 临安
    summary: 時和議既決，檜患飛異己，乃密奏召三大將論功行賞。韓世忠張俊已至飛獨後，檜又用王次翁計俟之六七日。既至，授樞密副使位參知政事上，飛固請還兵柄——以枢府虚衔收三大将兵权的制度化削藩之举。
    confidence: 存疑
    dispute: 除枢副在本传系于绍兴十一年，月日据三大将赴行在时序推定。
    source_ids: [src-songshi-vol365]
  - stage: 枢府罢权与风波狱
    stage_order: 19
    title: 万俟禼劾飞，还两镇节；张俊构陷诱王俊诬告张宪
    date:
      text: "1141年（绍兴十一年）"
      year: 1141
      precision: 约
    place: 临安
    summary: 檜志未伸也，以谏议大夫万俟禼与飞有怨风禼劾飞，又风中丞何鑄侍御史羅汝楫交章彈論；飛累章請罷樞柄，尋還兩鎮節充萬壽觀使奉朝請。又諭張俊令劫王貴誘王俊誣告張憲謀還飛兵——罗织之网由党争与私人恩怨层层结成。
    source_ids: [src-songshi-vol365]
  - stage: 枢府罢权与风波狱
    stage_order: 20
    title: 何铸鞫狱，裂裳示背「尽忠报国」四大字
    date:
      text: "1141年（绍兴十一年）冬"
      year: 1141
      precision: 约
    place: 临安大理寺狱
    summary: 檜遣使捕飛父子證張憲事，使者至，飛笑曰皇天后土可表此心。初命何鑄鞠之，飛裂裳以背示鑄，有「盡忠報國」四大字深入膚理。既而閱實無左驗，鑄明其無辜，改命万俟禼。禼誣飛與憲書令虛申探報以動朝廷，且言其書已焚。
    confidence: 存疑
    dispute: 背刺四字本传作「盡忠報國」而非「精忠報國」；狱址大理寺系由鞫狱官何鑄万俟禼职任及「下棘寺」语推定。
    source_ids: [src-songshi-vol365]
  - stage: 枢府罢权与风波狱
    stage_order: 21
    title: 岁暮狱不成，檜手书小纸付狱，飞死，时年三十九
    date:
      text: 绍兴十一年岁暮（公历已入1142年初）
      year: 1142
      precision: 约
    place: 临安大理寺狱
    summary: 飛坐繫兩月無可證者。或教禼以臺章所指淮西事為言，傅會其獄。嵗暮，獄不成，檜手書小紙付獄，即報飛死，時年三十九。雲棄市。籍家貲徙家嶺南，幕屬于鵬等從坐者六人。狱中大理寺丞李若樸何彥猷大理卿薛仁輔並言飛無罪俱被劾，宗正卿士㒟請以百口保飛亦劾竄死，布衣劉允升上書訟冤下棘寺以死。
    confidence: 存疑
    dispute: 本传仅记「嵗暮」不系日；绍兴十一年农历岁暮换算公历已在1142年初（通行作1142年1月末），L1卒年1142与此闭合；赐死的具体方式本传不载细节。
    source_ids: [src-songshi-vol365]
  - stage: 枢府罢权与风波狱
    stage_order: 22
    title: 韩世忠诣桧诘实：「莫须有」三字何以服天下
    date:
      text: "1141年末—1142年初，狱案将上之时"
      year: 1141
      range_end: 1142
      precision: 范围
    place: 临安
    summary: 獄之將上也，韓世忠不平，詣檜詰其實，檜曰：「飛子雲與張憲書雖不明，其事體莫須有。」世忠曰：「『莫須有』三字，何以服天下？」——「莫须有」自此成为中国法律史上冤狱的代名词。時洪皓在金國中蠟書馳奏，以為金人所畏服者惟飛至以父呼之，諸酋聞其死酌酒相賀。
    source_ids: [src-songshi-vol365]
  - stage: 枢府罢权与风波狱
    stage_order: 23
    title: 身后平反：孝宗复官改葬，谥武穆，追封鄂王
    date:
      text: 孝宗即位初复官改葬；淳熙六年(1179)謚武穆；嘉定四年(1211)追封鄂王
      year: 1162
      range_end: 1211
      precision: 范围
    place: 临安、鄂州
    summary: 檜死后议复飛官，万俟禼犹沮之；太學生程宏圖上書訟冤，故部曲合辭訟之哭聲雷震。孝宗詔復飛官以禮改葬賜錢百萬求其後悉官之，建廟於鄂號忠烈。淳熙六年謚武穆，嘉定四年追封鄂王。
    confidence: 存疑
    dispute: 本传止于「追封鄂王」；后世通称的「改諡忠武」（宝庆间）不见于本传，属本传之外文献层，本卷不作为本传事实著录。
    source_ids: [src-songshi-vol365]

works:
  # 三件作品文本均实取维基文库单篇页（简体转录自页面繁体原文，通行本层）；
  # 单篇页来源未登记前暂挂 src-songshi-vol365，建议主会话新增登记后翻转。
  - work_id: manjianghong-nufachongguan-xiehuai
    title: 满江红·怒发冲冠
    alt_titles: [满江红·写怀]
    genre: 词（慢词）
    date:
      text: 创作年代无定说；若为岳作当系绍兴间，若为明人拟托则系明中期以后
      precision: 未知
    place: ""
    context: 怒发冲冠凭栏处潇潇雨歇起笔，三十功名尘与土八千里路云和月，靖康耻犹未雪臣子恨何时灭，待从头收拾旧山河朝天阙——中国传播度最高的爱国词。
    attribution: 存疑
    excerpt: 怒发冲冠，凭阑处、萧萧雨歇。擡望眼，仰天长啸，壮怀激烈。……三十功名尘与土，八千里路云和月。……靖康耻，犹未雪；臣子恨，何时灭？……待从头、收拾旧山河，朝天阙。
    text_display: excerpt
    themes: [报国, 靖康之愤, 收复]
    influence: 国民记忆层面的第一爱国词，其著作权公案本身也成为学术史名案。
    confidence: 有争议
    dispute: 著作权公案：此词宋代文献无征，明代始见于著录；维基文库单篇页自身标注「此詞是否為岳飛作，未有定論。一說為明人假借岳飛之名而作」，并注「約明中後期『金』改为『天』」。近现代学界余嘉锡、夏承焘等主明代说（贺兰山方位、岳飞孙辈未辑此词等为疑点），另有学者力主岳作说，双方论辩至今未决——本卷按近现代学术层中立转述双方立场，不引现代原文，attribution 著录为存疑。
    source_ids: [src-manjianghong]

  - work_id: xiaochongshan-zuoye-hanqun-buzhu-ming
    title: 小重山·昨夜寒蛩不住鸣
    alt_titles: []
    genre: 词（小令）
    date:
      text: 创作年代无定说，多系于绍兴和议前后
      year: 1138
      range_end: 1141
      precision: 范围
    place: ""
    context: 昨夜寒蛩不住鸣惊回千里梦已三更，欲將心事付瑤琴知音少弦斷有誰聽——与其豪迈公共形象相对的幽独一面，主战者孤怀无人可诉的心声。
    attribution: 确凿
    excerpt: 昨夜寒蛩不住鸣。惊回千里梦，已三更。起来独自绕阶行。人悄悄，帘外月胧明。白首为功名。旧山松竹老，阻归程。欲将心事付瑶琴。知音少，弦断有谁听？
    text_display: full
    themes: [孤怀, 知音难觅, 归乡受阻]
    influence: 岳飞传世词中最可靠的一首，展示其词风的另一极，常与满江红对读。
    confidence: 确定
    dispute: 归属争议较满江红为少（本卷从通行较可靠说著录为确凿）；惟文本仍赖明代以降辑本传世，异文有瑶琴/瑶筝两系（明陈耀文花草稡编清朱彝尊词综及钦定四库全书岳武穆遗文作瑶琴，历代诗馀引陈郁藏一话腴作瑶筝——文库页注实取），系年只能框定于和议前后。
    source_ids: [src-xiaochongshan-yuefei]

  - work_id: chizhou-cuiweiting
    title: 池州翠微亭
    alt_titles: []
    genre: 诗（七言绝句）
    date:
      text: 创作年代无定说，多系于绍兴间驻军沿江时期
      year: 1134
      range_end: 1141
      precision: 范围
    place: 池州翠微亭
    context: 经年塵土滿征衣特特尋芳上翠微，好水好山看不足馬蹄催趁月明歸——戎马间隙的山水一瞥，武人诗中难得的明快之作。
    attribution: 存疑
    excerpt: 经年尘土满征衣，特特寻芳上翠微。好水好山看不足，马蹄催趁月明归。
    text_display: full
    themes: [军旅间隙, 山水]
    influence: 岳飞传世诗作的代表，与经年塵土滿征衣的自画像互证其儒将气象。
    confidence: 存疑
    dispute: 此诗不见于宋元早期文献著录，赖明人所辑岳飞佚诗文一系文本传世（维基文库单篇页署南宋岳飞）；归属学界一般采信但无宋刻实证，故按存疑著录，系年仅能框定于驻军沿江时期。
    source_ids: [src-chizhou-cuiweiting]

