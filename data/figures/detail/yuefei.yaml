  - era: 同时代
    evaluator: 金人与两河军民
    quote: 撼山易，撼岳家军难；俟岳家军来即降；金人所畏服者惟飞，至以父呼之。
    text_display: excerpt
    comment: 敌我两方的口碑并见本传——金军将士私语岳爺爺軍争来降附，金帅乌陵思谋诫其下俟岳家军来即降；洪皓自金国蜡书驰奏金人所畏服者惟飞，诸酋闻其死酌酒相贺。对手的畏惧是军事人物同时代评价的最高形态。
    source_ids: [src-songshi-vol365]
  - era: 历代批评
    evaluator: 《宋史》史臣论赞（元代修史）
    quote: 求其文武全器、仁智并施如宋岳飛者，一代豈多見哉。……忠義之言，流出肺腑，真有諸葛孔明之風，而卒死於秦檜之手。……高宗忍自棄其中原，故忍殺飛，嗚呼冤哉！嗚呼冤哉！
    text_display: excerpt
    comment: 卷末论赞将其置于韩彭绛灌之上而比迹关张诸葛，并以檀道济自坏长城为喻直指高宗之忍——正史层面责任表述的双向定位（论赞兼责高宗与檜），为历代评价的权威底本。
    source_ids: [src-songshi-vol365]
  - era: 历代批评
    evaluator: 宋廷平反与谥号变迁层（孝宗诏、忠烈庙、武穆谥、鄂王封）
    quote: ""
    text_display: none
    comment: 孝宗诏复飞官以礼改葬建庙于鄂号忠烈，淳熙六年谥武穆，嘉定四年追封鄂王（均本传明文）；其后改谥忠武不见于本传，属更晚文献层（转述存疑）。后世武庙从祀、历代鄂王庙祀与《金佗稡编》（岳珂籲天辯誣集系统，本传附传明载其御札辩验汇次事迹）构成的官方与家族双重纪念体系，本卷以转述为主，未逐一实取原文献。
    confidence: 存疑
    dispute: 改谥忠武（宝庆间）与武庙从祀的具体年分均非本传所载，本卷按后世文献层转述，未实取原始诏令文本。
    source_ids: [src-songshi-vol365]
  - era: 近现代学术
    evaluator: 学界综述
    quote: ""
    text_display: none
    comment: 近现代研究两大焦点均为学术公案——其一，郾城战史与拐子马制度的考释（重铠贯索三人相联的战术含义有专门商榷），以及朱仙镇之战真伪之辨（主流意见倾向岳珂系统增饰说，亦有异见）；其二，满江红著作权论战（明代说与岳作说长期对垒，详见works条dispute）。另有《金佗稡编》史料层次的文献学研究（家传碑志与官文书互校）。上述均按近现代学术层中立转述双方立场，不引现代原文，具体论著引文须取得许可后补入。
    source_ids: [src-songshi-vol365]
  - era: 教科书与公共文化
    evaluator: 通用语文教育与大众传播
    quote: ""
    text_display: none
    comment: 精忠报国的国民记忆层——注意分层：本传背刺原文为尽忠报国四大字，精忠出自高宗手书精忠岳飞旗，二者在流传中被混同为精忠报国并完成符号化；满江红入选教材与大众读本，岳王庙跪像与还我山河题字成为公共记忆装置。教材篇目随学期变动，录入时须另行核验当期版本。
