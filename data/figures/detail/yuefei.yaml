  summary: 南宋中兴诸将之首，农家出身以列校拔起的一代军事家——治军严明（冻死不拆屋饿死不掳掠）、用兵存乎一心，收复襄汉六郡、郾城大破拐子马、连结河朔谋恢复；绍兴十年北伐功败垂成于十二道金字牌，绍兴十一年岁暮被赐死于大理寺狱，年三十九，狱成于「莫须有」三字；孝宗时平反改葬，谥武穆，后追封鄂王，成为中国历史上精忠符号与悲剧名将的双重原型。

timeline:
  # ── 阶段一：汤阴农家与四次从军 ──────────────────────────────
  - stage: 汤阴农家与四次从军
