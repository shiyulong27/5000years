# 王维全景详卷（schema v1）
# 史料审计表（TASK-003 批次一；来源见 data/sources.yaml）：
#
# | 事实点 | 旧唐书·文苑下(J) | 新唐书·文艺中(X) | 结论与置信 |
# |---|---|---|---|
# | 籍贯家世 | 太原祁人，父处廉终汾州司马，徙家于蒲遂为河东人 | 无详载 | 确定(J) |
# | 及第 | 开元九年进士擢第 | 开元初擢进士，调太乐丞 | 两书系年互异；「状元」说出自《集异记》小说不采 |
# | 早贬 | 未载贬因 | 坐累为济州司仓参军 | 确定(X)；坐伶人舞黄狮子事出《集异记》层存疑 |
# | 擢右拾遗 | 历右拾遗 | 张九龄执政擢右拾遗 | 确定；系年约735为通说 |
# | 出塞 | 未载 | 使至塞上（监察御史）未明言 | 通说据本诗集年，737慰军凉州，存疑 |
# | 丧妻 | 妻亡不再娶 | 丧妻不娶孤居三十年 | 确定；丧妻年份无载，推约730前后 |
# | 母丧居敬 | 居母丧柴毁骨立殆不胜丧 | 母丧毁几不生；母亡表辋川第为寺 | 确定 |
# | 辋川别业 | 得宋之问蓝田别墅在辋口，与裴迪浮舟往来 | 别墅在辋川有华子冈欹湖竹里馆等，与裴迪赋诗相酬 | 确定 |
# | 陷贼 | 为贼所得服药取痢伪称瘖病，拘普施寺迫伪署 | 同（文字小异） | 确定 |
# | 凝碧池诗 | 潜为诗万户伤心生野烟 | 赋诗悼痛（文异） | 确定；诗句文本从J |
# | 免罪 | 缙请削己刑部侍郎以赎，责授太子中允 | 缙位已显请削官赎维罪 | 确定 |
# | 卒年 | 乾元二年(759)七月卒 | 上元初卒，年六十一(→761) | 两史矛盾→主流从X推701-761，J说存疑记录 |
# | 临终 | 索笔作别缙书与亲故别书数幅舍笔而绝 | 作书与别遗亲故书数幅停笔而化 | 确定（措辞互异） |
# | 身后 | 代宗命缙辑得四百余篇 | 宝应中代宗语缙取诗；赠秘书监(X) | 确定 |
#
