    place: 金华
    summary: 打马图序自述：易安居士亦自临安泝流涉岩滩之险抵金华卜居陈氏第，乍释舟楫而见轩窗意颇释然。同期武陵春风住尘香花已尽：只恐双溪舴艋舟载不动许多愁——金华时期的自述与词作互证其行迹心境。
    confidence: 存疑
