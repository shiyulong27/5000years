    date:
      text: "1101年"
      year: 1101
      precision: 精确
    place: 汴京
    summary: 后序自述：余建中辛巳，始归赵氏。时先君作礼部员外郎，丞相作吏部侍郎，侯年二十一，在太学作学生。十八岁嫁二十一岁的太学生赵明诚，两家父祖同朝，此为她一生叙事的起点。
    source_ids: [src-jinshilu-houxu]
  - stage: 归赵氏与青州屏居
    stage_order: 5
    title: 质衣市碑相国寺，葛天氏之民
    date:
      text: "1101—1102年之间"
      year: 1101
      range_end: 1102
      precision: 范围
    place: 汴京相国寺
    summary: 赵、李族寒，素贫俭。每朔望谒告出，质衣取半千钱，步入相国寺，市碑文果实归；相对展玩咀嚼，自谓葛天氏之民也——典衣买碑文的清贫之乐，是她亲笔写下的新婚图景。
    source_ids: [src-jinshilu-houxu]
  - stage: 归赵氏与青州屏居
    stage_order: 6
    title: 徐熙牡丹图二十万钱，留信宿而还之
    date:
      text: 崇宁间
      year: 1102
      range_end: 1106
      precision: 范围
    place: 汴京
    summary: 后序记崇宁间有人持徐熙牡丹图求钱二十万，夫妇留信宿计无所出而还之，相向惋怅者数日。收藏之癖已成，而财力不逮，自述细节宛然。
    source_ids: [src-jinshilu-houxu]
  - stage: 归赵氏与青州屏居
    stage_order: 7
    title: 屏居青州十年，归来堂赌书泼茶
    date:
      text: 约1107—1121年之间
      year: 1107
      range_end: 1121
      precision: 范围
    place: 青州
    summary: 后屏居乡里十年……每饭罢坐归来堂烹茶，指堆积书史言某事在某书某卷第几页第几行，以中否角胜负为饮茶先后，中即举杯大笑至茶倾覆怀中反不得饮而起。甘心老是乡矣——赌书泼茶成为中国文人夫妇生活的千古典范意象。
    confidence: 存疑
    dispute: 屏居起讫年份系学界据崇宁间政局与赵挺之身故等推定，后序仅言十年不系年。
    source_ids: [src-jinshilu-houxu]
  - stage: 归赵氏与青州屏居
    stage_order: 8
    title: 连守两郡，夜尽一烛勘校题跋
    date:
