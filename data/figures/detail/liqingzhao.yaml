reception:
  - era: 同时代
    evaluator: 王灼《碧鸡漫志》（宋人记载层）
    quote: 作长短句能曲折尽人意，轻巧尖新，姿态百出，闾巷荒淫之语，肆意落笔，自古搢绅之家能文妇女，未见如此无顾籍也。
    text_display: excerpt
    comment: 同时代人最激烈的贬评，同条又称其自少年便有诗名才力华赡逼近前辈、在本朝妇人为词采第一——毁誉同源，恰见其突破时代规范的程度；同条并载再嫁讼离之说，属本案核心宋人记载。维基文库碧鸡漫志卷2实取。
    confidence: 确定
    source_ids: [src-bijimanzhi-vol2]
  - era: 同时代
    evaluator: 胡仔《苕溪渔隐丛话》（宋人记载层，转引）
    quote: 近时妇人能文词如李易安，颇多佳句，如云绿肥红瘦，此语甚新。
    text_display: excerpt
    comment: 生前词名的同时代正面证据，本条经唐宋诸贤绝妙词选等转引实取；苕溪渔隐并载其再适张汝舟有启事上綦处厚之说，是再嫁案的另一路宋人来源。
    confidence: 存疑
    dispute: 丛话原书条目未直接实取，属可靠转引；再嫁相关记载互有矛盾。
    source_ids: [src-licizhaoji]
  - era: 历代批评
    evaluator: 「易安体」之称与沈谦《填词杂说》等宗主之说（后世追认层）
    quote: ""
    text_display: none
    comment: 宋人已有以易安体名其词者（侯寘、辛弃疾词中曾效易安体，属转述）；清沈谦填词杂说有婉约以易安为宗之目，王士禛称婉约以易安为宗豪放惟幼安称首——婉约之宗与千古第一才女皆为后世追认的评价框架，非当时封号，故置接受史而不入 profile。沈谦原文本次未实取，按转述著录。
    confidence: 存疑
    dispute: 易安体具体所指宋人语焉不详；宗主说为清人词统建构的一部分。
    source_ids: []
  - era: 历代批评
    evaluator: 吴衡照《莲子居词话》与俞正燮（后世考证层）
    quote: 易安居士再适张汝舟，卒至对簿……宋人说部多载其事，大抵彼此衍袭，未可尽信。
    text_display: excerpt
    comment: 清人对再嫁公案的系统怀疑始于梁绍壬、俞正燮等辨诬一路，莲子居词话明言宋人说部彼此衍袭未可尽信；本条维基文库莲子居词话实取。俞正燮易安居士事迹辑及其后考辨为辩诬说的代表作，属清代考证层，不能推翻宋人记载但确立了两案并存的格局。
    confidence: 确定
    source_ids: []
  - era: 近现代学术
    evaluator: 学界综述
    quote: ""
    text_display: none
    comment: 近现代研究三大议题——词史地位（词别是一家理论的词体论价值与易安体的艺术独创）、漱玉词版本源流（宋史艺文志著录易安居士文集七卷易安词六卷今均佚，今本漱玉词为后人辑本）、再嫁公案的现代重审（20世纪学者多回到宋人记载可信说，辩诬说渐弱）。具体论著引文须取得许可后补入，暂作中立转述。
    source_ids: []
  - era: 教科书与公共文化
    evaluator: 通用语文教育与大众传播
    quote: ""
    text_display: none
    comment: 如梦令两首、声声慢、夏日绝句、醉花阴等长期入选两岸语文教材与读本（声声慢并列为香港中学文凭考试指定文言篇章，维基文库页面分类可证）；千古第一才女的称号属公共文化追认。教材篇目随学期变动，录入时须另行核验当期版本。
    source_ids: [src-licizhaoji]
  - era: 影视与网络
    evaluator: 大众传播综述
    quote: ""
    text_display: none
    comment: 影视剧中的李清照形象多围绕其爱情与南渡叙事敷演，不作信史依据；网络传播集中于绿肥红瘦、怎一个愁字了得、生当作人杰等名句，暂无可靠专门条目可引。
    source_ids: []

