    title: 再嫁张汝舟、讼而离之（宋人记载，历来有争）
    date:
      text: 绍兴二年（1132）前后
      year: 1132
      precision: 约
    place: 临安
    summary: 宋人记载层：《建炎以来系年要录》卷58载右承奉郎监诸军审计司张汝舟属吏，以汝舟妻李氏讼其妄增举数入官也，其后有司当汝舟私罪徒诏除名柳州编管，李氏格非女能为歌词自号易安居士；王灼碧鸡漫志称赵死再嫁某氏讼而离之晚节流荡无归。宋代记载互有出入，同时已有辩诬之说；清代俞正燮作系统考辨主辩诬说，近现代学界两说并存。
    confidence: 存疑
    dispute: 本卷按「宋人记载层+后世争议」双层著录，不作定论亦不隐去。要点：其一，李清照自述性文字（金石录后序及投内翰綦公崇礼启之外的自述）均不载此事；其二，系年要录讼事条目通行引文多标卷88，本次维基文库卷88实取全文未见该条，实际见于卷58（绍兴二年九月至十月），引用时应以卷58为准；其三，俞正燮辩诬说属清代考证层而非宋代证据，不能反向推翻宋人记载，只说明此案自古有争。
