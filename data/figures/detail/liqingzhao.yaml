works:
  - work_id: ru-meng-ling-chang-ji-xi-ting
    title: 如梦令·常记溪亭日暮
    alt_titles: []
    genre: 词（小令）
    date:
      text: 约1099年，少女时期（编者推定）
      year: 1099
      precision: 约
    place: 济南一带
    context: 少女溪亭醉游迷路的即景小品，争渡争渡惊起一滩鸥鹭，以动破静收束，天真烂漫。
    attribution: 确凿
    excerpt: 常记溪亭日暮，沉醉不知归路。兴尽晚回舟，误入藕花深处。争渡，争渡，惊起一滩鸥鹭。
    text_display: full
    themes: [少女情怀, 游冶, 夏景]
    influence: 其前期词的名片之作，与昨夜雨疏风骤并为国民级如梦令双璧。
    confidence: 存疑
    dispute: 词作归属无争；系年与地点系编者推定。
    source_ids: [src-licizhaoji]

  - work_id: ru-meng-ling-zuo-ye-yu-shu
    title: 如梦令·昨夜雨疏风骤
    alt_titles: []
    genre: 词（小令）
    date:
      text: 约1100年前后（编者推定）
      year: 1100
      precision: 约
    place: ""
    context: 卷帘人与海棠依旧的一问一答，绿肥红瘦四字以人拟花翻出新警，宋人已激赏此语甚新。
    attribution: 确凿
    excerpt: 昨夜雨疏风骤，浓睡不消残酒。试问卷帘人，却道海棠依旧。知否，知否？应是绿肥红瘦。
    text_display: full
    themes: [惜春, 伤花, 白描对话]
    influence: 绿肥红瘦成为炼字典范，入选历代词选与语文教材。
    source_ids: [src-licizhaoji]

  - work_id: zui-hua-yin-bo-wu-nong-yun
    title: 醉花阴·薄雾浓云愁永昼
    alt_titles: [醉花阴·九日]
    genre: 词（小令）
    date:
      text: 前期重阳寄外之作，创作年代无定说
      precision: 未知
    place: ""
    context: 重阳怀人，结拍莫道不销魂帘卷西风人比黄花瘦，以菊喻人清瘦入骨。宋人笔记层流传元祐诸家苦思胜之不得的传说，不足为信史。
    attribution: 确凿
    excerpt: 薄雾浓云愁永昼，瑞脑销金兽。……莫道不销魂，帘卷西风，人比黄花瘦。
    text_display: excerpt
    themes: [重阳, 相思, 咏菊]
    influence: 人比黄花瘦为千古名句，帘卷西风一句归属无争议。
    confidence: 存疑
    dispute: 词句归属确凿；宋人所传赵明诚闭门三日填词五十阕杂之而终不及的竞胜本事属笔记传说层，不可为据。
    source_ids: [src-licizhaoji]

  - work_id: yi-jian-mei-hong-ou-xiang-can
    title: 一剪梅·红藕香残玉簟秋
    alt_titles: [一剪梅·别愁]
    genre: 词（小令）
    date:
      text: 前期别后相思之作，创作年代无定说
      precision: 未知
    place: ""
    context: 此情无计可消除才下眉头却上心头，将无形相思写成可掬可挪之物，缠而不靡。
    attribution: 确凿
    excerpt: 花自飘零水自流。一种相思，两处闲愁。此情无计可消除，才下眉头，却上心头。
    text_display: excerpt
    themes: [离情, 相思]
    influence: 才下眉头却上心头为婉约情语的教科书级范本。
    source_ids: [src-licizhaoji]

  - work_id: yu-jia-ao-tian-jie-yun-tao
    title: 渔家傲·天接云涛连晓雾
    alt_titles: [渔家傲·记梦]
    genre: 词（长调记梦）
    date:
      text: 创作年代无定说
      precision: 未知
    place: ""
    context: 记梦境而直叩天语：我报路长嗟日暮学诗谩有惊人句，九万里风鹏正举——以庄周鹏翼自壮，豪气逼人，历来视为漱玉词中的别调。
    attribution: 确凿
    excerpt: 天接云涛连晓雾，星河欲转千帆舞。……我报路长嗟日暮，学诗谩有惊人句。九万里风鹏正举。风休住，蓬舟吹取三山去！
    text_display: excerpt
    themes: [记梦, 怀才之叹, 豪放气象]
    influence: 清人梁启超谓其绝似苏辛派不类漱玉集中语，是论其词风多样性的常引证据（转述层）。
    confidence: 确定
    source_ids: [src-licizhaoji]

  - work_id: sheng-sheng-man-xun-xun-mi-mi
    title: 声声慢·寻寻觅觅
    alt_titles: [声声慢·秋情]
    genre: 词（慢词）
    date:
      text: 南渡后晚年之作，创作年代无定说
      year: 1129
      range_end: 1155
      precision: 范围
    place: ""
    context: 开篇十四叠字寻寻觅觅冷冷清清凄凄惨惨戚戚，前无古人；这次第怎一个愁字了得，以口语收束万钧之愁，晚期词风的极诣。
    attribution: 确凿
    excerpt: 寻寻觅觅，冷冷清清，凄凄惨惨戚戚。……梧桐更兼细雨，到黄昏、点点滴滴。这次第，怎一个愁字了得！
    text_display: excerpt
    themes: [孤寂, 国破家亡之痛, 叠字艺术]
    influence: 十四叠字为汉语音乐性的巅峰实验，历代和者畏其难，清人有独不敢次此篇恐为妇人所笑之语。
    confidence: 存疑
    dispute: 系年只能框定在南渡之后，确切年份地点无考；文本异文较多（晚来风急/晓来风急等）。
    source_ids: [src-licizhaoji]

  - work_id: wu-ling-chun-feng-zhu-chen-xiang
    title: 武陵春·风住尘香花已尽
    alt_titles: []
    genre: 词（小令）
    date:
      text: 约绍兴四年冬至五年（1134—1135），避乱金华时期
      year: 1134
      range_end: 1135
      precision: 范围
    place: 金华双溪
    context: 物是人非事事休欲语泪先流，结拍只恐双溪舴艋舟载不动许多愁，把愁写成有重量的实物，金华流寓的心境实录。
    attribution: 确凿
    excerpt: 风住尘香花已尽，日晚倦梳头。物是人非事事休，欲语泪先流。闻说双溪春尚好，也拟泛轻舟。只恐双溪舴艋舟，载不动许多愁。
    text_display: full
    themes: [流寓, 春愁, 家国之痛]
    influence: 载不动许多愁为以虚为实的千古愁句。
    confidence: 存疑
    dispute: 系年从金华说为主流，亦有异说。
    source_ids: [src-licizhaoji]

  - work_id: yong-yu-le-luo-ri-rong-jin
    title: 永遇乐·落日熔金
    alt_titles: [永遇乐·元宵]
    genre: 词（慢词）
    date:
      text: 南渡后晚年所作，创作年代无定说
      precision: 未知
    place: 临安
    context: 以中州盛日的闺门三五对照如今的憔悴霜鬓，帘儿底下听人笑语，热闹中的自我放逐，南宋元宵词的压卷之作。
    attribution: 确凿
    excerpt: 落日熔金，暮云合璧，人在何处。……如今憔悴，风鬟霜鬓，怕见夜间出去。不如向、帘儿底下，听人笑语。
    text_display: excerpt
    themes: [元宵, 今昔之感, 流寓孤独]
    influence: 南宋末刘辰翁读此词为之涕下并有和李清照永遇乐之作，足证其跨时代的感染力（转述层）。
    confidence: 存疑
    dispute: 创作年份无定说。
    source_ids: [src-licizhaoji]

  - work_id: wu-jiang-sheng-dang-zuo-ren-jie
    title: 乌江（夏日绝句）
    alt_titles: [夏日绝句]
    genre: 诗（七绝）
    date:
      text: 建炎中南渡期间，具体年份无确考
      year: 1127
      range_end: 1129
      precision: 范围
    place: 乌江（项羽自刎处，今安徽和县，行旅说）
    context: 生当作人杰死亦为鬼雄，至今思项羽不肯过江东。借项羽宁死不屈讽南宋朝廷仓皇南逃，巾帼之笔有金石之声。
    attribution: 确凿
    excerpt: 生当作人杰，死亦为鬼雄。至今思项羽，不肯过江东。
    text_display: full
    themes: [咏史, 讽刺时政, 节烈之气]
    influence: 与其婉约词风构成巨大张力，是「巾帼不让须眉」人格形象的核心文本，入选教材层。
    confidence: 存疑
    dispute: 乌江行旅说系据诗题与其夫建康—江淮行迹推断（inferred），作年与是否过乌江均无原始记载。
    source_ids: [src-licizhaoji]

  - work_id: ci-lun-bie-shi-yi-jia
    title: 词论
    alt_titles: []
    genre: 词学专论
    date:
      text: 晚年整理平生词学见解而成，作年无定说
      precision: 未知
    place: ""
    context: 历数唐五代至本朝词家得失，直评柳永词语尘下、晏殊欧阳修苏轼皆句读不葺之诗尔又往往不协音律，提出词别是一家的本体主张——中国文学批评史上第一篇女性词学专论。
    attribution: 确凿
    excerpt: 乃知词别是一家，知之者少。
    text_display: excerpt
    themes: [词体独立, 音律本位, 批评胆识]
    influence: 别是一家成为词体论的纲领性表述；其遍诋诸家的锋芒引发历代聚讼。
    confidence: 存疑
    dispute: 今本经苕溪渔隐丛话等宋人类书征引辑存，文本完整性与真伪有学术讨论；对苏轼等的批评是词学立场之争而非私怨。
    source_ids: [src-licizhaoji]

  - work_id: jin-shi-lu-hou-xu
    title: 金石录后序
    alt_titles: []
    genre: 散文（序跋）
    date:
      text: "1132年（绍兴二年玄黓岁壮月）自题"
      year: 1132
      precision: 精确
    place: 杭州
    context: 为亡夫赵明诚金石录三十卷所作后序，实为一篇自传性散文：由质衣市碑到赌书泼茶，再到靖康煨烬池阳诀别洪州云烟，得之艰而失之易的浩叹贯穿始终。
    attribution: 确凿
    excerpt: 余自少陆机作赋之二年，至过蘧瑗知非之两岁，三十四年之间，忧患得失，何其多也！然有有必有无，有聚必有散，乃理之常。
    text_display: excerpt
    themes: [自述生平, 图书聚散, 生死之恸]
    influence: 散文史上的名篇，更是其生平研究无可替代的第一手文献；宋人瑞桂堂暇录已称使人叹息。
    source_ids: [src-jinshilu-houxu]

