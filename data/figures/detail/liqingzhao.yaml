    summary: 后序：连守两郡，竭其俸入以事铅椠。每获一书即同共勘校整集签题……夜尽一烛为率。故能纸札精致字画完整冠诸收书家。莱淄二州守郡时期是赵氏金石书画收藏的鼎盛期，亦是夫妻同校共跋的最后安稳岁月。
    confidence: 存疑
