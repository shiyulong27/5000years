      year: 806
      range_end: 820
      precision: 范围
    evidence: 旧唐书本传全文转录元稹论李杜优劣：至于子美盖所谓上薄风骚下该沈宋言夺苏李气吞曹刘掩颜谢之孤高杂徐庾之流丽尽得古今之体势而兼人人之所独专矣……诗人已来未有如子美者；并称自后属文者以稹论为是。全唐诗小传记迁葬时元稹志其墓。
    source_ids: [src-jts-vol190b, src-qts-dufu]
