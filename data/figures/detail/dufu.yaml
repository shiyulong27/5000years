reception:
  - era: 同时代
    evaluator: 元稹《唐故工部员外郎杜君墓系铭并序》（旧唐书本传全文转录）
    quote: 至于子美，盖所谓上薄风骚，下该沈宋，言夺苏李，气吞曹刘，掩颜谢之孤高，杂徐庾之流丽，尽得古今之体势，而兼人人之所独专矣。……诗人已来，未有如子美者。
    text_display: excerpt
    comment: 同时代人给出的最高定位，诗人以来未有如子美者成为杜甫评价史的基石；本文经维基文库旧唐书卷190下实取得手，无需另行转述。
    source_ids: [src-jts-vol190b]
  - era: 历代批评
    evaluator: 《新唐书》杜甫赞（宋祁）
    quote: 至甫，浑涵汪茫，千汇万状，兼古今而有之，它人不足，甫乃厌余，残膏剩馥，沾丐后人多矣。……甫又善陈时事，律切精深，至千言不少衰，世号诗史。
    text_display: excerpt
    comment: 诗史之称的正史出处；赞语同时引韩愈李杜文章在光焰万丈长为佐证。
    source_ids: [src-xts-vol201]
  - era: 历代批评
    evaluator: 秦观
    quote: ""
    text_display: none
    comment: 秦观韩愈论中有杜子美者穷高妙之格极豪逸之气包冲淡之趣峻洁之姿备藻丽之态而诸家之作所不及焉、比之孔子所谓集大成之说，为集大成论的代表性表述；本次未在维基文库实取原文，按中立转述层著录，引文待核后补。
    confidence: 存疑
    source_ids: []
  - era: 近现代学术
    evaluator: 学界综述
    quote: ""
    text_display: none
    comment: 近现代研究将其定位为中国现实主义诗歌的高峰与集大成者，聚焦其编年系谱重建、律诗艺术、诗史互证方法及安史之乱书写等议题；具体论著引文须取得许可后补入，本卷暂作中立转述。
    source_ids: []
  - era: 教科书与公共文化
    evaluator: 通用语文教育与大众传播
    quote: ""
    text_display: none
    comment: 春望石壕吏茅屋为秋风所破歌望岳登高等长期入选中小学语文教材；诗圣与民间疾苦笔底波澜的形象成为中华文化符号。教材篇目随学期变动，录入时须另行核验当期版本。
    source_ids: []
  - era: 影视与网络
    evaluator: 大众传播综述
    quote: ""
    text_display: none
    comment: 影视剧中的杜甫形象多为安史之乱叙事与李杜友谊的戏剧化敷演，不作信史依据；网络传播集中于其名句与成都草堂等纪念空间，暂无可靠专门条目可引。
    source_ids: []

