    summary: 新唐书载召补京兆功曹参军不至——朝廷再给仕途机会而不赴，可见其对朝局与自身处境的判断。旧唐书作久之召补京兆府功曹。
    confidence: 存疑
    dispute: 征召年份系据徐知道乱后行迹推定。
    source_ids: [src-xts-vol201, src-jts-vol190b]
  - stage: 成都草堂与梓阆飘泊
    stage_order: 18
    title: 严武表为参谋，检校工部员外郎
    date:
      text: 约764年（广德二载）
      year: 764
      precision: 约
    place: 成都
    summary: 会严武节度剑南东西川往依焉，武再帅剑南表为参谋检校工部员外郎（《新唐书》）；旧唐书作上元二年冬严武镇成都奏为节度参谋检校尚书工部员外郎赐绯鱼袋。杜工部之称即源于此官。
    confidence: 存疑
    dispute: 两书系年均压缩失次：参谋之任实在严武广德二年（764）再镇剑南时，旧唐书上元二年（761）说与之矛盾，从严武再镇之年。
    source_ids: [src-xts-vol201, src-jts-vol190b]
  - stage: 成都草堂与梓阆飘泊
    stage_order: 19
    title: 醉登武床，幕府不协
    date:
      text: 入幕期间，约764年
      year: 764
      precision: 约
    place: 成都
    summary: 两史均记其尝醉登武床瞪视曰严挺之乃有此儿；旧唐书谓武虽急暴不以为忤，新唐书则谓武外若不为忤中衔之，一日欲杀甫及梓州刺史章彝集吏于门，武将出冠钩于帘三左右白其母奔救得止独杀彝。
    confidence: 存疑
    dispute: 严武欲杀杜甫情节为新唐书采自传闻，情理与时序均有可疑，历来考辨不休；本条仅按正史层面著录并存疑。
    source_ids: [src-jts-vol190b, src-xts-vol201]
  - stage: 成都草堂与梓阆飘泊
    stage_order: 20
    title: 严武卒，蜀中大乱，往来梓阆
    date:
      text: 约765—766年之间
      year: 765
      range_end: 766
      precision: 范围
    place: 成都、梓州、阆州、嘉州以下
    summary: 永泰元年夏武卒甫无所依，郭英乂代镇粗暴无能刺谒，乃游东蜀依高适既至而适卒，崔宁杀英乂杨子琳攻西川蜀中大乱（《旧唐书》）；新唐书作武卒崔旰等乱甫往来梓夔间。携家离蜀下峡前的飘泊期。
    source_ids: [src-jts-vol190b, src-xts-vol201]

  # ── 阶段六：夔府孤舟与湖湘终老 ──────────────
  - stage: 夔府孤舟与湖湘终老
    stage_order: 21
    title: 流寓夔州孤城
    date:
      text: 约766—768年之间
      year: 766
      range_end: 768
      precision: 范围
    place: 夔州
    summary: 新唐书往来梓夔间与出瞿唐的记载之间，即其寓居夔州近两年的创作爆发期；秋兴八首诸将五首咏怀古迹五首等律诗极诣皆成于此。寓夔起讫系据诗文自证推定。
    confidence: 存疑
    dispute: 正史对夔州时期几乎无具体记载，行迹全赖诗集编年重建。
    source_ids: [src-xts-vol201, src-qts-dufu]
  - stage: 夔府孤舟与湖湘终老
    stage_order: 22
    title: 出瞿唐，下江陵，溯沅湘
    date:
      text: 约768年
      year: 768
      precision: 约
    place: 江陵、公安、岳阳
    summary: 大历中出瞿唐下江陵溯沅湘以登衡山（《新唐书》）。出峡后以舟为家，亲朋无一字老病有孤舟即此时写照；旧唐书则记扁舟下峡未维舟而江陵乱乃泝沿湘流。
    source_ids: [src-xts-vol201, src-jts-vol190b]
  - stage: 夔府孤舟与湖湘终老
    stage_order: 23
    title: 游岳祠为大水所阻，旬日不得食
    date:
      text: 约770年
      year: 770
      precision: 约
    place: 衡山、耒阳一带
    summary: 新唐书载游岳祠大水遽至涉旬不得食县令具舟迎之乃得还；旧唐书记耒阳聂令知之自棹舟迎甫而还——生命最后一年的困厄场景。
    source_ids: [src-xts-vol201, src-jts-vol190b]
  - stage: 夔府孤舟与湖湘终老
    stage_order: 24
    title: 一夕而卒，年五十九
    date:
      text: "770年（大历五载）冬"
      year: 770
      precision: 精确
    place: 湖湘舟中（旧唐书谓卒于耒阳）
    summary: 旧唐书载永泰二年啗牛肉白酒一夕而卒于耒阳时年五十九；新唐书作令尝馈牛炙白酒大醉一昔卒年五十九。年五十九两史一致，与生于712年闭合。
    confidence: 存疑
    dispute: 死因为两史共记的牛肉白酒说，然情节近乎轶闻，历来视为传闻层存疑（另有病死长沙至耒阳间诸说）；旧唐书永泰二年纪年显误（永泰仅一年即改元大历），卒年从大历五年（770）通说。
    source_ids: [src-jts-vol190b, src-xts-vol201]
  - stage: 夔府孤舟与湖湘终老
    stage_order: 25
    title: 元和中迁柩归葬偃师首阳山
    date:
      text: 806—820年之间（元和中）
      year: 806
      range_end: 820
      precision: 范围
    place: 偃师首阳山前
    summary: 子宗武流落湖湘而卒；元和中宗武子嗣业自耒阳迁甫之柩归葬于偃师县西北首阳山之前（旧唐书）。全唐诗小传并记元稹志其墓——今存元稹墓系铭即迁葬背景下的产物。
    source_ids: [src-jts-vol190b, src-qts-dufu]

works:
  - work_id: wang-yue
    title: 望岳
    alt_titles: []
    genre: 五言古诗
    date:
      text: 约736年前后（开元二十四载后游齐赵间）
      year: 736
      precision: 约
    place: 齐赵间（遥望泰山）
    context: 壮游齐赵时期的开笔之作，岱宗夫如何齐鲁青未了起势，会当凌绝顶一览众山小收束，少年气象与盛唐气象合一。
    attribution: 确凿
    excerpt: 岱宗夫如何？齐鲁青未了。造化钟神秀，阴阳割昏晓。荡胸生曾云，决眦入归鸟。会当凌绝顶，一览众山小。
    text_display: full
    themes: [山水, 壮怀]
    influence: 咏泰山第一诗，青年杜甫的气象宣言。
    confidence: 存疑
    dispute: 系年从开元后期齐赵壮游通说，确切年份无考。
    source_ids: [src-qts-dufu]

  - work_id: fengzeng-wei-zuocheng
    title: 奉赠韦左丞丈二十二韵
    alt_titles: []
    genre: 五言古诗
    date:
      text: 约748年前后（天宝七载韦济迁尚书左丞后）
      year: 748
      precision: 约
    place: 长安
    context: 困守长安干谒期的自陈之作，读书破万卷下笔如有神与致君尧舜上再使风俗淳为其自我期许的双联；诗中原注记李林甫抑才致无一人得第之事。
    attribution: 确凿
    excerpt: 甫昔少年日，早充观国宾。读书破万卷，下笔如有神。……致君尧舜上，再使风俗淳。……骑驴三十载，旅食京华春。朝扣富儿门，暮随肥马尘。残杯与冷炙，到处潜悲辛。
    text_display: excerpt
    themes: [干谒自陈, 抱负]
    influence: 其政治理想与长安困顿生活的第一手自述。
    source_ids: [src-qts-dufu]

  - work_id: bingche-xing
    title: 兵车行
    alt_titles: []
    genre: 乐府（新题乐府）
    date:
      text: 约天宝十载（751）前后
      year: 751
      precision: 约
    place: 咸阳桥畔（纪实背景）
    context: 借行人点行之苦讽开边黩武，边庭流血成海水武皇开边意未已直刺时政，是新题乐府写时事的开山之作。
    attribution: 确凿
    excerpt: 车辚辚，马萧萧，行人弓箭各在腰。……边庭流血成海水，武皇开边意未已。……君不见青海头，古来白骨无人收。新鬼烦冤旧鬼哭，天阴雨湿声啾啾。
    text_display: excerpt
    themes: [讽喻, 反战, 乐府]
    influence: 以乐府旧体写当下时事的范式，直接启发元白新乐府运动。
    confidence: 存疑
    dispute: 系年有天宝十载用兵吐蕃说与天宝间泛指诸说，确切年份无考。
    source_ids: [src-qts-dufu]

  - work_id: tongdeng-cients
    title: 同诸公登慈恩寺塔
    alt_titles: []
    genre: 五言古诗
    date:
      text: 约752年秋（天宝十一载）
      year: 752
      precision: 约
    place: 长安慈恩寺塔
    context: 与高适薛据岑参储光羲同时登塔唱和，题注记时高适薛据先有此作。回首叫虞舜苍梧云正愁与君看随阳雁各有稻粱谋，盛世塔顶已见忧危之眼。
    attribution: 确凿
    excerpt: 高标跨苍穹，烈风无时休。自非旷士怀，登兹翻百忧。……秦山忽破碎，泾渭不可求。俯视但一气，焉能辨皇州？……君看随阳雁，各有稻粱谋。
    text_display: excerpt
    themes: [登览, 忧世]
    influence: 盛唐同题唱和中公认压卷，被视为乱前忧患意识的先声。
    source_ids: [src-qts-dufu]

  - work_id: liren-xing
    title: 丽人行
    alt_titles: []
    genre: 七言古诗（乐府）
    date:
      text: 约753年春（天宝十二载）
      year: 753
      precision: 约
    place: 长安曲江
    context: 三月三日水边丽人的工笔长卷，就中云幕椒房亲赐名大国虢与秦直指杨氏姐妹，结尾炙手可热势绝伦慎莫近前丞相嗔以冷刺收束。
    attribution: 确凿
    excerpt: 三月三日天气新，长安水边多丽人。……紫驼之峰出翠釜，水精之盘行素鳞。……炙手可热势绝伦，慎莫近前丞相嗔。
    text_display: excerpt
    themes: [讽刺, 时政]
    influence: 不着一字议论而讽刺自见的曲笔典范。
    source_ids: [src-qts-dufu]

  - work_id: zijing-fufengxian-yonghuai
    title: 自京赴奉先县咏怀五百字
    alt_titles: []
    genre: 五言古诗
    date:
      text: 755年冬（天宝十四载十二月初作，诗有原注自证）
      year: 755
      precision: 精确
    place: 自长安至奉先县道中
    context: 原注天宝十四载十二月初作——恰在安禄山反讯传到前夕。朱门酒肉臭路有冻死骨为千年阶级对照名句；入门闻号咷幼子饥已卒记幼子饿死的私痛，忧端齐终南澒洞不可掇收束全篇，被后世视为其诗史品格的总纲。
    attribution: 确凿
    excerpt: 杜陵有布衣，老大意转拙。许身一何愚，窃比稷与契。……彤庭所分帛，本自寒女出。……朱门酒肉臭，路有冻死骨。……入门闻号啕，幼子饥已卒。……忧端齐终南，澒洞不可掇。
    text_display: excerpt
    themes: [咏怀, 诗史, 社会批判]
    influence: 个人咏怀与时代记录熔于一炉的最高样本。
    source_ids: [src-qts-dufu]

  - work_id: yueye
    title: 月夜
    alt_titles: []
    genre: 五言律诗
    date:
      text: 756年秋（至德元载，陷贼长安）
      year: 756
      precision: 约
    place: 长安（陷贼中）
    context: 陷贼望月而不写己望月、反写鄜州闺中人独看，遥怜小儿女未解忆长安从对面着笔，为律诗中对写法的千古典范。
    attribution: 确凿
    excerpt: 今夜鄜州月，闺中只独看。遥怜小儿女，未解忆长安。香雾云鬟湿，清辉玉臂寒。何时倚虚幌，双照泪痕干。
    text_display: full
    themes: [思亲, 战乱]
    influence: 对写法与炼字（独看双照呼应）的经典教材。
    source_ids: [src-qts-dufu]

  - work_id: chunwang
    title: 春望
    alt_titles: []
    genre: 五言律诗
    date:
      text: 757年春（至德二载，陷贼长安）
      year: 757
      precision: 约
    place: 长安（陷贼中）
    context: 国破山河在城春草木深八字抵一部兴亡史，烽火连三月家书抵万金写乱世音书之贵，尾联白头搔更短浑欲不胜簪以身体细节收束家国之痛。
    attribution: 确凿
    excerpt: 国破山河在，城春草木深。感时花溅泪，恨别鸟惊心。烽火连三月，家书抵万金。白头搔更短，浑欲不胜簪。
    text_display: full
    themes: [战乱, 忧国]
    influence: 传播最广的唐诗之一，五律沉郁风格的代表。
    source_ids: [src-qts-dufu]

  - work_id: bei-zheng
    title: 北征
    alt_titles: []
    genre: 五言古诗
    date:
      text: 757年闰八月（至德二载，诗首句自证）
      year: 757
      precision: 精确
    place: 自凤翔至鄜州途中
    context: 墨制放往鄜州省家途中作，皇帝二载秋闰八月初吉开篇自记年月；途中所见夜深经战场寒月照白骨与到家后儿女衣百结的家国双写，末段以煌煌太宗业树立甚宏达寄中兴之望。与自京赴奉先县咏怀五百字并称双璧。
    attribution: 确凿
    excerpt: 皇帝二载秋，闰八月初吉。杜子将北征，苍茫问家室。……靡靡逾阡陌，人烟眇萧瑟。……夜深经战场，寒月照白骨。……煌煌太宗业，树立甚宏达。
    text_display: excerpt
    themes: [纪实, 家国, 中兴之望]
    influence: 五古排比纪行的巅峰，编年自证的史诗标本。
    source_ids: [src-qts-dufu, src-xts-vol201]

  - work_id: shihao-li
    title: 石壕吏
    alt_titles: [三吏之三]
    genre: 五言古诗（乐府）
    date:
      text: 759年春（乾元二载）
      year: 759
      precision: 约
    place: 陕州石壕镇
    context: 由华州赴东都道中即目所见，与潼关吏新安吏垂老别无家别新婚别同为三吏三别组诗。暮投石壕村有吏夜捉人以纯客观叙事藏批判于不言，卷217诸诗题注层系于乾元二载自华州之东都道途所感。
    attribution: 确凿
    excerpt: 暮投石壕村，有吏夜捉人。老翁逾墙走，老妇出门看。……听妇前致词：三男邺城戍。……夜久语声绝，如闻泣幽咽。天明登前途，独与老翁别。
    text_display: excerpt
    themes: [战乱民生, 叙事诗]
    influence: 中国叙事诗的白描高峰，长期入选语文教材。
    confidence: 存疑
    dispute: 系年乾元二载从通行编年及选本题注层，月份无考。
    source_ids: [src-qts-dufu]

  - work_id: xinhun-bie
    title: 新婚别
    alt_titles: [三别之一]
    genre: 五言古诗（乐府）
    date:
      text: 759年（乾元二载）
      year: 759
      precision: 约
    place: 洛阳以西道中（拟托）
    context: 三别之一，代暮婚晨别的征妇立言，兔丝附蓬麻起兴，勿为新婚念努力事戎行于私痛中翻出公义，结以人事多错迕与君永相望，代言体的极致。
    attribution: 确凿
    excerpt: 兔丝附蓬麻，引蔓故不长。嫁女与征夫，不如弃路旁。……暮婚晨告别，无乃太匆忙。……勿为新婚念，努力事戎行。……人事多错迕，与君永相望。
    text_display: excerpt
    themes: [战乱民生, 代言体]
    influence: 以小人物命运折射大战局的组诗经典。
    source_ids: [src-qts-dufu]

  - work_id: maowu-qiufeng-ge
    title: 茅屋为秋风所破歌
    alt_titles: []
    genre: 七言古诗（歌行）
    date:
      text: 761年秋（上元二年，成都）
      year: 761
      precision: 约
    place: 成都草堂
    context: 草堂为秋风所破、娇儿恶卧、床头屋漏的个人窘境，翻出安得广厦千万间大庇天下寒士俱欢颜的推己及人之愿，吾庐独破受冻死亦足收束，儒家仁者襟怀的诗化表达。
    attribution: 确凿
    excerpt: 八月秋高风怒号，卷我屋上三重茅。……床头屋漏无干处，雨脚如麻未断绝。……安得广厦千万间，大庇天下寒士俱欢颜，风雨不动安如山！呜呼！何时眼前突兀见此屋，吾庐独破受冻死亦足！
    text_display: excerpt
    themes: [济世情怀, 歌行]
    influence: 由一身之寒推及天下寒士的精神坐标，长期入选教材。
    source_ids: [src-qts-dufu]

  - work_id: qiuxing-bashou-zhiyi
    title: 秋兴八首（其一）
    alt_titles: [秋兴八首·玉露凋伤枫树林]
    genre: 七言律诗（组诗）
    date:
      text: 766年秋（大历元年，夔州）
      year: 766
      precision: 约
    place: 夔州
    context: 夔州组律八首之首章，玉露凋伤枫树林起而丛菊两开他日泪孤舟一系故园心收束于故园之念，八章以身居夔州心驰长安为总纲，为其晚年律诗结构与声情的最高成就。
    attribution: 确凿
    excerpt: 玉露凋伤枫树林，巫山巫峡气萧森。江间波浪兼天涌，塞上风云接地阴。丛菊两开他日泪，孤舟一系故园心。寒衣处处催刀尺，白帝城高急暮砧。
    text_display: full
    themes: [秋兴, 故园之思, 律诗极诣]
    influence: 七律组诗的巅峰，历代诗话推为唐人七律门径。
    source_ids: [src-qts-dufu]

  - work_id: deng-gao
    title: 登高
    alt_titles: []
    genre: 七言律诗
    date:
      text: 767年秋（大历二年重阳，夔州）
      year: 767
      precision: 约
    place: 夔州长江之滨
    context: 万里悲秋常作客百年多病独登台十四字含八重悲慨，通篇对仗精严而不见斧凿。文本据维基文库登高单篇页（录自杜工部集卷12与全唐诗卷227系统），渚清沙白鸟飞回句一作渚涛沙白鸟飞回。
    attribution: 确凿
    excerpt: 风急天高猿啸哀，渚清沙白鸟飞回。无边落木萧萧下，不尽长江滚滚来。万里悲秋常作客，百年多病独登台。艰难苦恨繁霜鬓，潦倒新停浊酒杯。
    text_display: full
    themes: [悲秋, 登览, 沉郁顿挫]
    influence: 被历代评家推为古今七律第一。
    confidence: 存疑
    dispute: 系年从夔州重阳通说。
    source_ids: [src-qts-dufu]

  - work_id: deng-yueyang-lou
    title: 登岳阳楼
    alt_titles: []
    genre: 五言律诗
    date:
      text: 768年冬（大历三年，出峡漂泊湖湘之际）
      year: 768
      precision: 约
    place: 岳阳楼
    context: 昔闻洞庭水今上岳阳楼偿愿与迟暮相对，吴楚东南坼乾坤日夜浮写洞庭之阔，而亲朋无一字老病有孤舟骤然收回孤舟一身，戎马关山北凭轩涕泗流以涕泗收束家国。
    attribution: 确凿
    excerpt: 昔闻洞庭水，今上岳阳楼。吴楚东南坼，乾坤日夜浮。亲朋无一字，老病有孤舟。戎马关山北，凭轩涕泗流。
    text_display: full
    themes: [登览, 漂泊, 忧国]
    influence: 五律境界阔大与身世之悲结合的绝唱，岳阳楼诗第一名篇。
    source_ids: [src-qts-dufu]

  - work_id: jiangnan-feng-liguinian
    title: 江南逢李龟年
    alt_titles: []
    genre: 七言绝句
    date:
      text: 约769—770年间（大历四、五年，潭州）
      year: 769
      range_end: 770
      precision: 范围
    place: 潭州
    context: 岐王宅里寻常见崔九堂前几度闻忆开元盛世，正是一年江南好风景落花时节又逢君以四十年的盛衰折叠于一句相逢之中，被誉为绝句中最含蓄深沉的一首。
    attribution: 确凿
    excerpt: 岐王宅里寻常见，崔九堂前几度闻。正是江南好风景，落花时节又逢君。
    text_display: full
    themes: [盛衰之感, 相逢]
    influence: 以个人交游写时代兴亡的绝句典范。
    confidence: 存疑
    dispute: 作年有大历五年潭州说与四载衡州潭州间说；另有学者疑非杜甫作，主流仍定为杜诗。
    source_ids: [src-qts-dufu]

