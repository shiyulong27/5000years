relations:
  - relation_type: 挚友
    target_id: libai
    direction: 双向
    period:
      text: 约744—745年相遇订交，此后终身以诗相忆
      year: 744
      precision: 约
    evidence: 新唐书本传载少与李白齐名时号李杜，尝从白及高适过汴州酒酣登吹台慷慨怀古人莫测也；旧唐书亦载天宝末诗人甫与李白齐名。诗证俱在：与李十二白同寻范十隐居（醉眠秋共被携手日同行）、春日忆李白（白也诗无敌）、冬日有怀李白、赠李白等均为实取原文。
    source_ids: [src-xts-vol201, src-jts-vol190b, src-qts-dufu]
