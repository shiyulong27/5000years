    title: 典引
    alt_titles: []
    genre: 颂赞体大赋
    date:
      text: 约79—88年之间
      year: 79
      range_end: 88
      precision: 范围
    place: 洛阳
    context: 固又作典引篇述叙汉德，以为相如封禅靡而不典扬雄美新典而不实盖自谓得其致焉——以汉承尧后续尧典自命，是班固文学自负的宣言。
