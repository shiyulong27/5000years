timeline:
  # ── 阶段一：少年安陵 ──────────────────────────────
  - stage: 少年安陵
    stage_order: 1
    title: 生于扶风安陵儒史之家
    date:
      text: "约32年"
      year: 32
      precision: 约
    place: 扶风安陵
    summary: 祖况成帝时为越骑校尉，父稚哀帝时为广平太守。生年正史不书，由本传卒时年六十一与卒于窦宪败后（永元四年，公元92年）倒推闭合。
    confidence: 存疑
    dispute: 生年32系倒推所得；而本传注引谢承书谓其十三岁时王充已见其才，奏记东平王苍又系于永平初并称始弱冠，诸点与32年生说存在十余年出入，学界有异说。
    source_ids: [src-houhanshu-vol40b]
  - stage: 少年安陵
    stage_order: 2
    title: 九岁能属文诵诗赋，长而博览九流百家
    date:
      text: 约41—55年之间
      year: 41
      range_end: 55
      precision: 范围
    place: 扶风安陵
    summary: 本传记年九岁能属文诵诗赋，及长遂博贯载籍，九流百家之言无不穷究。所学无常师，不为章句，举大义而已。性宽和容众，不以才能高人，诸儒以此慕之。
    source_ids: [src-houhanshu-vol40b]
  - stage: 少年安陵
    stage_order: 3
    title: 王充拊背预言，弱冠奏记东平王苍
    date:
      text: "约58年"
      year: 58
      precision: 约
    place: 洛阳
    summary: 注引谢承书载十三岁时王充见之拊其背谓彪曰此儿必记汉事。永平初东平王苍以至戚为骠骑将军辅政开东阁延英雄，时固始弱冠，奏记说苍劝其总览贤才为国得人，苍纳之。
    confidence: 存疑
    dispute: 奏记王苍系于永平初且称始弱冠，与生于约32年说相抵牾；王充拊背为谢承书孤证。
    source_ids: [src-houhanshu-vol40b]

