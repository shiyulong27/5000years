    date:
      text: "约62年"
      year: 62
      precision: 约
    place: 京兆（长安）
    summary: 既而有人上书显宗告固私改作国史者，有诏下郡收固系京兆狱尽取其家书。先是扶风人苏朗伪言图谶事下狱死，郡吏核考之势严峻。
    confidence: 存疑
    dispute: 下狱系年本传无载，学界通行系于永平五年前后，此处从之；罪名实为私修国史，反映东汉国史书写权未放之前提。
    source_ids: [src-houhanshu-vol40b]
  - stage: 归乡修史与京兆之狱
    stage_order: 6
    title: 弟班超驰诣阙上书，显宗奇之
    date:
      text: "约62年"
      year: 62
      precision: 约
    place: 洛阳
    summary: 弟超恐固为郡所核考不能自明，乃驰诣阙上书，得召见，具言固所著述意，而郡亦上其书。显宗甚奇之，召诣校书部——私修国史的嫌疑就此转为朝廷修史的委任。
    source_ids: [src-houhanshu-vol40b]

