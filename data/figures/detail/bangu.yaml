  - work_id: liang-du-fu
    title: 两都赋
    alt_titles: [两都赋（含明堂辟雍灵台宝鼎白雉五诗）]
    genre: 大赋（京都赋）
    date:
      text: 兰台时期，约65—79年之间
      year: 65
      range_end: 79
      precision: 范围
    place: 洛阳
    context: 关中耆老犹望朝廷西顾，固感前世相如寿王东方之徒造构文辞终以讽劝，乃上两都赋盛称洛邑制度之美以折西宾淫侈之论。设西都宾与东都主人问答，以西宾失容降阶作结。
    attribution: 确凿
    excerpt: 汉之西都，在于雍州，寔曰长安。左据函谷、二崤之阻，表以太华、终南之山。右界褒斜、陇首之险，带以洪河、泾、渭之川。华实之毛，则九州之上腴焉；防御之阻，则天下之奥区焉。
    text_display: excerpt
    themes: [京都, 礼制]
    influence: 开京都大赋范式，张衡二京赋、左思三都赋皆祖此体；赋末五诗颂明堂辟雍灵台宝鼎白雉，为东汉礼制文学的标本。
    source_ids: [src-houhanshu-vol40b]

  - work_id: you-tong-fu
    title: 幽通赋
    alt_titles: []
    genre: 骚体赋
    date:
      text: 成年早年所作，确切年份不详
      precision: 未知
    place: ""
    context: 致命遂志之作：系高颛之玄胄自叙家世，梦登山迥眺觌幽人之仿佛而究天人性命之理，乱曰保身遗名民之表兮舍生取谊以道用兮。
    attribution: 确凿
    excerpt: 系高颛之玄胄兮，氏中叶之炳灵。……魂茕茕与神交兮，精诚发于宵寐。梦登山而迥眺兮，觌幽人之髣彿。……舍生取谊，以道用兮。忧伤夭物，忝莫痛兮。
    text_display: excerpt
    themes: [性命, 自省]
    influence: 东汉述志骚体赋代表，萧统文选收录。
