    comment: 论赞褒贬并陈——既许固文赡而事详的良史之才，又记其父子讥迁是非颇谬于圣人，而责其排死节否正直、身陷大戮智及之而不能守之；这一评价框架主导了此后千年史汉优劣之争的基本议题。
