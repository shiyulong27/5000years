  - stage: 兰台著述
    stage_order: 8
    title: 受诏终成汉书，潜精积思二十余年
    date:
      text: 约66—79年之间
      year: 66
      range_end: 79
      precision: 范围
    place: 洛阳兰台
    summary: 固以为汉绍尧运以建帝业，太初以后阙而不录，故探撰前记缀集所闻以为汉书：起元高祖终于孝平王莽之诛，十有二世二百三十年，为纪表志传凡百篇。自永平中始受诏，潜精积思二十余年，至建初中乃成。当世甚重其书，学者莫不讽诵焉。
    source_ids: [src-houhanshu-vol40b]
  - stage: 兰台著述
    stage_order: 9
    title: 上两都赋，折西宾淫侈之论
    date:
      text: 约65—79年之间
      year: 65
      range_end: 79
      precision: 范围
    place: 洛阳
    summary: 时京师修起宫室浚缮城隍，而关中耆老犹望朝廷西顾。固感前世相如寿王东方之徒造构文辞终以讽劝，乃上两都赋，盛称洛邑制度之美以折西宾淫侈之论。赋末缀明堂、辟雍、灵台、宝鼎、白雉五诗。
    confidence: 存疑
    dispute: 上赋确年无载，据其为郎后遂见亲近的语境系于兰台时期。
