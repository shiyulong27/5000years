    place: 洛阳兰台
    summary: 除兰台令史，与前睢阳令陈宗、长陵令尹敏、司隶从事孟异共成世祖本纪。迁为郎，典校秘书。又撰功臣、平林、新市、公孙述事，作列传载记二十八篇奏之，帝乃复使终成前所著书。
    confidence: 存疑
    dispute: 迁郎年份据除兰台令史后的升迁次第推定。
