      precision: 范围
    place: 洛阳
    summary: 固自以二世才术位不过郎，感东方朔扬雄自论，以不遭苏张范蔡之时，作宾戏以自通焉。后迁玄武司马，主玄武门，秩比千石。
    confidence: 存疑
    dispute: 作宾戏与迁玄武司马的先后间隔本传无载，统系于章帝朝。
    source_ids: [src-houhanshu-vol40b]
  - stage: 兰台著述
    stage_order: 12
    title: 作典引，自许迈轶相如扬雄
    date:
      text: 约79—88年之间
      year: 79
      range_end: 88
      precision: 范围
    place: 洛阳
    summary: 固又作典引篇述叙汉德，以为相如封禅靡而不典，扬雄美新典而不实，盖自谓得其致焉——以汉承尧后续尧典自命。
    confidence: 存疑
    dispute: 典引作年无确载，从章帝朝恩宠最盛期推定。
    source_ids: [src-houhanshu-vol40b]

  # ── 阶段四：北征幕府 ──────────────────────────────
  - stage: 北征与狱死
    stage_order: 13
    title: 北单于求和亲，固议宜依故事复遣使者
    date:
      text: "约88年"
      year: 88
      precision: 约
    place: 洛阳
    summary: 时北单于遣使贡献求欲和亲，诏问群僚，议者多言不可。固议历数汉兴以来绥御匈奴或修文以和之或用武以征之，未有拒绝弃放不与交接者，主张宜依故事复遣使者，明中国主在忠信。
    confidence: 存疑
    dispute: 和亲议系年本传无载，置于窦宪出征前夕的语境中推定。
