    place: 扶风安陵
    summary: 班彪官望都长，建武三十年年五十二卒官。彪曾继司马迁太初以后之阙作后传数十篇。固以彪所续前史未详，乃潜精研思欲就其业，归乡里续撰。
    source_ids: [src-houhanshu-vol40b]
  - stage: 归乡修史与京兆之狱
    stage_order: 5
