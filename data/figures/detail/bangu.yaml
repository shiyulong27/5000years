  - work_id: bai-hu-tong-yi
    title: 白虎通义
    alt_titles: [白虎通德论, 白虎通]
    genre: 经学总集（奉诏撰集）
    date:
      text: "79年白虎观会议后撰集"
      year: 79
      precision: 约
    place: 洛阳白虎观
    context: 天子会诸儒讲论五经作白虎通德论令固撰集其事。性质是撰集白虎观议奏而成的经学总集而非个人专著：皇帝亲称制临决，班固承担整理定稿。今本四十四篇，三纲六纪篇为其伦纲纲领。
    attribution: 确凿
    excerpt: 三纲者何谓也？谓君臣、父子、夫妇也。六纪者，谓诸父、兄弟、族人、诸舅、师长、朋友也。
    text_display: excerpt
    themes: [经学, 礼制]
    influence: 今文经学官方结论的总汇，三纲六纪之说由此定型，深刻塑造两千年伦理秩序话语。
    confidence: 存疑
    dispute: 撰集体裁意味着部分篇章归属历来有讨论；摘句实取自维基文库白虎通卷07页，该来源未在本文件注册表登记，故撰集事实引本传而摘句暂不带独立来源。
    source_ids: [src-houhanshu-vol40b]

