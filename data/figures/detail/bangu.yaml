    dispute: 中护军任命系永元初；燕然刻石作铭出处为后汉书窦宪传（卷二十三），不在本卷所据卷四十上下文本内，故相关条目均按存疑与推定处理。
    source_ids: [src-houhanshu-vol40b]
  - stage: 北征与狱死
    stage_order: 15
    title: 行中郎将事，出居延塞迎北单于使，至私渠海引还
    date:
      text: 约89—90年之间
      year: 89
      range_end: 90
      precision: 范围
    place: 居延塞至私渠海
    summary: 北单于闻汉军出遣使款居延塞欲修呼韩邪故事请大使。宪上遣固行中郎将事，将数百骑与虏使俱出居延塞迎之。会南匈奴掩破北庭，固至私渠海闻虏中乱引还。
    source_ids: [src-houhanshu-vol40b]
  - stage: 北征与狱死
    stage_order: 16
    title: 窦宪败，固先坐免官
    date:
      text: "约92年"
      year: 92
      precision: 约
    place: 洛阳
    summary: 及窦宪败，固先坐免官——因曾入宪幕而首先被牵连去职。
    confidence: 存疑
    dispute: 窦宪败亡在永元四年（92），据东汉编年推定；本传仅记及窦宪败固先坐免官而不书年份。
    source_ids: [src-houhanshu-vol40b]
  - stage: 北征与狱死
    stage_order: 17
    title: 种兢捕系，死洛阳狱中，年六十一
    date:
      text: "约92年"
      year: 92
      precision: 约
    place: 洛阳狱
    summary: 固不教学诸子，诸子多不遵法度吏人苦之。初洛阳令种兢尝行，固奴干其车骑，奴醉骂，兢大怒，畏宪不敢发心衔之。及窦氏宾客皆逮考，兢因此捕系固，遂死狱中。时年六十一。和帝诏以谴责兢，抵主者吏罪。
    confidence: 有争议
    dispute: 责任归属分两层如实记录——直接动因是洛阳令种兢挟私怨报复（借逮考窦氏宾客之机捕系），背景是窦宪党案株连的政治气氛；朝廷事后谴责种兢并抵罪主者吏，可证当时已视为冤滥。
    source_ids: [src-houhanshu-vol40b]

works:
  - work_id: hanshu
    title: 汉书
    alt_titles: [汉书百篇, 前汉书]
    genre: 断代纪传体正史
    date:
      text: 约公元66—79年之间（永平受诏至建初成书）
      year: 66
      range_end: 79
      precision: 范围
    place: 洛阳兰台
    context: 起父业、承诏命而成：起元高祖终于孝平王莽之诛，十有二世二百三十年，纪表志传凡百篇。自永平中始受诏潜精积思二十余年，至建初中乃成。当世甚重其书学者莫不讽诵焉。
    attribution: 确凿
    excerpt: 固以为汉绍尧运，以建帝业，至于六世……故探撰前记，缀集所闻，以为《汉书》。起元高祖，终于孝平王莽之诛，十有二世，二百三十年，综其行事，傍贯五经，上下洽通。
    text_display: excerpt
    themes: [史学, 典制]
    influence: 中国第一部断代史，创纪传体断代为史的范式，此后历代正史皆祖述之；与史记并称史汉，优劣之争延续千年。
    source_ids: [src-houhanshu-vol40b]

  - work_id: hanshu-su-wu-zhuan
    title: 汉书·李广苏建传（苏武节选）
    alt_titles: [苏武传]
    genre: 史传文学
    date:
      text: 汉书成书期间，约66—79年之间
      year: 66
      range_end: 79
      precision: 范围
    place: ""
    context: 李广苏建传第二十四合李广李陵苏建苏武于一篇，苏武杖汉节牧羊十九年不改其守一节尤为千古传诵。李陵置酒贺武曰今足下还归扬名于匈奴功显于汉室虽古竹帛所载丹青所画何以过子卿。
    attribution: 确凿
    excerpt: 武既至海上，廩食不至，掘野鼠去草实而食之。杖汉节牧羊，卧起操持，节旄尽落。
    text_display: excerpt
    themes: [气节, 史传]
    influence: 苏武牧羊故事的正史源头，后世民族气节叙事的原型文本。
    confidence: 存疑
