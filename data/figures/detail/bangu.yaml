    title: 答宾戏
    alt_titles: [宾戏]
    genre: 设论文
    date:
      text: 章帝朝，约76—88年之间
      year: 76
      range_end: 88
      precision: 范围
    place: 洛阳
    context: 固自以二世才术位不过郎，感东方朔答客难扬雄解嘲自论，以不遭苏张范蔡之时，聊复应焉——以宾主问答申明君子守道不苟合于时。
    attribution: 确凿
    excerpt: 盖闻圣人有一定之论，烈士有不易之分……太上有立德，其次有立功。……时暗而久章者，君子之真也。
    text_display: excerpt
    themes: [抒怀, 处世]
    influence: 与答客难解嘲同体的士人不遇主题名文，文选收录；本传所著目录四十一篇中有宾戏一目。
    source_ids: [src-houhanshu-vol40b]

