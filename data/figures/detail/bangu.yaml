    date:
      text: "79年"
      year: 79
      precision: 精确
    place: 洛阳白虎观
    summary: 肃宗雅好文章，固愈得幸，数入读书禁中或连日继夜，每行巡狩辄献上赋颂，朝廷有大议使难问公卿辩论于前。天子会诸儒讲论五经，作白虎通德论，令固撰集其事。会议在章帝建初四年。
    source_ids: [src-houhanshu-vol40b]
  - stage: 兰台著述
