    date:
      text: "约89年"
      year: 89
      precision: 约
    place: 洛阳至漠北军中
    summary: 固后以母丧去官。永元初大将军窦宪出征匈奴，以固为中护军与参议。随军登燕然山刻石勒功令固作铭一事载于窦宪传，本传未及。
