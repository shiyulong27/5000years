  - work_id: chang-sha-guo-jia-yi-zhai
    title: 长沙过贾谊宅
    alt_titles: []
    genre: 七言律诗
    date:
      text: 一般系于贬南巴往返途经长沙时，确切年份不详
      precision: 未知
    place: 长沙贾谊宅
    context: 三年谪宦此栖迟，万古惟留楚客悲——过贾谊故宅而自伤迁谪，汉文有道恩犹薄湘水无情吊岂知借古人酒杯浇自己块垒。
    attribution: 确凿
    excerpt: 三年谪宦此栖迟，万古惟留楚客悲。秋草独寻人去后，寒林空见日斜时。汉文有道恩犹薄，湘水无情吊岂知。寂寂江山摇落处，怜君何事到天涯。（「独寻」一作「渐寻」）
    text_display: full
    themes: [吊古, 迁谪, 自伤]
    influence: 其七律压卷之作，吊贾谊而自吊的迁谪诗典范，收入唐诗三百首。
    source_ids: [src-qts-liuchangqing]

  - work_id: deng-yu-gan-gu-xian-cheng
    title: 登余干古县城
    alt_titles: []
    genre: 七言律诗
    date:
      text: 创作年代不详，一般系于游饶州余干时
      precision: 未知
    place: 余干古县城
    context: 孤城上与白云齐万古荒凉楚水西，登废县而写陵谷之变：沙鸟不知陵谷变朝飞暮去弋阳溪，荒凉之极归于无言。
    attribution: 确凿
    excerpt: 孤城上与白云齐，万古荒凉楚水西。官舍已空秋草绿，女墙犹在夜乌啼。平江渺渺来人远，落日亭亭向客低。沙鸟不知陵谷变，朝飞暮去弋阳溪。（「白云」一作「迢递」，「荒凉」一作「萧条」）
    text_display: full
    themes: [怀古, 废墟, 陵谷之变]
    influence: 大历怀古诗中以荒寒意境著称的一篇。
    source_ids: [src-qts-liuchangqing]

  - work_id: xun-nan-xi-chang-shan-dao-ren-yin-ju
    title: 寻南溪常山道人隐居
    alt_titles: [寻常山南溪道士隐居]
    genre: 五言律诗
    date:
      text: 创作年代不详
      precision: 未知
    place: 南溪
    context: 寻人不遇而不作失望语，过雨看松色随山到水源，结于溪花与禅意相对亦忘言——不遇之遇，正是其方外交游诗的至高处。
    attribution: 确凿
    excerpt: 一路经行处，莓苔见履痕。白云依静渚，春草闭闲门。过雨看松色，随山到水源。溪花与禅意，相对亦忘言。
    text_display: full
    themes: [访隐, 不遇, 禅意]
    influence: 收入唐诗三百首；溪花与禅意相对亦忘言为以景结情的名联。
    source_ids: [src-qts-liuchangqing]

  - work_id: xin-nian-zuo
    title: 新年作
    alt_titles: []
    genre: 五言律诗
    date:
      text: 创作年代不详，从诗意看当为迁谪岭南时期
      precision: 未知
    place: 岭南贬途（据诗意）
    context: 乡心新岁切天畔独潸然，老至居人下春归在客先——新年独在天涯，已似长沙傅自比贾谊，是其迁谪心境最直接的写照。
    attribution: 确凿
    excerpt: 乡心新岁切，天畔独潸然。老至居人下，春归在客先。岭猿同旦暮，江柳共风烟。已似长沙傅，从今又几年。（「已似」一作「已是」）
    text_display: full
    themes: [新年, 乡愁, 迁谪]
    influence: 老至居人下春归在客先为大历五律炼句的代表。
    source_ids: [src-qts-liuchangqing]

  - work_id: song-li-zhong-cheng-zhi-xiang-zhou
    title: 送李中丞之襄州
    alt_titles: []
    genre: 五言律诗
    date:
      text: 创作年代不详
      precision: 未知
    place: ""
    context: 为罢归的老将送行：流落征南将曾驱十万师，独立三边静轻生一剑知，茫茫汉江上日暮欲何之——写尽功臣迟暮的无处归宿，唐人选本中兴间气集选录。
    attribution: 确凿
    excerpt: 流落征南将，曾驱十万师。罢归无旧业，老去恋明时。独立三边静，轻生一剑知。茫茫汉江上，日暮欲何之。
    text_display: full
    themes: [赠别, 老将, 身世之感]
    influence: 咏功臣失路的五律名篇，中兴间气集与唐诗三百首并录。
    source_ids: [src-qts-liuchangqing]

  - work_id: zhe-ju-yu-yue-ting-zuo
    title: 谪居于越亭作（中兴间气集本题）
    alt_titles: []
    genre: 五言排律
    date:
      text: 迁谪时期所作，确切年份不详
      precision: 未知
    place: 越亭（岭南贬途，一说在桂州）
    context: 唐人选本中兴间气集所选九首之一。得罪风霜苦全生天地仁，青山数行泪沧海一穷鳞——正是选家所评伤而不怨的实证文本。
    attribution: 确凿
    excerpt: 天南愁望绝，亭上柳条新。……得罪风霜苦，全生天地仁。青山数行泪，沧海一穷鳞。
    text_display: excerpt
    themes: [迁谪, 自辩, 江海穷愁]
    influence: 见于唐人选本的迁谪自述，与高仲武「伤而不怨亦足以发挥风雅」的评语互证。
    source_ids: [src-qts-liuchangqing]

