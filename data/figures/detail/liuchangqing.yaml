reception:
  - era: 同时代
    evaluator: 高仲武《中兴间气集》（唐人选本，选其诗九首）
    quote: 长卿有吏干，刚而犯上，两遭迁谪，皆自取之。诗体虽不新奇，甚能炼饰。……思锐才窄也。……可谓伤而不怨，亦足以发挥风雅矣。
    text_display: excerpt
    comment: 同时代选家的定音之评：一面直言其性格致祸与「语意稍同、思锐才窄」的创作局限，一面肯定其炼饰之功与伤而不怨的风雅品格。据四库全书本（维基文库）实取并施加现代标点断句。
    confidence: 确定
    source_ids: [src-zhongxingjianqiji]
  - era: 同时代
    evaluator: 韩翃（《中兴间气集》卷下韩翃评语中带及）
    quote: 其比兴深于刘员外，筋节成于皇甫冉也。
    text_display: excerpt
    comment: 选家评韩翃时以刘长卿（刘员外）为比兴深度的标尺，可见其在大历诗坛的坐标地位。
    confidence: 确定
    source_ids: [src-zhongxingjianqiji]
  - era: 历代批评
    evaluator: 权德舆称、皇甫湜引，全唐诗小传总述
    quote: 權德輿嘗謂爲五言長城。皇甫湜亦云：「詩未有劉長卿一句，已呼宋玉爲老兵。」其見重如此。
    text_display: excerpt
    comment: 五言长城之称出自权德舆（两源一致），后人沿称遂成定名；皇甫湜语则状其诗句被广泛援用的盛况。注意：「自称五言长城」为通行误记，实取两源均作权德舆所称。
    source_ids: [src-qts-liuchangqing, src-tangcaizizhuan]
  - era: 近现代学术
    evaluator: 学界综述
    quote: ""
    text_display: none
    comment: 近现代研究将其定位为大历诗风的代表作家与五言律精工化的关键人物，围绕其生平系年（生卒、两次贬谪路线）、与大历十才子的先后关系、五言长城的诗体内涵等展开考订；具体论著引文须取得许可后补入，本卷暂作中立转述。
    source_ids: []
  - era: 教科书与公共文化
    evaluator: 通用语文教育与大众传播
    quote: ""
    text_display: none
    comment: 逢雪宿芙蓉山主人长期入选语文教材与古典选本，柴门闻犬吠风雪夜归人为国民级诗句；送灵澈上人、听弹琴、饯别王十一南游、长沙过贾谊宅等收入唐诗三百首系统。教材篇目随学期变动录入时须另行核验当期版本。
    source_ids: []
  - era: 影视与网络
