    alt_titles: []
    genre: 五言绝句
    date:
      text: 创作年代不详
      precision: 未知
    place: 芙蓉山（所在地有多说）
    context: 全唐诗卷147首篇。日暮苍山远，天寒白屋贫，柴门闻犬吠，风雪夜归人——二十字写尽荒山雪夜的清冷与归人的暖意。
