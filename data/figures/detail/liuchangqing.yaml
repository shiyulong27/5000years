    alt_titles: []
    genre: 五言律诗
    date:
      text: 创作年代不详
      precision: 未知
    place: ""
    context: 全唐诗卷148。望君烟水阔挥手泪沾巾起笔，长江一帆远落日五湖春以帆影落日写目送之情，不着一个别字的送别名篇。
    attribution: 确凿
    excerpt: 望君烟水阔，挥手泪沾巾。飞鸟没何处，青山空向人。长江一帆远，落日五湖春。谁见汀洲上，相思愁白蘋。
    text_display: full
    themes: [送别, 江景, 相思]
    influence: 收入唐诗三百首，五律送别体的精工样本。
