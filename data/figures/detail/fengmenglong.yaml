reception:
  - era: 同时代
    evaluator: 绿天馆主人（古今小说叙署）
    quote: 试今说话人当场描写，可喜可愕，可悲可涕，可歌可舞……怯者勇，淫者贞，薄者敦，顽钝者汗下。虽小诵《孝经》、《论语》，其感人未必如是之捷且深也。
    text_display: excerpt
    comment: 中国俗文学史上最有力的宣言之一——以说书场上的感动力压倒经传的抽象教训，为白话小说争得存在权。叙署化名是否冯氏本人系学界推测，故评价人与被评人可能同为一人。
    confidence: 存疑
    dispute: 化名归属推测；叙不系年。
    source_ids: [src-gujinxiaoshuo]
  - era: 同时代
    evaluator: 可一居士（醒世恒言叙署）
    quote: 以《明言》、《通言》、《恒言》為六經國史之輔，不亦可乎？
    text_display: excerpt
    comment: 同时代对三言价值的最高定位——把话本总集安放进六经国史之辅的正统序列，通俗文学的合法性论证至此完成。
    confidence: 存疑
    dispute: 叙署可一居士化名归属系推测。
    source_ids: [src-gujinxiaoshuo]
  - era: 历代批评
    evaluator: 姑苏笑花主人《今古奇观序》（转述）
    quote: ""
    text_display: none
    comment: 崇祯间抱瓮老人选今古奇观四十篇，通行说法谓其序以三言二拍为白话小说正宗、所选悉从三言二拍拔萃——三言由此获得跨书场的选本经典地位。序文本次未能实取，仅按通行转述著录，引文待核后翻转。
    confidence: 存疑
    dispute: 选目构成与序文措辞未经本次实取核验。
    source_ids: []
  - era: 近现代学术
    evaluator: 学界综述
    quote: ""
    text_display: none
    comment: 近现代研究将其置于通俗文学整理者与市民文学研究框架之下，聚焦三言的底本源流考证、编选加工程度的量化分析、情教观的思想史定位及其出版活动与晚明江南商业出版的关系等议题；具体论著引文须取得许可后补入，本卷暂作中立转述。
    source_ids: []
  - era: 教科书与公共文化
    evaluator: 通用语文教育与大众传播
    quote: ""
    text_display: none
    comment: 杜十娘怒沉百宝箱与卖油郎独占花魁长期入选语文教材与大众读本，成为国民级的古典白话短篇记忆；三言作为话本总集的公共形象主要经由这两篇建立。教材篇目随学期变动，录入时须另行核验当期版本。
    source_ids: []
  - era: 影视与网络
    evaluator: 大众传播综述
    quote: ""
    text_display: none
    comment: 杜十娘、白娘子等篇目被戏曲影视反复改编，多为戏剧化敷演，不作信史依据；冯梦龙本人的影视形象罕见，网络传播集中于三言名篇与情教名言，暂无可靠专门条目可引。
