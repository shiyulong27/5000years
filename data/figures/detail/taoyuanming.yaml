timeline:
  # ── 阶段一：家世与少年 ──────────────────────────────
  - stage: 家世与少年
    stage_order: 1
    title: 生于浔阳柴桑没落仕族，曾祖为晋大司马陶侃
    date:
      text: "约365年"
      year: 365
      precision: 约
    place: 浔阳柴桑
    summary: 宋书称陶潜字渊明或云渊明字元亮、寻阳柴桑人、曾祖侃晋大司马；晋书则径作陶潜字元亮，并补祖茂武昌太守。出身东晋功臣之后而家道久衰。
    confidence: 存疑
    dispute: 一、名字两说：宋书「陶潜字渊明或云渊明字元亮」与晋书「陶潜字元亮」互异，名渊明抑名潜、字元亮抑字渊明至今聚讼；二、生年两史无载，约365年由卒年六十三倒推，另有372年生、享年七十六或五十二诸说。
    source_ids: [src-songshu-vol93, src-jinshu-vol94]
  - stage: 家世与少年
    stage_order: 2
    title: 少有高趣，著五柳先生传以自况
    date:
      text: 少年时期，具体年代不详
      precision: 未知
    place: 浔阳柴桑
    summary: 宋书载潜少有高趣，尝著五柳先生传以自况——宅边五柳、不慕荣利、性嗜酒、箪瓢屡空晏如也，且谓其自序如此时人谓之实录；晋书录传文全篇。此传成为其一生自我写照。
    source_ids: [src-songshu-vol93, src-jinshu-vol94]

  # ── 阶段二：五度出仕 ──────────────────────────────
  - stage: 五度出仕
    stage_order: 3
    title: 起为州祭酒，不堪吏职少日自解归
    date:
      text: 约393年前后
      year: 393
      precision: 约
    place: 浔阳（江州治所一带）
    summary: 亲老家贫，起为州祭酒，不堪吏职，少日自解归；州复召主簿不就。首次出仕即以去就自持。系年从学界通谱推定，两史未系年。
    confidence: 存疑
    dispute: 祭酒任职年份正史无载，约393年为通说推定。
    source_ids: [src-songshu-vol93, src-jinshu-vol94]
  - stage: 五度出仕
    stage_order: 4
    title: 躬耕自资，遂抱羸疾
    date:
      text: 祭酒去职后至再出仕前
      year: 394
      range_end: 403
      precision: 范围
    place: 浔阳柴桑
    summary: 两史同载躬耕自资遂抱羸疾。弃官归田与再度出仕之间的长期耕居生活为其田园诗的生活根基。
    source_ids: [src-songshu-vol93, src-jinshu-vol94]
  - stage: 五度出仕
    stage_order: 5
    title: 复为镇军、建威参军
    date:
      text: 约403—405年之间
      year: 403
      range_end: 405
      precision: 范围
    place: 京口、建康一带（幕职驻地，地望系推定）
    summary: 两史同载复为镇军、建威参军，谓亲朋曰聊欲弦歌以为三径之资可乎——出仕动机直书为归隐筹措资费。镇军将军刘裕、建威将军刘敬宣府中参谋军事。
    confidence: 存疑
    dispute: 入幕确切年份与驻地正史未详，系年系据刘裕、刘敬宣任职年代推定。
    source_ids: [src-songshu-vol93, src-jinshu-vol94]
  - stage: 五度出仕
    stage_order: 6
    title: 任彭泽令八十余日，不为五斗米折腰，解印赋归去来
    date:
      text: 约405年（义熙元年冬）
      year: 405
      precision: 约
    place: 彭泽
    summary: 执事者闻其弦歌之志以为彭泽令；公田悉欲种秫酿酒，妻固请乃一顷五十亩种秫五十亩种秔。郡遣督邮至，吏白应束带见之，叹曰我不能为五斗米折腰向乡里小人（晋书作拳拳事乡里小人邪），即日解印绶去职，赋归去来兮辞。辞序自述在官八十余日，此后终身不复出仕。
    confidence: 存疑
    dispute: 辞官事实两史互证确凿；惟系年有出入——晋书作义熙二年，通行说法为义熙元年（405）十一月辞官，归去来兮辞序自述仲秋至冬在官八十余日。
    source_ids: [src-songshu-vol93, src-jinshu-vol94, src-taoji]

  # ── 阶段三：归隐田园 ──────────────────────────────
  - stage: 归隐田园
    stage_order: 7
    title: 义熙末征著作佐郎，不就
    date:
      text: 约418年前后（义熙末）
      year: 418
      precision: 约
    place: 浔阳柴桑
    summary: 宋书载义熙末征著作佐郎不就，晋书作顷之征著作郎不就。此后朝廷征命皆不应，绝州郡觐谒。义熙末具体年份无考。
    confidence: 存疑
    dispute: 征命事实两史同载；义熙末所指确年无考。
    source_ids: [src-songshu-vol93, src-jinshu-vol94]
  - stage: 归隐田园
    stage_order: 8
    title: 居所遭火，草屋焚毁
    date:
      text: "约408年（戊申岁六月中）"
      year: 408
      precision: 约
    place: 上京里（柴桑故居）
    summary: 其戊申岁六月中遇火诗自述草庐寄穷巷、一宅无遗火之灾——林室尽焚舫舟荫门前，举室迁居船中暂处。归耕生活的物质困境见于此类自述诗文。
    source_ids: [src-taoji]
  - stage: 归隐田园
    stage_order: 9
    title: 江州刺史王弘半道栗里要之
    date:
      text: 约420年前后
      year: 420
      precision: 约
    place: 栗里、庐山道中
    summary: 宋书载江州刺史王弘欲识之不能致也；潜尝往庐山，弘令其故人庞通之赍酒具于半道栗里要之，潜有脚疾使一门生二儿轝篮舆，既至欣然便共饮酌。九月九日出宅边菊丛坐久，值弘送酒至即便就酌醉而后归。晋书另载弘为之造履、令门生二儿共舁蓝舆至州诸细节，情节两书互有详略。
    confidence: 存疑
    dispute: 相识过程两书叙述互异（宋书系于王弘遣人候知其往庐山之后，晋书系于元熙中临州），交往事实可信而细节存疑；相访年份系推定。
    source_ids: [src-songshu-vol93, src-jinshu-vol94]
  - stage: 归隐田园
    stage_order: 10
    title: 与颜延之情款，留二万钱悉送酒家
    date:
      text: 约404—426年之间（前后两次交游）
      year: 404
      range_end: 426
      precision: 范围
    place: 浔阳
    summary: 宋书载先是颜延之为刘柳后军功曹在寻阳与潜情款；后延之为始安郡经过，日日造潜每往必酣饮致醉，临去留二万钱与潜，潜悉送酒家稍就取酒。二人布衣之交为同时代史料中对其性情最直接的记录。
    source_ids: [src-songshu-vol93]
  - stage: 归隐田园
    stage_order: 11
    title: 无弦琴与葛巾漉酒的真率风神
    date:
      text: 归隐期间，具体年代不详
      precision: 未知
    place: 浔阳柴桑
    summary: 宋书载潜不解音声而畜素琴一张无弦，每有酒适辄抚弄以寄其意；贵贱造之者有酒辄设，若先醉便语客我醉欲眠卿可去；郡将候潜值其酒熟，取头上葛巾漉酒毕还复著之。晋书补但识琴中趣何劳弦上声之语。
    source_ids: [src-songshu-vol93, src-jinshu-vol94]
  - stage: 归隐田园
    stage_order: 12
    title: 义熙以前书晋氏年号，永初以来唯云甲子
    date:
      text: 晋宋易代之际（约420年起）
      year: 420
      precision: 约
    place: 浔阳柴桑
    summary: 宋书特笔记其出处大节：自以曾祖晋世宰辅耻复屈身后代，自高祖王业渐隆不复肯仕；所著文章皆题其年月，义熙以前则书晋氏年号，自永初以来唯云甲子而已。此条为理解其不仕新朝心迹的最早史源。
    source_ids: [src-songshu-vol93]

  # ── 阶段四：卒与身后 ──────────────────────────────
  - stage: 卒与身后
    stage_order: 13
    title: 檀道济馈粱肉麾而去之说
    date:
      text: 约元嘉三年（426年）前后
      year: 426
      precision: 约
    place: 浔阳
    summary: 通行传记载江州刺史檀道济往候之，偃卧瘠馁有日矣；道济馈以粱肉麾而去之。此事不见于宋书晋书本传。
    confidence: 传说
    dispute: 情节仅见萧统《陶渊明传》等后出文献，正史无载；是否信史学界长期存疑，本卷按传说层著录。
  - stage: 卒与身后
    stage_order: 14
    title: 元嘉四年卒，时年六十三
    date:
      text: "427年（元嘉四年）"
      year: 427
      precision: 精确
    place: 浔阳柴桑
    summary: 宋书明载潜元嘉四年卒时年六十三，晋书作以宋元嘉中卒时年六十三。卒年两史相合，享年六十三由此成为推算生年的基点。
    source_ids: [src-songshu-vol93, src-jinshu-vol94]
  - stage: 卒与身后
    stage_order: 15
    title: 颜延之作诔，私谥靖节先生
    date:
      text: 卒后不久
      year: 427
      precision: 约
    place: 浔阳
    summary: 卒后友人颜延之念昔日情款作《陶徵士诔》，谥曰靖节徵士，诔文盛称其宽乐令终之美好廉克己之操。私谥靖节自此成为其千年定称。（诔文全文未登记来源，此处仅作事实转述。）
    confidence: 存疑
    dispute: 宋书仅记延之与潜情款及赠钱事；作诔私谥事见颜延之诔序本文与萧统诸传，本文件未登记诔文来源，故引文从略、置信降档。
    source_ids: [src-songshu-vol93]

works:
  - work_id: yin-jiu-qi-wu
    title: 饮酒二十首（其五）
    alt_titles: []
    genre: 五言古诗
    date:
      text: 约417年前后（退隐中期）
      year: 417
      precision: 约
    place: 浔阳柴桑
    context: 组诗自序谓既醉之后辄题数句自娱。结庐在人境一篇写心远地自偏的境界，采菊东篱下悠然见南山为千古隐逸意象之巅。
    attribution: 确凿
    excerpt: 结庐在人境，而无车马喧。问君何能尔？心远地自偏。采菊东篱下，悠然见南山。山气日夕佳，飞鸟相与还。此中有真意，欲辨已忘言。
    text_display: full
    themes: [隐逸, 自然, 酒]
    influence: 采菊见南山一联奠定中国诗歌冲淡美学典范，苏轼以下和陶不绝。
    confidence: 存疑
    dispute: 组诗作年诸家系于义熙末至元嘉初之间，非有一年定论。
    source_ids: [src-taoji]

  - work_id: gui-yuan-tian-ju-yi
    title: 归园田居五首（其一）
    alt_titles: []
    genre: 五言古诗
    date:
      text: 约406年（辞彭泽令归田次年）
      year: 406
      precision: 约
    place: 浔阳柴桑
    context: 解印去职后归耕之初的自道：误落尘网三十年而终得返自然，方宅草屋榆柳桃李的日常白描开田园诗体。
    attribution: 确凿
    excerpt: 少无适俗韵，性本爱丘山。误落尘网中，一去三十年。……暧暧远人村，依依墟里烟。狗吠深巷中，鸡鸣桑树颠。……久在樊笼里，复得返自然。
    text_display: excerpt
    themes: [田园, 归隐]
    influence: 归隐主题的第一经典文本，久在樊笼里成为后世士人的共同心声。
    confidence: 存疑
    dispute: 作年从辞官次年通说，亦有系于归田数年间者。
    source_ids: [src-taoji]

  - work_id: gui-yuan-tian-ju-san
    title: 归园田居五首（其三）
    alt_titles: []
    genre: 五言古诗
    date:
      text: 约406—407年之间
      year: 406
      range_end: 407
      precision: 范围
    place: 浔阳柴桑
    context: 种豆南山下的躬耕实录，晨兴理荒秽带月荷锄归写尽农作辛苦而衣沾不足惜但使愿无违。
    attribution: 确凿
    excerpt: 种豆南山下，草盛豆苗稀。晨兴理荒秽，带月荷锄归。道狭草木长，夕露沾我衣。衣沾不足惜，但使愿无违。
    text_display: full
    themes: [躬耕, 志节]
    influence: 中国诗歌史上第一次把体力劳动写得如此庄重而诗意。
    source_ids: [src-taoji]

  - work_id: gui-qu-lai-xi-ci
    title: 归去来兮辞
    alt_titles: [归去来辞]
    genre: 辞赋
    date:
      text: 约405年（义熙元年冬，解印去职之际）
      year: 405
      precision: 约
    place: 彭泽至浔阳柴桑
    context: 辞官即日所作（宋书赋归去来）。序文交代家贫出仕、妹丧去职、在官八十余日本末；正文舟遥遥以轻飏至乐夫天命复奚疑，为弃官宣言亦是归隐哲学的总纲。宋书本传全文收录。
    attribution: 确凿
    excerpt: 归去来兮，田园将芜胡不归！……悟已往之不谏，知来者之可追。实迷途其未远，觉今是而昨非。……云无心以出岫，鸟倦飞而知还。……富贵非吾愿，帝乡不可期。聊乘化以归尽，乐夫天命复奚疑！
    text_display: excerpt
    themes: [归隐, 人生哲思]
    influence: 与不为五斗米折腰共同构成中国文人精神独立的标志性文本，欧阳修叹晋无文章惟陶渊明归去来兮辞。
    confidence: 存疑
    dispute: 系年从义熙元年通说；晋书本传系辞官于义熙二年，相差一年。
    source_ids: [src-songshu-vol93, src-jinshu-vol94, src-taoji]

