    title: 五柳先生传
    alt_titles: []
    genre: 传记散文
    date:
      text: 少年时期所作（一说作于归隐后），具体年代不详
      precision: 未知
    place: 浔阳柴桑
    context: 宋书载潜少有高趣尝著此传以自况，时人谓之实录。宅边五柳因以为号，好读书不求甚解，环堵萧然晏如也，忘怀得失以此自终。
    attribution: 确凿
    excerpt: 先生不知何许人也，不详姓字，宅边有五柳树，因以为号焉。……好读书，不求甚解，每有会意，欣然忘食。……环堵萧然，不蔽风日，短褐穿结，箪瓢屡空，晏如也。……忘怀得失，以此自终。
    text_display: excerpt
    themes: [自况, 安贫]
    influence: 创虚拟人物自传一体，五柳先生成为其终身别号；白居易醉吟先生传等皆效其体。
    confidence: 存疑
    dispute: 宋书系于少年，亦有学者主张作于归隐以后，作年两说并存。
    source_ids: [src-songshu-vol93, src-jinshu-vol94]

  - work_id: tao-hua-yuan-ji
    title: 桃花源记（并诗）
    alt_titles: []
    genre: 散文（记并诗）
    date:
      text: 约晋宋易代之际（约420年前后）
      year: 420
      precision: 约
    place: 浔阳柴桑（虚构武陵桃源）
    context: 以武陵渔人误入桃花林为引，写避秦时乱不知有汉无论魏晋的无君无税理想世界。乱世躬耕经验与老子小国寡民理想的结晶。
    attribution: 确凿
    excerpt: 晋太元中，武陵人捕鱼为业。缘溪行，忘路之远近。忽逢桃花林，夹岸数百步，中无杂树，芳草鲜美，落英缤纷。……自云先世避秦时乱，率妻子邑人来此绝境，不复出焉，遂与外人间隔。……不足为外人道也。
    text_display: excerpt
    themes: [理想国, 乱世寄托]
    influence: 桃花源成为中国人对理想社会的通用隐喻，武陵桃源意象影响诗文绘画戏曲千余年。
    confidence: 存疑
    dispute: 作年有太元末、义熙、永初诸说，通说系于晋宋易代之际。
    source_ids: [src-taoji]

  - work_id: za-shi-yi
    title: 杂诗十二首（其一）
    alt_titles: []
    genre: 五言古诗
    date:
      text: 约414年前后（通说系于五十岁左右）
      year: 414
      precision: 约
    place: 浔阳柴桑
    context: 盛年不重来一日难再晨及时当勉励岁月不待人——人生无根蒂飘如陌上尘的漂泊感与惜时之思。
    attribution: 确凿
    excerpt: 人生无根蒂，飘如陌上尘。分散逐风转，此已非常身。落地为兄弟，何必骨肉亲！……盛年不重来，一日难再晨。及时当勉励，岁月不待人。
    text_display: excerpt
    themes: [人生, 惜时]
    influence: 及时当勉励成为汉语惜时的第一格言化诗句。
    confidence: 存疑
    dispute: 十二首非一时所作，各篇系年诸家出入较大。
    source_ids: [src-taoji]

  - work_id: du-shan-hai-jing-yi
    title: 读山海经十三首（其一）
    alt_titles: []
    genre: 五言古诗
    date:
      text: 归隐后期，具体年代不详
      precision: 未知
    place: 浔阳柴桑
    context: 孟夏草木长的耕读图景：众鸟欣有托吾亦爱吾庐，既耕亦已种时还读我书，泛览周王传流观山海图——隐居生活最恬美的自画像。
    attribution: 确凿
    excerpt: 孟夏草木长，绕屋树扶疏。众鸟欣有托，吾亦爱吾庐。既耕亦已种，时还读我书。……泛览《周王传》，流观《山海图》。俯仰终宇宙，不乐复何如。
    text_display: excerpt
    themes: [耕读, 夏景]
    influence: 耕读传家理想的诗意源头。
    source_ids: [src-taoji]

  - work_id: yi-ju-er
    title: 移居二首（其二）
    alt_titles: []
    genre: 五言古诗
    date:
      text: 约410—411年之间（移居南村后）
      year: 410
      range_end: 411
      precision: 范围
    place: 浔阳南村
    context: 春秋多佳日登高赋新诗，过门更相呼有酒斟酌之——与素心人邻里的日常欢聚，衣食当须纪力耕不吾欺的务实耕读观。
    attribution: 确凿
    excerpt: 春秋多佳日，登高赋新诗。过门更相呼，有酒斟酌之。农务各自归，闲暇辄相思。相思则披衣，言笑无厌时。……衣食当须纪，力耕不吾欺。
    text_display: full
    themes: [邻里, 酒, 躬耕]
    influence: 平淡中见真味的邻里书写，为田园社交题材立范。
    confidence: 存疑
    dispute: 移居南村年份诸谱系略有出入。
    source_ids: [src-taoji]

  - work_id: ni-wan-ge-ci-san
    title: 拟挽歌辞三首（其三）
    alt_titles: []
    genre: 五言古诗
    date:
      text: 晚年自挽之作，具体年代不详
      precision: 未知
    place: 浔阳柴桑
    context: 自拟死后送葬情境：亲戚或余悲他人亦已歌，死去何所道托体同山阿——以旷达直面死亡的终极书写。
    attribution: 确凿
    excerpt: 荒草何茫茫，白杨亦萧萧。严霜九月中，送我出远郊。……亲戚或余悲，他人亦已歌。死去何所道，托体同山阿。
    text_display: excerpt
    themes: [生死, 旷达]
    influence: 中国文学中最从容的死亡书写之一。
    source_ids: [src-taoji]

