reception:
  - era: 同时代
    evaluator: 颜延之
    quote: ""
    text_display: none
    comment: 宋书载延之为刘柳后军功曹在寻阳即与潜情款，后赴始安郡道经日日造潜酣饮致醉，临去留二万钱而潜悉送酒家——布衣之交所见性情。潜卒后延之作陶徵士诔并私谥靖节（诔文原文未登记来源，不作引文）。
    source_ids: [src-songshu-vol93]
  - era: 历代批评
    evaluator: 苏轼
    quote: 欲以晚节师范其万一也。
    text_display: excerpt
    comment: 苏轼贬谪中遍和陶诗百余首，自谓深愧渊明欲以晚节师范其万一，并将陶诗推为质而实绮癯而实腴的极境；萧统编陶渊明集作序谓其文章不群词采精拔。此为陶集经典化的两大节点。（和陶诗、萧统序均为公版，来源条目待另行登记后补 source_ids。）
    source_ids: []
  - era: 近现代学术
    evaluator: 学界综述
    quote: ""
    text_display: none
    comment: 近现代研究集中于名字归属与生年诸说考辨、晋宋易代之际的政治态度（甲子书例与忠愤说之辨）、以及其自然观与真淳诗风的哲学阐释；具体论著引文须逐条取得许可后补入，本卷暂作中立转述。
    source_ids: []
  - era: 教科书与公共文化
    evaluator: 通用语文教育与大众传播
    quote: ""
    text_display: none
    comment: 桃花源记饮酒其五归园田居长期入选中小学语文教材；不为五斗米折腰成为汉语中人格尊严的成语级典故，桃花源成为理想社会的通用隐喻。教材篇目随学期变动，录入时须另行核验当期篇目。
    source_ids: []
  - era: 影视与网络
    evaluator: 大众传媒与网络文化
    quote: ""
    text_display: none
    comment: 世外桃源、归隐田园等意象在影视剧、游戏与文旅命名中被高频借用；网络语境下其形象多为躺平与精神家园讨论的文化资源，评价分化明显，本卷仅作现象著录不作价值判断。
    source_ids: []

