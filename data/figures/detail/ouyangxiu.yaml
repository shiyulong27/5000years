    quote: 唐之文，涉五季而弊，至宋欧阳修又振起之。挽百川之颓波，息千古之邪说。
    text_display: excerpt
    comment: 卷319论曰语，将他与韩愈并列为两代文运振起者。「唐宋八大家」并称属明代茅坤唐宋八大家文钞之后世归纳，非宋人自称，本卷如实分层著录。
    source_ids: [src-songshi-vol319]
