    title: 醉翁亭记
    alt_titles: []
    genre: 文（记）
    date:
      text: "约1046年"
      year: 1046
      precision: 约
    place: 滁州
    context: 知滁州任上自号醉翁，与民同乐寄于山水，环滁皆山也起笔。全文经维基文库古文观止系统实取核对。
    attribution: 确凿
    excerpt: 环滁皆山也。其西南诸峰，林壑尤美。……峰回路转，有亭翼然临于泉上者，醉翁亭也。……醉翁之意不在酒，在乎山水之间也。山水之乐，得之心而寓之酒也。……太守谓谁？庐陵欧阳修也。
    text_display: excerpt
    themes: [山水, 与民同乐]
    influence: 古文运动写景名篇，醉翁之意成为汉语经典意象。
    confidence: 存疑
    dispute: 系年从庆历六年在滁通说；文本据维基文库实取，泉名从页面注作让泉（明刻本讹作酿泉），通行选本多作酿泉。
