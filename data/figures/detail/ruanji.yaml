    dispute: 正史无生年载记，约210系由卒年五十四倒推的通说。
    source_ids: [src-jinshu-vol49]
  - stage: 陈留世家
    stage_order: 2
    title: 容貌瑰杰，志气宏放
    date:
      text: 青年时期，具体年代不详
      precision: 未知
    place: 陈留
    summary: 晋书载其容貌瑰杰志气宏放傲然独得任性不羁，喜怒不形于色；或闭户视书累月不出，或登临山水经日忘归。博览群籍尤好庄老，嗜酒能啸善弹琴，当其得意忽忘形骸，时人多谓之痴。
    source_ids: [src-jinshu-vol49]

  # ── 阶段二：仕途浮沉与本有济世志 ────────────────────
  - stage: 仕途浮沉
    stage_order: 3
    title: 蒋济辟召，奏记乞回
    date:
      text: 魏正始前后，蒋济任太尉时，确切年份不详
      precision: 未知
    place: 洛阳都亭
    summary: 太尉蒋济闻其有隽才而辟之，籍诣都亭奏记自陈无邹卜之道乞回谬恩；初济恐籍不至得记欣然遣卒迎之而籍已去。后乡亲共喻乃就吏，旋谢病归；复为尚书郎少时又以病免。
    confidence: 存疑
    dispute: 辟召与就吏的确切年份正史无载。
    source_ids: [src-jinshu-vol49]
  - stage: 仕途浮沉
    stage_order: 4
    title: 辞曹爽参军，岁余爽诛服其远识
    date:
      text: "约249年（曹爽诛前岁余辞征）"
      year: 249
      range_end: 250
      precision: 范围
    place: 田里
    summary: 及曹爽辅政召为参军，籍因以疾辞屏于田里。岁余而爽诛，时人服其远识。宣帝为太傅复命为从事中郎，帝崩后又为景帝大司马从事中郎。
    confidence: 存疑
    dispute: 辞征在爽诛（249）前岁余，系年由史文逆推。
    source_ids: [src-jinshu-vol49]
  - stage: 仕途浮沉
    stage_order: 5
    title: 高贵乡公即位，封关内侯徙散骑常侍
    date:
      text: "约254年"
      year: 254
      precision: 约
    place: 洛阳
    summary: 高贵乡公即位（254），封关内侯，徙散骑常侍。此为其在魏廷名义上最显要的职位。
    source_ids: [src-jinshu-vol49]

  # ── 阶段三：酣饮避祸 ──────────────────────────────
  - stage: 酣饮避祸
    stage_order: 6
    title: 本有济世志，遂酣饮为常
    date:
      text: 魏晋之际天下多故时期
      year: 240
      range_end: 263
      precision: 范围
    place: ""
    summary: 晋书点破关键转折——籍本有济世志，属魏晋之际天下多故名士少有全者，籍由是不与世事遂酣饮为常。纵酒由是避祸的自保策略而非天性疏懒。
    source_ids: [src-jinshu-vol49]
  - stage: 酣饮避祸
    stage_order: 7
    title: 醉六十日拒司马氏联姻
    date:
      text: 文帝初欲为婚之时，年份不详
      precision: 未知
    place: 洛阳
    summary: 文帝初欲为武帝求婚于籍，籍醉六十日不得言而止。又钟会数以时事问之，欲因其可否而致之罪，皆以酣醉获免。
    source_ids: [src-jinshu-vol49]
  - stage: 酣饮避祸
    stage_order: 8
    title: 自请东平相，坏屏鄣旬日而还
    date:
      text: 文帝辅政期间，确切年份不详
      precision: 未知
    place: 东平
    summary: 籍尝从容言于帝曰籍平生曾游东平乐其风土，帝大悦即拜东平相。籍乘驴到郡，坏府舍屏鄣使内外相望，法令清简，旬日而还。后世视为其行政才具与疏放作风的双重见证。
    confidence: 存疑
    dispute: 拜东平相的确切年份诸家系年不一，正史仅系于文帝辅政语境。
    source_ids: [src-jinshu-vol49]
  - stage: 酣饮避祸
    stage_order: 9
    title: 闻步兵厨营善酿，求为步兵校尉
    date:
      text: 东平相还后，确切年份不详
      precision: 未知
    place: 洛阳
    summary: 籍闻步兵厨营人善酿有贮酒三百斛，乃求为步兵校尉。遗落世事，虽去佐职恒游府内朝宴必与焉。阮步兵之称由此而来。
    source_ids: [src-jinshu-vol49]
  - stage: 酣饮避祸
    stage_order: 10
    title: 沈醉忘作，书案成劝进辞
    date:
      text: 会帝让九锡公卿将劝进之际，年份不详
      precision: 未知
    place: 洛阳
    summary: 公卿将劝进使籍为其辞，籍沈醉忘作；临诣府使取之，见籍方据案醉眠，使者以告，籍便书案使写之无所改窜，辞甚清壮为时所重。此篇即流传的为郑冲劝晋王笺。
    confidence: 有争议
    dispute: 劝进笺写作时间紧接卒年且是否出于本愿，历来聚讼：或视为被迫应制之屈辱，或以为借醉脱身的权宜，晋书仅记其事不著心迹。
    source_ids: [src-jinshu-vol49]

  # ── 阶段四：至情至性 ──────────────────────────────
  - stage: 至情至性
    stage_order: 11
    title: 母丧毁瘠骨立，青白眼待人
    date:
      text: 具体年份不详
      precision: 未知
    place: 洛阳
    summary: 性至孝。母终正与人围棋留与决赌，既而饮酒二斗举声一号吐血数升；将葬食一蒸肫饮二斗酒然后临诀直言穷矣，又吐血数升毁瘠骨立殆致灭性。又能为青白眼，见礼俗之士以白眼对之——嵇喜来吊作白眼，嵇康闻之乃赍酒挟琴造焉籍大悦乃见青眼。由是礼法之士疾之若仇而帝每保护之。
    source_ids: [src-jinshu-vol49]
  - stage: 至情至性
    stage_order: 12
    title: 礼岂为我辈设，外坦荡而内淳至
    date:
      text: 具体年份不详
      precision: 未知
    place: 洛阳
    summary: 籍嫂尝归宁籍相见与别或讥之，籍曰礼岂为我设邪。邻家少妇当垆沽酒，籍尝诣饮醉便卧其侧，其夫察之亦不疑。兵家女有才色未嫁而死，籍不识其父兄径往哭之尽哀而还。其外坦荡而内淳至皆此类也。
    source_ids: [src-jinshu-vol49]
  - stage: 至情至性
    stage_order: 13
    title: 率意独驾，穷途恸哭而返
    date:
      text: 具体年份不详
      precision: 未知
    place: 洛阳郊野
    summary: 时率意独驾不由径路，车迹所穷辄恸哭而返。这一意象成为后世士人途穷之悲的原型语汇。
    source_ids: [src-jinshu-vol49]
  - stage: 至情至性
    stage_order: 14
    title: 登广武观楚汉古战场
    date:
      text: 具体年份不详
      precision: 未知
    place: 广武山
    summary: 尝登广武观楚汉战处，叹曰时无英雄使竖子成名！又登武牢山望京邑而叹，于是赋豪杰诗。济世之志未泯，于此二叹可见。
    source_ids: [src-jinshu-vol49]

  # ── 阶段五：逝世 ──────────────────────────────
  - stage: 逝世
    stage_order: 15
    title: 景元四年冬卒，时年五十四
    date:
      text: 景元四年冬（263年）
      year: 263
      precision: 约
    place: ""
    summary: 景元四年冬卒时年五十四。能属文初不留思，作咏怀诗八十余篇为世所重，著达庄论叙无为之贵。
    source_ids: [src-jinshu-vol49]

works:
  - work_id: yonghuai-qiyi
    title: 咏怀诗八十二首（其一）
    alt_titles: [咏怀八十二首其一]
    genre: 五言古诗（组诗）
    date:
      text: 创作年代不详，历来编年聚讼
      precision: 未知
    place: ""
    context: 组诗首篇，夜中不能寐起坐弹鸣琴，以失眠独夜的忧思奠定八十二章的总基调。晋书称作咏怀诗八十余篇为世所重。
    attribution: 确凿
    excerpt: 夜中不能寐，起坐弹鸣琴。薄帷鉴明月，清风吹我襟。孤鸿号外野，翔鸟鸣北林。徘徊将何见，忧思独伤心。
    text_display: full
    themes: [忧思, 夜咏]
    influence: 五言抒情组诗的开山之作，陶潜陈子昂李白杜甫的咏怀咏古感遇一脉皆承此体。
    confidence: 有争议
    dispute: 咏怀诗寄托所指历来聚讼——忧魏晋之际的时局、自伤身世、或泛言人生哲思，各家解说纷纭无定论。
    source_ids: [src-jinshu-vol49]
