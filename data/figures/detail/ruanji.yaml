# | 事实点 | 晋书卷49 原文依据 | 结论与置信 |
# |---|---|---|
# | 籍贯家世 | 阮籍字嗣宗陳留尉氏人也父瑀魏丞相掾知名於世 | 确定 |
# | 气性才貌 | 容貌瑰傑志氣宏放傲然獨得任性不羈；閉戸視書累月不出或登臨山水經日忘歸 | 确定 |
# | 嗜好 | 博覽群籍尤好莊老嗜酒能嘯善彈琴當其得意忽忘形骸 | 确定 |
# | 济世志转饮 | 本有濟世志屬魏晉之際天下多故名士少有全者由是不與世事遂酣飲為常 | 确定 |
# | 醉六十日拒婚 | 文帝初欲為武帝求婚於籍籍醉六十日不得言而止 | 确定 |
# | 钟会问罪 | 鍾會數以時事問之欲因其可否而致之罪皆以酣醉獲免 | 确定 |
# | 东平相 | 籍平生曾游東平樂其風土即拜東平相乘驢到郡壞府舍屏鄣法令清簡旬日而還 | 确定（系年无载） |
# | 步兵校尉 | 聞歩兵廚營人善釀有貯酒三百斛乃求為歩兵校尉 | 确定 |
# | 母丧 | 食一蒸肫飲二斗酒然後臨訣直言窮矣舉聲一號因又吐血數升毀瘠骨立殆致滅性 | 确定 |
# | 青白眼 | 見禮俗之士以白眼對之嵇喜來弔作白眼嵇康齎酒挾琴造焉乃見靑眼 | 确定 |
# | 处境 | 由是禮法之士疾之若仇而帝毎保護之 | 确定 |
# | 穷途恸哭 | 率意獨駕不由徑路車跡所窮輒慟哭而反 | 确定 |
# | 广武之叹 | 登廣武觀楚漢戰處歎曰時無英雄使豎子成名 | 确定 |
# | 卒 | 景元四年冬卒時年五十四 | 确定（生年由此倒推约210） |
# | 著述 | 作詠懷詩八十餘篇為世所重著達莊論敘無為之貴 | 确定 |
# | 苏门山遇孙登 | 籍嘗于蘇門山遇孫登與商略終古及棲神導氣之術登皆不應籍因長嘯而退 | 本载确定；与嵇康从孙登游叙事重叠，学界有传闻异辞之辨→存疑 |
# | 竹林之游（嵇康条） | 所與神交者惟陳留阮籍河內山濤豫其流者河内向秀沛國劉伶籍兄子咸琅邪王戎遂為竹林之遊世所謂竹林七賢也 | 确定（同卷互证）；另阮咸條「與叔父籍為竹林之遊」 |
