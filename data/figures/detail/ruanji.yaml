timeline:
  # ── 阶段一：陈留世家 ──────────────────────────────
  - stage: 陈留世家
    stage_order: 1
    title: 生于陈留尉氏文学之家
    date:
      text: "约210年"
      year: 210
      precision: 约
    place: 陈留尉氏
    summary: 阮籍字嗣宗，陈留尉氏人。父阮瑀，魏丞相掾，知名于世，建安七子之一。生年由景元四年卒时年五十四依传统虚岁倒推。
