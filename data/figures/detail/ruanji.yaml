relations:
  - relation_type: 社群
    target_id: jikang
    direction: 双向
    period:
      text: 竹林之游时期，魏晋之际
      year: 240
      range_end: 262
      precision: 范围
    evidence: 同卷嵇康传明载——所与神交者惟陈留阮籍、河内山涛，豫其流者河内向秀、沛国刘伶、籍兄子咸、琅邪王戎，遂为竹林之游，世所谓竹林七贤也。又阮咸条云与叔父籍为竹林之游。嵇康闻籍母丧赍酒挟琴造焉籍大悦乃见青眼，二人交谊有直接行事可证。
    source_ids: [src-jinshu-vol49]

reception:
  - era: 同时代
    evaluator: 礼法之士与司马昭（晋书原貌）
    quote: 由是礼法之士疾之若仇，而帝每保护之。
    text_display: excerpt
    comment: 晋书如实记录阮籍的两难处境——礼法阵营视其为仇雠，唯赖司马昭庇护得以保全；口不臧否人物与酣醉正是乱世名士的生存技术，此层处境不应被后世风流想象遮蔽。
    source_ids: [src-jinshu-vol49]
  - era: 历代批评
    evaluator: 钟嵘《诗品》（上品）
    quote: 言在耳目之内，情寄八荒之表……厥旨渊放，归趣难求。
    text_display: excerpt
    comment: 南朝品评将阮籍列于上品，指出咏怀诗言近旨远的特质；归趣难求四字实为千余年咏怀诠释之争的总纲。
    source_ids: []
  - era: 历代批评
    evaluator: 刘勰《文心雕龙·明诗》
    quote: 嵇志清峻，阮旨遥深。
    text_display: excerpt
    comment: 与嵇康对举的经典概括，阮旨遥深成为后世理解阮籍诗歌风格的基准表述。
    source_ids: []
  - era: 近现代学术
    evaluator: 学界综述
    quote: ""
    text_display: none
    comment: 近现代研究将阮籍定位为正始之音的代表，聚焦咏怀诗作年分组与政治寄托的诠释方法之争、玄学与创作的关系、以及竹林之游的历史真实性问题；具体论著引文须取得许可后补入，本卷暂作中立综述。
    source_ids: []
  - era: 教科书与公共文化
    evaluator: 通用语文教育与大众传播
    quote: ""
    text_display: none
    comment: 咏怀选篇长期见于大学语文与中国文学史课程，夜中不能寐为必选篇目；竹林七贤、青白眼、穷途恸哭构成大众文化中的阮籍形象。当期教材篇目须另行核验后录入。
    source_ids: []

