  - work_id: da-ren-xian-sheng-zhuan
    title: 大人先生传
    alt_titles: []
    genre: 赋体传记文
    date:
      text: 相传苏门山归后所作，年份不详
      precision: 未知
    place: 苏门山
    context: 晋书载籍于苏门山遇孙登长啸而退还半岭闻鸾凤之音，遂归著大人先生传。文中以群虱处裈中讽礼法君子，惟法是修惟礼是克者不过虱处裈中，此亦籍之胸怀本趣。
    attribution: 确凿
    excerpt: 世人所谓君子，惟法是修，惟礼是克。手执圭璧，足履绳墨。……独不见群虱之处裈中……君子之处域内，何异夫虱之处裈中乎！
    text_display: excerpt
    themes: [越名任自然, 讽礼法]
    influence: 魏晋玄学文学的代表作，对后世狂士文学影响深远。
