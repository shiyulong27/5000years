    date:
      text: "1170年"
      year: 1170
      precision: 精确
    place: 燕山
    summary: 金迎使者慕成大名，至求巾幘效之。至燕山密草奏具言受書式懷之入；初進國書詞氣慷慨，金君臣方傾聽，成大忽奏曰兩朝既為叔侄而受書禮未稱臣有疏，搢笏出之。金主大駭曰此豈獻書處耶，左右以笏標起之，成大屹不動必欲書達。太子欲殺成大，越王止之，竟得全節而歸。
    source_ids: [src-songshi-vol386]
  - stage: 使金全节
    stage_order: 10
    title: 还除中书舍人，封还张说词头
    date:
      text: 约1171年
      year: 1171
      precision: 约
    place: 临安
    summary: 使還除中書舍人，奏论大理议刑递加一等非以严致平乃酷也，上稱為知言。張說除簽書樞密院事，成大當制，留詞頭七日不下，又上疏言之，說命竟寢——以外制抵制佞幸超擢。
    confidence: 存疑
    dispute: 除中书舍人与封还词头本传不系年，按使还之后通说推定。
