# | 早年孤露苦读 | 本传不载 | 碑传笔记层通说，存疑著录 |
# | 四时田园杂兴 | 本传无载 | 从作品层处理：维基文库四時田園雜興专页实取六首 |
# | 作品文本 | 州橋、會同館（石湖詩集四庫本卷12）、催租行橫塘（卷03）、四時田園雜興专页、攬轡錄专页均实取；后催租行文库检索零命中 | 通行本层；简体转写，异文未深校标存疑 |
