      year: 1186
      precision: 约
    place: 石湖
    context: 秋日打稻场夜景：笑歌声里轻雷动，一夜连枷响到明，丰收之夜的声景写得欢腾有力，是组诗中少有的亮色。
    attribution: 确凿
    excerpt: 新筑场泥镜面平，家家打稻趁霜晴。笑歌声里轻雷动，一夜连枷响到明。
    text_display: full
    themes: [田园, 丰收, 秋景]
    influence: 以声响写劳动场面田园诗名句。
    confidence: 存疑
    dispute: 同上，组诗总规模未实取；文本转写异文未深校。
    source_ids: [src-shihuji]

  - work_id: si-shi-tian-yuan-za-xing-xuan-si-cai-ling-xin-ku
    title: 四时田园杂兴（选四）
    alt_titles: []
    genre: 七言绝句（田园组诗选段）
    date:
      text: 约1186年，退居石湖期间
      year: 1186
      precision: 约
    place: 石湖
    context: 血指流丹鬼质枯写采菱者劳损至极，近来湖面亦收租直斥赋税侵渔及于水面——田园组诗并非牧歌，批判锋芒在此。
    attribution: 确凿
    excerpt: 采菱辛苦废犁锄，血指流丹鬼质枯。无力买田聊种水，近来湖面亦收租！
    text_display: full
    themes: [田园, 苦役, 批判]
    influence: 无力买田聊种水近来湖面亦收租为组诗社会批判面的代表作。
    confidence: 存疑
    dispute: 同上，组诗总规模未实取；文本转写异文未深校。
    source_ids: [src-shihuji]

  - work_id: zhou-qiao-shi-qing
    title: 州桥
    alt_titles: [州橋]
    genre: 七言绝句（使金纪行）
    date:
      text: "1170年，乾道六年使金道经汴京"
      year: 1170
      precision: 精确
    place: 汴京
    context: 原注：南望朱雀门北望宣德楼皆旧御路也。使金纪行组诗之一：忍泪失声询使者几时真有六军来，借遗民之问写中原之望，语浅痛深。
    attribution: 确凿
    excerpt: 州桥南北是天街，父老年年等驾回。忍泪失声询使者，几时真有六军来！
    text_display: full
    themes: [使金, 遗民, 家国之痛]
    influence: 使金纪行诗第一名篇，父老等驾回成为中原遗民意象的经典定格。
    confidence: 存疑
    dispute: 文本实取自石湖诗集四库本卷12，与四部丛刊本石湖居士诗集互见；个别字形版本或有异文，未深校。
    source_ids: [src-shihuji]

  - work_id: hui-tong-guan-wan-li-gu-chen
    title: 会同馆
    alt_titles: [㑹同館]
    genre: 七言绝句（使金纪行）
    date:
      text: "1170年，乾道六年使金留馆燕山"
      year: 1170
      precision: 精确
    place: 燕山会同馆
    context: 原题注：燕山客馆也授馆之明日守吏微言有议留使人者。以苏武持节自况，致命之秋以身许国，与其廷争受书礼互为注脚。
    attribution: 确凿
    excerpt: 万里孤臣致命秋，此身何止一沤浮。提携汉节同生死，休问羝羊解乳不。
    text_display: full
    themes: [使金, 持节, 生死]
    influence: 使金气节的自我写照，与本传全节而归的记载可互相印证。
    confidence: 存疑
    dispute: 文本实取自石湖诗集四库本卷12；转写异文未深校。
    source_ids: [src-shihuji]

  - work_id: heng-tang-nan-pu-chun-lai
    title: 横塘
    alt_titles: [橫塘]
    genre: 七言绝句
    date:
      text: 创作年代不详，一般视为早期苏州时期作品
      precision: 未知
    place: 苏州横塘
    context: 南浦春绿石桥朱塔，年年送客之地细雨垂杨，以淡笔写离情，是苏州横塘的经典题咏。
    attribution: 确凿
    excerpt: 南浦春来绿一川，石桥朱塔两依然。年年送客横塘路，细雨垂杨系画船。
    text_display: full
    themes: [送别, 江南水乡]
    influence: 年年送客横塘路使横塘成为姑苏离别地标，后世方志多引。
    confidence: 存疑
    dispute: 文本实取自石湖诗集四库本卷03（石仓历代诗选卷174互见）；创作年份无考。
    source_ids: [src-shihuji]

  - work_id: cui-zu-xing
    title: 催租行
    alt_titles: [催租行（乐府体）]
    genre: 乐府体古诗
    date:
      text: 创作年代不详
      precision: 未知
    place: ""
    context: 里正敲门催租而农户慳囊仅三百钱，聊复偿君草鞋费，以诙谐写苛政，与姊妹篇后催租行同为悯农乐府名作。
    attribution: 确凿
    excerpt: 输租得钞官更催，踉跄里正敲门来。手持文书杂嗔喜，我亦来营醉归耳。床头悭囊大如拳，扑破正有三百钱。不堪与君成一醉，聊复偿君草鞋费。
    text_display: full
    themes: [悯农, 苛政, 讽喻]
    influence: 与范成大后催租行并为南宋悯农诗双璧，上承张籍王建乐传统。
    confidence: 存疑
    dispute: 文本实取自石湖诗集四库本卷03；其后催租行在维基文库检索零命中未获原文，本卷不予摘引；转写异文未深校。
    source_ids: [src-shihuji]

  - work_id: lan-pei-lu
    title: 揽辔录
    alt_titles: [攬轡錄]
    genre: 日记体行记
    date:
      text: "1170年，乾道六月使金往返途中所记"
      year: 1170
      precision: 精确
    place: 使金沿途（泗州、汴京、相州、邯郸至燕山一线）
    context: 使金日记，逐日记行程与北方风物遗民情状；开篇即系受命与出国门日期，为本卷使金系年的精确依据；入汴一段弥望悉荒墟之叹与州桥诗互证。
    attribution: 确凿
    excerpt: 乾道六年閏五月戊子，成大被命以資政殿大學士，與崇信節度使康諝，爲奉使大金國信使副。六月甲子，出國門。
    text_display: excerpt
    themes: [使金, 行记, 遗民]
    influence: 与楼钥北行日录等同为乾道使金文献名品，本传列其行世著述之一。
    confidence: 存疑
    dispute: 文本实取自维基文库攬轡錄专页（说郛本系统，src-lanpeilu）；说郛本与他本文字或有出入。
    source_ids: [src-lanpeilu]

