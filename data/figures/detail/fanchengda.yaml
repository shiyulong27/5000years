# | 晚阶与卒 | 以病請閑進資政殿學士再領洞霄宮紹熙三年加大學士四年薨 | 确定；绍熙四年即1193年 |
# | 自号与著述 | 自號「石湖」，有《石湖集》《攬轡錄》《桂海虞衡集》行於世；素有文名尤工於詩 | 确定；「石湖居士」之称见诗集署名层 |
