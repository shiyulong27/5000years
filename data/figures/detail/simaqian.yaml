  # ── 阶段三：李陵之祸 ───────────────────────────────
  - stage: 李陵之祸
    stage_order: 9
    title: 论次其文，草创史记
    date:
      text: 约前104年起
      year: -104
      precision: 约
    place: 长安
    summary: 与壶遂问答春秋之义后，「于是论次其文」——正式开始著述。自比于继孔子《春秋》之统，本欲载明圣盛德、述功臣贤大夫之业。
    source_ids: [src-hanshu-vol62]
  - stage: 李陵之祸
    stage_order: 10
    title: 遭李陵之祸，幽于累绁
    date:
      text: 前99年
      year: -99
      precision: 约
    place: 长安
    summary: 论次其文十年而遭李陵之祸。李陵提步卒不满五千深践戎马之地，矢尽道穷救兵不至而降。迁适会召问，即以此指推言陵功，欲以广主上之意塞睚眦之辞。明主不深晓，以为仆沮贰师而为李陵游说，遂下于理。拳拳之忠终不能自列，因为诬上卒从吏议。家贫财赂不足以自赎，交游莫救，左右亲近不为一言。
    confidence: 存疑
    dispute: 天汉二年（前99）李陵败降系年从通说；迁获罪在下狱当年抑或次年定罪，诸家谱略有出入。「沮贰师」谓被认作诋毁贰师将军李广利。
    source_ids: [src-hanshu-vol62]
  - stage: 李陵之祸
    stage_order: 11
    title: 下蚕室受腐刑
    date:
      text: 约前98年
      year: -98
      precision: 约
    place: 长安
    summary: 李陵既生降颓其家声，而仆又茸以蚕室，重为天下观笑。悲夫！悲夫！——最下腐刑极矣。人固有一死，死有重于泰山或轻于鸿毛，用之所趋异也。
    confidence: 有争议
    dispute: 受腐刑本传明载（「茸以蚕室」「诟莫大于宫刑」），但行刑确切年份正史无载，约前98说系由下狱与赦免时序推算；另有学者主张前97年。
    source_ids: [src-hanshu-vol62]
  - stage: 李陵之祸
    stage_order: 12
    title: 就极刑而无愠色，隐忍苟活
    date:
      text: 约前98年之后
      year: -98
      precision: 约
    place: 长安
    summary: 草创未就会遭此祸，惜其不成，是以就极刑而无愠色。所以隐忍苟活函粪土之中而不辞者，恨私心有所不尽，鄙没世而文采不表于后世也。肠一日而九回，每念斯耻汗未尝不发背沾衣。
    source_ids: [src-hanshu-vol62]

  # ── 阶段四：忍辱著成一家之言 ────────────────────────
  - stage: 忍辱著成一家之言
    stage_order: 13
    title: 既被刑之后为中书令
    date:
      text: 约前96年后
      year: -96
      precision: 约
    place: 长安
    summary: 迁既被刑之后为中书令，尊宠任职——以内朝近臣身份继续典掌文书。故人益州刺史任安予迁书，责以古贤臣之义。
    confidence: 存疑
    dispute: 任中书令的确切年份无载，约前96年后说系据受刑时间顺推。
    source_ids: [src-hanshu-vol62]
  - stage: 忍辱著成一家之言
    stage_order: 14
    title: 报任安书，自陈心迹
    date:
      text: 约前91年
      year: -91
      precision: 约
    place: 长安
    summary: 迁报任安书，尽舒愤懣：亦欲以究天人之际，通古今之变，成一家之言。仆诚已著此书，藏诸名山传之其人通邑大都，则仆偿前辱之责虽万被戮岂有悔哉！要之死日然后是非乃定。
    confidence: 存疑
    dispute: 报书写作年份正史无载，通说系于征和二年前91年任安下狱之际，亦有更早数年的异说；书中「今少卿抱不测之罪」所指任安得罪事由学界仍有讨论。
    source_ids: [src-hanshu-vol62]
  - stage: 忍辱著成一家之言
    stage_order: 15
    title: 百三十篇成，藏之名山
    date:
      text: 约前91年前后写成
      year: -91
      precision: 约
    place: 长安
    summary: 网罗天下放失旧闻，考之行事稽其成败兴坏之理，上记轩辕下至于兹，凡百三十篇五十二万六千五百字为太史公书。序略以拾遗补阙成一家言，臧之名山副在京师以俟后圣君子。（本传言十篇缺有录无书。）
    confidence: 存疑
    dispute: 全书完成年代无确载，从报任安书「仆诚已著此书」系于约前91年前后；十篇亡缺的时间与篇目自汉以来聚讼不已。
    source_ids: [src-hanshu-vol62]
  - stage: 忍辱著成一家之言
    stage_order: 16
    title: 卒年无载，其书稍出
    date:
      text: 卒年正史无载，通说约前86年
      year: -86
      precision: 约
    place: 不详
    summary: 迁既死后其书稍出。宣帝时迁外孙平通侯杨恽祖述其书遂宣布焉；王莽时求封迁后为史通子。一代太史公之卒，正史竟无一字及之。
    confidence: 存疑
    dispute: 卒年卒地正史均无载。约前86说系学界由武帝末年世次推断；另有前90年因巫蛊事下狱而死（《史记》褚少孙补引述线索及东汉卫宏说）等异说，皆无定论。
    source_ids: [src-hanshu-vol62]
  - stage: 忍辱著成一家之言
    stage_order: 17
    title: 班固承其体例，为之立传
    date:
      text: 东汉明帝章帝间（约1世纪）
      precision: 未知
    place: ""
    summary: 百余年后班固撰《汉书》，专立司马迁传，全载太史公自序节录与报任安书，纪传体由此成为正史不祧之祖。
    related_year: 60
    source_ids: [src-hanshu-vol62]

works:
  - work_id: shiji-xiangyu-benji
    title: 史记·项羽本纪（选段）
    alt_titles: [项羽本纪]
    genre: 纪传体本纪
    date:
      text: 约前104—前91年间著述期内
      year: -104
      range_end: -91
      precision: 范围
    place: 长安
    context: 本传著录十二本纪第七即项羽本纪。不以成败论英雄，将失败者列入帝王本纪，正是司马迁史识与文章合一的极致——垓下之围悲歌慷慨，千载如闻其声。
    attribution: 确凿
    excerpt: 于是项王乃悲歌慷慨，自为诗曰：力拔山兮气盖世，时不利兮骓不逝。骓不逝兮可奈何，虞兮虞兮奈若何！歌数阕，美人和之。项王泣数行下。
    text_display: excerpt
    themes: [英雄悲剧, 史传文学]
    influence: 被历代文家推为本纪中最具文学光彩之篇，鸿门宴垓下之围成为经典叙事范本。
    source_ids: [src-hanshu-vol62]

  - work_id: shiji-lianpo-linxiangru
