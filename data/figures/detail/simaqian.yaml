      year: -104
      range_end: -91
      precision: 范围
    place: 长安
    context: 本传著录七十列传第二十一。完璧归赵渑池会将相和，以人物对话推动叙事，智勇与气节跃然纸上，后世戏曲小说多取材于此。
    attribution: 确凿
    excerpt: 赵惠文王时，得楚和氏璧。秦昭王闻之，使人遗赵王书，愿以十五城请易璧。……相如曰：王必无人，臣愿奉璧往使。城入赵而璧留秦；城不入，臣请完璧归赵。
    text_display: excerpt
    themes: [智勇, 将相和]
    influence: 长期入选语文教材，完璧归赵、负荆请罪成为成语典故库中的常青篇目。
    source_ids: [src-hanshu-vol62]
  - work_id: shiji-chenshe-shijia
