# | 李陵之祸 | 十年而遭李陵之禍幽於累紲；報書：明主不深曉以為僕沮貳師而為李陵遊說遂下於理因為誣上卒從吏議家貧財賂不足以自贖 | 确定(J)；受刑具体年份正史无载 |
# | 受刑 | 李陵既生降頹其家聲而僕又茸以蠶室重為天下觀笑；最下腐刑極矣 | 确定(J) |
# | 受刑后 | 遷既被刑之後為中書令尊寵任職 | 确定(J) |
# | 发愤著述 | 惜其不成是以就極刑而無慍色僕誠已著此書藏諸名山傳之其人通邑大都則僕償前辱之責雖萬被戮豈有悔哉 | 确定(J) |
# | 成书 | 凡百三十篇五十二萬六千五百字為太史公書臧之名山副在京師；十篇缺有錄無書 | 确定(J) |
# | 身后 | 遷既死後其書稍出宣帝時遷外孫平通侯楊惲祖述其書遂宣布焉王莽時求封遷後為史通子 | 确定(J) |
# | 传末赞 | 是非頗繆於聖人論大道則先黃老而後六經…此其所蔽也；劉向揚雄皆稱遷有良史之材…不虛美不隱惡故謂之實錄 | 确定(J) |
