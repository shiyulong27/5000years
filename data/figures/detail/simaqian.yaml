    place: 长安
    context: 本传著录三十世家第十八。以佣耕者入世家、首倡发难者为张楚立传，见其别识心裁；燕雀鸿鹄之叹与王侯将相宁有种乎，皆为千古名句。
    attribution: 确凿
    excerpt: 陈涉太息曰：嗟乎！燕雀安知鸿鹄之志哉！……且壮士不死即已，死即举大名耳，王侯将相宁有种乎！
    text_display: excerpt
    themes: [布衣之志, 首义]
    influence: 长期入选语文教材，塑造了国人对大泽乡起义的基本记忆。
    source_ids: [src-hanshu-vol62]
  - work_id: shiji-cike-liezhuan
