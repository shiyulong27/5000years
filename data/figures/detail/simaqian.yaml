    target_id: bangu
    direction: 单向
    period:
      text: 东汉班固撰汉书时承其余绪（晚司马迁约百余年）
      precision: 未知
    evidence: 汉书司马迁传赞自述：司马迁据左氏国语采世本战国策述楚汉春秋接其后事讫于大汉——班固明言承其所述而续之；汉书又全录太史公自序节录与报任安书为之立传，纪传体例由史记开山而定。
    inferred: true
