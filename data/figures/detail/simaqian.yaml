    date:
      text: 约前104—前91年间著述期内
      year: -104
      range_end: -91
      precision: 范围
    place: 长安
    context: 本传著录七十列传第二十六。曹沫专诸豫让聂政荆轲五人事迹汇为一传，易水送别一节白衣冠悲歌，是中国文学里最著名的赴死场景之一。
    attribution: 确凿
    excerpt: 太子及宾客知其事者，皆白衣冠以送之。至易水之上，既祖，取道，高渐离击筑，荆轲和而歌，为变徵之声，士皆垂泪涕泣。……风萧萧兮易水寒，壮士一去兮不复还！
    text_display: excerpt
    themes: [侠义, 悲歌]
    influence: 易水意象自此定型，历代咏刺客诗文不绝。
    source_ids: [src-hanshu-vol62]
  - work_id: bao-ren-an-shu
    title: 报任安书
    alt_titles: [报任少卿书, 与任安书]
    genre: 书信体散文
    date:
      text: 约前91年
      year: -91
      precision: 约
    place: 长安
    context: 故人益州刺史任安责以古贤臣之义，迁报之书尽舒愤懣——自叙李陵之祸本末、受刑之辱与隐忍著书之志，是理解《史记》写作动机的第一手自白。
    attribution: 确凿
    excerpt: 古者富贵而名摩灭不可胜记，唯俶傥非常之人称焉。盖西伯拘而演周易，仲尼厄而作春秋……诗三百篇，大氐贤圣发愤之所为作也。……亦欲以究天人之际，通古今之变，成一家之言。
    text_display: excerpt
    themes: [发愤著书, 自白]
    influence: 中国书信文中第一等文字，发愤著书说由此成为中国文学批评的核心命题之一。
    confidence: 存疑
    dispute: 写作年份系学界推定；汉书所录与文选所收文本互有异文。
    source_ids: [src-hanshu-vol62]
  - work_id: taishigong-zixu
    title: 太史公自序
    alt_titles: [太史公书自序]
    genre: 自序（书序）
    date:
      text: 约前91年前后
      year: -91
      precision: 约
    place: 长安
    context: 汉书本传全文节录——自叙史官世系、父亲遗命、著述宗旨与百三十篇目录，兼载论六家要指，是《史记》的总纲与作者的精神自画像。
    attribution: 确凿
    excerpt: 网罗天下放失旧闻，王迹所兴原始察终，见盛观衰论考之行事……凡百三十篇五十二万六千五百字为太史公书。序略以拾遗补阙成一家言，协六经异传齐百家杂语，臧之名山副在京师以俟后圣君子。
    text_display: excerpt
    themes: [著述宗旨, 家学]
    influence: 后世文集自序体的典范，成一家之言成为学人的最高自期。
    source_ids: [src-hanshu-vol62]
  - work_id: bei-shi-buyu-fu
    title: 悲士不遇赋
    alt_titles: []
    genre: 辞赋
    date:
      text: 晚年所作，具体年份不详
      precision: 未知
    place: 长安（一说）
    context: 与报任安书同一心境的短赋，抒士生不逢时、志行无闻之悲，是其现存唯一的赋作，可与发愤著书的自白互证。
    attribution: 确凿
    excerpt: 悲夫！士生之不辰，愧顾影而独存。恒克己而复礼，惧志行之无闻。
    text_display: excerpt
    themes: [士不遇, 抒愤]
    influence: 西汉抒情小赋中以生命痛感写不遇之感的代表文本。
    confidence: 存疑
    dispute: 该赋赖《艺文类聚》等类书收录而传，不在汉书本传之内；归属历代无异词而来源登记尚待补入 sources.yaml，故本条暂不引用来源 id。
    source_ids: []

