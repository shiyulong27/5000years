reception:
  - era: 同时代
    evaluator: 朝廷与世俗舆论（报任安书自述语境）
    quote: 明主不深晓，以为仆沮贰师，而为李陵游说，遂下于理。……重为天下观笑。
    text_display: excerpt
    comment: 同时代评价的原貌只能取自其自诉：为李陵一言而获诬上之罪，被刑之后身残处秽动而见尤，负下未易居下流多谤议——时人非议与皇权定性共同构成他生前所处的舆论处境，本卷如实分层呈现。
    source_ids: [src-hanshu-vol62]
  - era: 历代批评
    evaluator: 班固（汉书·司马迁传赞）
    quote: 又其是非颇缪于圣人，论大道则先黄老而后六经，序游侠则退处士而进奸雄，述货殖则崇埶利而羞贱贫，此其所蔽也。
    text_display: excerpt
    comment: 汉书传末的官方批评，指其思想立场不合于儒家正统；此评成为历代尊经派贬抑史记的经典依据，与其对史记体例的继承形成耐人寻味的对照。
    source_ids: [src-hanshu-vol62]
  - era: 历代批评
    evaluator: 刘向、扬雄（转见汉书传赞）
    quote: 皆称迁有良史之材，服其善序事理，辨而不华，质而不俚，其文直，其事核，不虚美，不隐恶，故谓之实录。
    text_display: excerpt
    comment: 汉代最具分量的正面定评，实录二字自此成为史家最高荣誉；班固虽批评其是非而仍服其文章，两评并存恰见汉代评价的张力。
    source_ids: [src-hanshu-vol62]
  - era: 历代批评
    evaluator: 韩愈、柳宗元等唐宋文家（综述）
    quote: ""
    text_display: none
    comment: 唐宋古文运动以降，韩愈柳宗元以下文家普遍尊史记为文章典范，以为三代以下之文莫尚于司马迁；此层属文学史共识的中性转述，具体论著原文未实取，来源留空以待补核。
    source_ids: []
  - era: 近现代学术
    evaluator: 学界综述
    quote: ""
    text_display: none
    comment: 近现代研究聚焦生卒年推算（前145与前135两说）、李陵案的政治语境与受刑年份考辨、史记十篇亡缺问题、实录与文学性（史家之绝唱无韵之离骚）的双重品格等议题；具体论著引文须逐条取得许可后补入，本卷暂作中立转述。
    source_ids: []
  - era: 教科书与公共文化
    evaluator: 通用语文教育与大众传播
    quote: ""
    text_display: none
    comment: 廉颇蔺相如（完璧归赵负荆请罪）、陈涉世家（燕雀安知鸿鹄之志）、报任安书节选等长期入选中小学及大学语文教材；司马迁忍辱著书的形象成为坚韧人格的文化符号。教材篇目随学期变动，录入时须另行核验当期版本。
    source_ids: []

