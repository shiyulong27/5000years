      precision: 约
    place: 长安
    context: 少年感愤秦奢，借阿房宫兴废警讽时君，成于弱冠之前后。六王毕四海一之劈空而起与后人哀之而不鉴之之结穴，使其成为唐赋转折名篇。
    attribution: 确凿
    excerpt: 六王毕，四海一；蜀山兀，阿房出。……秦人不暇自哀，而后人哀之；后人哀之而不鉴之，亦使后人而复哀后人也。
    text_display: excerpt
    themes: [咏史, 讽喻]
    influence: 以赋为论的名篇，戒奢之典千古沿用。
    confidence: 存疑
    dispute: 写作年份通行系于宝历元年敬宗大起宫室之际，系据文中讽意推定。
    source_ids: [src-qts-dumu]
  - work_id: zui-yan
    title: 罪言
    alt_titles: []
    genre: 论议散文
    date:
      text: 约大和、开成之际
      year: 837
      precision: 约
    place: ""
    context: 因刘从谏何进滔辈骄蹇不循法度，追咎长庆以来措置亡术；自谦位不当而言实有罪故名罪言。全文赖新唐书本传收录得传。
    attribution: 确凿
    excerpt: 生人常病兵，兵祖于山东……上策莫如自治。中策莫如取魏。……最下策为浪战，不计地势，不审攻守是也。
    text_display: excerpt
    themes: [军事, 藩镇]
    influence: 晚唐藩镇问题的纲领性政论，新唐书全篇采录。
