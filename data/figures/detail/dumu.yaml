  - work_id: jiangnan-chun
    title: 江南春
    alt_titles: []
    genre: 七言绝句
    date:
      text: 创作年代不详，当在大和会昌间江南宦游之日
      precision: 未知
    place: 江南
    context: 千里莺啼水村山郭酒旗风，收南朝四百八十寺多少楼台烟雨中于一幅，写尽江南春色与历史烟霭。
    attribution: 确凿
    excerpt: 千里莺啼绿映红，水村山郭酒旗风。南朝四百八十寺，多少楼台烟雨中。
