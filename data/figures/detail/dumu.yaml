      year: 848
      precision: 约
    place: ""
    context: 落魄江湖载酒行楚腰纤细掌中轻，十年一觉扬州梦赢得青楼薄幸名，自嘲中寓半生蹉跎之慨。
    attribution: 确凿
    excerpt: 落魄江湖载酒行，楚腰纤细掌中轻。十年一觉扬州梦，赢得青楼薄幸名。
