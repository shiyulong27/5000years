    context: 为曹操所定孙子十三篇作注，旧唐书谓行于代。与其上宰相书论兵、罪言之军事议论互为表里，宋以后刊本十一家注孙子中杜注居其一。
    attribution: 确凿
    excerpt: ""
    text_display: none
    themes: [军事]
    influence: 使其在文学之外别立兵学一席。
    source_ids: [src-jts-dumu]
  - work_id: bo-qinhuai
    title: 泊秦淮
    alt_titles: []
    genre: 七言绝句
    date:
      text: 约文宗年间夜泊金陵时
      year: 833
      precision: 约
    place: 秦淮河
    context: 夜泊秦淮闻商女犹唱玉树后庭花，借陈亡旧曲写晚唐衰象。
    attribution: 确凿
    excerpt: 烟笼寒水月笼沙，夜泊秦淮近酒家。商女不知亡国恨，隔江犹唱后庭花。
    text_display: full
    themes: [咏史, 忧时]
    influence: 咏史绝句中以轻笔负重忧的代表，传诵极广。
    confidence: 存疑
    dispute: 系年与作地有金陵说、扬州说之别。
    source_ids: [src-qts-dumu]
  - work_id: chi-bi
    title: 赤壁
