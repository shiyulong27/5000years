      year: 852
      precision: 约
    place: 长安安仁里
    summary: 将及知命得病，自为墓志祭文；新唐书载乃自为墓志悉取所为文章焚之，又记梦告改名毕甑裂皎皎白驹诸异梦。其年以疾终于安仁里，年五十。旧唐书载有集二十卷曰杜氏樊川集行于代，外甥裴延翰编次之本实存，焚稿云云当非尽焚。从兄悰更历将相而牧困踬不自振，颇怏怏不平。
