      year: 844
      precision: 约
    place: 池州（一说黄州）
    context: 于江滨得折戟沉沙，磨洗认出前朝遗物，翻案设想东风不与周郎便铜雀春深锁二乔，以二乔系二国之运。
    attribution: 确凿
    excerpt: 折戟沉沙铁未销，自将磨洗认前朝。东风不与周郎便，铜雀春深锁二乔。
    text_display: full
    themes: [咏史, 翻案]
    influence: 借地咏史翻转定评的名作，后世聚讼其议论之奇。
