  - work_id: qing-ming
    title: 清明
    alt_titles: []
    genre: 七言绝句
    date:
      text: 创作年代不详
      precision: 未知
    place: ""
    context: 杏花春雨中的问酒小景，明白如话而成清明的国民记忆。
    attribution: 存疑
    excerpt: 清明时节雨纷纷，路上行人欲断魂。借问酒家何处有？牧童遥指杏花村。
    text_display: full
    themes: [节令, 行旅]
    influence: 使杏花村成为清明文化符号。
    confidence: 有争议
    dispute: 此诗不见于樊川文集与唐宋选本，明代始阑入杜集，作者归属有学术争议（主流仍归杜牧），亦有主张许浑或他人作者；本项目从主流归于杜牧而标注存疑。
    source_ids: [src-qts-dumu]
  - work_id: qiu-xi
    title: 秋夕
    alt_titles: []
    genre: 七言绝句
    date:
      text: 创作年代不详
      precision: 未知
    place: 长安（宫怨题材，作地无考）
    context: 以轻罗小扇扑流萤的天阶秋色写宫人幽寂，坐看牵牛织女星结出无限心事。
    attribution: 确凿
    excerpt: 银烛秋光冷画屏，轻罗小扇扑流萤。天阶夜色凉如水，坐看牵牛织女星。
    text_display: full
    themes: [宫怨]
    influence: 宫怨绝句中不着怨字而怨深之作。
    confidence: 存疑
    dispute: 别本题作七夕，又有阑入王建名下之版本系统，文本小异尚存讨论。
    source_ids: [src-qts-dumu]
  - work_id: zeng-bie
    title: 赠别二首（其二）
    alt_titles: []
    genre: 七言绝句
    date:
      text: 约大和末离扬州之际
      year: 835
      precision: 约
    place: 扬州
    context: 与扬州歌妓留别之作，蜡烛有心还惜别替人垂泪到天明以物拟人而情深一往。
    attribution: 确凿
    excerpt: 多情却似总无情，唯觉樽前笑不成。蜡烛有心还惜别，替人垂泪到天明。
    text_display: full
    themes: [离别]
    influence: 咏蜡烛惜别的千古名句。
    confidence: 存疑
    dispute: 系于离扬州时仅从诗境与行迹之通说，确年无考。
    source_ids: [src-qts-dumu]
  - work_id: qian-huai
    title: 遣怀
    alt_titles: []
    genre: 七言绝句
    date:
