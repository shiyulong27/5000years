    text_display: excerpt
    comment: 本传评语对曹植文才与其政治失防作双重评价；裴注又引鱼豢语「余每览植之华采思若有神」，可见魏晋之际对其文章的普遍倾倒。评语原文据维基文库卷19实取核对。
    source_ids: [src-sanguozhi-vol19]
