works:
  - work_id: luoshen-fu
    title: 洛神赋
    alt_titles: [感甄赋]
    genre: 赋
    date:
      text: 黄初三年（222）说为主流
      year: 222
      precision: 约
    place: 洛水
    context: 序自记黄初三年朝京师还济洛川，古人有言斯水之神名曰宓妃，感宋玉对楚王神女之事遂为其赋。「翩若惊鸿婉若游龙」写人神相遇，终以「人神之道殊」怅然长逝。
    attribution: 确凿
    excerpt: 其形也，翩若惊鸿，婉若游龙。荣曜秋菊，华茂春松。……恨人神之道殊兮，怨盛年之莫当。
    text_display: excerpt
    themes: [人神之恋, 抒愤]
    influence: 中国文学史上最负盛名的抒情小赋，书画戏曲反复取材，洛神形象成为经典审美意象。
    confidence: 有争议
    dispute: 作年有黄初三年入朝说为主流，亦有黄初四年及他解；「感甄」谓赋为感恋甄后而作者系后世附会流传，学界多不取，仅录为传播史上的著名异说。
    source_ids: [src-caozhiji]

  - work_id: baima-pian
    title: 白马篇
    alt_titles: []
    genre: 乐府
    date:
      text: 约建安年间青年时期所作，确切年份不详
      precision: 未知
    place: ""
    context: 以幽并游侠儿为主角，「控弦破左的右发摧月支」「捐躯赴国难视死忽如归」，寄托其建功立业的少年壮志，亦被视为自我写照。
    attribution: 确凿
    excerpt: 白马饰金羁，连翩西北驰。借问谁家子？幽并游侠儿。少小去乡邑，扬声沙漠垂。……捐躯赴国难，视死忽如归。
    text_display: full
    themes: [游侠, 建功立业]
    influence: 建安风骨的代表作之一，「捐躯赴国难」成为后世忠勇精神的经典表述。
    source_ids: [src-caozhiji]

  - work_id: qi-ai-shi
    title: 七哀诗
    alt_titles: []
    genre: 五言古诗
    date:
      text: 约建安末至黄初间，一说作于曹丕即位之后
      precision: 未知
    place: ""
    context: 以思妇望月起兴「明月照高楼流光正徘徊」，借夫妇喻君臣，「君若清路尘妾若浊水泥」写疏离之痛，「愿为西南风长逝入君怀」哀恳动人。
    attribution: 确凿
    excerpt: 明月照高楼，流光正徘徊。上有愁思妇，悲叹有余哀。……愿为西南风，长逝入君怀。
    text_display: excerpt
    themes: [思妇, 君臣寄托]
    influence: 五言诗比兴寄托传统的名篇，历代拟作评点不绝。
    confidence: 存疑
    dispute: 系年无考；「喻君臣」的读法自六朝以来渐成主流，亦属阐释传统而非作者自注。
    source_ids: [src-caozhiji]

  - work_id: yetian-huangque-xing
    title: 野田黄雀行
    alt_titles: []
    genre: 乐府
    date:
      text: 约建安二十四年（219）前后，通说系于杨修丁仪之难之际
      year: 219
      precision: 约
    place: 邺
    context: 「高树多悲风海水扬其波利剑不在掌结友何须多」，以篱间黄雀投罗喻友人罹祸而无力相救，少年拔剑捎网救雀则是想象中的救赎。
    attribution: 确凿
    excerpt: 高树多悲风，海水扬其波。利剑不在掌，结友何须多？不见篱间雀，见鹞自投罗。
    text_display: excerpt
    themes: [忧生, 友难]
    influence: 以寓言写政治恐惧的开创之作，忧生之嗟的代表文本。
    confidence: 存疑
    dispute: 本事与丁仪丁廙被害相系的读法属传统笺释，作年系推定。
    source_ids: [src-caozhiji]

  - work_id: zeng-baima-wang-biao
    title: 赠白马王彪（并序）
    alt_titles: []
    genre: 赠答诗（七首连章）
    date:
      text: "223年"
      year: 223
      precision: 精确
    place: 洛阳东归道
    context: 黄初四年朝京师，任城王曹彰暴薨，与白马王曹彪同路东归被监国使者禁止，发愤告离而作。七章章章相承蝉联而下：「鸱枭鸣衡轭豺狼当路衢苍蝇间白黑谗巧反亲疏」直刺监视构陷，「丈夫志四海万里犹比邻」强抑悲痛互勉。
    attribution: 确凿
    excerpt: 谒帝承明庐，逝将归旧疆。清晨发皇邑，日夕过首阳。……丈夫志四海，万里犹比邻。
    text_display: excerpt
    themes: [骨肉之痛, 政治压抑, 别离]
    influence: 连章体赠答诗的高峰，「万里犹比邻」为王勃「天涯若比邻」之所本；三国志裴注引魏氏春秋存其全篇，本事确凿。
    source_ids: [src-sanguozhi-vol19, src-caozhiji]

  - work_id: za-shi-q4
    title: 杂诗六首（其四）
    alt_titles: []
    genre: 五言古诗
    date:
      text: 约太和年间，确切年份不详
      precision: 未知
    place: ""
    context: 「南国有佳人容华若桃李朝游江北岸夕宿潇湘沚」，以佳人迟暮自况，「时俗薄朱颜谁为发皓齿」，写抱才不用的悲哀。
    attribution: 确凿
    excerpt: 南国有佳人，容华若桃李。朝游江北岸，夕宿潇湘沚。时俗薄朱颜，谁为发皓齿？俯仰岁将暮，荣耀难久恃。
    text_display: full
    themes: [自况, 迟暮]
    influence: 以美人意象写士不遇的经典范式。
    source_ids: [src-caozhiji]

  - work_id: konghou-yin
    title: 箜篌引（置酒）
    alt_titles: [置酒高殿上]
    genre: 乐府
    date:
      text: 约邺下时期，确切年份不详
      precision: 未知
    place: 邺
    context: 「置酒高殿上亲交从我飞」极写邺下游宴之乐，忽转「惊风飘白日光景驰西流盛年不再来岁月不我待」，宴饮之欢与生命焦虑并置。
    attribution: 确凿
    excerpt: 置酒高殿上，亲交从我飞。中厨办丰膳，烹羊宰肥牛。……惊风飘白日，光景驰西流。盛年不再来，岁月不我待。
    text_display: excerpt
    themes: [游宴, 人生无常]
    influence: 邺下集团生活的实录性文本，乐府旧题翻新的代表。
    confidence: 存疑
    dispute: 作年无确证；题名在乐府文献中有「箜篌引」「野田黄雀行」两题互见的版本问题。
    source_ids: [src-caozhiji]

  - work_id: ze-gong-ying-zhao
    title: 责躬诗·应诏诗
    alt_titles: [献诗二篇]
    genre: 四言诗
    date:
      text: "223年"
      year: 223
      precision: 精确
    place: 洛阳
    context: 黄初四年朝京都上疏献诗二篇，责躬篇自陈「举挂时网动乱国经傲我皇使犯我朝仪」请罪乞恩，应诏篇颂圣感恩。本传全文收录，帝嘉其辞义优诏答勉之。
    attribution: 确凿
    excerpt: 於穆显考，时惟武皇。受命于天，宁济四方。……皇恩过隆，祗承怵惕。
    text_display: excerpt
    themes: [请罪, 颂圣]
    influence: 正史记存的臣藩献诗范本，也是其晚年屈辱处境的第一手材料。
    source_ids: [src-sanguozhi-vol19]

  - work_id: zhuanpeng-ge
    title: 转蓬（琴瑟调歌）
    alt_titles: []
    genre: 乐府歌辞
    date:
      text: 约晚年徙封期间，确切年份不详
      precision: 未知
    place: 东阿、陈一带
    context: 「吁嗟此转蓬居世何独然长去本根逝夙夜无休闲东西经七陌南北越九阡」，以随风飘转的蓬草自喻十一年中三徙都的命运。本传裴注引作其常为琴瑟调歌。
    attribution: 确凿
    excerpt: 吁嗟此转蓬，居世何独然！长去本根逝，夙夜无休闲。……流转无恒处，谁知吾苦艰？
    text_display: excerpt
    themes: [迁徙之苦, 自伤]
    influence: 转蓬意象自此与其迁徙命运绑定，成为漂泊主题的经典符号。
    source_ids: [src-sanguozhi-vol19]

  - work_id: qibu-shi
    title: 七步诗
    alt_titles: []
    genre: 五言古诗（传说文本）
    date:
      text: 相传作于黄初年间，正史无载
      precision: 未知
    place: 洛阳（传说情境）
    context: 相传文帝尝令东阿王七步中作诗不成者行大法，应声便为诗。煮豆燃萁同根相煎的比喻流传极广。
    attribution: 托名
    excerpt: 煮豆持作羹，漉菽以为汁。萁在釜下燃，豆在釜中泣。本自同根生，相煎何太急？
    text_display: excerpt
    themes: [兄弟相煎]
    influence: 汉语中最广为人知的急智诗传说，同根相煎成为兄弟内斗的固定隐喻。
    confidence: 传说
    dispute: 不见于三国志本传正文与裴注，最早见于《世说新语·文学》（六句本）；通行「本是同根生」七句本更为晚出。学界多疑为附会传说，本项目按传说层著录。世说新语未登记于 sources.yaml，故 source_ids 留空以示无原始文献支撑。
    source_ids: []

