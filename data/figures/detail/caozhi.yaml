  - relation_type: 亲属
    target_id: caocao
    direction: 双向
    period:
      text: 192—220年，父子
      year: 192
      range_end: 220
      precision: 范围
    evidence: 三国志卷19本传：植为太祖（曹操）之子、卞太后同母弟。铜爵台新成太祖悉将诸子登台使各为赋植援笔立成太祖甚异之；征孙权使植留守邺戒以年二十三往事；太祖狐疑几为太子者数矣；司马门事后重诸侯科禁植宠日衰。父子关系为正史铁证。
    source_ids: [src-sanguozhi-vol19]
  - relation_type: 思想影响
    target_id: jikang
    direction: 单向
    period:
      text: 无直接交往记载；建安风骨向正始延展的文学史谱系
      year: 217
      range_end: 262
      precision: 范围
    evidence: 曹植卒（232）时嵇康尚未成年，二人无任何交往记载。所谓影响实为「汉魏风骨」谱系的文学史归纳：钟嵘称植诗「骨气奇高词采华茂」，嵇康诗文被视为建安气骨向正始之音转化的一环。此归纳属后世批评建构而非可证实的影响事实，故按推定著录。
    inferred: true
