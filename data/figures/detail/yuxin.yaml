    summary: 信虽位望通显常有乡关之思，乃作哀江南赋以致其意。序自言信年始二毛即逢丧乱藐是流离至于暮齿——追叙家世、梁亡与羁旅三大主题的千古典范在此完成，日暮途远人间何世成为乱世士人的共同心声。
    confidence: 存疑
    dispute: 哀江南赋创作年份无定年，通说系于入北晚年（约578—579）；亦有更早成篇说。
