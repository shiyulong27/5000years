    dispute: 卒年周书本传不系（仅言大象初去职后卒），通行从北史系统隋开皇元年（581）说；享年六十九与生年513闭合。
    source_ids: [src-zhoushu-vol41]

works:
  - work_id: ai-jiang-nan-fu-bing-xu
    title: 哀江南赋并序
    alt_titles: [哀江南赋]
    genre: 骈赋（并序）
    date:
      text: 约578—579年之间，暮年所作，无定年
      year: 578
      range_end: 579
      precision: 约
    place: 长安
    context: 以赋体追叙庾氏家世、梁代兴亡与自己出使被留的经历，三日哭于都亭三年囚于别馆写尽遗臣之痛；周书本传全文收录并明言乃作哀江南赋以致其意。
    attribution: 确凿
    excerpt: 日暮途远，人间何世。将军一去，大树飘零；壮士不还，寒风萧瑟。……天道周星，物极不反。傅燮之但悲身世，无所求生；袁安之每念王室，自然流涕。
    text_display: excerpt
    themes: [乡关之思, 家国兴亡, 骈文巅峰]
    influence: 中国辞赋史的巅峰之作与六朝骈文的压卷文本；日暮途远人间何世、穷者欲达其言劳者须歌其事成为千古名句，杜甫暮年诗赋动江关即指此赋一路的晚年创作。
    confidence: 确定
    source_ids: [src-zhoushu-vol41, src-yuzishanji]

  - work_id: ku-shu-fu
    title: 枯树赋
    alt_titles: []
    genre: 骈赋
    date:
      text: 一般系于入北以后，具体年份不详
      precision: 未知
    place: 长安
    context: 假殷仲文顾庭槐之叹起兴，以树木之移植摧折喻羁旅之士的摇落飘零；结尾桓大司马昔年种柳今看摇落的慨叹，是六朝文中传诵最广的段落之一。
    attribution: 确凿
    excerpt: 昔年种柳，依依汉南；今看摇落，凄怆江潭。树犹如此，人何以堪！
    text_display: excerpt
    themes: [摇落之悲, 羁旅, 托物言志]
    influence: 树犹如此人何以堪化用桓温故事而成为汉语中感叹生命流逝的通用语汇；此赋与哀江南赋并为其晚年赋作双璧。
    confidence: 确定
    source_ids: [src-yuzishanji]

  - work_id: xiao-yuan-fu
    title: 小园赋
    alt_titles: []
    genre: 骈赋
    date:
      text: 一般系于入北后期，具体年份不详
      precision: 未知
    place: 长安
    context: 咏长安城中数亩敝庐，以蜗角蚊睫又足相容者的自嘲写羁旅者退守心灵一隅的姿态；一寸二寸之鱼三竿两竿之竹的闲淡笔墨背后，是山崩川竭冰碎瓦裂的家国之痛。
    attribution: 确凿
    excerpt: 一寸二寸之鱼，三竿两竿之竹；云气荫于丛蓍，金精养于秋菊……落叶半床，狂花满屋；名为野人之家，是谓愚公之谷。
    text_display: excerpt
    themes: [隐逸自适, 乡关之思, 骈文小品]
    influence: 与枯树赋并称的晚年名赋；以极简之景写极深之悲的笔法为后世园林书写与闲适散文开辟了路径。
    confidence: 确定
    source_ids: [src-yuzishanji]

  - work_id: ni-yong-huai-qi-qi-yu-guan-duan-yin-xin
    title: 拟咏怀二十七首·其七（榆关断音信）
    alt_titles: [拟咏怀·榆关断音信]
    genre: 五言古诗
    date:
      text: 入北以后所作，具体年份不详
      precision: 未知
    place: 长安
    context: 组诗二十七首为庾信暮年诗的代表，此首以闺中思妇口吻自喻北地羁臣：故国音书断绝，恨心终不歇而红颜无复多。
    attribution: 确凿
    excerpt: 榆关断音信，汉使绝经过。胡笳落泪曲，羌笛断肠歌。纤腰减束素，别泪损横波。恨心终不歇，红颜无复多。枯木期填海，青山望断河。
    text_display: full
    themes: [乡关之思, 音书断绝, 香草美人自喻]
    influence: 拟咏怀组诗被视为上承阮籍咏怀的典范；枯木期填海青山望断河以不可能之事写不绝之望，是其晚期诗风的标本句。
    confidence: 确定
    source_ids: [src-yuzishanji]

  - work_id: ni-yong-huai-qi-shi-yi-yao-luo-qiu-wei-qi
    title: 拟咏怀二十七首·其十一（摇落秋为气）
    alt_titles: [拟咏怀·摇落秋为气]
    genre: 五言古诗
    date:
      text: 入北以后所作，具体年份不详
      precision: 未知
    place: 长安
    context: 哀悼江陵之变的挽歌：天亡遭愤战日蹙值愁兵写梁室覆亡，眼前一杯酒谁论身后名则以反讽收束，痛感乱世中及时行乐与身后之名两皆虚妄。
    attribution: 确凿
    excerpt: 摇落秋为气，凄凉多怨情。啼枯湘水竹，哭坏杞梁城。……楚歌饶恨曲，南风多死声。眼前一杯酒，谁论身后名。
    text_display: excerpt
    themes: [亡国之痛, 秋气悲怀, 身后之名]
    influence: 眼前一杯酒谁论身后名为历代选家激赏的名联，可见庾信晚年由绮丽入苍劲的典型转折。
    confidence: 确定
    source_ids: [src-yuzishanji]

  - work_id: ni-yong-huai-qi-si-chu-cai-cheng-jin-yong
    title: 拟咏怀二十七首·其四（楚材称晋用）
    alt_titles: [拟咏怀·楚材称晋用]
    genre: 五言古诗
    date:
      text: 入北以后所作，具体年份不详
      precision: 未知
    place: 长安
    context: 连用楚材晋用、羁旅寓卫等典故自况北仕的尴尬：被用而非所愿，安齐而独未安；结句唯彼穷途恸知余行路难直承阮籍穷途之哭。
    attribution: 确凿
    excerpt: 楚材称晋用，秦臣即赵冠。离宫延子产，羁旅接陈完。寓卫非所寓，安齐独未安。雪泣悲去鲁，凄然忆相韩。唯彼穷途恸，知余行路难。
    text_display: full
    themes: [羁臣之痛, 用典如己出, 上承阮籍]
    influence: 是理解庾信屈仕北朝心态的第一手文本；典故密度与情感强度的结合为其晚期五古的代表性面目。
    confidence: 确定
    source_ids: [src-yuzishanji]

  - work_id: ni-yong-huai-qi-shi-ba-xun-si-wan-hu-hou
    title: 拟咏怀二十七首·其十八（寻思万户侯）
    alt_titles: [拟咏怀·寻思万户侯]
    genre: 五言古诗
    date:
      text: 入北以后所作，具体年份不详
      precision: 未知
    place: 长安
    context: 夜半愁生而琴书满床，虽言梦蝴蝶定自非庄周——明知旷达不可得而强学旷达，乐天知命何时能不忧的自问是其精神困境的白描。
    attribution: 确凿
    excerpt: 寻思万户侯，中夜忽然愁。琴声遍屋里，书卷满床头。虽言梦蝴蝶，定自非庄周。……露泣连珠下，萤飘碎火流。乐天乃知命，何时能不忧。
    text_display: excerpt
    themes: [中夜之愁, 庄周之辨, 知命之难]
    influence: 残月如新月新秋似旧秋一类回环句式，显示其对诗歌语言精度的极致追求，下启唐代律诗的对仗锤炼。
    confidence: 确定
    source_ids: [src-yuzishanji]

  - work_id: ni-yong-huai-qi-er-shi-liu-xiao-tiao-ting-zhang-yuan
    title: 拟咏怀二十七首·其二十六（萧条亭障远）
    alt_titles: [拟咏怀·萧条亭障远]
    genre: 五言古诗
    date:
      text: 入北以后所作，具体年份不详
      precision: 未知
    place: 长安
    context: 关塞风尘的边地意象与历史送别的叠印：秋风别苏武寒水送荆轲，谁言气盖世晨起帐中歌——以项羽垓下之歌收束，写尽英雄末路与羁臣无归的双重悲凉。
    attribution: 确凿
    excerpt: 萧条亭障远，凄惨风尘多。关门临白狄，城影入黄河。秋风别苏武，寒水送荆轲。谁言气盖世，晨起帐中歌。
    text_display: full
    themes: [边塞意象, 历史送别, 英雄末路]
    influence: 边塞景物入抒情旧题的写法被视为唐人边塞诗的先声之一；此首亦是庾信融合南朝技巧与北地气象的直观样本。
    confidence: 确定
    source_ids: [src-yuzishanji]

  - work_id: ji-wang-lin
    title: 寄王琳
    alt_titles: []
    genre: 五言绝句（早期五绝）
    date:
      text: 王琳卒（573）前，入北期间，具体年份不详
      year: 557
      range_end: 573
      precision: 范围
    place: 长安
    context: 写给仍奉梁正朔、拥兵长江中游抗陈的将领王琳。故国信使稀疏之际得万里来书，独下千行泪——私人情谊承载的是对梁室的最后忠诚。
    attribution: 确凿
    excerpt: 玉关道路远，金陵信使疏。独下千行泪，开君万里书。
    text_display: full
    themes: [故国之忠, 万里书信, 泪]
    influence: 二十字的绝唱，被视为早期五言绝句成熟的标志之作；独下千行泪开君万里书的对照结构为后世尺素题材的经典原型。
    confidence: 确定
    source_ids: [src-yuzishanji]

