      precision: 约
    place: 长安
    summary: 卒。隋文帝深悼之赠本官加荆淮二州刺史，子立嗣。身历四朝（梁西魏北周隋）而终不得归，卒年距隋文帝受禅仅数月，恰是一个南北分裂时代落幕前的谢幕者。
