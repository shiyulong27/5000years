# | 北周历官 | 孝闵帝践阼封临清县子邑五百户除司水下大夫出为弘农郡守迁骠骑大将军开府仪同三司司宪中大夫进爵义城县侯俄拜洛州刺史信多识旧章为政简静吏民安之 | 确定；各任职具体年份本传不系 |
