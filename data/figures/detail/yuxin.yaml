    summary: 加散骑常侍来聘于西魏；属大军南讨遂留长安——出使之日恰逢西魏发兵攻江陵，使命未成而故国将倾，从此被扣留北地。此为本卷核心转折：哀江南赋序自纪华阳奔命有去无归中兴道销穷于甲戌，甲戌即承圣三年。
