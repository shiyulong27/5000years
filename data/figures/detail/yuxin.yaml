# | 一传两评 | 唯王褒庾信奇才秀出牢笼于一代；然则子山之文发源于宋末盛行于梁季其体以淫放为本其词以轻险为宗……若以庾氏方之斯又词赋之罪人也 | 确定；唐初史臣褒贬并存 |
