relations:
  - relation_type: 思想影响
    target_id: dufu
    direction: 单向
    period:
      text: 杜甫论庾信诗（约761—767年间作戏为六绝句与咏怀古迹）
      year: 761
      range_end: 767
      precision: 约
    evidence: 杜甫戏为六绝句其一：庾信文章老更成，凌云健笔意纵横。今人嗤点流传赋，不觉前贤畏后生；咏怀古迹五首其一：羯胡事主终无赖，词客哀时且未还。庾信平生最萧瑟，暮年诗赋动江关——并以词客哀时自况，两联均实取自维基文库全唐诗卷227卷230。
    source_ids: [src-quantangshi-vol227, src-quantangshi-vol230]

reception:
  - era: 同时代
    evaluator: 北周皇室（《周书》本传所记）
    quote: 世宗、高祖并雅好文学，信特蒙恩礼。至于赵、滕诸王，周旋款至，有若布衣之交。群公碑志，多相请托。
    text_display: excerpt
    comment: 本传直书庾信在北周的礼遇之隆：帝王雅好文学而特蒙恩礼，宗王与之布衣之交，碑志文字争相请托——同时代的接受以优礼与文名垄断为特征。滕王宇文逌编庾子山集并作序盛赞其文，本次未能于网络公版全文库实取该序原文，暂不引录，待核补。
    source_ids: [src-zhoushu-vol41]
  - era: 历代批评
    evaluator: 唐修《周书》史臣（令狐德棻）
    quote: 唯王褒、庾信奇才秀出，牢笼于一代。……然则子山之文，发源于宋末，盛行于梁季。其体以淫放为本，其词以轻险为宗。……若以庾氏方之，斯又词赋之罪人也。
    text_display: excerpt
    comment: 一传之内毁誉并存：既承认其牢笼一代的文坛地位，又沿杨广（斥为文妖之先声）一路斥其绮艳为词赋之罪人——这一褒贬张力本身构成庾信接受史的起点，也折射唐初对齐梁文风的官方清算立场。
    source_ids: [src-zhoushu-vol41]
  - era: 历代批评
    evaluator: 杜甫
    quote: 庾信文章老更成，凌云健笔意纵横。今人嗤点流传赋，不觉前贤畏后生。／庾信平生最萧瑟，暮年诗赋动江关。
    text_display: excerpt
    comment: 分别出自戏为六绝句其一与咏怀古迹五首其一（实取自维基文库全唐诗卷227卷230）。前者为庾信晚年风格翻案定谳，后者以萧瑟暮年与动江关注入身世共鸣——杜甫并在咏怀古迹中以词客哀时且未还自比庾信。此两联奠定了此后千年评价的主基调。
    confidence: 确定
    source_ids: [src-quantangshi-vol227, src-quantangshi-vol230]
  - era: 近现代学术
    evaluator: 学界综述
    quote: ""
    text_display: none
    comment: 近现代研究的共识性框架为：庾信是南北文风融合的集大成者——以南朝的形式技巧承载北地的苍凉经验，前期绮艳与后期老成的分期、徐庾体与宫体诗的关系、乡关之思的主题学与哀江南赋的史学价值为主要议题；具体论著引文须取得许可后补入，本卷暂作中立转述。
    source_ids: []
  - era: 教科书与公共文化
    evaluator: 通用语文教育与大众传播
    quote: ""
    text_display: none
    comment: 哀江南赋序与小园赋枯树赋选段长期见于大学及中学语文读本，日暮途远人间何世、树犹如此人何以堪进入日常语言；庾信文章老更成作为文学史成语广泛流通。教材篇目随学期变动，录入时须另行核验当期版本。
    source_ids: []
  - era: 影视与网络
    evaluator: 大众传播综述
    quote: ""
    text_display: none
    comment: 影视剧中庾信形象多为南朝宫廷与南北交聘故事的点缀，缺乏可靠专门作品可引；网络传播集中于其暮年名句与徐庾体话题，暂不作信史依据著录。
    source_ids: []

