relations:
  - relation_type: 思想影响
    target_id: libai
    direction: 单向
    period:
      text: 开元以后，隔代文学史的路线承续
      year: 720
      range_end: 762
      precision: 范围
    evidence: 新唐书称唐兴文章承徐庾余风天下祖尚子昂始变雅正；李白继其扫除齐梁绮靡、恢复汉魏风骨的革新路线而集大成，后世论者常以陈李并举。此系文学史归纳，两人相隔逾三十年，并无任何直接交往记载。
    inferred: true
    confidence: 存疑
    dispute: 本条为思想脉络层面的单向归纳关系，非交往实证；「李白受陈子昂直接影响」的具体程度在学界亦有不同评估。
    source_ids: [src-xts-vol107]

reception:
  - era: 同时代
    evaluator: 王适
    quote: 此子必为天下文宗矣！
    text_display: excerpt
    comment: 旧唐书所记京兆司功王适读感遇诗后的断语，子昂由是知名；新唐书作是必为海内文宗且谓王适因此请交。
    source_ids: [src-jts-vol190m, src-xts-vol107]
  - era: 同时代
    evaluator: 卢藏用
    quote: ""
    text_display: none
    comment: 旧唐书载子昂有集十卷，友人黄门侍郎卢藏用为之序盛行于代；新唐书又载其轻财好施笃朋友，与陆余庆王无竞房融崔泰之卢藏用赵元最厚。
    source_ids: [src-jts-vol190m, src-xts-vol107]
  - era: 历代批评
    evaluator: 韩愈
    quote: 国朝盛文章，子昂始高蹈。
    text_display: excerpt
    comment: 韩愈荐士诗句（公版原文），把唐诗革新的起点系于子昂，是对其文学史地位最有力的传统定评；出处未另行登记来源，引用边界以该联为限。
    source_ids: []
  - era: 历代批评
    evaluator: 新唐书史臣
    quote: 乃以王者之术勉之，卒为妇人讪侮不用，可谓荐圭璧于房闼，以脂泽污漫之也。
    text_display: excerpt
    comment: 宋祁赞语对其谏诤谋国之效持尖锐否定态度，与对其文章始变雅正的肯定并存，代表宋代史学评价的两面性。
    source_ids: [src-xts-vol107]
  - era: 近现代学术
    evaluator: 学界综述
    quote: ""
    text_display: none
    comment: 近现代研究聚焦生卒年考订（659/661两说）、死因与段简案的法律政治解读（含受武氏讽使罗织说的史料层级辨析）、感遇诗与修竹篇序的风骨理论定位等议题；具体论著引文须逐条取得许可后补入，本卷暂作中立转述。
    source_ids: []
  - era: 教科书与公共文化
    evaluator: 通用语文教育与大众传播
    quote: ""
    text_display: none
    comment: 登幽州台歌长期入选中小学语文教材，前不见古人成为大众熟语；射洪金华山读书台为其最重要的乡邦纪念地。教材篇目随学期变动录入时须另行核验。
    source_ids: []
  - era: 影视与网络
    evaluator: 影视与网络传播
    quote: ""
    text_display: none
    comment: 暂无稳定、权威的影视形象记载可录，本层留空待补。
