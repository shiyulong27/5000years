  - work_id: ji-qiu-lan-gu-yan-zhao-wang
    title: 蓟丘览古赠卢居士藏用七首·燕昭王
    alt_titles: [蓟丘览古]
    genre: 五言古诗（组诗之一）
    date:
      text: 约696年随军幽州期间
      year: 696
      precision: 约
    place: 幽州蓟丘
    context: 南登碣石馆遥望黄金台，吊燕昭王礼贤故事，与其进言不遇的处境互证；登幽州台歌即同一情境下的产物。
    attribution: 确凿
    excerpt: 南登碣石馆，遥望黄金台。丘陵尽乔木，昭王安在哉？霸图怅已矣，驱马复归来。
    text_display: full
    themes: [怀古, 礼贤不遇]
    influence: 与登幽州台歌互文的组诗，幽州台意象群之所本。
    confidence: 存疑
    dispute: 组诗作于随军时期从通说，序称身犹是客等语与系年细节尚有讨论。
    source_ids: [src-qts-chenziang]
  - work_id: xian-shan-huai-gu
    title: 岘山怀古
    alt_titles: []
    genre: 五言古诗
    date:
      text: 约垂拱间往返荆楚途中，确年不详
      precision: 未知
    place: 襄阳岘山
    context: 秣马临荒甸登高览旧都，过羊祜堕泪碑故地而兴亡国之思。
    attribution: 确凿
    excerpt: 秣马临荒甸，登高览旧都。犹悲堕泪碣，尚想卧龙图。……谁知万里客，怀古正踌躕。
    text_display: excerpt
    themes: [怀古]
    influence: 初唐五古怀古的成熟之作。
