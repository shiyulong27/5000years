    title: 度荆门望楚
    alt_titles: []
    genre: 五言律诗
    date:
      text: 约青年出蜀途中，确年不详
      precision: 未知
    place: 荆门山
    context: 遥遥去巫峡望望下章台，写初次出峡入楚的新鲜视野，巴国山川尽荆门烟雾开。
    attribution: 确凿
    excerpt: 遥遥去巫峡，望望下章台。巴国山川尽，荆门烟雾开。城分苍野外，树断白云隈。今日狂歌客，谁知入楚来。
    text_display: full
    themes: [山水, 行旅]
    influence: 出蜀纪行的清新名篇。
