reception:
  - era: 同时代
    evaluator: 天启《淮安府志》（明代方志层，经转引）
    quote: 性敏而多慧，博极群书，为诗文下笔立成，清雅流丽，有秦少游之风。复善谐剧，所著杂记几种，名震一时。
    text_display: excerpt
    comment: 吴承恩才名的核心同时代（明代）评价，也是后世归属说的源头文献。注意两点：一是本次系经鲁迅《小说旧闻钞》转引页实取，未核天启府志原典（转引层）；二是府志成书已在吴氏身后四十余年，且所言杂记几种并未点名西游记。
    confidence: 存疑
    source_ids: []
  - era: 历代批评
    evaluator: 阮葵生《茶余客话》（清代）
    quote: 金漳山先生令山阳，修邑志，以吴射阳撰《西游记》事欲入志。予谓此事真伪不值一辨也。……惟《淮贤文目》载射阳撰《西游记通俗演义》。
    text_display: excerpt
    comment: 清代著作权两造的地方样本——阮氏一面讥辨伪多事，一面仍引淮贤文目的著录，恰可见淮安地方文献一脉与清初丘作旧题流行的并行。片段经搜索结果页取得，未逐字核对善本。
    confidence: 存疑
    source_ids: []
  - era: 近现代学术
    evaluator: 学界综述
    quote: ""
    text_display: none
    comment: 鲁迅《中国小说史略》第十七篇与胡适《西游记考证》据天启府志、淮贤文目一脉确立吴承恩归属说，成为教科书层面的通行结论；当代学界异说并陈——华阳洞天主人校订（写定）说、千顷堂书目地理类游记说、府志杂记几种非必指西游记说等，均未成定谳。本卷对各方只作中立转述，现代论著原文一律不引。
    source_ids: []
  - era: 教科书与公共文化
    evaluator: 通用语文教育与大众传播
    quote: ""
    text_display: none
    comment: 西游记位列四大名著，孙悟空与大闹天宫是国民级文化记忆；吴承恩作为其作者的通行归属随教材与大众读物广泛传播——注意公共文化中的归属表述多为简化版通行说，不等同学术结论。教材表述随版本变动，录入时须另行核验当期版本。
    source_ids: []
  - era: 影视与网络
    evaluator: 大众传播综述
    quote: ""
    text_display: none
    comment: 86版电视剧《西游记》及其后续改编使吴承恩的名字进入大众视野，衍生大量戏剧化敷演（包括对其生平的虚构演绎），一律不作信史依据；网络上的著作权讨论良莠混杂，暂无可靠专门条目可引。
