works:
  - work_id: xiyouji-baihuiben
    title: 西游记（百回本）
    alt_titles: [西游释厄传]
    genre: 长篇神魔小说（章回体）
    date:
      text: 写定年无考；现存最早完整刊本为万历二十年（1592）金陵世德堂本
      year: 1592
      precision: 约
    place: 金陵（刊行地）
    context: 讲石头里生的猴王皈依佛法、护唐僧西天取经的神魔故事，以游戏笔墨包孕儒释道三教讽刺；第一回开篇诗点题西游释厄传，灵根育孕源流出心性修持大道生一回目统摄全书修心寓意。
    attribution: 存疑
    excerpt: 诗曰：混沌未分天地乱，茫茫渺渺无人见。自从盘古破鸿蒙，开辟从兹清浊辨。覆载群生仰至仁，发明万物皆成善。欲知造化会元功，须看《西游释厄传》。……内育仙胞，一日迸裂，产一石卵，似圆毬样大。因见风，化作一个石猴，五官俱备，四肢皆全。
    text_display: excerpt
    themes: [神魔, 取经, 修心寓义, 谐剧讽世]
    influence: 中国四大名著之一，神魔小说的巅峰；孙悟空成为国民级文化形象，大闹天宫等段落进入戏曲、影视与儿童读物的公共记忆。
    confidence: 有争议
    dispute: 著作权公案要点——（1）通行说：鲁迅《中国小说史略》、胡适《西游记考证》据天启《淮安府志》著录（复善谐剧所著杂记几种名震一时）与《千顷堂书目》一脉，确立淮安吴承恩为百回本最终写定者；（2）府志仅言杂记几种，未言卷数回目，西游记是否即其中之一无明文；（3）《千顷堂书目》著录情况涉版本差异，有学者主张其著录之吴承恩西游记或为地理类游记而非小说；（4）早期刊本题华阳洞天主人校，陈元之序未确指作者，有学者据此提华阳洞天主人写定说；（5）清初通行本长期题丘处机（或其门徒）作，系沿元人旧题之演变。诸说并陈，本卷不作断语，attribution 标存疑。
