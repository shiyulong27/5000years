  - work_id: li-zhi-tan
    title: 荔支叹
    alt_titles: [荔枝叹]
    genre: 七言古诗
    date:
      text: 约1095年
      year: 1095
      precision: 约
    place: 惠州（一说）
    context: 由汉唐荔枝进贡的惊尘溅血写到本朝斗茶贡花争新买宠——我愿天公怜赤子莫生尤物为疮痏；点名词臣丁谓蔡襄进小龙团欧阳修所惊叹之事，锋芒不减当年，岭海贬所犹存讽谕风骨。
    attribution: 确凿
    excerpt: 十里一置飞尘灰，五里一堠兵火催。……我愿天公怜赤子，莫生尤物为疮痏。君不见武夷溪边粟粒芽，前丁后蔡相笼加。
    text_display: excerpt
    themes: [讽谕, 贡赋之弊]
    influence: 晚年讽谕诗的代表，证明其批判精神至贬所未泯。
    confidence: 存疑
    dispute: 维基文库页名荔支叹无系年；通行系于绍圣年间惠州贬所，确切年份无考；荔支/荔枝二字并行。
    source_ids: [src-dongpoji]

  - work_id: zi-ti-jin-shan-hua-xiang
    title: 自题金山画像
    alt_titles: []
    genre: 六言绝句（题画赞）
    date:
      text: 约1101年
      year: 1101
      precision: 约
    place: 金山寺（镇江）
    context: 北归经金山寺观李公麟所绘己像而自题，心似已灰之木身如不系之舟，问汝平生功业黄州惠州儋州——临终之年对自己一生的最终总结，三个贬所即全部功业的自嘲式碑铭。
    attribution: 确凿
    excerpt: 心似已灰之木，身如不系之舟。问汝平生功业，黄州惠州儋州。
    text_display: full
    themes: [自题, 一生总结, 旷达]
    influence: 其生命终章的定格文本，后世论苏轼人格必引。
    confidence: 存疑
    dispute: 维基文库页不系年；通行系于建中靖国元年（1101）北归过金山时，画像作者与确切时地据笔记年谱层，本传无载。
    source_ids: [src-dongpoji]

