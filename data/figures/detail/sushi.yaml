    text_display: excerpt
    comment: 本传便殿对话所记，神宗宫中读其文膳进忘食称为天下奇才——帝王赏识与其终身不获大用构成其命运的张力。
    source_ids: [src-songshi-vol338]
  - era: 历代批评
