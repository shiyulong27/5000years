      text: "1085年"
      year: 1085
      precision: 精确
    place: 常州、登州、汴京
    summary: 至常而神宗崩哲宗立，复朝奉郎知登州，召为礼部郎中。本传又载轼旧善司马光章惇，二人不合，轼引许靖故事劝惇毋慢司马光，光赖以少安。
    source_ids: [src-songshi-vol338]
  - stage: 元祐还朝与再度外放
    stage_order: 18
    title: 迁中书舍人，寻除翰林学士；与司马光争役法
    date:
      text: "1086年"
      year: 1086
      precision: 精确
    place: 汴京
    summary: 迁起居舍人辞蔡确不许；元祐元年以七品服入侍延和即赐银绯迁中书舍人。司马光为相欲复差役，轼谓差役免役各有利害骤罢免役而行差役正如罢长征而复民兵盖未易也，陈于政事堂光忿然，轼举韩魏公刺陕西义勇时光为谏官力争旧事诘之，光笑之。寻除翰林学士。
    source_ids: [src-songshi-vol338]
  - stage: 元祐还朝与再度外放
    stage_order: 19
    title: 兼侍读；宣仁后金莲烛送归院
    date:
      text: 约1087—1088年之间
      year: 1087
      range_end: 1088
      precision: 范围
    place: 汴京
    summary: 二年兼侍读，每进读至治乱兴衰邪正得失之际未尝不反复开导。尝锁宿禁中召对便殿，宣仁后告以此先帝意也先帝每诵卿文章必叹曰奇才奇才但未及进用卿耳，轼不觉哭失声，宣仁后与哲宗亦泣，已而命坐赐茶彻御前金莲烛送归院。三年权知礼部贡举。
    source_ids: [src-songshi-vol338]
  - stage: 元祐还朝与再度外放
    stage_order: 20
    title: 以龙图阁学士知杭州，救灾浚湖筑苏公堤
    date:
      text: 约1089—1091年之间
      year: 1089
      range_end: 1091
      precision: 范围
    place: 杭州
    summary: 四年积以论事为当轴者所恨恐不见容请外，拜龙图阁学士知杭州。既至杭大旱饑疫并作，请免本路上供米三之一，作病坊遣医分坊治病活者甚众；浚茅山盐桥二河以通漕复完六井，取葑田积湖中南北径三十里为长堤植芙蓉杨柳其上望之如图画，杭人名为苏公堤。本传记轼二十年间再莅杭有德于民家有画像饮食必祝又作生祠以报。
    source_ids: [src-songshi-vol338]
  - stage: 元祐还朝与再度外放
    stage_order: 21
    title: 召回迁翰林承旨；历知颍州扬州，召为兵部尚书礼部尚书
    date:
      text: "1091—1092年"
      year: 1091
      range_end: 1092
      precision: 范围
    place: 汴京、颍州、扬州
    summary: 六年召为吏部尚书未至，以弟辙除右丞改翰林承旨，在翰林数月复以谗请外出知颍州（测淮水高程谏止凿黄堆工程、遣尉捕宿贼尹遇）；七年徙扬州请复漕法旧制；未阅岁以兵部尚书召兼侍读，迁礼部兼端明殿翰林侍读两学士为礼部尚书。
    source_ids: [src-songshi-vol338]

  # ── 阶段六：岭海贬窜与北归病卒 ──────────────────────
  - stage: 岭海贬窜与北归病卒
    stage_order: 22
    title: 宣仁后崩乞补外，出知定州
    date:
      text: "1093年"
      year: 1093
      precision: 精确
    place: 定州
    summary: 八年宣仁后崩哲宗亲政，轼乞补外以两学士出知定州，不得入辞。既行上书言天下治乱出于下情之通塞愿虚心循理一切未有所为默观庶事之利害。整饬定州军政，取贪污者配隶远恶缮修营房部勒战法众皆畏伏，定人言自韩琦去后不见此礼至今矣。
    source_ids: [src-songshi-vol338]
  - stage: 岭海贬窜与北归病卒
    stage_order: 23
    title: 绍圣初论词命讥斥先朝，贬宁远军节度副使惠州安置
    date:
      text: 约1094年
      year: 1094
      precision: 约
    place: 英州道中、惠州
    summary: 绍圣初御史论轼掌内外制日所作词命以为讥斥先朝，遂以本官知英州，寻降一官，未至，贬宁远军节度副使惠州安置。居三年泊然无所蒂芥人无贤愚皆得其欢心。
    confidence: 存疑
    dispute: 本传仅记绍圣初不系具体年份；贬惠确年起讫（通行绍圣元年1094抵惠）据年谱与编年史料，本卷未实取，按约处理。
    source_ids: [src-songshi-vol338]
  - stage: 岭海贬窜与北归病卒
    stage_order: 24
    title: 又贬琼州别驾居昌化，儋耳买地筑室著书
    date:
      text: 约1097—1100年之间
      year: 1097
      range_end: 1100
      precision: 范围
    place: 昌化（儋州）
    summary: 又贬琼州别驾居昌化。昌化故儋耳地非人所居药饵皆无有，初僦官屋以居有司犹谓不可，轼遂买地筑室儋人运甓畚土以助之；独与幼子过处著书以为乐时时从其父老游若将终身。海南时期完成书传，与和陶诗同为晚年著述大宗。
    confidence: 存疑
    dispute: 贬儋起讫本传不系年，按居惠三年之后至徽宗立之间的范围著录；通行系于绍圣四年（1097）渡海。
    source_ids: [src-songshi-vol338]
  - stage: 岭海贬窜与北归病卒
    stage_order: 25
    title: 徽宗立量移内迁，更三大赦提举玉局观
    date:
      text: "1100年"
      year: 1100
      precision: 精确
    place: 廉州、永州一带北归途中
    summary: 徽宗立移廉州改舒州团练副使徙永州，更三大赦遂提举玉局观复朝奉郎。本传谓轼自元祐以来未尝以岁课乞迁故官止于此。
    source_ids: [src-songshi-vol338]
  - stage: 岭海贬窜与北归病卒
    stage_order: 26
    title: 卒于常州，年六十六
    date:
      text: "1101年"
      year: 1101
      precision: 精确
    place: 常州
    summary: 建中靖国元年卒于常州年六十六。北归途中作自题金山画像，问汝平生功业黄州惠州儋州——以三个贬所为平生功业的自嘲自评，成为其一生结局的经典概括。
    source_ids: [src-songshi-vol338, src-dongpoji]
  - stage: 岭海贬窜与北归病卒
    stage_order: 27
    title: 身后：赠太师谥文忠，文章雄视百代
    date:
      text: 南宋高宗以后追褒
      year: 1127
      range_end: 1138
      precision: 范围
    place: ""
    summary: 史臣论其体浑涵光芒雄视百代有文章以来盖亦鲜矣。高宗即位赠资政殿学士以其文置左右读之终日忘倦谓为文章之宗亲制集赞；遂崇赠太师谥文忠。
    confidence: 存疑
    dispute: 赠资政殿学士在高宗即位初，崇赠太师系年史无明文，按绍兴年间范围著录。
    source_ids: [src-songshi-vol338]

works:
  - work_id: nian-nu-jiao-chibi-huaigu
    title: 念奴娇·赤壁怀古
    alt_titles: []
    genre: 词（慢词）
    date:
      text: "1082年"
      year: 1082
      precision: 精确
    place: 黄州赤壁（赤鼻矶）
    context: 黄州贬居期间游赤鼻矶怀古之作，大江东去浪淘尽千古风流人物开豪放词境；与前后赤壁赋同为一时之作。
    attribution: 确凿
    excerpt: 大江东去，浪淘尽、千古风流人物。故垒西边，人道是、三国周郎赤壁。……羽扇纶巾，谈笑间、樯橹灰飞烟灭。……人生如梦，一尊还酹江月。
    text_display: excerpt
    themes: [怀古, 豪放]
    influence: 宋词豪放一派的奠基之作，千古风流人物由此成为项目名与国民语汇。
    confidence: 存疑
    dispute: 异文极多——维基文库页注浪淘尽一作浪声沈、崩云一作穿空、裂岸一作拍岸、谈笑间一作笑谈间、樯橹一作强虏、人间如梦一作人生如寄等，本卷从御定词谱系统；系年从维基文库页标注之1082年。
    source_ids: [src-dongpoji]

  - work_id: shui-diao-ge-tou-ming-yue-ji-shi-you
    title: 水调歌头·明月几时有
    alt_titles: [水调歌头·丙辰中秋]
    genre: 词（慢词）
    date:
      text: "1076年"
      year: 1076
      precision: 精确
    place: 密州
    context: 小序自述丙辰中秋欢饮达旦大醉作此篇兼怀子由——中秋醉后对月的哲学追问与人伦祝愿，兼怀其弟苏辙。
    attribution: 确凿
    excerpt: 明月几时有，把酒问青天。……人有悲欢离合，月有阴晴圆缺，此事古难全。但愿人长久，千里共婵娟。
    text_display: excerpt
    themes: [中秋, 怀人, 哲思]
    influence: 但愿人长久千里共婵娟为中秋第一绝唱，南宋以来传唱不衰。
    source_ids: [src-dongpoji]

  - work_id: jiang-cheng-zi-mizhou-chulie
    title: 江城子·密州出猎
    alt_titles: []
    genre: 词（小令）
    date:
      text: "1075年"
      year: 1075
      precision: 精确
    place: 密州
    context: 知密州时祭常山会猎而作，老夫聊发少年狂写太守出猎盛况；会挽雕弓如满月西北望射天狼以射天狼喻御边之志。
    attribution: 确凿
    excerpt: 老夫聊发少年狂，左牵黄，右擎苍。……会挽雕弓如满月，西北望，射天狼。
    text_display: excerpt
    themes: [出猎, 豪放, 用世]
    influence: 与念奴娇并为宋词豪放开山的标志作品。
    source_ids: [src-dongpoji]

  - work_id: jiang-cheng-zi-yimao-zhengyue-jimeng
    title: 江城子·乙卯正月二十日夜记梦
    alt_titles: [江城子·十年生死两茫茫]
    genre: 词（小令）
    date:
      text: "1075年"
      year: 1075
      precision: 精确
    place: 密州
    context: 乙卯正月二十日夜梦见亡妻王弗而作，十年生死两茫茫不思量自难忘，悼亡词中情致最深的绝唱。
    attribution: 确凿
    excerpt: 十年生死两茫茫，不思量，自难忘。千里孤坟，无处话凄凉。……相顾无言，惟有泪千行。料得年年肠断处，明月夜，短松冈。
    text_display: excerpt
    themes: [悼亡, 记梦]
    influence: 中国悼亡词的巅峰之作，与贺铸半死桐并称。
    source_ids: [src-dongpoji]

  - work_id: ding-feng-bo-mo-ting-chuan-lin
    title: 定风波·莫听穿林打叶声
    alt_titles: []
    genre: 词（小令）
    date:
      text: "1082年"
      year: 1082
      precision: 精确
    place: 黄州沙湖道中
    context: 小序自述三月七日沙湖道中遇雨雨具先去同行皆狼狈余独不觉已而遂晴故作此；也无风雨也无晴为黄州时期旷达人格的定格。
    attribution: 确凿
    excerpt: 莫听穿林打叶声，何妨吟啸且徐行。竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。……回首向来萧瑟处，归去，也无风雨也无晴。
    text_display: excerpt
    themes: [旷达, 雨中行]
    influence: 也无风雨也无晴成为中国文化中宠辱不惊的人格符号。
    source_ids: [src-dongpoji]

  - work_id: qian-chibi-fu
    title: 前赤壁赋
    alt_titles: [赤壁赋]
    genre: 文赋
    date:
      text: "1082年"
      year: 1082
      precision: 精确
    place: 黄州赤壁
    context: 壬戌之秋七月既望与客泛舟游于赤壁之下，由曹操固一世之雄而今安在哉转入变与不变的哲学自解——自其不变者而观之则物与我皆无尽也；江上清风山间明月取之无禁用之不竭。卷末附亲书本跋云轼去岁作此赋未尝轻出以示人……多难畏事。
    attribution: 确凿
    excerpt: 清风徐来，水波不兴。……寄蜉蝣于天地，渺沧海之一粟。哀吾生之须臾，羡长江之无穷。……惟江上之清风，与山间之明月，耳得之而为声，目遇之而成色，取之无禁，用之不竭。
    text_display: excerpt
    themes: [怀古, 哲思, 旷达]
    influence: 文赋的极致典范，与后赤壁赋并称双璧，长期入选语文教材。
    source_ids: [src-dongpoji]

  - work_id: hou-chibi-fu
    title: 后赤壁赋
    alt_titles: []
    genre: 文赋
    date:
      text: "1082年"
      year: 1082
      precision: 精确
    place: 黄州赤壁
    context: 前赋三个月后是岁十月之望重游赤壁，江流有声断岸千尺山高月小水落石出写冬夜江山，孤鹤横江道士入梦以梦幻结——与前赋的水月之辩相对，境界转幽峭。
    attribution: 确凿
    excerpt: 江流有声，断岸千尺；山高月小，水落石出。……适有孤鹤，横江东来。翅如车轮，玄裳缟衣，戛然长鸣，掠予舟而西也。
    text_display: excerpt
    themes: [冬夜山水, 梦, 幽峭]
    influence: 山高月小水落石出为历代画家竞写的意境母题（乔仲常后赤壁赋图等）。
    confidence: 存疑
    dispute: 维基文库页注梦一道士句原本据推断为二道士，后人以孤鹤当为道士改一字，台湾学者衣若芬专文论之；文字小异并存。
    source_ids: [src-dongpoji]

  - work_id: ti-xi-lin-bi
    title: 题西林壁
    alt_titles: []
    genre: 七言绝句
    date:
      text: 约1084年
      year: 1084
      precision: 约
    place: 庐山西林寺
    context: 游庐山题壁诗，横看成岭侧成峰远近高低各不同，不识庐山真面目只缘身在此山中——以观山写当局者迷的哲理，宋诗理趣的极致样本。
    attribution: 确凿
    excerpt: 横看成岭侧成峰，远近高低各不同。不识庐山真面目，只缘身在此山中。
    text_display: full
    themes: [哲理, 山水]
    influence: 不识庐山真面目成为国民成语级表达。
    confidence: 存疑
    dispute: 维基文库页不系年；通行系于元丰七年（1084）自黄州赴汝州途中游庐山，亦有异说。第二句页注异文甚夥（总不同/看山了/无一同等），本卷从不相同。
    source_ids: [src-dongpoji]

  - work_id: yin-hu-shang-chu-qing-hou-yu
    title: 饮湖上初晴后雨二首（其二）
