    source_ids: [src-dongpoji]

  - work_id: he-ziyou-mianchi-huai-jiu
    title: 和子由渑池怀旧
    alt_titles: []
    genre: 五言律诗
    date:
      text: 约1061年
      year: 1061
      precision: 约
    place: 渑池道中
    context: 和其弟苏辙怀旧之作，人生到处知何似应似飞鸿踏雪泥——雪泥鸿爪由此成为人生聚散无常的千古意象，作于初仕凤翔途经渑池时。
    attribution: 确凿
    excerpt: 人生到处知何似，应似飞鸿踏雪泥。泥上偶然留指爪，鸿飞那复计东西。
