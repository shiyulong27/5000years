relations:
  - relation_type: 师承
    target_id: ouyangxiu
    direction: 双向
    period:
      text: 1057年礼部试知遇至1072年欧阳修卒
      year: 1057
      range_end: 1072
      precision: 范围
    evidence: 本传明载嘉祐二年试礼部主司欧阳修得轼刑赏忠厚论惊喜欲擢冠多士犹疑其客曾巩所为但置第二；后以书见修修语梅圣俞曰吾当避此人出一头地；又以才识兼茂荐之秘阁。欧阳修之于苏轼为座主、荐主与文坛衣钵相传之人。
    source_ids: [src-songshi-vol338]
  - relation_type: 论敌
    target_id: wanganshi
    direction: 双向
    period:
      text: 1069—1076年新法之争为主，1084年金陵会晤和解
      year: 1069
      range_end: 1084
      precision: 范围
    evidence: 本传载王安石执政素恶其议论异己以判官告院；轼上书论新法不便愿陛下结人心厚风俗存纪纲；安石使御史谢景温论奏其过穷治无所得。然元丰末道过金陵见王安石论大兵大狱，安石厉声曰安石须说出在安石口入在子瞻耳，轼戏言争减半年磨勘虽杀人亦为之安石笑而不言——政见论敌而私谊终存，措辞须两面兼顾不可简化为对立。
    source_ids: [src-songshi-vol338]
  - relation_type: 师承
    target_id: huangtingjian
    direction: 双向
    period:
      text: 元祐前后订交至1101年苏轼卒
      year: 1085
      range_end: 1101
      precision: 范围
    evidence: 本传列一时文人如黄庭坚晁补之秦观张耒陈师道举世未之识轼待之如朋俦未尝以师资自予也——苏门授受之实存而苏轼不以师自居；宋人并称苏黄，本卷按苏门师承著录。
    confidence: 存疑
    dispute: 师承名义系本卷依苏门传统归类；正史层面仅记待之如朋俔未尝以师资自予，严格说是亦师亦友关系，订交确切年份正史无载。
    source_ids: [src-songshi-vol338]
  - relation_type: 挚友
    target_id: qinguan
    direction: 双向
    period:
      text: 约1077—1078年徐州订交至1100年秦观卒
      year: 1077
      range_end: 1100
      precision: 范围
    evidence: 本传列秦观于轼所奖掖的一时文人之中待之如朋俦；秦观本传（宋史卷444）互证见苏轼于徐为赋黄楼轼以为有屈宋才，元祐初轼以贤良方正荐于朝；秦观死轼叹曰少游不幸死道路哀哉世岂复有斯人乎。苏门四学士中情谊最深者。
    source_ids: [src-songshi-vol338, src-songshi-vol444]

