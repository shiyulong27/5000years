    place: 黄州、汝州道中、金陵
    summary: 神宗数有意复用辄为当路者沮之，尝语宰相曰国史至重可命苏轼成之，遂手札移轼汝州有曰苏轼黜居思咎阅岁滋深人材实难不忍终弃。轼未至汝上书自言饥寒有田在常愿得居之，朝奏夕报可。道过金陵见王安石论大兵大狱汉唐灭亡之兆，安石曰出在安石口入在子瞻耳——政敌而相见尽欢，为党争史上著名一幕。
