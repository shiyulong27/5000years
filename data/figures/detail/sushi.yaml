# |---|---|---|
# | 名号籍贯 | 蘇軾字子瞻眉州眉山人 | 确定 |
# | 少年母教 | 生十年父洵遊學四方母程氏親授以書；程氏讀東漢范滂傳，軾請曰軾若爲滂母許之否乎 | 确定 |
# | 嘉祐二年 | 試禮部，主司歐陽脩得軾刑賞忠厚論驚喜欲擢冠多士猶疑其客曾鞏所爲但置第二；復以春秋對義居第一殿試中乙科；脩語梅聖俞曰吾當避此人出一頭地 | 确定（1057） |
# | 制科三等 | 歐陽脩以才識兼茂薦之秘閣，復對制策入三等；自宋初以來制策入三等惟吳育與軾而已；除大理評事簽書鳳翔府判官 | 确定；制科确年本传不系（通行嘉祐六年1061） |
# | 议新法 | 熙寧二年還朝王安石執政以判官告院；四年上議反對變科舉，神宗召見，對曰但患求治太急聽言太廣進人太銳；又上書論其不便願陛下結人心厚風俗存紀綱 | 确定 |
# | 外放履历 | 使御史謝景溫論奏其過窮治無所得軾遂請外通判杭州；徙知密州（爭手實法）；徙知徐州（河決曹村廬於城上過家不入卒全其城）；徙知湖州 | 确定；各州起讫年份本传不系 |
# | 乌台诗案 | 御史李定舒亶何正臣摭其表語並媒蘖所爲詩以爲訕謗逮赴臺獄欲置之死鍛煉久之不決神宗獨憐之以黃州團練副使安置；築室於東坡自號東坡居士 | 确定；案发年份本传不系年（元丰二年1079说据编年史料，本卷未实取，按约处理） |
# | 金陵会晤 | 手札移軾汝州有曰蘇軾黜居思咎閱歲滋深人材實難不忍終棄；道過金陵見王安石論大兵大獄，安石曰出在安石口入在子瞻耳 | 确定；过金陵年份本传不系（元丰七年1084通说） |
# | 元祐历官 | 至常神宗崩哲宗立復朝奉郎知登州召爲禮部郎中；遷起居舍人中書舍人；尋除翰林學士；二年兼侍讀；四年拜龍圖閣學士知杭州；六年改翰林承旨出知潁州；七年徙揚州以兵部尚書召兼侍讀遷禮部尚書；八年出知定州 | 确定（本传逐年系年） |
# | 知杭政绩 | 免上供米三之一作病坊；浚茅山鹽橋二河復完六井；取葑田積湖中爲長堤植芙蓉楊柳杭人名爲蘇公堤；二十年間再蒞杭有德於民家有畫像飲食必祝又作生祠 | 确定 |
# | 绍圣贬窜 | 御史論所作詞命以爲譏斥先朝遂以本官知英州尋降一官未至貶寧遠軍節度副使惠州安置；居三年泊然無所蒂芥；又貶瓊州別駕居昌化（故儋耳地非人所居藥餌皆無有）買地築室儋人運甓畚土以助之獨與幼子過處著書以爲樂 | 确定；贬惠贬儋起讫本传仅记「紹聖初」「居三年」，具体年份按约处理 |
# | 北归病卒 | 徽宗立移廉州改舒州團練副使徙永州更三大赦遂提舉玉局觀復朝奉郎；建中靖國元年卒于常州年六十六 | 确定（1100/1101） |
# | 文章评价 | 嘗自謂作文如行雲流水初無定質但常行於所當行止於所不可不止；其體渾涵光芒雄視百代有文章以來蓋亦鮮矣 | 确定 |
# | 苏门诸人 | 一時文人如黃庭堅晁補之秦觀張耒陳師道舉世未之識軾待之如朋儔未嘗以師資自予也 | 确定 |
# | 身后 | 高宗卽位贈資政殿學士謂爲文章之宗親制集贊；遂崇贈太師諡文忠 | 确定 |
# | 词作文本 | 念奴娇水调歌头江城子二首定风波等取维基文库单篇页通行公版文本；念奴娇异文极多（浪聲沈/穿空/拍岸/强虜/人間如寄等），从御定词谱系统并注异文层 | 通行本层；未逐字核对善本异文 |
# | 关西大汉条 | 幕士論柳蘇詞：學士詞須關西大漢鐵綽板唱大江東去——原題吹劍錄；本次未在维基文库定位吹剑录单行页，經清·沈雄《古今词话》（维基文库）转引实取得手 | 笔记转引层，出处链已注明 |
# | 荔支叹 | 无独立单篇页；经维基文库 API 检索定位页名「荔支嘆」（出自東坡全集），全文实取得手 | 确定 |
