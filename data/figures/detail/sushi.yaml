    quote: 学士词，须关西大汉，铁绰板，唱大江东去。
    text_display: excerpt
    comment: 幕士对比柳永晓风残月与苏轼大江东去之语，确立苏词豪放一派的大众印象。出处链说明：吹剑录单行页本次未能在维基文库定位，此条经维基文库清·沈雄古今词话（幕士论柳苏词则）转引实取得手，属转引层；严羽沧浪诗话无直接可比条目未采。
