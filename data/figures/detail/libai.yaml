  - stage: 乱世流离
    stage_order: 21
    title: 宋若思辟参谋，依李阳冰于当涂
    date:
      text: 约759—761年之间
      year: 759
      range_end: 761
      precision: 范围
    place: 寻阳、金陵、当涂
    summary: 新唐书载会赦还寻阳坐事下狱，宋若思将吴兵三千赴河南道寻阳释其囚辟为参谋未几辞职。后贫病交加，往依族叔当涂县令李阳冰。代宗立以左拾遗召而白已卒。
    source_ids: [src-xts-vol202]
  - stage: 乱世流离
    stage_order: 22
    title: 病逝当涂，葬东山麓
    date:
      text: "约762年"
      year: 762
      precision: 约
    place: 当涂
    summary: 新唐书谓卒年六十余，临终以诗文稿托李阳冰编集作序。初葬当涂龙山之东麓；元和末宣歙观察使范传正祭墓改葬青山，访后裔惟二孙女嫁为民妻。旧唐书则称饮酒过度醉死于宣城，与当涂病卒说并存。
    confidence: 存疑
    dispute: 死地死因两唐书相牾：当涂病卒为主流（李阳冰序托稿事可佐），宣城醉死说记录存疑；捉月骑鲸为文学传说不足为据。
    source_ids: [src-xts-vol202, src-jts-vol190b]

works:
  - work_id: huanghelou-song-menghaoran
    title: 黄鹤楼送孟浩然之广陵
    alt_titles: []
    genre: 七言绝句
    date:
      text: 约730年前后
      year: 730
      precision: 约
    place: 江夏黄鹤楼
    context: 开元年间游历荆楚，送别孟浩然东下扬州。故人西辞黄鹤楼烟花三月下扬州孤帆远影碧空尽唯见长江天际流。
    attribution: 确凿
    excerpt: 故人西辞黄鹤楼，烟花三月下扬州。孤帆远影碧空尽，唯见长江天际流。
    text_display: full
    themes: [送别, 江景]
    influence: 送别诗中情景交融的典范之作。
    source_ids: [src-quantangshi-li]

  - work_id: jing-ye-si
    title: 静夜思
    alt_titles: [夜思]
    genre: 五言绝句
    date:
      text: 约726年
      year: 726
      precision: 约
    place: 扬州（一说）
    context: 客居扬州旅舍秋夜望月思乡而作，系年从扬州旅居说。
    attribution: 确凿
    excerpt: 床前明月光，疑是地上霜。举头望明月，低头思故乡。
    text_display: full
    themes: [思乡]
    influence: 传诵最广的唐诗之一。
    confidence: 存疑
    dispute: 宋刊本首句作床前看月光第三句作举头望山月，今通行文本为明清改定；创作地点与年份均系推定。
    source_ids: [src-quantangshi-li]
  - work_id: shu-dao-nan
    title: 蜀道难
    alt_titles: []
    genre: 乐府
    date:
      text: 创作年代众说纷纭，约在天宝初见贺知章之前
      precision: 未知
    place: ""
    context: 新唐书载贺知章读其文而叹谪仙人，旧题此诗即所读之篇；主旨或送友人入蜀、或讽时事、或咏蜀道之险，历代聚讼。
    attribution: 确凿
    excerpt: 噫吁嚱危乎高哉！蜀道之难难于上青天。蚕丛及鱼凫开国何茫然。尔来四万八千岁不与秦塞通人烟。
    text_display: excerpt
    themes: [山水, 乐府]
    influence: 想落天外的乐府绝唱，殷璠称其奇之又奇。
    confidence: 存疑
    dispute: 系年有开元末、天宝初诸说；作意自唐以来无定论。
    source_ids: [src-xts-vol202, src-quantangshi-li]
  - work_id: qingpingdiao
    title: 清平调词三首
    alt_titles: [清平调]
    genre: 乐府词
    date:
      text: 约743年
      year: 743
      precision: 约
    place: 长安兴庆宫沉香亭
    context: 新唐书载玄宗沉香亭意有所感欲得白为乐章，白醉中援笔成文婉丽精切。云想衣裳花想容即其一。
    attribution: 确凿
    excerpt: 云想衣裳花想容，春风拂槛露华浓。若非群玉山头见，会向瑶台月下逢。
    text_display: full
    themes: [应制, 咏牡丹]
    influence: 应制诗中传诵最广者，亦为力士脱靴传闻之背景。
    confidence: 存疑
    dispute: 三首是否一时一地所作及文字小异尚有讨论；应制情境据新唐书。
    source_ids: [src-xts-vol202, src-quantangshi-li]
  - work_id: xing-lu-nan
    title: 行路难三首（其一）
    alt_titles: []
    genre: 乐府
    date:
      text: 约744年离京之际
      year: 744
      precision: 约
    place: 长安
    context: 赐金放还前后，抒怀才不遇与自信突破交织之情。
    attribution: 确凿
    excerpt: 金樽清酒斗十千，玉盘珍羞直万钱。停杯投箸不能食，拔剑四顾心茫然。长风破浪会有时，直挂云帆济沧海。
    text_display: full
    themes: [抒怀]
    influence: 长风破浪成为士人困境自励的千古名句。
    source_ids: [src-quantangshi-li]
  - work_id: yue-xia-du-zhuo
    title: 月下独酌四首（其一）
    alt_titles: []
    genre: 五言古诗
    date:
      text: 约744年
      year: 744
      precision: 约
    place: 长安
    context: 供奉翰林末期孤独处境的自写照，独酌邀月成三人。
    attribution: 确凿
    excerpt: 花间一壶酒，独酌无相亲。举杯邀明月，对影成三人。
    text_display: full
    themes: [孤独, 月]
    influence: 以月为友的浪漫想象代表。
    source_ids: [src-quantangshi-li]
  - work_id: mengyou-tianmu
    title: 梦游天姥吟留别
    alt_titles: [梦游天姥山别东鲁诸公]
    genre: 七言古诗
    date:
      text: 约745年
      year: 745
      precision: 约
    place: 东鲁
    context: 离开长安后由东鲁将游吴越，梦游天姥而留别诸公。安能摧眉折腰事权贵使我不得开心颜为其宣言。
    attribution: 确凿
    excerpt: 海客谈瀛洲，烟涛微茫信难求。越人语天姥，云霞明灭或可睹。……安能摧眉折腰事权贵，使我不得开心颜！
    text_display: excerpt
    themes: [梦境, 傲岸]
    influence: 其人格宣言与浪漫主义笔法的高峰。
    confidence: 存疑
    dispute: 系年从天宝四载通说，亦有异说。
    source_ids: [src-quantangshi-li]

  - work_id: jiang-jin-jiu
    title: 将进酒
    alt_titles: []
    genre: 乐府
    date:
      text: 约天宝年间，通说约752年
      year: 752
      precision: 约
    place: 嵩山颍阳山居（一说）
    context: 与友人岑勋应元丹丘邀宴饮，怀才不遇而纵酒高歌。天生我材必有用千金散尽还复来。
    attribution: 确凿
    excerpt: 君不见黄河之水天上来，奔流到海不复回。……天生我材必有用，千金散尽还复来。
    text_display: excerpt
    themes: [饮酒, 抒怀]
    influence: 豪放诗风的极致代表。
    confidence: 存疑
    dispute: 作年有开元说与天宝说之争，地点亦有嵩山、颍阳诸异说。
    source_ids: [src-quantangshi-li]
  - work_id: wang-lushan-pubu
    title: 望庐山瀑布（其二）
    alt_titles: []
    genre: 七言绝句
    date:
      text: 约天宝乱前，或谓开元间初游庐山所作
      year: 750
      precision: 约
    place: 庐山
    context: 遥望香炉峰瀑布，飞流直下三千尺疑是银河落九天。与永王事前后转侧匡庐的行迹相合。
    attribution: 确凿
    excerpt: 日照香炉生紫烟，遥看瀑布挂前川。飞流直下三千尺，疑是银河落九天。
    text_display: full
    themes: [山水]
    influence: 咏庐山瀑布的绝唱。
    confidence: 存疑
    dispute: 系年有开元与天宝两说。
    source_ids: [src-quantangshi-li]
  - work_id: zao-fa-baidicheng
    title: 早发白帝城
    alt_titles: [下江陵]
    genre: 七言绝句
    date:
      text: 约759年春
      year: 759
      precision: 约
    place: 白帝城至江陵江段
    context: 长流夜郎中道遇赦，乘舟东还江陵，轻快如释重负。两岸猿声啼不住轻舟已过万重山。
    attribution: 确凿
    excerpt: 朝辞白帝彩云间，千里江陵一日还。两岸猿声啼不住，轻舟已过万重山。
    text_display: full
    themes: [遇赦, 江行]
    influence: 其晚年命运转折的诗化见证。
    confidence: 存疑
    dispute: 归属主流定为李白，然亦有学者主张非李白作；系年从乾元二年赦归通说。
    source_ids: [src-quantangshi-li]

