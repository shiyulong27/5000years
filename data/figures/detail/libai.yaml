relations:
  - relation_type: 挚友
    target_id: dufu
    direction: 双向
    period:
      text: 约744—745年订交，此后终身以诗相忆
      year: 744
      precision: 约
    evidence: 天宝三载离京后与杜甫相遇订交，同游梁宋东鲁；杜甫存怀李白诗十余首，有醉眠秋共被携手日同行之句。两唐书并称李杜齐名。
    source_ids: [src-jts-vol190b, src-xts-vol202, src-quantangshi-li]
  - relation_type: 社群
    target_id: wangwei
    direction: 双向
    period:
      text: 同处开元天宝长安诗坛，生卒几乎相同
      year: 701
      range_end: 761
      precision: 范围
    evidence: 李王同为盛唐代表诗人且有共同友人圈，然现存史料无二人直接交往记载，后世常并称对照。
    inferred: true
    confidence: 存疑
    dispute: 二人无交往记录本身即学界常讨论的话题，任何交往传闻均属附会。
    source_ids: [src-jts-vol190b]
  - relation_type: 后世附会
    target_id: guoziyi
    direction: 双向
    period:
      text: 传说谓开元间并州相识
      year: 735
      precision: 约
    evidence: 新唐书载白尝救犯法之子仪、子仪后请解官赎白之罪。此段因果时序难合，自宋以来学者多疑为传闻，故按规范标为后世附会层。
    inferred: true
    confidence: 有争议
    dispute: 正史有载而事迹可信度存疑，属「史源存疑的附会叙事」典型个案。
    source_ids: [src-xts-vol202]

reception:
  - era: 同时代
    evaluator: 贺知章
    quote: 子，谪仙人也！
    text_display: excerpt
    comment: 新唐书所记知章读其文后的惊呼，谪仙人由此成为李白终生标签。
    source_ids: [src-xts-vol202]
  - era: 同时代
    evaluator: 杜甫
    quote: 白也诗无敌，飘然思不群。笔落惊风雨，诗成泣鬼神。
    text_display: excerpt
    comment: 友人视角中最权威的同时代评价，出自杜甫寄李十二白二十韵与春日忆李白。
    source_ids: [src-quantangshi-li]
  - era: 历代批评
    evaluator: 韩愈
    quote: 李杜文章在，光焰万丈长。
    text_display: excerpt
    comment: 中唐以后李杜并举的经典表述，出自调张籍，奠定二人并尊格局。
    source_ids: [src-quantangshi-li]
  - era: 近现代学术
    evaluator: 学界综述
    quote: ""
    text_display: none
