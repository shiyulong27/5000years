# | 永王事 | 白在宣州谒见辟为从事 | 转侧宿松匡庐间璘辟为府僚佐 | 确定 |
# | 流放遇赦 | 长流夜郎后遇赦得还 | 有诏长流夜郎会赦还寻阳 | 确定；未至夜郎说据早发白帝城系年（存疑） |
