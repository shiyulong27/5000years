relations:
  - relation_type: 社群
    target_id: wangbo
    direction: 双向
    period:
      text: 高宗朝四杰并称形成期（约650—680年之间）
      year: 650
      range_end: 680
      precision: 范围
    evidence: 旧唐书杨炯附段：炯與王勃盧照鄰駱賓王以文詞齊名海內稱為王楊盧駱亦號為四傑，楊炯聞之謂人曰吾愧在盧前恥居王後；新唐书王勃段同载并称与杨炯语，且载崔融张说评四杰文。并称系同时代公论而非后世追封。
    confidence: 确定
    dispute: 四杰并称为文名齐名之目，四人实际交往深浅史料有限；排序王杨卢骆与杨炯自陈之愧耻为文学史著名公案，此处仅按社群关系著录。
    source_ids: [src-jts-vol190a, src-xts-vol201]

reception:
  - era: 同时代
    evaluator: 武则天（读讨武曌檄）
    quote: 宰相安得失此人！
    text_display: excerpt
    comment: 新唐书所载女皇读檄至一抔之土未干六尺之孤安在矍然而问、闻出自宾王后的感叹——被讨伐者对讨伐者的最高认可，代表檄文在其时代的即时冲击力。
    source_ids: [src-xts-vol201]
  - era: 同时代
    evaluator: 时论（见旧唐书本传）
    quote: 尝作《帝京篇》，当时以为绝唱。
    text_display: excerpt
    comment: 旧唐书实录的同时代评价；又载则天素重其文遣使求之——政敌政权对其文学价值的持续追认，同时代层面罕见的双重背书。
    source_ids: [src-jts-vol190a]
  - era: 历代批评
    evaluator: 杨炯、崔融、张说（评四杰，见两唐书）
    quote: 吾愧在卢前，耻居王后。……勃文章宏放，非常人所及。
    text_display: excerpt
    comment: 四杰内部排序之争（杨炯愧耻之语）与开元名相张说的再裁定（旧唐书作盈川文思如悬河注水酌之不竭既优于卢亦不减王），奠定四杰并称千年讨论的基本框架；两唐书文字略异，均为公版原文实取。
    source_ids: [src-jts-vol190a, src-xts-vol201]
  - era: 近现代学术
    evaluator: 学界综述
    quote: ""
    text_display: none
    comment: 近现代研究聚焦生年三说与结局诸说的考辨、讨武曌檄的文体与政治动员力量、其在五言律诗与七言歌行定型中的贡献、以及郤云卿十卷本文集的流传系统等议题；具体论著引文须取得许可后补入，本卷暂作中立转述。
    source_ids: []
  - era: 教科书与公共文化
    evaluator: 通用语文教育与大众传播
    quote: ""
    text_display: none
    comment: 咏鹅为国民级启蒙诗，长期位列义务教育课标优秀诗文背诵推荐篇目；在狱咏蝉入选唐诗三百首并常见于中学读本，无人信高洁谁为表予心为咏物寄怀名句；教材篇目随学期变动录入时须另行核验。
    source_ids: []
  - era: 影视与网络
    evaluator: 大众传播综述
    quote: ""
    text_display: none
    comment: 七岁咏鹅神童与一篇檄文骂醒女皇、兵败不知所终的传奇终局使其成为大众文化常见素材；相关影视改编暂不著录具体作品以免权利状态不明。
