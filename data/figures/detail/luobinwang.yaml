# | 早期仕历 | 新唐书：初为道王府属尝使自言所能宾王不答；曆武功主簿；裴行儉為洮州總管表掌書奏不應調長安主簿 | 确定（各任年份正史无载） |
# | 下狱与贬临海 | 在狱咏蝉并序（维基文库单篇页实取）；贬任两书均有而贬因互异：旧唐书坐贓左遷臨海丞／新唐書數上疏言事下除臨海丞 | 确定被贬；贬因两说并存 |
# | 讨武曌檄与则天反应 | 新唐书：為敬業傳檄天下斥武后罪后讀但嘻笑至一抔之土未乾六尺之孤安在矍然曰誰為之或以賓王對后曰宰相安得失此人 | 确定（新唐书口径；旧唐书仅言敬业军中书檄皆宾王之词） |
# | 结局 | 旧唐书：敬業敗伏誅／新唐書：敬業敗賓王亡命不知所之 | 两唐书矛盾，无定论，按异说著录 |
# | 身后文集 | 旧唐书：則天素重其文遣使求之有兗州人郤雲卿集成十卷盛傳於世；新唐書：中宗昌詔求其文得數百篇 | 确定 |
# | 四杰并称 | 旧唐书杨炯附段與新唐书王勃段：炯與王勃盧照鄰駱賓王以文詞齊名海內稱為王楊盧駱亦號為四傑；楊炯曰吾愧在盧前恥居王後 | 确定 |
# | 诗文文本 | 为徐敬业讨武曌檄（古文观止卷七）、在狱咏蝉并序（唐诗三百首系统）、於易水送人／詠鵝／夕次蒲類津（全唐诗卷079）、帝京篇／疇昔篇（卷077）、送鄭少府入遼共賦俠客遠從戎／久客臨海有懷（卷078）均经维基文库单篇页逐字实取 | 公版原文层；异文未深校善本 |
# | 咏鹅七岁传说 | 正史仅言七岁能赋诗未指咏鹅；全唐诗卷079该篇原注七歲時作；七岁咏鹅故事细节出后世笔记层 | 作品文本确定；七岁本事属传说层存疑 |
# | 字观光 | 两唐书本传均不载其字；观光之说出自后世（通行谓取义《易·观》观国之光），本次未实取原典 | 笔记层存疑 |
# | 生年 | 约619／约626／约640诸说并存，均非正史明载 | 异说并存，无定论 |
