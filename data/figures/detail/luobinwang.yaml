    dispute: 七岁作咏鹅属传说层——正史无此文，全唐诗原注为清人据传闻所加，故事细节定型于后世笔记；著作权本身亦有讨论。本卷按文本确定、本事存疑著录。
    source_ids: [src-xts-vol201, src-luobinwangji]

  # ── 阶段二：入道王府与仕途蹇涩 ────────────────────
  - stage: 入道王府与仕途蹇涩
    stage_order: 3
    title: 初为道王府属，不答才所能
    date:
      text: 太宗末至高宗初年，具体年份无考
      precision: 未知
    place: 长安
    summary: 新唐书载其初为道王府属，尝使自言所能，宾王不答——道王李元庆命僚属自陈才器以求荐拔，他拒绝自我标榜，傲岸之气见于行事。
    confidence: 存疑
    dispute: 入道王府年份正史无载，系据其生平次第推定于高宗初年。
    source_ids: [src-xts-vol201]
  - stage: 入道王府与仕途蹇涩
    stage_order: 4
    title: 作帝京篇，当时以为绝唱
    date:
      text: 高宗朝，具体年份无考
      precision: 未知
    place: 长安
    summary: 旧唐书载其少善属文尤妙于五言诗，尝作帝京篇，当时以为绝唱。此篇以七言歌行铺写帝都气象与贵游骄奢，收束于寒士不遇之慨，是初唐长篇歌行的代表作。
    source_ids: [src-jts-vol190a, src-luobinwangji]
  - stage: 入道王府与仕途蹇涩
    stage_order: 5
    title: 历武功主簿，自述十年不调
    date:
      text: 高宗朝前期，具体年份无考
      precision: 未知
    place: 武功
    summary: 新唐书载历武功主簿。畴昔篇自叙少年重英俠弱歲賤衣冠以下，有十年不調爲貧賤百日屢遷隨倚伏之叹，可见其沉沦下僚之久。
    confidence: 存疑
    dispute: 任武功主簿年份正史无载；畴昔篇系自传体长诗，所叙职历次第与正史互证而细节难逐年坐实。
    source_ids: [src-xts-vol201, src-luobinwangji]
  - stage: 入道王府与仕途蹇涩
    stage_order: 6
    title: 裴行俭表掌书奏不应，调长安主簿
    date:
      text: 高宗朝后期（旧唐书系于高宗末）
      year: 676
      range_end: 680
      precision: 范围
    place: 长安
    summary: 新唐书载裴行俭为洮州总管表其掌书奏，不应，调长安主簿；旧唐书则径记高宗末为长安主簿。拒不应辟而仍入京畿任卑职，仕路始终偃蹇。
    confidence: 存疑
    dispute: 调任长安主簿的年份正史不系年，旧唐书仅称高宗末，此处按通说框定于高宗朝后期数年内。
    source_ids: [src-xts-vol201, src-jts-vol190a]
  - stage: 入道王府与仕途蹇涩
    stage_order: 7
    title: 远使西南与边塞之行
    date:
      text: 高宗朝，具体年份无考
      precision: 未知
    place: 蜀中、蒲类一带
    summary: 畴昔篇自述脂車秣馬辭鄉國縈轡西南使邛僰，又有蜀路何悠悠岷峯阻且修之句；夕次蒲類津写二庭歸望斷萬里客心愁的边地秋色。学界据此通说他曾从军或奉使西北、游宦蜀中。
    confidence: 存疑
    dispute: 行迹据自叙诗与边塞诗系地推定，正史不载；从军西域说与入蜀游宦说的路线细节学界尚有分歧，此处仅按诗文自证著录。
    source_ids: [src-luobinwangji]

  # ── 阶段三：狱中咏蝉与贬临海 ──────────────────────
  - stage: 狱中咏蝉与贬临海
    stage_order: 8
    title: 数上疏言事，触忤武后
    date:
      text: 武后当政时期，具体年份无考
      precision: 未知
    place: 长安
    summary: 新唐书载武后时数上疏言事——屡次直言进谏为其招致祸端的前因，与其后下狱、贬黜构成因果链。旧唐书于此节不书，仅以坐赃二字定谳。
    source_ids: [src-xts-vol201, src-jts-vol190a]
  - stage: 狱中咏蝉与贬临海
    stage_order: 9
    title: 下狱，狱中咏蝉
    date:
      text: 约678年（仪凤三年前后，通说）
      year: 678
      precision: 约
    place: 长安御史台狱
    summary: 在狱咏蝉并序作于狱中。序自称僕失路艱虞遭時徽纆；诗云露重飛難進風多響易沉無人信高潔誰為表予心——以秋蝉自喻，高洁之鸣无人听，成为唐人咏物寄托的典范之作。
    confidence: 存疑
    dispute: 系年从学界通说约仪凤三年（678），亦有前后一两年异说；下狱罪名两唐书均未明言（旧唐书坐赃语或即指此案，然无佐证细节），狱之所在据序文禁所指为法厅事推定在长安。
    source_ids: [src-luobinwangji, src-xts-vol201]
  - stage: 狱中咏蝉与贬临海
    stage_order: 10
    title: 左迁临海丞
    date:
      text: 约679年前后（系年推定）
      year: 679
      precision: 约
    place: 临海
    summary: 出狱后被贬为临海丞——旧唐书作坐贓左遷臨海丞，新唐书作數上疏言事下除臨海丞。两书对贬因的记载截然不同：一为贪赃案，一为直言获罪，后世评价的分野正在于此。
    confidence: 存疑
    dispute: 贬因两唐书互异（坐赃／言事），无第三方史料裁断；到任年份系据下狱系年顺推。
    source_ids: [src-jts-vol190a, src-xts-vol201]
  - stage: 狱中咏蝉与贬临海
    stage_order: 11
    title: 怏怏失志，弃官而去
    date:
      text: 约680年前后（临海任内弃官）
      year: 680
      precision: 约
    place: 临海
    summary: 旧唐书怏怏失誌棄官而去；畴昔篇亦有挂冠裂冕已辭榮南畝東臯事耕鑿之句，久客临海有怀写天涯非日觀地屺望星樓的凄断。弃官之后行踪转入江湖。
    confidence: 存疑
    dispute: 弃官年份系据贬任时间顺推，正史不载确年。
    source_ids: [src-jts-vol190a, src-luobinwangji]

  # ── 阶段四：扬州起兵与讨武曌檄 ────────────────────
  - stage: 扬州起兵与讨武曌檄
    stage_order: 12
    title: 文明中赴扬州，署徐敬业府属
    date:
      text: "684年（文明中／光宅元年）"
      year: 684
      precision: 精确
    place: 扬州
    summary: 文明中与徐敬业于扬州作乱，敬业军中书檄皆宾王之词（旧唐书）；新唐书作徐敬业乱署宾王为府属。被贬弃置十余年的老诗人投入了反对武则天的武装起事。
    source_ids: [src-jts-vol190a, src-xts-vol201]
  - stage: 扬州起兵与讨武曌檄
    stage_order: 13
    title: 草讨武曌檄，女皇读之动容
    date:
      text: "684年"
      year: 684
      precision: 精确
    place: 扬州
    summary: 为敬业传檄天下斥武后罪。新唐书载后讀但嘻笑至一抔之土未乾六尺之孤安在矍然曰誰為之或以賓王對后曰宰相安得失此人——一篇檄文的敌手成了它最深的知音，此事成为中国文学史上最著名的接受瞬间。
    source_ids: [src-xts-vol201, src-luobinwangji]

  # ── 阶段五：兵败与下落不明 ────────────────────────
  - stage: 兵败与下落不明
    stage_order: 14
    title: 兵败，结局成谜
    date:
      text: "684年末兵败之后"
      year: 684
      precision: 约
    place: 扬州一线
    summary: 徐敬业兵败，骆宾王的下落从此没有定论：旧唐书作敬業敗伏誅，新唐书作敬業敗賓王亡命不知所之。后世更有投水死、逃匿为僧诸说流传，均不出正史之外。
    confidence: 存疑
    dispute: 结局异说并存——被杀（旧唐书伏诛）、逃匿不知所终（新唐书）、投水、为僧诸说均见于史籍或笔记传闻，无一可确证；本卷按两唐书原文并列，绝不写成定论。
    source_ids: [src-jts-vol190a, src-xts-vol201]
  - stage: 兵败与下落不明
    stage_order: 15
    title: 诏求遗文，郤云卿集成十卷
    date:
      text: 武则天当政末至中宗复位之际
      year: 705
      range_end: 710
      precision: 范围
    place: ""
    summary: 旧唐书载則天素重其文遣使求之，有兗州人郤雲卿集成十卷盛傳於世；新唐书作中宗昌詔求其文得數百篇。敌对阵营的胜利者回头搜求败党文章——这是对其文学价值的最终裁决。
    confidence: 存疑
    dispute: 诏求其文的时间两书系于不同君主名下（则天遣使／中宗下诏），郤云卿编集成书的准确年份亦无载。
    source_ids: [src-jts-vol190a, src-xts-vol201]

works:
  - work_id: wei-xu-jingye-tao-wuzhao-xi
    title: 为徐敬业讨武曌檄
    alt_titles: [代李敬业传檄天下文, 讨武曌檄]
    genre: 骈文（檄文）
    date:
      text: "684年"
      year: 684
      precision: 精确
    place: 扬州
    context: 徐敬业起兵时的动员檄文，前半历数武氏罪状，后半申明大义号召勤王，气势与辞采兼极，是骈文战斗功能的巅峰示范。
    attribution: 确凿
    excerpt: 入门见嫉，蛾眉不肯让人；掩袖工谗，狐媚偏能惑主。……一抔之土未干，六尺之孤何托？……请看今日之域中，竟是谁家之天下！
    text_display: excerpt
    themes: [檄文, 讨武, 骈文]
    influence: 武则天读至六尺之孤一联矍然动容问谁为之，叹宰相安得失此人；檄文作为政治动员文本的经典，千年来传诵不衰。
    confidence: 确定
    dispute: 本传引文作六尺之孤安在，檄文通行本作何托，异文并存；篇题与归属历代略有异说（代李敬业／为徐敬业），文本归属无争议。
    source_ids: [src-luobinwangji]

  - work_id: zai-yu-yong-chan
    title: 在狱咏蝉（并序）
    alt_titles: [在狱咏蝉]
    genre: 五言律诗（并序）
    date:
      text: 约678年狱中作（通说）
      year: 678
      precision: 约
    place: 长安狱中
    context: 序自陈失路艰虞遭时徽纆，诗以秋蝉的高洁难伸自喻，露重风多是处境，无人信高洁是悲音，物我合一的咏物范式。
    attribution: 确凿
    excerpt: 西陆蝉声唱，南冠客思侵。……露重飞难进，风多响易沉。无人信高洁，谁为表予心。
    text_display: excerpt
    themes: [咏物寄怀, 狱中悲愤, 高洁自守]
    influence: 与虞世南垂緌饮清露、李商隐本以高难饱并称唐人咏蝉三绝；此首情最激切，入选唐诗三百首。
    confidence: 确定
    dispute: 系年从通说约仪凤年间，确年无载。
    source_ids: [src-luobinwangji]

