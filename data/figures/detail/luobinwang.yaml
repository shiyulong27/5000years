  - stage: 义乌少年与咏鹅传说
    stage_order: 2
    title: 七岁能赋诗，咏鹅传说
    date:
      text: 幼年（约7岁时），具体年份不可考
      precision: 未知
    place: 义乌
    summary: 新唐书本传记七岁能赋诗；全唐诗卷079咏鹅篇下原注七歲時作，鹅鹅鹅曲项向天歌遂成为其神童之名的标志。惟正史只言能赋诗而未指实此篇。
