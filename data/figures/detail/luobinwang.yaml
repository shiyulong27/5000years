    context: 鹅鹅鹅曲项向天歌，白毛浮绿水红掌拨清波——状物如画，声色兼备，是中国儿童启蒙背诵的第一批古诗之一。
    attribution: 存疑
    excerpt: 鹅，鹅，鹅，曲项向天歌。白毛浮绿水，红掌拨清波。
    text_display: full
    themes: [咏物, 童趣]
    influence: 国民启蒙第一诗级别的传播广度，长期入选义务教育课标推荐背诵篇目。
    confidence: 存疑
    dispute: 七岁作咏鹅属传说层——两唐书仅言七岁能赋诗未指实此篇，全唐诗卷079原注七歲時作为清人所加，故事细节定型于后世笔记；本次未实取更早出处原典，故著作权按存疑著录。
    source_ids: [src-luobinwangji]

