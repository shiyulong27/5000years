    title: 生于婺州义乌
    date:
      text: "约626年（一说619年或640年，诸说不一）"
      year: 626
      precision: 约
    place: 婺州义乌
    summary: 骆宾王生于婺州义乌（今浙江义乌）。籍贯两唐书一致明载，惟生年正史不载，诸家推算相差可达二十余年。
    confidence: 存疑
    dispute: 生年诸说不一——约619年说、约626年说、约640年说并行，均系后人据仕历与诗文倒推，无正史依据；本卷从figures.yaml登记的约626年为叙述基准，不作定论。
