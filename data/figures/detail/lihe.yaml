# 李贺全景详卷（schema v1）
# 史料审计表（TASK-003 批次；来源登记见 data/sources.yaml）：
#
# | 事实点 | 新唐书·卷203·文艺下·李贺传(J) | 李商隐·李贺小传(L) | 结论与置信 |
# |---|---|---|---|
# | 家世籍贯 | 字長吉系出鄭王後 | 无载 | 确定(J)；宗室远支家道中落系通识推论 |
# | 籍里 | 无载 | 无载 | 福昌昌谷（今河南宜阳）系历代通行说法，正史无载→存疑 |
# | 七岁赋高轩过 | 七歳能辭章韓愈皇甫湜始聞未信過其家使賀賦詩援筆輒就如素構自目曰髙軒過二人大驚 | 最先為昌黎韓愈所知 | 仅J载且七岁作说近传奇→存疑（本事层） |
# | 形貌 | 纖瘦通眉長指爪能疾書 | 細瘦通眉長指爪能苦吟疾書 | 确定（J/L互证） |
# | 锦囊觅句 | 每旦日騎弱馬從小奚奴背古錦囊遇所得書投囊中暮歸足成之 | 騎距驢背一古破錦囊遇有所得即書投囊中 | 确定；弱马/距驴细节两书互异 |
# | 呕心 | 母探囊怒曰是兒要嘔出心乃已耳 | 太夫人曰是兒要當嘔出心始已耳 | 确定（J/L互证） |
# | 避父讳 | 以父名晉肅不肯舉進士愈為作諱辨然卒亦不就舉 | 无载 | 确定(J)；讳辨系年据元和间韩愈行迹推定 |
# | 官职 | 為協律郎 | 位不過奉禮太常 | 两书矛盾：协律郎/奉礼郎并存记录→有争议 |
# | 享年 | 卒年二十七 | 長吉生二十四年 | 两书矛盾→有争议；L1从约790—816 |
# | 临终白玉楼 | 无载 | 帝成白玉樓立召君為記 | 仅L载且自述出自姊嫁王氏口述→传说层 |
# | 身后集 | 賀亦早世故其詩歌世傳者鮮焉 | 沈子明家所餘四卷而已；杜牧為《李長吉集序》 | 确定（J/L互证） |
