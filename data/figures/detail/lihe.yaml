    evaluator: 韩愈、皇甫湜及长安乐工
    quote: 援筆輒就如素構……二人大驚，自是有名。
    text_display: excerpt
    comment: 新唐书总评其辭尚奇詭所得皆驚邁絶去翰墨畦逕當時無能效者，樂府數十篇雲韶諸工皆合之絃管——生前诗名兼具文人激赏与乐工传唱两个维度。
    source_ids: [src-xts-vol203]
  - era: 历代批评
    evaluator: 杜牧（《李长吉歌诗叙》）
    quote: 骚之苗裔，理虽不及，辞或过之。
    text_display: excerpt
    comment: 杜牧受沈子明之托为李贺遗诗作序，以骚之苗裔定位其承续楚骚的奇诡传统；该评价为历代李贺批评的总纲。《李长吉歌诗叙》尚未登记入 sources.yaml，出处待登记后补 source_ids。
    source_ids: []
