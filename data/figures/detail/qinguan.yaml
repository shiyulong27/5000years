# | 文风与身后 | 观长于议论文丽而思深；轼闻之叹少游不幸死道路哀哉世岂复有斯人乎 | 确定 |
# | 词作文本 | 鹊桥仙踏莎行等取通行公版文本（淮海居士长短句系统），未逐字核对善本异文 | 通行本层；异文未深校，标存疑说明 |
# | 苏轼书扇事 | 通行说法：苏轼绝爱踏莎行尾两句书于扇曰少游已矣虽万人何赎——题惠洪冷斋夜话；已在维基文库冷斋夜话卷一卷三检索未获该条原文 | 笔记层存疑，出处待核 |
# | 满庭芳本事 | 会稽艳遇说与苏轼戏称山抹微云君事均出宋人笔记层 | 笔记层存疑 |
