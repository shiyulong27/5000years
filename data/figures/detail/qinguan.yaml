relations:
  - relation_type: 师承
    target_id: sushi
    direction: 双向
    period:
      text: 约1077—1078年徐州订交至1100年秦观卒
      year: 1077
      range_end: 1100
      precision: 范围
    evidence: 本传明载见苏轼于徐，为赋黄楼，轼以为有屈宋才；又介其诗于王安石；元祐初轼以贤良方正荐于朝；同卷黄庭坚传称与张耒晁补之秦观俱游苏轼门天下称为四学士；及死轼叹曰少游不幸死道路哀哉世岂复有斯人乎。
    source_ids: [src-songshi-vol444]

reception:
  - era: 同时代
    evaluator: 苏轼
    quote: 少游不幸死道路，哀哉！世岂复有斯人乎！
    text_display: excerpt
    comment: 本传直引的苏轼闻讣之叹，代表师门对秦观人品文品的最高评价。
    source_ids: [src-songshi-vol444]
  - era: 同时代
    evaluator: 王安石
    quote: 清新似鲍、谢。
    text_display: excerpt
    comment: 本传载安石读其诗后的评语，说明秦观早年已获新旧两党文坛领袖的一致推许。
    source_ids: [src-songshi-vol444]
  - era: 历代批评
    evaluator: 冯煦《蒿庵论词》
    quote: 淮海、小山，真古之伤心人也。其淡语皆有味，浅语皆有致，求之两宋词人，实罕其匹。
    text_display: excerpt
    comment: 清代词论的代表性定位——伤心人与词心之说（冯氏又谓他人之词词才也少游词心也）奠定秦观婉约正宗、以情致胜的千年评价框架；蒿庵论词为清代公版文献，文本经网络公版全文库比对核验。
    confidence: 确定
    source_ids: []
  - era: 近现代学术
    evaluator: 学界综述
    quote: ""
    text_display: none
    comment: 近现代研究聚焦其词境由凄婉转凄厉的分期、苏门交游与党争关系、词集版本源流（淮海居士长短句系统）等议题；具体论著引文须取得许可后补入，本卷暂作中立转述。
    source_ids: []
  - era: 教科书与公共文化
    evaluator: 通用语文教育与大众传播
    quote: ""
    text_display: none
    comment: 鹊桥仙纤云弄巧与踏莎行郴州旅舍长期入选语文教材与大众读本，两情若是久长时成为国民级爱情格言；教材篇目随学期变动录入时须另行核验当期版本。
    source_ids: []
  - era: 影视与网络
    evaluator: 大众传播综述
    quote: ""
    text_display: none
    comment: 影视剧中的秦观形象多为苏门轶事的戏剧化敷演，不作信史依据；网络传播集中于其爱情名句，暂无可靠专门条目可引。
