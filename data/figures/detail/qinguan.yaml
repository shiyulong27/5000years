works:
  - work_id: que-qiao-xian-xian-yun-nong-qiao
    title: 鹊桥仙·纤云弄巧
    alt_titles: []
    genre: 词（小令）
    date:
      text: 创作年代无定说
      precision: 未知
    place: ""
    context: 咏七夕牛女而翻出一层：金风玉露一相逢便胜却人间无数，将一年一会写得胜过人间朝暮相守。
    attribution: 确凿
    excerpt: 纤云弄巧，飞星传恨，银汉迢迢暗度。……两情若是久长时，又岂在朝朝暮暮。
    text_display: excerpt
    themes: [七夕, 恋歌, 议论入词]
    influence: 中国爱情词的巅峰名句，两情若是久长时成为千古爱情箴言。
    confidence: 有争议
    dispute: 牛女本事的传统解读历来有两路：或谓翻恨为慰、化短为长是对牛女悲剧的超越性礼赞；亦有学者主张词中自有寄托非专咏七夕。文本异文与系年均无定论。
    source_ids: [src-huaihaiji]

  - work_id: ta-suo-xing-cheng-zhou-lv-she
    title: 踏莎行·郴州旅舍
    alt_titles: [踏莎行·雾失楼台]
    genre: 词（小令）
    date:
      text: 约1096—1097年，郴州贬所
      year: 1096
      range_end: 1097
      precision: 范围
    place: 郴州旅舍
    context: 削秩徙郴后所作，雾失楼台月迷津渡写尽贬所前途俱失之境；结尾郴江幸自绕郴山为谁流下潇湘去以山水无理之问写身世无可排遣之悲。
    attribution: 确凿
    excerpt: 雾失楼台，月迷津渡，桃源望断无寻处。……郴江幸自绕郴山，为谁流下潇湘去？
    text_display: excerpt
    themes: [贬谪, 绝望, 山水问情]
    influence: 由凄婉转凄厉的代表作，王国维评为最凄咽的词境之一；苏轼绝爱其尾两句。
    confidence: 存疑
    dispute: 通行说法谓苏轼绝爱其尾两句、自书扇面并有少游已矣虽万人何赎之叹，此事题惠洪冷斋夜话；本次在维基文库冷斋夜话卷一、卷三实取检索未获该条原文，出处待核，故仅按笔记层存疑著录。系年亦有小异。
    source_ids: [src-huaihaiji]

  - work_id: man-ting-fang-shan-mo-wei-yun
    title: 满庭芳·山抹微云
    alt_titles: []
    genre: 词（慢词）
    date:
      text: 创作年代无定说，一般系于元丰前期
      year: 1080
      precision: 约
    place: 会稽（一说）
    context: 此词一出传唱汴京，苏轼戏称作者为山抹微云君——该轶事属宋人笔记层。另有会稽艳遇的本事传说，均不可确证。
    attribution: 确凿
    excerpt: 山抹微云，天连衰草，画角声断谯门。……伤情处，高城望断，灯火已黄昏。
    text_display: excerpt
    themes: [离情, 秋景]
    influence: 使秦观得名山抹微云君，为北宋传唱最广的长调之一。
    confidence: 存疑
    dispute: 山抹微云君之称与会稽艳遇本事均出宋人笔记，属传闻层面不足为史实；创作地点会稽说亦系后人附会本事而来，系年仅能约估。
    source_ids: [src-huaihaiji]

