# | 苏门四学士 | 同卷黄庭坚传：与张耒晁补之秦观俱游苏轼门天下称为四学士 | 确定 |
# | 绍圣贬窜 | 绍圣初坐党籍出通判杭州；御史刘拯论其增损实录贬监处州酒税；使者承风望指候伺过失既而无所得则以谒告写佛书为罪削秩徙郴州继编管横州又徙雷州 | 确定 |
