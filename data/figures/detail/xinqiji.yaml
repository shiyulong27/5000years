    - {date: 2026-08-26, note: "初版。23条年谱（6阶段）、13种作品（12词+美芹十论）、14处足迹、2组关系（社群朱熹/社群陆游）、7层接受史。生平全部实取维基文库宋史卷401；12首词+美芹十论实取维基文库单篇页；陆游诗经公版全文库多源比对。关键发现：五十骑入五万众不见本传（洪迈稼轩记夸饰层）、本传不系卒年不载享年不载卒地，均已落dispute。"}
