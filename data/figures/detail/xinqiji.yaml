# | 帅湘建飞虎军 | 乞依广东摧锋荆南神劲福建左翼例别创一军以湖南飞虎为名；度马殷营垒故基招步军二千人马军五百人；降御前金字牌俾日下住罢，受而藏之期一月营栅成；军成雄镇一方为江上诸军之冠 | 确定 |
# | 台臣弹劾 | 台臣王蔺劾其用钱如泥沙杀人如草芥旦夕望端坐闽王殿，遂丐祠归；庆元元年落职 | 确定 |
# | 朱熹交往 | 尝同朱熹游武夷山赋九曲棹歌，熹书克己复礼夙兴夜寐题其二斋室；熹殁伪学禁方严门生故旧至无送葬者，弃疾为文往哭之曰所不朽者垂万世名孰谓公死凛凛犹生 | 确定（正史层直接证据） |
# | 卒年卒地 | 进枢密都承旨未受命而卒，守龙图阁待制致仕特赠四官；绍定六年赠光禄大夫，德祐初谢枋得请谥忠敏 | 本传不系卒年不载享年不载卒地！通行开禧三年(1207)年六十八、卒于铅山说出后世文献层，存疑著录 |
