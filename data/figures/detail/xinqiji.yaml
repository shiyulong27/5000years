    context: 总叙自述臣尝鸠众二千隶耿京为掌书记共籍兵二十五万纳款于朝及大父辛赞指画山河事，正文审势察情观衅自治守淮屯田致勇防微久任详战十篇，三言虏人之弊七言朝廷之所当行。野人美芹而献于君亦爱主之诚可取自解其名。本传载与九议应问同献，以讲和方定议不行。
