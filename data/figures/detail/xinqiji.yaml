relations:
  - relation_type: 社群
    target_id: zhuxi
    direction: 双向
    period:
      text: 约1181—1200年间游武夷、题斋室，至朱熹殁弃疾往哭
      year: 1181
      range_end: 1200
      precision: 范围
    evidence: 本传明载：弃疾尝同朱熹游武夷山赋九曲棹歌，熹书克己复礼夙兴夜寐题其二斋室——克己复礼是朱熹对辛的人品期许。熹殁伪学禁方严门生故旧至无送葬者，弃疾为文往哭之曰所不朽者垂万世名孰谓公死凛凛犹生——在庆元党禁最酷烈时的公开吊唁尤为难得。另稼轩词贺新郎把酒长亭说小序自记与陈亮同游鹅湖且会朱晦庵于紫溪不至，可见三人过从之约。
    source_ids: [src-songshi-vol401, src-jiaxuanci]
  - relation_type: 社群
    target_id: luyou
    direction: 双向
    period:
      text: 嘉泰末开禧初（约1203—1205年）相互推许
      year: 1203
      range_end: 1205
      precision: 范围
    evidence: 陆游《送辛幼安殿撰造朝》（剑南诗稿，公版全文库多源一致实取）：稼轩落笔凌鲍谢，退避声名称学稼……大材小用古所叹，管仲萧何实流亚……深仇积愤在逆胡，不用追思灞亭夜——既推其文才将略，又诫其勿因私怨轻发，为辛陆晚年交往与相互评价的直接诗文证据。来源登记待主会话补录（剑南诗稿单篇）。
    source_ids: []

reception:
  - era: 同时代
    evaluator: 朱熹
    quote: 克己复礼；夙兴夜寐
    text_display: excerpt
    comment: 本传载朱熹手书二语题辛弃疾二斋室，是同时代大儒对其人格修养的直接期许；朱熹殁时伪学禁方严，弃疾为文往哭曰所不朽者垂万世名孰谓公死凛凛犹生，亦见二人相知之深。
    source_ids: [src-songshi-vol401]
  - era: 同时代
    evaluator: 陈亮（辛陈唱和圈）
    quote: ""
    text_display: none
    comment: 铅山鹅湖之会后陈亮以贺新郎见和往复唱和数四（同父见和再用韵答之等俱在稼轩词内），时人视为词坛主战阵营的双璧之交；陈亮一方评语引文须另核龙川文集后补入，暂作中立转述。
    source_ids: [src-jiaxuanci]
  - era: 历代批评
    evaluator: 谢枋得（宋末）
    quote: ""
    text_display: none
    comment: 本传记德祐初谢枋得请于朝加赠少师谥忠敏，并载其过墓旁僧舍秉烛作文祭之文成而声始息的传说——宋遗民的追尊确立了忠敏这一官方定评。
    source_ids: [src-songshi-vol401]
  - era: 历代批评
    evaluator: 刘克庄、王士祯等历代词论（转述）
    quote: ""
    text_display: none
    comment: 刘克庄辛稼轩集序称其大声镗鞳小声铿鍧横绝六合扫空万古（转述）；后世词论有词中之龙之称（常见归于明清词话系统）。上述引文本次未逐一实取原句，确切首出待核后再改为实引，现按转述层著录。
    confidence: 存疑
    source_ids: []
  - era: 近现代学术
    evaluator: 学界综述
    quote: ""
    text_display: none
    comment: 近现代研究聚焦归正人身份与仕途困境、以文为词与英雄语的词体突破、稼轩词编年笺注与版本源流、五十骑故事的史料层次辨析等议题；具体论著引文须取得许可后补入，本卷暂作中立转述。
    source_ids: []
  - era: 教科书与公共文化
    evaluator: 通用语文教育与大众传播
    quote: ""
    text_display: none
    comment: 破阵子青玉案永遇乐水龙吟菩萨蛮丑奴儿等长期入选中小学语文教材，众里寻他千百度成为国民级语汇；青玉案系香港中学文凭考试指定文言篇章（文库页面分类明示）。教材版本信息随学期变动，录入时须另行核验当期篇目。
    source_ids: [src-jiaxuanci]
