      precision: 约
    place: 铅山瓢泉
    summary: 本传记其尝谓人生在勤当以力田为先，北方之人养生之具不求于人是以无甚富甚贫之家，故以稼名轩。闲居期间创作了破阵子丑奴儿西江月等大批代表作，前后家居近二十年，是其词艺的成熟期。
    confidence: 存疑
    dispute: 徙瓢泉年份系学界推定（庆元元年落职后）；闲居总时长二十年系综合带湖瓢泉两期而言。
    source_ids: [src-songshi-vol401]

  # ── 阶段五：嘉泰起复与京口怀古 ──────────────────────────────
  - stage: 嘉泰起复与京口怀古
    stage_order: 19
    title: 起知绍兴府兼浙东安抚使
    date:
      text: 约1203年（嘉泰三年）
      year: 1203
      precision: 约
    place: 绍兴
    summary: 久之，起知绍兴府兼浙东安抚使。韩侂胄谋北伐起用主战旧臣，闲居多年的辛弃疾复出。陆游时居镜湖，有交游酬答。
    confidence: 存疑
    dispute: 本传但云久之不系年，嘉泰三年起复从通行说并得陆游诗作年旁证。
    source_ids: [src-songshi-vol401, src-jiaxuanci]
  - stage: 嘉泰起复与京口怀古
    stage_order: 20
    title: 差知镇江府，登北固亭作永遇乐南乡子
    date:
      text: 约1204—1205年之间
      year: 1204
      range_end: 1205
      precision: 范围
    place: 京口（镇江）
    summary: 宁宗召见言盐法，加宝谟阁待制提举佑神观奉朝请，寻差知镇江府赐金带。在京口登北固亭，千古江山廉颇老矣之永遇乐与何处望神州的南乡子皆作于此期；旋坐缪举降朝散大夫提举冲佑观。永遇乐文库页系年1205。
    source_ids: [src-songshi-vol401, src-jiaxuanci]

  # ── 阶段六：开禧局中赍志而殁 ──────────────────────────────
  - stage: 开禧局中赍志而殁
    stage_order: 21
    title: 进龙图阁知江陵府、试兵部侍郎皆辞免
    date:
      text: 约1205—1206年之间
      year: 1205
      range_end: 1206
      precision: 范围
    place: ""
    summary: 进宝文阁待制又进龙图阁知江陵府，令赴行在奏事试兵部侍郎皆辞免——朝廷屡易其衔而不用其实。
    confidence: 存疑
    dispute: 各次除命的具体月份本传不载。
    source_ids: [src-songshi-vol401]
  - stage: 开禧局中赍志而殁
    stage_order: 22
    title: 进枢密都承旨，未受命而卒
    date:
      text: 约1207年（开禧三年）
      year: 1207
      precision: 约
    place: 铅山（通行说）
    summary: 进枢密都承旨，未受命而卒。赐对衣金带，守龙图阁待制致仕，特赠四官。北伐局中，这位六十八岁的老帅带着未竟的恢复之志赍志而殁。
    confidence: 存疑
    dispute: 本传不系卒年不载享年！通行开禧三年(1207)九月卒年六十八说出后世文献层（本传仅记未受命而卒），卒地铅山亦非本传明文，均存疑著录。
    source_ids: [src-songshi-vol401]
  - stage: 开禧局中赍志而殁
    stage_order: 23
    title: 身后恤典：赠光禄大夫，谢枋得请谥忠敏
    date:
      text: 绍定六年(1233)赠官，德祐初(1275)请谥
      year: 1233
      range_end: 1275
      precision: 范围
    place: ""
    summary: 绍定六年赠光禄大夫。咸淳间史馆校勘谢枋得过弃疾墓旁僧舍，有疾声大呼于堂上若鸣其不平自昏暮至三鼓不绝，枋得秉烛作文祭之文成而声始息。德祐初枋得请于朝加赠少师谥忠敏。
    source_ids: [src-songshi-vol401]

