  - work_id: yongyule-jingkou-beiguting-huaigu
    title: 永遇乐·京口北固亭怀古
    alt_titles: []
    genre: 词（慢词）
    date:
      text: "1205年"
      year: 1205
      precision: 精确
    place: 京口北固亭
    context: 知镇江府时登北固亭怀古，千古江山英雄无觅孙仲谋处起笔，借元嘉草草封狼居胥警韩侂胄轻启战端，末以凭谁问廉颇老矣尚能饭否自况。文库页面系年1205。
    attribution: 确凿
    excerpt: 千古江山，英雄无觅，孙仲谋处。……四十三年，望中犹记，烽火扬州路。……凭谁问：廉颇老矣，尚能饭否？
    text_display: excerpt
    themes: [怀古, 北伐, 用舍行藏]
    influence: 明代杨慎推为本朝第一词（转述层），豪放词怀古之绝顶。
    source_ids: [src-jiaxuanci]
  - work_id: qingyuanan-yuanxi
    title: 青玉案·元夕
    alt_titles: []
    genre: 词（小令）
    date:
      text: 创作年代无定说，一般系于闲居带湖时期
      year: 1180
      precision: 约
    place: 临安或带湖（咏元夕）
    context: 东风夜放花千树极写元夕繁华，结拍众里寻他千百度蓦然回首那人却在灯火阑珊处自甘寂寞之境。香港中学文凭考试指定文言篇章（文库页面分类明示）。
    attribution: 确凿
    excerpt: 东风夜放花千树，更吹落、星如雨。……众里寻他千百度；蓦然回首，那人却在，灯火阑珊处。
    text_display: excerpt
    themes: [元夕, 寂寞自守]
    influence: 众里寻他千百度已成国民级名句，王国维借喻治学第三境界（转述层）。
    confidence: 存疑
    dispute: 是否有政治寄托历来有两读；创作年份无考。
    source_ids: [src-jiaxuanci]
  - work_id: moyuer-gengnengxiao-jifan-fengyu
    title: 摸鱼儿·更能消几番风雨
    alt_titles: []
    genre: 词（慢词）
    date:
      text: "1179年（淳熙己亥）"
      year: 1179
      precision: 精确
    place: 湖南漕移途中（小山亭饯席）
    context: 小序自注淳熙己亥自湖北漕移湖南同官王正之置酒小山亭为赋，惜春怨春长门玉环飞燕层层寄托身世之忧，梁启超谓回肠荡气至于此极（转述层）。
    attribution: 确凿
    excerpt: 更能消几番风雨，匆匆春又归去。……君莫舞！君不见、玉环飞燕皆尘土！闲愁最苦。休去倚危栏，斜阳正在，烟柳断肠处。
    text_display: excerpt
    themes: [惜春, 身世寄托]
    influence: 以婉约外壳包藏家国悲愤，被视为稼轩词风多样性的代表。
    source_ids: [src-jiaxuanci]
  - work_id: shuilongyin-dengjiankang-shangxinting
    title: 水龙吟·登建康赏心亭
    alt_titles: []
    genre: 词（慢词）
    date:
      text: 约通判建康府期间（乾道四年以后）
      year: 1169
      precision: 约
    place: 建康赏心亭
    context: 楚天千里清秋遥岑远目献愁供恨，把吴钩看了栏杆拍遍无人会登临意，写江南游子无人知晓的恢复壮心。
    attribution: 确凿
    excerpt: 楚天千里清秋，水随天去秋无际。……把吴钩看了，栏杆拍遍，无人会，登临意。……倩何人唤取，红巾翠袖，揾英雄泪！
    text_display: excerpt
    themes: [登临, 英雄失路]
    influence: 其早期豪放词的奠基之作，中学教材常选篇目。
    confidence: 存疑
    dispute: 系年有建康通判任(1169前后)与江东参议任(1174前后)诸说。
    source_ids: [src-jiaxuanci]
  - work_id: pusaman-shujiangxi-zaokou-bi
    title: 菩萨蛮·书江西造口壁
    alt_titles: []
    genre: 词（小令）
    date:
      text: 约淳熙二三年间提点江西刑狱任内
      year: 1176
      precision: 约
    place: 江西造口（郁孤台）
    context: 郁孤台下清江水中间多少行人泪，西北望长安可怜无数山，青山遮不住毕竟东流去——造口怀伤靖康以来中原沦丧之痛。
    attribution: 确凿
    excerpt: 郁孤台下清江水，中间多少行人泪。西北望长安，可怜无数山。青山遮不住，毕竟东流去。
    text_display: full
    themes: [家国之痛, 山水寄慨]
    influence: 四十年后罗大经犹叹其忠愤之气拂拂指端（转述层），宋词中家国书写的巅峰之作。
    confidence: 存疑
    dispute: 系年从提点江西刑狱任内通说；郁孤台下所指行人泪本事有靖康隆祐太后奔虔州说等多种解读。
    source_ids: [src-jiaxuanci]
  - work_id: pozhenzi-wei-chentongfu-fuzhuangci-yijizhi
