      year: 1188
      range_end: 1190
      precision: 范围
    place: 上饶带湖
    context: 题为陈同甫赋壮词以寄之，醉里挑灯看剑梦回吹角连营，了却君王天下事赢得生前身后名，结拍可怜白发生陡然跌落。
    attribution: 确凿
    excerpt: 醉里挑灯看剑，梦回吹角连营。……马作的卢飞快，弓如霹雳弦惊。了却君王天下事，赢得生前身后名。可怜白发生！
    text_display: excerpt
    themes: [军旅梦境, 壮志难酬]
    influence: 中学教材必选名篇，梦里沙场与白发现实的对照成为中国式英雄迟暮的经典表达。
    confidence: 存疑
    dispute: 系年从鹅湖唱和期通说，确切年份无考。
    source_ids: [src-jiaxuanci]
  - work_id: xijiangyue-yexing-huangsha-daozhong
    title: 西江月·夜行黄沙道中
    alt_titles: []
    genre: 词（小令）
    date:
      text: 约闲居带湖时期
      year: 1183
      precision: 约
    place: 上饶黄沙岭道中
    context: 明月别枝惊鹊清风半夜鸣蝉稻花香里说丰年听取蛙声一片，闲居中夜行道上的丰年喜悦。
    attribution: 确凿
    excerpt: 明月别枝惊鹊，清风半夜鸣蝉。稻花香里说丰年，听取蛙声一片。七八个星天外，两三点雨山前。旧时茅店社林边，路转溪桥忽见。
    text_display: full
    themes: [田园, 夏夜]
    influence: 乡村词的典范之作，教材常选。
    confidence: 存疑
    dispute: 系年只能框定在带湖闲居期内。
    source_ids: [src-jiaxuanci]
  - work_id: nanxiangzi-dengjingkou-beiguting-youhuai
    title: 南乡子·登京口北固亭有怀
    alt_titles: []
    genre: 词（小令）
    date:
      text: 约1204—1205年间知镇江府时
      year: 1204
      range_end: 1205
      precision: 范围
    place: 京口北固亭
    context: 与永遇乐同期同地之作。何处望神州满眼风光北固楼，天下英雄谁敌手曹刘生子当如孙仲谋，借孙权讽当朝无人。
    attribution: 确凿
    excerpt: 何处望神州？满眼风光北固楼。千古兴亡多少事，悠悠。不尽长江滚滚流。……天下英雄谁敌手？曹刘。生子当如孙仲谋。
    text_display: excerpt
    themes: [怀古, 讽今]
    influence: 生子当如孙仲谋化曹操语入词，问答体的豪放小令代表。
    source_ids: [src-jiaxuanci]
  - work_id: hexinlang-shenyiwushuaiyi
    title: 贺新郎·甚矣吾衰矣
    alt_titles: []
    genre: 词（慢词）
    date:
      text: 约闲居期晚年，独坐停云堂所作
      year: 1196
      range_end: 1202
      precision: 范围
    place: 铅山（一说带湖）停云堂
    context: 小序自记邑中园亭仆皆为赋此词一日独坐停云水声山色竞来相娱，庶几仿佛渊明思亲友之意。我见青山多妩媚料青山见我应如是、不恨古人吾不见恨古人不见吾狂耳为其狂态自供状。
    attribution: 确凿
    excerpt: 甚矣吾衰矣。怅平生、交游零落，只今余几！……我见青山多妩媚，料青山见我应如是。……不恨古人吾不见，恨古人不见吾狂耳。知我者，二三子。
    text_display: excerpt
    themes: [知己之叹, 狂与寂寞]
    influence: 岳珂桯史记其每宴必命侍妓歌此阕自诵其警句（笔记层转述），狂与孤独的双重画像。
    confidence: 存疑
    dispute: 系年无定说；岳珂桯史所记本事属笔记层未经核实。
    source_ids: [src-jiaxuanci]
  - work_id: hexinlang-bajiu-changting-shuo
    title: 贺新郎·把酒长亭说
    alt_titles: [贺新郎·陈同父自东阳来过余]
    genre: 词（慢词）
    date:
      text: 约1188年冬（淳熙十五年）
      year: 1188
      precision: 约
    place: 上饶鹅湖、方村泉湖四望楼
    context: 小序详记鹅湖之会本事：陈同父自东阳来过余留十日与之同游鹅湖且会朱晦庵于紫溪不至飘然东归，既别余意中殊恋恋雪深泥滑不得前，夜半投宿吴氏泉湖四望楼闻邻笛悲甚为赋贺新郎以见意。看渊明风流酷似卧龙诸葛以许陈亮。
    attribution: 确凿
    excerpt: 把酒长亭说。看渊明、风流酷似，卧龙诸葛。……铸就而今相思错，料当初、费尽人间铁。长夜笛，莫吹裂。
    text_display: excerpt
    themes: [友谊, 别情]
    influence: 辛陈唱和五章之首，小序本身即南宋文人交游的第一手文献。
    source_ids: [src-jiaxuanci]
  - work_id: chounuer-shu-boshan-daozhong-bi
    title: 丑奴儿·书博山道中壁
    alt_titles: [采桑子·书博山道中壁]
    genre: 词（小令）
    date:
      text: 约闲居带湖时期
      year: 1189
      precision: 约
    place: 上饶博山道中
    context: 少年不识愁滋味爱上层楼与而今识尽愁滋味欲说还休对勘，却道天凉好个秋以淡语收至痛。
    attribution: 确凿
    excerpt: 少年不识愁滋味，爱上层楼。爱上层楼，为赋新词强说愁。而今识尽愁滋味，欲说还休。欲说还休，却道天凉好个秋。
    text_display: full
    themes: [愁绪, 人生况味]
    influence: 强说愁与天凉好个秋进入日常汉语，教材常选。
    confidence: 存疑
    dispute: 系年只能框定在带湖闲居期内。
    source_ids: [src-jiaxuanci]
  - work_id: shuilongyin-guo-nanjian-shuangxilou
    title: 水龙吟·过南剑双溪楼
    alt_titles: []
    genre: 词（慢词）
    date:
      text: 约绍熙间闽中时期
      year: 1191
      range_end: 1192
      precision: 范围
    place: 南剑州双溪楼
    context: 举头西北浮云倚天万里须长剑，人言此地夜深长见斗牛光焰，借延津剑气神话写恢复之志与风雷鱼龙的险阻。
    attribution: 确凿
    excerpt: 举头西北浮云，倚天万里须长剑。……千古兴亡，百年悲笑，一时登览。
    text_display: excerpt
    themes: [剑气, 山川奇想]
    influence: 以神话意象承载政治抱负的后期代表作。
    confidence: 存疑
    dispute: 系年有绍熙闽中说与晚年福建安抚使再任说等分歧。
    source_ids: [src-jiaxuanci]
