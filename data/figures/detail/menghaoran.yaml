# 孟浩然全景详卷（schema v1）
# 史料审计表（TASK-003 批次一；来源见 data/sources.yaml）：
#
# | 事实点 | 旧唐书·文苑下(J) | 新唐书·文艺下(X) | 结论与置信 |
# |---|---|---|---|
# | 籍贯身份 | 隐鹿门山以诗自适 | 襄州襄阳人，少好节义喜振人患难，隐鹿门山 | 确定(X)；一生布衣处士 |
# | 入京应试 | 年四十来游京师应进士不第还 | 年四十乃游京师；太学赋诗一座嗟伏；不才明主弃放还 | 应举与否两书侧重不同：J明言不第，X记放还轶事；并存记录 |
# | 匿床下事 | 无载 | 维私邀入内署玄宗至匿床下…帝诵至不才明主弃曰卿不求仕而朕未尝弃卿奈何诬我 | 仅X载，本事小说化风险高→存疑 |
# | 韩朝宗约荐 | 无载 | 约偕至京师欲荐诸朝；会故人至剧饮叱曰业已饮遑恤他卒不赴 | 仅X载→存疑（细节近逸闻） |
# | 荆州幕 | 张九龄镇荆州署为从事与之唱和 | 张九龄为荆州辟置于府府罢 | 确定（两书同记） |
# | 卒 | 不达而卒（含糊） | 开元末病疽背卒 | 从X：开元末(约740)病疽背卒；生年689由卒年与年四十逆推 |
# | 身后 | 无载 | 樊泽节度时符载以笺叩泽更为刻碑凤林山南封宠其墓；王维过郢州画浩然像于刺史亭曰浩然亭咸通中更名孟亭 | 确定(X) |
