    quote: 二百年来以乐府独步。贵人、学士、市儇、妓女，皆知美成词为可爱。
    text_display: excerpt
    comment: 南宋人笔记中的顶级定位，兼记其词雅俗共赏传播之广。该书为宋代公版文献，此处仅收短引；来源注册表暂未登记该条目，引用边界以本短引为限。
