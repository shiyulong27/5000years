works:
  - work_id: su-mu-zhe-liao-chen-xiang
    title: 苏幕遮·燎沉香
    alt_titles: [苏幕遮·夏日溧水无想山作之外咏荷名篇]
    genre: 词（小令）
    date:
      text: 创作年代不详，一般定为北宋后期在京师时
      precision: 未知
    place: ""
    context: 夏日雨后观荷思乡之作，叶上初阳干宿雨水面清圆一一风荷举为王士祯所称写荷绝唱，王国维誉为真能得荷之神理者。
    attribution: 确凿
    excerpt: 燎沉香，消溽暑。鸟雀呼晴，侵晓窥檐语。叶上初阳干宿雨，水面清圆，一一风荷举。故乡遥，何日去？家住吴门，久作长安旅。五月渔郎相忆否？小楫轻舟，梦入芙蓉浦。
    text_display: full
    themes: [咏物, 荷, 思乡]
    influence: 一一风荷举成为咏荷千古名句，入选现代语文教材。
    source_ids: [src-qingzhenji]

  - work_id: shao-nian-you-bing-dao-ru-shui
    title: 少年游·并刀如水
    alt_titles: []
    genre: 词（小令）
    date:
      text: 创作年代不详
      precision: 未知
    place: 京师开封（一说）
    context: 冬夜室内调笙听语的生活小品，低声问向谁行宿城上已三更马滑霜浓不如休去直是少人行，体贴入微而止于礼。
    attribution: 确凿
    excerpt: 并刀如水，吴盐胜雪，纤手破新橙。锦幄初温，兽烟不断，相对坐调笙。低声问：向谁行宿？城上已三更。马滑霜浓，不如休去，直是少人行。
    text_display: full
    themes: [艳情, 生活]
    influence: 以白描工笔写旖旎情境的小令典范。
    confidence: 传说
    dispute: 本词本事附会周邦彦与李师师及宋徽宗三角故事，出自南宋张端义贵耳集等笔记层材料，纯属小说家言，词作本体可信而本事不足为据。
    source_ids: [src-qingzhenji]

  - work_id: lan-ling-wang-liu-yin-zhi
    title: 兰陵王·柳阴直
    alt_titles: [兰陵王·柳]
    genre: 词（慢词，自度曲）
    date:
      text: 创作年代不详，通说为提举大晟府前后在京送别之作
      precision: 未知
    place: 京师开封隋堤（一说）
    context: 咏柳送别名篇，谁识京华倦客道尽久客倦游之感。愁一箭风快半篙波暖写舟行人去回望京华。
    attribution: 确凿
    excerpt: 柳阴直，烟里丝丝弄碧。隋堤上、曾见几番，拂水飘绵送行色。……愁一箭风快，半篙波暖，回头迢递便数驿，望人在天北。
    text_display: excerpt
    themes: [送别, 咏柳, 倦游]
    influence: 此曲南宋流传极广，西楼南瓦奏之无虚日，号称渭城三叠式送别曲。
    source_ids: [src-qingzhenji]

  - work_id: liu-chou-qiang-wei-xie-hou
    title: 六丑·蔷薇谢后作
    alt_titles: []
    genre: 词（慢词，自度曲）
    date:
      text: 创作年代不详
      precision: 未知
    place: ""
    context: 咏落花惜春的长调，为问花何在夜来风雨葬楚宫倾国问花葬花笔法为后世红楼葬花意象之远源。曲名六丑相传因其犯六个宫调声之美音难歌而得名。
    attribution: 确凿
    excerpt: 正单衣试酒，怅客里光阴虚掷。……为问花何在？夜来风雨，葬楚宫倾国。
    text_display: excerpt
    themes: [咏物, 惜春]
    influence: 自度曲犯调技巧的代表样本，历代词论推为涩曲之极则。
    confidence: 存疑
    dispute: 六丑曲名缘起出自南宋王灼碧鸡漫志等所记传闻，细节难以确考。
    source_ids: [src-qingzhenji]

  - work_id: die-lian-hua-yue-jiao-jing-wu
    title: 蝶恋花·月皎惊乌栖不定
    alt_titles: []
    genre: 词（小令）
    date:
      text: 创作年代不详
      precision: 未知
    place: ""
    context: 别前一夜与临歧执手的连续镜头，唤起两眸清炯炯泪花落枕红绵冷写彻夜无眠细腻入骨。
    attribution: 确凿
    excerpt: 月皎惊乌栖不定，更漏将残，辘轳牵金井。唤起两眸清炯炯，泪花落枕红绵冷。
