works:
  - work_id: yulinling-hanchanqiqie
    title: 雨霖铃·寒蝉凄切
    alt_titles: [雨霖铃·秋别]
    genre: 词（双调慢词）
    date:
      text: 创作年代不详，当在离京南下之际
      precision: 未知
    place: 汴京城外长亭（词境推定）
    context: 秋别之作。上片写实离亭执手，下片悬想别后，寒蝉骤雨兰舟晓月层层铺叙，为宋代离别词第一名篇，宋金十大曲之一。
    attribution: 确凿
    excerpt: 寒蝉凄切。对长亭晚，骤雨初歇。……执手相看泪眼，竟无语凝噎。……今宵酒醒何处，杨柳岸、晓风残月。
    text_display: excerpt
    themes: [离别, 羁旅]
    influence: 执手相看泪眼与杨柳岸晓风残月成为汉语离别意象的极致表达。
    source_ids: [src-yuezhangji]
  - work_id: bashengganzhou-duixiaoxiao
    title: 八声甘州·对潇潇暮雨洒江天
    alt_titles: []
    genre: 词（慢词）
    date:
      text: 创作年代不详，羁旅行役时期
      precision: 未知
    place: 江上（泛指）
    context: 秋士登高怀远之词。霜风凄紧关河冷落一联，苏轼叹为不减唐人高处（侯鲭录所记，笔记层），是雅俗之争中柳词被士大夫承认的孤证。
    attribution: 确凿
    excerpt: 对潇潇暮雨洒江天，一番洗清秋。渐霜风凄紧，关河冷落，残照当楼。……惟有长江水，无语东流。
    text_display: excerpt
    themes: [羁旅, 秋思]
    influence: 关河冷落残照当楼被历代词论推为柳词中最近唐人气象的一联。
    source_ids: [src-yuezhangji]
  - work_id: wanghaichao-dongnanxingsheng
    title: 望海潮·东南形胜
    alt_titles: []
    genre: 词（慢词）
    date:
      text: 约漫游杭州时期，具体年份不详
      precision: 未知
    place: 杭州
    context: 铺叙杭城形胜繁华的都市词。三秋桂子十里荷花一联相传令金主完颜亮兴起投鞭渡江之志（鹤林玉露所记，传说层），足见其传播之广。
    attribution: 确凿
    excerpt: 东南形胜，三吴都会，钱塘自古繁华。……重湖叠𪩘清嘉。有三秋桂子，十里荷花。
    text_display: excerpt
    themes: [咏地, 都市]
    influence: 以词体为城市立传的开山之作，罗大经至谓一词牵动长江万里愁。
    source_ids: [src-yuezhangji]
  - work_id: dielianhua-zhuyiweilou
    title: 蝶恋花·伫倚危楼风细细
    alt_titles: [凤栖梧·伫倚危楼风细细]
    genre: 词（小令）
    date:
      text: 创作年代不详，漂泊怀人时期
      precision: 未知
    place: ""
    context: 怀人之作。结拍衣带渐宽终不悔为伊消得人憔悴，王国维人间词话借喻古今成大事业大学问者的第二境界，使俚情小令升格为治学箴言。
    attribution: 确凿
    excerpt: 伫倚危楼风细细，望极春愁，黯黯生天际。……衣带渐宽终不悔。为伊消得人憔悴。
    text_display: full
    themes: [相思, 抒怀]
    influence: 衣带渐宽一句经王国维征引成为中国文化中执着精神的通用符号。
    confidence: 存疑
    dispute: 此词调名蝶恋花与凤栖梧两见，亦有归入欧阳修词集的异文归属之争，主流定为柳永作。
    source_ids: [src-yuezhangji]
  - work_id: dingfengbo-zichunlai
    title: 定风波·自春来惨绿愁红
    alt_titles: [定风波·伫立长堤（另首同名）]
    genre: 词（慢词）
    date:
      text: 创作年代不详
      precision: 未知
    place: ""
    context: 代言体闺怨俚词。针线闲拈伴伊坐一句相传晏殊面斥柳永「殊虽作曲子不曾道彩线慵拈伴伊坐」（画墁录所记），成为柳词俚俗之评的经典公案。
    attribution: 确凿
    excerpt: 自春来、惨绿愁红，芳心是事可可。……镇相随、莫抛躲，针线闲拈伴伊坐。
    text_display: excerpt
    themes: [闺怨, 俚俗]
    influence: 柳词俚俗一路的代表，晏殊轶事使其成为雅俗之争的标本。
    source_ids: [src-yuezhangji]
  - work_id: hechongtian-huangjinbangshang
    title: 鹤冲天·黄金榜上
    alt_titles: []
    genre: 词
    date:
      text: 应举落第期间所作，具体年份不详
      precision: 未知
    place: 汴京（推定）
    context: 落第抒愤之作。忍把浮名换了浅斟低唱相传触怒仁宗致其黜落，遂有奉旨填词之谑（能改斋漫录所记，传说层）。词本身是科举失意心态最直白的自供状。
    attribution: 确凿
    excerpt: 黄金榜上，偶失龙头望。……才子词人，自是白衣卿相。……忍把浮名，换了浅斟低唱！
    text_display: excerpt
    themes: [落第, 狂放]
    influence: 白衣卿相与浅斟低唱自此成为柳永的人格标签，敷演为元曲话本中的经典形象。
