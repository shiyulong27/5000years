reception:
  - era: 同时代
    evaluator: 叶梦得（避暑录话）
    quote: 凡有井水饮处，即能歌柳词。
    text_display: excerpt
    comment: 出自叶梦得避暑录话柳永条——记其仕丹徒时闻诸西夏归明官，言柳词传播之广及于域外。同条又记教坊乐工每得新腔必求永为辞，是理解柳永创作机制的第一手材料。该笔记条目已于2026-08-25自维基文库实取全文，sources.yaml 尚未登记，故此处 source_ids 暂留空（警告预期）。
    source_ids: []
  - era: 历代批评
    evaluator: 苏轼（语见赵令畤侯鲭录，笔记层）
    quote: 不减唐人高处
    text_display: excerpt
    comment: 相传苏轼曾举八声甘州渐霜风凄紧关河冷落残照当楼数语，谓世言柳耆卿曲俗，非也，此语不减唐人高处。此说出赵令畤侯鲭录卷七，属宋人笔记转述而非苏轼文集本文；侯鲭录尚未登记 sources.yaml，source_ids 留空并中性转述其传闻性质。
    source_ids: []
  - era: 历代批评
    evaluator: 李清照（词论）
    quote: 词语尘下
    text_display: excerpt
    comment: 李清照词论批评柳屯田者变旧声作新声出乐章集大得声称于世，然虽协音律而词语尘下——肯定其协律与新声之功、贬其语言尘下，是宋人对柳词雅俗之争中最系统的负面表述。词论为公版古籍可短引；该文献尚未登记 sources.yaml，source_ids 留空。
    source_ids: []
  - era: 近现代学术
    evaluator: 学界综述
    quote: ""
    text_display: none
    comment: 近现代研究聚焦柳永生平系年的重建（生卒年、登第与宦历考订）、慢词体制与宋词转型的枢纽地位、以及雅俗二重性评价史的梳理；具体论著引文须逐条取得许可后补入，本卷暂作中立综述。
    source_ids: []
  - era: 教科书与公共文化
    evaluator: 通用语文教育与大众传播
    quote: ""
    text_display: none
    comment: 雨霖铃八声甘州望海潮长期入选中学语文教材与诵读选本；凡有井水饮处皆能歌柳词成为大众文化中宋词普及度的代名词，白衣卿相与奉旨填词的形象经由话本戏曲广泛传播。教材篇目随学期变动，录入时须另行核验。
    source_ids: []
