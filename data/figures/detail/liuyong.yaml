  - work_id: qishi-wanqiutian
    title: 戚氏·晚秋天
    alt_titles: []
    genre: 词（长调慢词三叠）
    date:
      text: 晚年羁旅时期所作（一说外放荆南时），具体年份不详
      precision: 未知
    place: 江陵一带（据词境推定）
    context: 二百一十二字三叠一韵到底，为北宋长调之最。孤馆度日如年以下自暮夜写到拂晓，把未名未禄的悔恨与帝里旧欢的追忆层层铺展，时人比之于离骚（碧鸡漫志引语，笔记层）。
    attribution: 确凿
    excerpt: 晚秋天，一霎微雨洒庭轩。……孤馆，度日如年。……念利名，憔悴长萦绊。……停灯向晓，抱影无眠。
    text_display: excerpt
    themes: [羁旅, 感遇]
    influence: 柳永自制新腔与慢词铺叙艺术的极限之作。
    source_ids: [src-yuezhangji]
  - work_id: erlangshen-yanguangxie
    title: 二郎神·炎光谢
    alt_titles: []
    genre: 词（慢词）
    date:
      text: 创作年代不详，七夕题材
      precision: 未知
    place: ""
    context: 咏七夕慢词。炎光谢过暮雨芳尘轻洒写新秋雨霁星娥驾轮之境，清丽疏朗，是柳词中少见的清空一路。
    attribution: 确凿
    excerpt: 炎光谢。过暮雨、芳尘轻洒。乍露冷风清庭户，爽天如水，玉钩遥挂。应是星娥嗟久阻，叙旧约、飙轮欲驾。
    text_display: excerpt
    themes: [七夕, 秋景]
    influence: 七夕词中以铺叙见长的代表作，可见柳词不止俚俗一格。
    source_ids: [src-yuezhangji]
  - work_id: shaonianyou-changangudao
    title: 少年游·长安古道马迟迟
    alt_titles: [少年游·参差烟树灞陵桥（另首同名）]
    genre: 词（小令）
    date:
      text: 晚年宦游时期所作（学界推定），具体年份不详
      precision: 未知
    place: 长安古道（词境泛指西行道途）
    context: 秋日行役小令。夕阳岛外秋风原上目断四天垂，以极简笔墨写尽天涯倦游之境，与慢词铺叙相映见其笔力。
    attribution: 确凿
    excerpt: 长安古道马迟迟，高柳乱蝉嘶。夕阳岛外，秋风原上，目断四天垂。
    text_display: full
    themes: [羁旅, 秋]
    influence: 小令中苍凉疏淡一路的典范。
    confidence: 存疑
    dispute: 作年系晚年推定；乐章集内少年游多首，此首归属历来无异而系年无据。
    source_ids: [src-yuezhangji]

