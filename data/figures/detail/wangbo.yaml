reception:
  - era: 同时代
    evaluator: 唐高宗（对《檄英王鸡文》）
    quote: 据此是交构之渐。
    text_display: excerpt
    comment: 旧唐书所载高宗阅檄震怒之语（新唐书作是且交构），帝王视角认定此文挑拨诸王关系，遂即日斥出沛王府，成为改变其一生的转折点。
    source_ids: [src-jts-vol190a, src-xts-vol201]
  - era: 同时代
    evaluator: 裴行俭
    quote: 士之致远，先器识而后文艺。勃等虽有文才，而浮躁浅露，岂享爵禄之器耶！
    text_display: excerpt
    comment: 旧唐书所载人伦鉴识名家对四杰的总评，器识先于文艺自此成为千年人才论的著名命题；其对王勃命运的预言性亦使此语流传极广。
    source_ids: [src-jts-vol190a]
  - era: 历代批评
    evaluator: 张说、崔融（评四杰文，见新唐书附传）
    quote: 勃文章宏放，非常人所及。
    text_display: excerpt
    comment: 新唐书骆宾王附传所载崔融语（旧唐书杨炯附传文字略异），开元名相对四杰文章地位的正式追认。
    source_ids: [src-xts-vol201, src-jts-vol190a]
  - era: 历代批评
    evaluator: 杜甫
    quote: 王杨卢骆当时体，轻薄为文哂未休。尔曹身与名俱灭，不废江河万古流。
    text_display: excerpt
    comment: 戏为六绝句之一，为四杰辩护并断言其如江河万古长流。公版诗句，出处登记待补故来源留空（预期产生可追溯性警告）。
    confidence: 存疑
    dispute: 本条引文为公版唐诗原文，但对应来源 id 尚未在本项目登记，source_ids 暂留空。
    source_ids: []
  - era: 近现代学术
    evaluator: 学界综述
    quote: ""
    text_display: none
    comment: 近现代研究聚焦生卒年与享年推算（二十八/二十九岁之争）、滕王阁序作年与真伪讨论、杀官奴案的律令背景重审、及其在五言律诗定型中的贡献等议题；具体论著引文须取得许可后补入，本卷暂作中立转述。
    source_ids: []

  - era: 教科书与公共文化
    evaluator: 通用语文教育与大众传播
    quote: ""
    text_display: none
    comment: 滕王阁序送杜少府之任蜀州长期入选中小学语文教材，落霞与孤鹜齐飞海内存知己成为国民级名句；滕王阁因序而列江南三大名楼。教材篇目随学期变动，录入时须另行核验。
    source_ids: []
  - era: 影视与网络
    evaluator: 大众传播
    quote: ""
    text_display: none
    comment: 天才早逝与滕王阁一夜成名的戏剧性人生使其成为大众文化常见题材，相关影视改编暂不著录具体作品以免权利状态不明。
    source_ids: []

