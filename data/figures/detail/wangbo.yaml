timeline:
  # ── 阶段一：绛州天才少年 ──────────────────────────────
  - stage: 绛州天才少年
    stage_order: 1
    title: 出生于绛州龙门书香世家
    date:
      text: "约650年"
      year: 650
      precision: 约
    place: 绛州龙门
    summary: 出身儒学世家，祖王通隋末讲学白牛溪著《元经》《中说》，门人私谥文中子；叔辈福郊福畤皆有名。生年约650系由卒年倒推。
    confidence: 存疑
    dispute: 两唐书均无生年明文，约650年由卒年与享年倒推；因卒年两书互异（详见卒条），生年在649—651间浮动，学界尚有他说。
    source_ids: [src-jts-vol190a, src-xts-vol201]
  - stage: 绛州天才少年
    stage_order: 2
    title: 六岁善文辞，兄第三人称三珠树
    date:
      text: "约655年前后"
      year: 655
      precision: 约
    place: 绛州龙门
    summary: 旧唐书称六岁解属文构思无滞词情英迈，与兄勔勮才藻相类，父友杜易简常称曰此王氏三珠树也。
    source_ids: [src-jts-vol190a]
  - stage: 绛州天才少年
    stage_order: 3
    title: 九岁作《汉书注指瑕》
    date:
      text: "约658年前后"
      year: 658
      precision: 约
    place: 绛州龙门
    summary: 新唐书载九岁得颜师古注《汉书》读之，作《指瑕》以擿其失，指摘一代经师注本的疏漏，惊动乡邦。
    source_ids: [src-xts-vol201]
  - stage: 绛州天才少年
    stage_order: 4
    title: 麟德初上书自陈，对策高第
    date:
      text: "约664年（麟德初）"
      year: 664
      precision: 约
    place: 关内
    summary: 新唐书载刘祥道巡行关内，勃上书自陈，祥道表于朝，对策高第。旧唐书则记其年未及冠应幽素举及第，乾封初又诣阙上《宸游东岳颂》《乾元殿颂》。两书所记入仕路径侧重不同。
    confidence: 存疑
    dispute: 入仕途径两唐书互异——新唐书作麟德初刘祥道荐引对策，旧唐书作应幽素举及第后再献颂；两者或先后相承，确切年份无定论。
    source_ids: [src-jts-vol190a, src-xts-vol201]
  - stage: 绛州天才少年
    stage_order: 5
    title: 年未及冠授朝散郎
    date:
      text: "约664—665年之间"
      year: 664
      range_end: 665
      precision: 范围
    place: 长安
    summary: 新唐书载对策高第后年未及冠授朝散郎（从七上文散官），数献颂阙下。未冠而官已及七品，一时称荣。
    source_ids: [src-xts-vol201]

  # ── 阶段二：沛王府与斗鸡之祸 ──────────────────────────
  - stage: 沛王府与斗鸡之祸
    stage_order: 6
    title: 沛王李贤召署府修撰
    date:
      text: "约666—669年之间"
      year: 666
      range_end: 669
      precision: 范围
    place: 长安沛王府
    summary: 沛王贤闻其名召为沛府修撰，甚爱重之；命论次《平台秘略》，书成王益爱重。入王府是勃一生最接近权力中枢的时期。
    source_ids: [src-jts-vol190a, src-xts-vol201]
  - stage: 沛王府与斗鸡之祸
    stage_order: 7
    title: 戏为《檄英王鸡文》，高宗震怒逐出王府
    date:
      text: "约669年"
      year: 669
      precision: 约
    place: 长安
    summary: 时诸王斗鸡互有胜负，勃戏为《檄英王鸡文》。高宗览之大怒曰二王不相和自此始，是交构之渐，即日斥勃不令入府。一篇游戏文字断送王府前程。
    source_ids: [src-jts-vol190a, src-xts-vol201]
  - stage: 沛王府与斗鸡之祸
    stage_order: 8
    title: 废斥后客居剑南，登葛愦山赋诗
    date:
      text: "约669—671年之间"
      year: 669
      range_end: 671
      precision: 范围
    place: 剑南（蜀中）
    summary: 新唐书载勃既废客剑南，尝登葛愦山旷望，慨然思诸葛亮之功，赋诗见情。蜀中漫游期作品多写羁旅漂泊之感。
    confidence: 存疑
    dispute: 蜀中之行起讫年份正史无明文，系学界据诗文与行程推定；葛愦山地望亦有待考。
    source_ids: [src-xts-vol201]

  # ── 阶段三：虢州祸变 ──────────────────────────────
  - stage: 虢州祸变
    stage_order: 9
    title: 求补虢州参军
    date:
      text: "约671—672年之间"
      year: 671
      range_end: 672
      precision: 范围
    place: 虢州
    summary: 新唐书载其闻虢州多药草求补参军（自请就任以便采药），旧唐书作久之补虢州参军。倚才陵藉，为同僚所嫉。
    confidence: 存疑
    dispute: 补虢州年份正史无载，通说系于咸亨年间，具体年次诸谱不一。
    source_ids: [src-jts-vol190a, src-xts-vol201]
  - stage: 虢州祸变
    stage_order: 10
    title: 匿杀官奴曹达，当诛遇赦除名
    date:
      text: "约673—674年之间"
      year: 673
      range_end: 674
      precision: 范围
    place: 虢州
    summary: 官奴曹达犯罪匿于勃所，惧事泄乃杀之以塞口。事发当死刑，适逢大赦改判除名。此案性质至今聚讼：或谓恃才傲物遭同僚设局构陷，或谓藏匿罪奴自知败露灭口。
    confidence: 有争议
    dispute: 杀奴动机两唐书仅记惧事泄四字；新旧《唐书》成书相距三百余年而情节一致，然唐代律令背景下匿奴杀奴的定罪逻辑、是否遭构陷，自宋以来争论不休。系年亦系推定。
    source_ids: [src-jts-vol190a, src-xts-vol201]
  - stage: 虢州祸变
    stage_order: 11
    title: 父福畤连坐左迁交趾令
    date:
      text: "约674年前后"
      year: 674
      precision: 约
    place: 交趾
    summary: 父福畤由雍州司户参军（新唐书作司功参军）因勃案连坐，远谪岭南道交趾令。王勃此后每以此深自咎责，遂有万里省父之行。
    confidence: 存疑
    dispute: 连坐贬谪年份随勃案系年推定；官职名两书一字之差（司户/司功）。
    source_ids: [src-jts-vol190a, src-xts-vol201]

  # ── 阶段四：南下省父与绝笔 ────────────────────────────
  - stage: 南下省父与绝笔
    stage_order: 12
    title: 上元二年启程往交趾省父，道出江中赋《采莲赋》
    date:
      text: "675年（上元二年）"
      year: 675
      precision: 精确
    place: 长江中下游
    summary: 旧唐书明载上元二年勃往交趾省父，道出江中为《采莲赋》以见意，其辞甚美。取道水路南下，经江南入岭外。
    source_ids: [src-jts-vol190a]
  - stage: 南下省父与绝笔
    stage_order: 13
    title: 重阳洪州滕王阁宴，即席成序
    date:
      text: "675年九月九日（通说）"
      year: 675
      precision: 约
    place: 洪州滕王阁
    summary: 新唐书载道出钟陵，九月九日都督大宴滕王阁，宿命其婿作序夸客，纸笔遍请莫敢当，至勃沆然不辞。都督怒起更衣遣吏伺其文辄报，一再报语益奇，乃矍然曰天才也，极欢而罢。《滕王阁序》与诗即成于此宴。
    confidence: 存疑
    dispute: 作序年份主流定为上元二年(675)重阳赴交趾途中所作，另有十四岁少年作、上元三年返程作等异说；都督阎公之名两唐书未载，宴席细节出自新唐书叙事传统。
    source_ids: [src-xts-vol201]
  - stage: 南下省父与绝笔
    stage_order: 14
    title: 渡海溺水，惊悸而卒
    date:
      text: "约676年（上元三年）"
      year: 676
      precision: 约
    place: 南海（渡琼州海峡一带）
    summary: 往交趾途中渡南海，堕水惊悸而死（新唐书作痵而卒）。旧唐书称时年二十八，新唐书称年二十九。一代奇才未满三十而没，文集三十卷后多散佚。
    confidence: 存疑
    dispute: 卒年两唐书直接矛盾——旧唐书作年二十八，新唐书作年二十九；本卷从L1通说约676年（上元三年八月渡海说为主流），享年相应为27或26周岁（虚岁28/29）。溺水地点史无确载，渡南海所指海域亦有琼州海峡与南海近岸诸理解。
    source_ids: [src-jts-vol190a, src-xts-vol201]

works:
  - work_id: song-du-shaofu-zhi-renshuzhou
    title: 送杜少府之任蜀州
    alt_titles: [送杜少府之任蜀川]
    genre: 五言律诗
    date:
      text: 创作年代不详，一般系于长安供职前后
      precision: 未知
    place: 长安（一说）
    context: 送友人赴蜀上任之作。海内存知己天涯若比邻将离别写得开阔昂扬，一洗送别诗悲酸态。
    attribution: 确凿
    excerpt: 城阙辅三秦，风烟望五津。与君离别意，同是宦游人。海内存知己，天涯若比邻。无为在歧路，儿女共沾巾。
    text_display: full
    themes: [送别, 友情]
    influence: 海内存知己成为友情超越空间的千古格言，五律定型期的典范之作。
    source_ids: [src-qts-wangbo]

  - work_id: tengwangge-xu
    title: 滕王阁序
    alt_titles: [秋日登洪府滕王阁饯别序]
    genre: 骈文
    date:
      text: "675年重阳（通说）"
      year: 675
      precision: 约
    place: 洪州滕王阁
    context: 新唐书载都督大宴滕王阁宿命婿作序夸客，勃沆然不辞援笔立就，都督叹曰天才也。即席挥毫而成千古第一骈文。
    attribution: 确凿
    excerpt: 时维九月，序属三秋。潦水尽而寒潭清，烟光凝而暮山紫。……落霞与孤鹜齐飞，秋水共长天一色。……关山难越，谁悲失路之人；萍水相逢，尽是他乡之客。老当益壮，宁移白首之心；穷且益坚，不坠青云之志。
    text_display: excerpt
    themes: [宴集, 怀才不遇, 山川]
    influence: 中国骈文的巅峰文本，落霞秋水一联为妇孺皆知的名句；滕王阁因此序位列江南三大名楼之首。
    confidence: 存疑
    dispute: 作序时间地点从上元二年洪州宴通说，另有异说；序末附诗与否及文字异读历代版本讨论不绝。
    source_ids: [src-xts-vol201]

  - work_id: tengwangge-shi
    title: 滕王阁诗
    alt_titles: []
    genre: 七言古诗
    date:
      text: "675年重阳，与序同时所作"
      year: 675
      precision: 约
    place: 洪州滕王阁
    context: 附于序末的收束之作，阁中帝子今何在槛外长江空自流，将盛衰之慨推向无穷时空。
    attribution: 确凿
    excerpt: 滕王高阁临江渚，佩玉鸣鸾罢歌舞。画栋朝飞南浦云，珠帘暮卷西山雨。闲云潭影日悠悠，物换星移几度秋。阁中帝子今何在？槛外长江空自流。
    text_display: full
    themes: [怀古, 盛衰]
    influence: 与序珠联璧合，槛外长江空自流为怀古绝唱。
    confidence: 存疑
    dispute: 与序同场所作从通说，系年争议同序。
    source_ids: [src-xts-vol201]

  - work_id: shan-zhong
    title: 山中
    alt_titles: []
    genre: 五言绝句
    date:
      text: "约670年前后，客居巴蜀时期"
      year: 670
      precision: 约
    place: 蜀中
    context: 被斥出府后漫游剑南，久客思归之作。长江悲已滞以滞字写江亦写己，二十字而苍凉无限。
    attribution: 确凿
    excerpt: 长江悲已滞，万里念将归。况属高风晚，山山黄叶飞。
    text_display: full
    themes: [羁旅, 思归, 秋]
    influence: 五绝中以景结情的早期名篇。
    confidence: 存疑
    dispute: 系年据蜀中漫游行迹推定。
    source_ids: [src-qts-wangbo, src-xts-vol201]

  - work_id: bie-xue-hua
    title: 别薛华
    alt_titles: [别薛升华]
    genre: 五言律诗
    date:
      text: "约670年前后，客蜀期间"
      year: 670
      precision: 约
    place: 蜀中
    context: 送别同游友人薛华之作，心事同漂泊生涯共苦辛，把两人命运打成一片，凄苦沉痛与其送杜少府之昂扬恰成两极。
    attribution: 确凿
    excerpt: 送送多穷路，遑遑独问津。悲凉千里道，况复百年身。心事同漂泊，生涯共苦辛。无论去与住，俱是梦中人。
    text_display: full
    themes: [送别, 漂泊]
    influence: 展现四杰诗风中沉郁一面的代表作。
    confidence: 存疑
    dispute: 薛华其人与作地均难确考，系年从蜀中通说。
    source_ids: [src-qts-wangbo]

