id: liyu

profile:
  courtesy_name: 重光
  art_name: 钟隐、莲峰居士
  aliases: [李后主, 违命侯]
  gender: 男
  ethnicity: ""
  ancestry: 徐州（祖父李昪自称唐宪宗之子建王恪的四世孙，欧阳修书「自言」「自以为」示存疑）
  birthplace: 金陵
  death_place: 汴梁（东京开封府）
  offices: [南唐国主, 违命侯（宋爵）, 左千牛卫将军]
  fields: [文学]
  roles: [词人, 画家, 音乐家]
  summary: 南唐末代国主，工书画音律诗文而不恤政事；亡国之后以血泪写词，遂变伶工之词为士大夫之词，后世尊为词中之帝。

timeline:
  # ── 阶段一：王子岁月 ──────────────────────────────
  - stage: 王子岁月
    stage_order: 1
    title: 出生金陵
    date:
      text: "937年"
      year: 937
      precision: 精确
    place: 金陵
    summary: 初名从嘉，字重光，元宗李璟第六子。为人仁孝，善属文，工书画，丰额骈齿，一目重瞳。一目重瞳系正史形貌记录，后世附会舜与项羽，本卷不作信史外的引申。
    confidence: 存疑
    dispute: 新五代史记其形貌而不载生年；937年生与七夕诞辰均系后世据卒年四十二倒推并采笔记层材料。
    source_ids: [src-xwushi-liyu]
  - stage: 王子岁月
    stage_order: 2
    title: 兄辈凋零，以次封吴王居东宫
    date:
      text: 约959年
      year: 959
      precision: 约
    place: 金陵
    summary: 太子冀卒后，冀以上五子皆早亡，从嘉以次封吴王。钟谟言从嘉轻肆请立纪国公从善，璟怒贬谟国子司业，仍立从嘉为太子。
    confidence: 存疑
    dispute: 封吴王在太子冀卒后，冀卒于显德六年九月，故系年约959。
    source_ids: [src-xwushi-liyu]
  - stage: 王子岁月
    stage_order: 3
    title: 立为太子，留监国
    date:
      text: "961年"
      year: 961
      precision: 精确
    place: 金陵
    summary: 建隆二年璟迁都洪州升为南昌建南都，留太子从嘉监国。同年六月璟卒于南都，年六十四，从嘉以丧归金陵嗣位。
    source_ids: [src-xwushi-liyu]

  # ── 阶段二：在位金陵 ──────────────────────────────
  - stage: 在位金陵
    stage_order: 4
    title: 嗣立于金陵，遣使修贡
    date:
      text: "961年"
      year: 961
      precision: 精确
    place: 金陵
    summary: 煜嗣立，尊母钟氏为圣尊后，立妃周氏为国后，封弟从善韩王等，大赦境内。遣中书侍郎冯延鲁修贡于宋廷，令诸司四品以下无职事者日二员待制内殿。
    source_ids: [src-xwushi-liyu]
  - stage: 在位金陵
    stage_order: 5
    title: 光政殿宿直谈论，韩熙载相业不成
    date:
      text: 约967年
      year: 967
      precision: 约
    place: 金陵
    summary: 乾德五年命两省侍郎诸学士分夕于光政殿宿直，煜引与谈论。尝以韩熙载尽忠能直言欲用为相，以熙载后房妓妾数十分司南都试之，终叹吾终不得熙载为相也。
    confidence: 存疑
    dispute: 宿直与韩熙载事新五代史系于乾德五年条下；韩熙载夜宴图所绘纵情声色自污情节属画史与笔记层。
    source_ids: [src-xwushi-liyu]
  - stage: 在位金陵
    stage_order: 6
    title: 弟从善朝宋被留，手疏求还不许
    date:
      text: "971年"
      year: 971
      precision: 精确
    place: 金陵、汴京
    summary: 开宝四年煜遣弟韩王从善朝京师，遂留不遣。煜手疏求从善还国，太祖不许。煜尝怏怏以国蹙为忧，日与臣下酣宴愁思悲歌不已。
    source_ids: [src-xwushi-liyu]
  - stage: 在位金陵
    stage_order: 7
    title: 贬损制度去国号，称江南国主奉宋正朔
    date:
      text: "972年"
      year: 972
      precision: 精确
    place: 金陵
    summary: 开宝五年煜下令贬损制度：下书称教，改中书门下省为左右内史府、尚书省为司会府、枢密院为光政院，诸王皆降国公，以尊朝廷。史称其性骄侈好声色又喜浮图，不恤政事。
    confidence: 存疑
    dispute: 新五代史止书「贬损制度」改易省院名号；「去唐国号称江南国主、去开元钱改用铁钱」等细节详宋史与续资治通鉴长编层，本卷分层标注不混作同源信史。
    source_ids: [src-xwushi-liyu]
  - stage: 在位金陵
    stage_order: 8
    title: 潘佑极谏下狱自缢，李平连坐
    date:
      text: "973年"
      year: 973
      precision: 精确
    place: 金陵
    summary: 开宝六年内史舍人潘佑上书极谏，煜收下狱，佑自缢死。此事后世视为煜失道之征。
    confidence: 有争议
    dispute: 新五代史仅载潘佑收狱自缢；李平与佑同日赐死、及户部尚书之职等细节出自马令陆游南唐书与宋人笔记层，情节后世聚讼，故标争议。
    source_ids: [src-xwushi-liyu]

  # ── 阶段三：亡国降俘 ──────────────────────────────
  - stage: 亡国降俘
    stage_order: 9
    title: 称疾不行，王师南征
    date:
      text: "974年"
      year: 974
      precision: 精确
    place: 金陵
    summary: 开宝七年太祖遣使诏煜赴阙，煜称疾不行，王师南征。宋军统帅部署（曹彬为主帅潘美都监）之名号新五代史不著，详见宋史层记载。
    source_ids: [src-xwushi-liyu]
  - stage: 亡国降俘
    stage_order: 10
    title: 遣徐铉周惟简奉表求缓师
    date:
      text: 974—975年之间
      year: 974
      range_end: 975
      precision: 范围
    place: 汴京
    summary: 煜遣徐铉周惟简等奉表朝廷求缓师，太祖不答。欧阳修于卷末自注录徐铉廷辩轶事：铉仰言李煜无罪陛下师出无名，以太祖尔谓父子者为两家可乎语对而退。
    source_ids: [src-xwushi-liyu]
  - stage: 亡国降俘
    stage_order: 11
    title: 金陵城破，出降
    date:
      text: "975年十二月"
      year: 975
      precision: 精确
    place: 金陵
    summary: 开宝八年十二月王师克金陵。煜出降被俘至京师。
    confidence: 存疑
    dispute: 新五代史仅记城破与被俘至京师；肉袒出降于军门、降仪细节出自宋人记载层，本卷不作确证表述。
    source_ids: [src-xwushi-liyu]
  - stage: 亡国降俘
    stage_order: 12
    title: 俘至京师，封违命侯拜左千牛卫将军
    date:
      text: "976年"
      year: 976
      precision: 精确
    place: 汴京
    summary: 开宝九年煜俘至京师，太祖赦之，封违命侯，拜左千牛卫将军。违命侯之爵实含贬抑，太宗即位后始加封陇西公（此节详宋史层）。
    source_ids: [src-xwushi-liyu]

  # ── 阶段四：汴梁囚居 ──────────────────────────────
  - stage: 汴梁囚居
    stage_order: 13
    title: 囚居汴梁，词风巨变
    date:
      text: 976—978年之间
      year: 976
      range_end: 978
      precision: 范围
    place: 汴京
    summary: 以臣虏之身囚居汴梁凡三年，故国之思皆入词章。虞美人浪淘沙破阵子等后期词以血泪写亡国，词境自宫廷艳情一变而为人生悲慨。
    confidence: 存疑
    dispute: 后期词的系年均系后人推定，具体写作年份无可确考；囚居细节多承宋人笔记层。
    source_ids: []
  - stage: 汴梁囚居
    stage_order: 14
    title: 卒于汴梁，年四十二
    date:
      text: "978年"
      year: 978
      precision: 精确
    place: 汴京
    summary: 太平兴国三年卒，年四十二，葬地传在洛阳北邙山。新五代史于此止书其后事具国史，本卷卒年据宋史层记载补足。
    confidence: 存疑
    dispute: 卒年978与享年四十二出自宋史及宋人记载层，非新五代史明文；七夕适值其生日而卒、牵机药赐死说出王铚默记等笔记传说层，不得冒充信史。
    source_ids: []

works:
  - work_id: yumeiren-chunhuaqiuyue
    title: 虞美人·春花秋月何时了
    alt_titles: [虞美人]
    genre: 词
    date:
      text: 约978年前后（囚居汴梁期间）
      year: 978
      precision: 约
    place: 汴京（推定）
    context: 亡国入宋后的绝笔之作，通说系于其卒年前夕。通篇以问起以答结，故国之思化作一江春水。
    attribution: 确凿
    excerpt: 春花秋月何时了，往事知多少。小楼昨夜又东风，故国不堪回首月明中。……问君能有几多愁，恰似一江春水向东流。
    text_display: excerpt
    themes: [亡国之痛, 故国]
    influence: 词史上以血书者的代表，千古传诵的绝命词。
    confidence: 存疑
    dispute: 系年为后人推定；相传此词招致杀身之说属笔记传说层。
    source_ids: []
  - work_id: langtaosha-lianwaiyuchanchan
    title: 浪淘沙令·帘外雨潺潺
    alt_titles: [浪淘沙]
    genre: 词
    date:
      text: 975—978年之间（囚居时期）
      year: 975
      range_end: 978
      precision: 范围
    place: 汴京（推定）
    context: 囚居梦中贪欢醒来所作，流水落花春去也天上人间，身世之痛极矣。
    attribution: 确凿
    excerpt: 帘外雨潺潺，春意阑珊。罗衾不耐五更寒。梦里不知身是客，一晌贪欢。……流水落花春去也，天上人间。
    text_display: excerpt
    themes: [亡国之痛, 梦境]
    influence: 以寻常语度入音律而境界全出的后期代表作。
    confidence: 存疑
    dispute: 后期词系年为后人推定。
    source_ids: []
  - work_id: xiangjianhuan-wuyandushangxilou
    title: 相见欢·无言独上西楼
    alt_titles: [乌夜啼·无言独上西楼]
    genre: 词
    date:
      text: 约976—978年之间（囚居时期）
      year: 976
      range_end: 978
      precision: 范围
    place: 汴京（推定）
    context: 囚居离愁之作，剪不断理还乱以浅白口语写无可排遣之情。
    attribution: 确凿
    excerpt: 无言独上西楼，月如钩。寂寞梧桐深院锁清秋。剪不断，理还乱，是离愁。别是一般滋味在心头。
    text_display: full
    themes: [离愁, 孤寂]
    influence: 千古写愁名篇，全篇如白话而余味无穷。
    confidence: 存疑
    dispute: 系年为后人推定；调名相见欢乌夜啼两属，各本互异。
    source_ids: []
  - work_id: wuyeti-linhuaxielechunhong
