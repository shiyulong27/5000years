# | 封王储 | 太子冀卒次子從嘉封吳王居東宮；鍾謨請立從善被貶仍立從嘉為太子 | 确定(X)，约显德六年(959) |
# | 即位 | 建隆二年景遷南都立煜為太子留監國；景卒煜嗣立於金陵 | 确定(X)，961 |
# | 臣宋去号 | 五年煜下令貶損制度（改中書門下為左右內史府等） | 确定(X)止书贬损制度；去唐国号称江南国主详宋史层，分层标注 |
# | 潘佑之死 | 六年內史舍人潘佑上書極諫煜收下獄佑自縊死 | 确定(X)止书潘佑；李平连坐出南唐书与笔记层，标争议 |
# | 伐唐 | 七年詔煜赴闕稱疾不行王師南征 | 确定(X)；曹彬为主帅之名详宋史层 |
# | 亡国 | 八年十二月王師克金陵；九年煜俘至京師赦之封違命侯拜左千牛衞將軍 | 确定(X) |
# | 之死 | 其後事具國史——本卷无卒年明文 | 卒年978年四十二据宋史层；牵机药说出笔记传说层，分层标注 |
