    title: 拜孝文园令，奏《大人赋》天子飘飘凌云
    date:
      text: 武帝朝中期，确切年份不详
      precision: 未知
    place: 长安
    summary: 相如拜为孝文园令。见上好仙道，因曰上林之事未足美也尚有靡者臣尝为大人赋未就请具而奏之。相如以为列仙之传居山泽间形容甚臞，此非帝王仙意也，乃遂就《大人赋》。既奏，天子大说，飘飘有凌云之气，似游天地之间意。
