      range_end: -141
      precision: 范围
    place: 临邛、成都
    summary: 既罢，相如乃使人重赐文君侍者通殷勤。文君夜亡奔相如，相如乃与驰归成都，家居徒四壁立。卓王孙大怒曰女至不材我不忍杀不分一钱也。
    confidence: 存疑
    dispute: 夜奔细节按《史记》本传原文录入；具体年份系推定。
    source_ids: [src-shiji-vol117]
