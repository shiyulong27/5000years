    evaluator: 影视改编综述
    quote: ""
    text_display: none
    comment: 相关影视剧与网络内容多据传说层敷演琴挑与私奔情节，与《史记》正史层出入较大；本项目仅将影视呈现视为当代接受现象记录，不作史实依据。
