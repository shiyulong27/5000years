      year: -143
      range_end: -142
      precision: 范围
    place: 成都
    summary: 会梁孝王卒，相如归，而家贫，无以自业。素与临邛令王吉相善，吉曰长卿久宦游不遂而来过我，于是相如往舍都亭。
    source_ids: [src-shiji-vol117]
  - stage: 临邛琴挑与当垆
    stage_order: 6
    title: 卓氏盛宴，鼓一再行以琴心挑文君
    date:
      text: 约前142—前141年之间
      year: -142
      range_end: -141
      precision: 范围
    place: 临邛卓王孙宅
    summary: 临邛令缪为恭敬日往朝相如。富人卓王孙程郑为具召之，相如不得已强往，一坐尽倾。酒酣临邛令前奏琴，相如为鼓一再行。是时卓王孙有女文君新寡好音，故相如缪与令相重，而以琴心挑之。文君窃从户窥之心悦而好之。
    confidence: 存疑
    dispute: 宴会与琴挑的具体年份无载系推定；本条按《史记》原文层录「以琴心挑之为鼓一再行」，所弹曲目正史未言，《凤求凰》歌辞属集外层材料另列于作品区并标存疑。
    source_ids: [src-shiji-vol117]
  - stage: 临邛琴挑与当垆
    stage_order: 7
