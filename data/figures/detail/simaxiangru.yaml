relations:
  - relation_type: 思想影响
    target_id: simaqian
    direction: 单向
    period:
      text: 相如卒（约前118）后，司马迁著史为其立专篇
      year: -118
      precision: 约
    evidence: 《史记》卷一百一十七即司马迁亲撰的司马相如列传，全文收录子虚、上林（天子游猎赋）、大人、哀二世、封禅诸篇并系传主生平，是关于相如的第一手史料；太史公曰评「相如虽多虚辞滥说，然其要归引之节俭，此与诗之风谏何异」。须说明：此为传主关系而非可证实的两人交往——相如卒时司马迁年少，现存史料无二人直接往来记载。
    inferred: true
    confidence: 存疑
    dispute: 本条实为史学编纂关联而非人际交往，direction 单向仅表示史料收录与评价的方向；二人交往传闻均无史据。「赋家之心」语境出自后世文献，本卷来源未登记，不予引用。
    source_ids: [src-shiji-vol117]

reception:
  - era: 同时代
    evaluator: 汉武帝刘彻
    quote: 朕独不得与此人同时哉！
    text_display: excerpt
    comment: 武帝读《子虚赋》后的感叹（《史记》本传），直接引发狗监杨得意荐引召见；其后读《大人赋》又飘飘有凌云之气。帝王的两度激赏奠定了相如在当世的地位。
    source_ids: [src-shiji-vol117]
  - era: 同时代
    evaluator: 司马迁（太史公曰）
    quote: 相如虽多虚辞滥说，然其要归引之节俭，此与诗之风谏何异。
    text_display: excerpt
    comment: 太史公在专篇末尾为汉赋辩护的总评，将其纳入诗经讽谏传统；同段又引扬雄「劝百风一」之讥并存两说，显示史家态度的复杂性。
    source_ids: [src-shiji-vol117]
  - era: 历代批评
    evaluator: 扬雄
    quote: 靡丽之赋，劝百风一，犹驰骋郑卫之声，曲终而奏雅，不已亏乎？
    text_display: excerpt
    comment: 此语见于《史记》卷一百一十七太史公曰所引（该段落是否司马迁原笔抑或后人增补，学界有讨论）。扬雄晚年悔作赋，于《法言·吾子》更有「童子雕虫篆刻」「壮夫不为」之论——《法言》来源本卷尚未登记，故该句仅在此中立转述而不录引文。扬雄的批评开启了此后两千年对汉赋价值聚讼不休的传统。
    confidence: 有争议
    dispute: 「劝百风一」段的作者归属（司马迁原笔/褚少孙以降补缀）本身即是学术公案；《法言》引文未登记来源，暂不摘引。
    source_ids: [src-shiji-vol117]
  - era: 近现代学术
    evaluator: 学界综述
    quote: ""
    text_display: none
    comment: 研究聚焦三大议题：其一，大赋体制研究——子虚上林的篇题分合、劝讽结构与散体大赋的形成机制；其二，真伪考辨——《长门赋》《美人赋》归属与《琴歌》凤求凰的晚出问题；其三，生卒年推算与通西南夷史事的系年。具体论著引文须逐条取得许可后补入，本卷暂作中立转述。
    source_ids: []
  - era: 教科书与公共文化
    evaluator: 大众传播与戏曲传统
    quote: ""
    text_display: none
    comment: 琴挑文君、当垆卖酒的故事经由《西京杂记》系统与后世戏曲小说不断敷演，成为才子佳人叙事的祖型母题，「凤求凰」「愿得一心人」（白头吟系统，归属另议）化为爱情文化符号；相如故里（成都/蓬安）、文君井等纪念景观持续生成。教材选篇情况随学期变动，录入时须另行核验。
    source_ids: []
