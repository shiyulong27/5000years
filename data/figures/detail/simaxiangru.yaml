    confidence: 存疑
    dispute: 病免年份正史无载系推定。
    source_ids: [src-shiji-vol117]
  - stage: 晚年与身后
    stage_order: 19
    title: 卒于茂陵，遗札书言封禅事
    date:
      text: "约前118年"
      year: -118
      precision: 约
    place: 茂陵
    summary: 天子曰司马相如病甚可往从悉取其书若不然后失之矣。使所忠往而相如已死家无书。问其妻，对曰长卿未死时为一卷书曰有使者来求书奏之。其遗札书言封禅事，忠奏其书，天子异之。相如既卒五岁天子始祭后土，八年而遂先礼中岳封于泰山至梁父禅肃然——遗篇竟成封禅大典的理论先声。
    confidence: 存疑
    dispute: 卒年约前118系推算，正史无明文；卒年直接决定生年前179之说亦随之存疑。
    source_ids: [src-shiji-vol117]

works:
  - work_id: zixu-fu
    title: 子虚赋
    alt_titles: []
    genre: 大赋
    date:
      text: 客游梁国期间，约前150年代
      year: -150
      range_end: -146
      precision: 范围
    place: 梁国睢阳
    context: 与邹阳枚乘等梁苑游士同居数岁间所著。借楚使子虚夸云梦之猎、乌有先生折之，为后来天子游猎赋的前半骨架。武帝读之叹不得与此人同时，遂有狗监荐引召见之事。
    attribution: 确凿
    excerpt: 臣之所见，盖特其小小者耳，名曰云梦。云梦者，方九百里，其中有山焉。其山则盘纡茀郁，隆崇嵂崒；岑岩参差，日月蔽亏；交错纠纷，上干青云。
    text_display: excerpt
    themes: [苑囿, 田猎, 夸饰]
    influence: 汉大赋体制的奠基之作之一，「子虚乌有」由此成为虚构的代词。
    confidence: 存疑
    dispute: 《史记》所载为客梁所著「子虚之赋」，与武帝朝所奏天子游猎赋的篇题分合关系历来有讨论，详见上林赋条。
    source_ids: [src-shiji-vol117]

  - work_id: shanglin-fu
    title: 上林赋（天子游猎赋）
    alt_titles: [天子游猎赋]
    genre: 大赋
    date:
      text: 约前136—前135年之间奏上
      year: -136
      range_end: -135
      precision: 范围
    place: 长安
    context: 召见后应武帝之请而作，无是公盛陈天子之上林以压齐楚之争，卒章归之节俭以寓风谏。赋奏天子以为郎。《汉书》《文选》析子虚上林为两题，《史记》合载为一篇。
    attribution: 确凿
    excerpt: 君未睹夫巨丽也，独不闻天子之上林乎？左苍梧，右西极，丹水更其南，紫渊径其北……荡荡兮八川分流，相背而异态。
    text_display: excerpt
    themes: [苑囿, 田猎, 风谏]
    influence: 确立了劝百讽一的汉大赋范式，为扬雄、班固等竞相摹习的典范。
    confidence: 存疑
    dispute: 篇题分合问题：《史记》以子虚上林连为一体称天子游猎赋，《汉书艺文志》《文选》始分题二篇；作于此说外另有改定旧稿说。
    source_ids: [src-shiji-vol117]

  - work_id: daren-fu
    title: 大人赋
    alt_titles: [大人之颂]
    genre: 大赋
    date:
      text: 孝文园令任上，确切年份不详
      precision: 未知
    place: 长安
    context: 相如见上好仙道，以为列仙居山泽形容甚臞非帝王仙意，乃就大人赋以讽。奏之天子大说飘飘有凌云之气——欲谏反成劝，风谏失效的著名个案。
    attribution: 确凿
    excerpt: 世有大人兮，在于中州。宅弥万里兮，曾不足以少留。悲世俗之迫隘兮，朅轻举而远游。……下峥嵘而无地兮，上寥廓而无天。视眩眠而无见兮，听惝恍而无闻。乘虚无而上假兮，超无友而独存。
    text_display: excerpt
    themes: [神仙, 远游, 讽谏]
    influence: 反向效果的讽谏名例，常被用为汉代献赋制度批评的标本。
    source_ids: [src-shiji-vol117]

  - work_id: jian-lie-shu
    title: 上书谏猎
    alt_titles: [谏猎疏, 谏猎书]
    genre: 奏疏
    date:
      text: 武帝朝中期，确切年份不详
      precision: 未知
    place: 长杨宫一带
    context: 天子方好自击熊彘驰逐野兽，相如随行上疏谏止，引家累千金坐不垂堂之谚，谓轻万乘之重乐出万有一危之涂以为娱臣窃为陛下不取也。上善之。
    attribution: 确凿
    excerpt: 盖明者远见于未萌，而智者避危于无形；祸固多藏于隐微，而发于人之所忽者也。故鄙谚曰「家累千金，坐不垂堂」。此言虽小，可以喻大。
    text_display: excerpt
    themes: [谏诤, 明哲保身]
    influence: 明者远见于未萌成为传世格言，历代谏书常引。
    source_ids: [src-shiji-vol117]

  - work_id: nan-shufulao
    title: 难蜀父老
    alt_titles: [喻难蜀父老]
    genre: 散体文（设难问答）
    date:
      text: 约前128年前后，奉使还报之际
      year: -128
      precision: 约
    place: 蜀
    context: 通西南夷劳费而蜀长者多言不便，相如欲谏业已建之不敢，乃设蜀父老二十七人与使者问答，己诘难之以风天子，宣明开边之义。
    attribution: 确凿
    excerpt: 盖世必有非常之人，然后有非常之事；有非常之事，然后有非常之功。非常者，固常之所异也。
    text_display: excerpt
    themes: [经略, 风谏]
    influence: 非常之人非常之事成为历代开拓叙事的经典语汇。
    confidence: 存疑
    dispute: 作年系于奉使期间，学界依《史记》叙次推定。
    source_ids: [src-shiji-vol117]

  - work_id: ai-ershi-fu
    title: 哀二世赋
    alt_titles: []
    genre: 骚体赋
    date:
      text: 武帝朝中期，确切年份不详
      precision: 未知
    place: 宜春宫
    context: 上善谏猎之言，还过宜春宫，相如奏赋以哀二世行失——借秦二世持身不谨信谗不寤以致宗庙灭绝，婉讽武帝。
    attribution: 确凿
    excerpt: 持身不谨兮，亡国失势。信谗不寤兮，宗庙灭绝。呜呼哀哉！操行之不得兮，坟墓芜秽而不修兮，魂无归而不食。
    text_display: excerpt
    themes: [吊古, 讽谏]
    influence: 以秦亡为镜的短章骚赋，与谏猎疏同为其兼擅讽谕的证据。
    source_ids: [src-shiji-vol117]

  - work_id: fengshan-wen
    title: 封禅文
    alt_titles: [遗札书]
    genre: 文（颂赞）
    date:
      text: 临终所作，约前118年
      year: -118
      precision: 约
    place: 茂陵
    context: 家无余书，惟临终预为一卷书嘱妻曰有使者来求书奏之。遗札言封禅事，奏所忠，忠奏其书天子异之。卒后五岁祭后土，八年遂封泰山禅梁父，遗篇与盛典遥相呼应。
    attribution: 确凿
    excerpt: 兴必虑衰，安必思危。……圣王之德，兢兢翼翼也。
    text_display: excerpt
    themes: [封禅, 颂德]
    influence: 中国历史上少有的「身后生效」的政治文书，直接为武帝封禅提供文本依据。
    confidence: 存疑
    dispute: 卒年约前118系推算；封禅文与武帝元封封禅的呼应关系系《史记》叙次所示，其间因果程度学者有不同解读。
    source_ids: [src-shiji-vol117]

  - work_id: changmen-fu
    title: 长门赋
    alt_titles: []
    genre: 骚体赋
    date:
      text: 不详（托言武帝时陈皇后事）
      precision: 未知
    place: ""
    context: 《文选》所收本题序言称陈皇后失宠别在长门宫，闻相如工文章奉黄金百斤令取愁思之辞，相如为之而皇后复得亲幸。赋写佳人望君之不来，凄婉深致。
    attribution: 存疑
    excerpt: 夫何一佳人兮，步逍遥以自虞。魂逾佚而不反兮，形枯槁而独居。
    text_display: excerpt
    themes: [宫怨, 抒情]
    influence: 后世宫怨文学的源头文本之一，「长门」成为失宠幽居的经典意象。
    confidence: 有争议
    dispute: 归属历来有争议：《史记》《汉书》均不载此事，赋序所叙黄金买赋情节被多数近现代学者视为后人敷演，或疑为托名之作；本卷按存疑著录。出处《文选》尚未登记来源，source_ids 留空待补。
    source_ids: []

  - work_id: meiren-fu
    title: 美人赋
    alt_titles: []
    genre: 赋
    date:
      text: 不详
      precision: 未知
    place: ""
    context: 见于后世辑本《古文苑》，设东邻女子登墙窥臣三年而相如不为动之类情节，以自守答谤。文体与《西京杂记》所存相如逸闻互有纠缠。
    attribution: 托名
    excerpt: ""
    text_display: none
    themes: [自守, 辨诬]
    influence: 常与登徒子好色赋对读，作为汉代艳情辩诬题材的样本。
    confidence: 有争议
    dispute: 真伪聚讼已久：《史记》《汉书》本传及艺文志皆不载，多数学者认为系后人依托；因来源文献未登记且真伪未决，本卷不作原文摘录。
    source_ids: []

  - work_id: qinge-ershou
    title: 琴歌二首（其一·凤求凰）
    alt_titles: [凤求凰]
    genre: 琴歌
    date:
      text: 传说系于琴挑文君之时，年代不详
      precision: 未知
    place: 临邛
    context: 正史层面《史记》只记相如于卓氏宴上「为鼓一再行」而以琴心挑之，并未载歌辞。凤求凰歌辞见于后世所编《玉台新咏》等集外文献，与《西京杂记》系统的传闻共同构成琴挑故事的后出层。
    attribution: 托名
    excerpt: 凤兮凤兮归故乡，遨游四海求其凰。
    text_display: excerpt
    themes: [求偶, 琴挑]
    influence: 凤求凰成为中国爱情文化的核心符号，戏曲小说母题之源。
    confidence: 传说
    dispute: 属集外层材料而非正史：歌辞晚出，异文繁多（求其凰/求其皇），学界多认为经后人润色或依托，不可与本传「琴心挑之」混为一谈；本卷分层著录。
    source_ids: []

