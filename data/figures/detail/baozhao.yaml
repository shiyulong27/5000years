works:
  - work_id: ni-xing-lu-nan-qi-si-xie-shui-zhi-ping-di
    title: 拟行路难十八首·其四
    alt_titles: [擬行路難十八首·其四]
    genre: 七言杂言乐府（组诗）
    date:
      text: 创作年代无定说
      precision: 未知
    place: ""
    context: 以泻水置平地各东西南北流起兴，写人生有命而行叹坐愁的困局；结尾心非木石岂无感吞声踯躅不敢言，把不敢言三个字压成千古寒门的心声。
    attribution: 确凿
    excerpt: 泻水置平地，各自东西南北流。人生亦有命，安能行叹复坐愁！酌酒以自宽，举杯断绝歌路难。心非木石岂无感？吞声踯躅不敢言。
    text_display: full
    themes: [命途, 寒门之愤, 吞声不言]
    influence: 中国诗歌史上以组诗形式抒写士人不遇之愤的巅峰之作，下启李白等人的行路难系列。
    confidence: 存疑
    dispute: 文本实取维基文库擬行路難页（公版，鲍氏集系统，src-baomingyuanji）；组诗系年无定说。
    source_ids: [src-baomingyuanji]

  - work_id: ni-xing-lu-nan-qi-liu-dui-an-bu-neng-shi
    title: 拟行路难十八首·其六
    alt_titles: [擬行路難十八首·其六]
    genre: 七言杂言乐府（组诗）
    date:
      text: 创作年代无定说
      precision: 未知
    place: ""
    context: 对案不能食拔剑击柱长叹息，写弃置罢官后的居家场景，弄儿床前戏看妇机中织，愈平淡愈见牢落；尾联自古圣贤尽贫贱何况我辈孤且直，孤且直二字是其一生自况。
    attribution: 确凿
    excerpt: 对案不能食，拔剑击柱长叹息。丈夫生世会几时，安能蹀躞垂羽翼？弃置罢官去，还家自休息。……弄儿床前戏，看妇机中织。自古圣贤尽贫贱，何况我辈孤且直！
    text_display: excerpt
    themes: [失意, 孤直, 门第之慨]
    influence: 长期入选语文教材的鲍照代表作，孤且直成为寒门士人自我认同的经典语汇。
    confidence: 存疑
    dispute: 文本实取维基文库擬行路難页（公版，鲍氏集系统，src-baomingyuanji）；系年无定说。
    source_ids: [src-baomingyuanji]

  - work_id: ni-xing-lu-nan-qi-yi-feng-jun-jin-zhi
    title: 拟行路难十八首·其一
    alt_titles: [擬行路難十八首·其一]
    genre: 七言杂言乐府（组诗）
    date:
      text: 创作年代无定说
      precision: 未知
    place: ""
    context: 组诗首章，以金卮美酒雕琴羽帐锦衾铺陈人生欢娱之物，而以红颜零落岁将暮陡然转折，劝君裁悲减思，听我抵节行路吟——为整组行路吟定调。
    attribution: 确凿
    excerpt: 奉君金卮之美酒，玳瑁玉匣之雕琴。七彩芙蓉之羽帐，九华蒲萄之锦衾。……愿君裁悲且减思，听我抵节行路吟。不见柏梁铜雀上，宁闻古时清吹音？
    text_display: excerpt
    themes: [行乐与悲慨, 组诗序曲]
    influence: 七言歌行铺陈转折章法的示范之作。
    confidence: 存疑
    dispute: 文本实取维基文库擬行路難页（公版，鲍氏集系统，src-baomingyuanji）。
    source_ids: [src-baomingyuanji]

  - work_id: mei-hua-luo
    title: 梅花落
    alt_titles: []
    genre: 乐府横吹曲辞
    date:
      text: 创作年代不详
      precision: 未知
    place: ""
    context: 借庭中杂树问梅独芳，念尔零落逐风飙徒有霜华无霜质，以霜华与霜质对举讥无质之徒，是咏物寓怀的名篇。
    attribution: 确凿
    excerpt: 中庭杂树多，偏为梅咨嗟。问君何独然？念其霜中能作花，露中能作实。摇荡春风媚春日。念尔零落逐风飙，徒有霜华无霜质。
    text_display: full
    themes: [咏梅, 骨质之喻]
    influence: 梅花落由此成为历代递相拟作的笛曲诗题，《乐府诗集》卷二十四录鲍照为此题现存最早完整作者。
    confidence: 存疑
    dispute: 文本实取维基文库樂府詩集024卷页（公版，src-yuefushiji）。
    source_ids: [src-yuefushiji]

  - work_id: dai-chu-zi-ji-bei-men-xing
    title: 代出自蓟北门行
    alt_titles: [出自蓟北门行（《乐府诗集》题）]
    genre: 乐府杂曲歌辞
    date:
      text: 创作年代不详
      precision: 未知
    place: ""
    context: 自羽檄起边亭至投躯报明主，写征戍之苦与死节之志；疾风冲塞起一联状塞外苦寒如画，时危见臣节世乱识忠良为全篇筋骨。
    attribution: 确凿
    excerpt: 疾风冲塞起，沙砾自飘扬。马毛缩如猬，角弓不可张。时危见臣节，世乱识忠良。投躯报明主，身死为国殇。
    text_display: excerpt
    themes: [边塞, 忠节, 国殇]
    influence: 边塞诗传统的前驱名作，马毛缩如猬角弓不可张为唐代边塞诗反复化用的意象。
    confidence: 存疑
    dispute: 文本实取维基文库代出自薊北門行页（公版，录自鮑氏集四部丛刊本／樂府詩集四部丛刊本，src-yuefushiji/src-baomingyuanji 已登记）；《乐府诗集》录本题出自蓟北门行，与本集题有一字之异。
    source_ids: [src-yuefushiji, src-baomingyuanji]

