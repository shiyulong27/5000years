    attribution: 确凿
    excerpt: 始见西南楼，纤纤如玉钩。末映东北墀，娟娟似蛾眉。……三五二八时，千里与君同。……归华先委露，别叶早辞风。……回轩驻轻盖，留酌待情人。
    text_display: excerpt
