reception:
  - era: 同时代
    evaluator: 临川王刘义庆
    quote: 于是奏诗，义庆奇之，赐帛二十匹，寻擢为国侍郎，甚见知赏。
    text_display: excerpt
    comment: 本传直载的赏遇始末——贡诗言志是鲍照一生仕进的起点，也是寒门文士以作品敲开权门的时代样本。
    source_ids: [src-nanshi-vol13]
  - era: 同时代
    evaluator: 宋文帝（刘义隆）
    quote: 上好为文章，自谓人莫能及。照悟其旨，为文章多鄙言累句。咸谓照才尽，实不然也。
    text_display: excerpt
    comment: 本传记文帝朝君臣文章之际的微妙生态：鲍照故意以鄙言累句自抑避忌，时人误传才尽，史臣特笔辩诬。
    source_ids: [src-nanshi-vol13]
  - era: 历代批评
    evaluator: 钟嵘《诗品》
    quote: 嗟其才秀人微，故取湮当代。然贵尚巧似，不避危仄，颇伤清雅之调。故言险俗者，多以附照。
    text_display: excerpt
    comment: 诗品对鲍照的定位语——才秀人微四字成为解释其一生沉浮的经典判词；险俗之讥反证其诗风越出门第雅调的冲击力。
    confidence: 确定
    dispute: 文本经维基文库诗品（四库全书本）卷2实取核验，src-shipin 已登记。
    source_ids: [src-shipin]
  - era: 历代批评
    evaluator: 杜甫
    quote: 清新庾开府，俊逸鲍参军。（春日忆李白）
    text_display: excerpt
    comment: 杜甫以俊逸许鲍照并与庾信并举，奠定鲍照在唐诗谱系中的先导地位。
    confidence: 存疑
    dispute: 此句为公版名句，但本次未直接实取全唐诗对应页面，按转述层著录；建议登记全唐诗杜甫卷相关来源后翻转。
    source_ids: []
  - era: 近现代学术
    evaluator: 学界综述
    quote: ""
    text_display: none
    comment: 近现代研究公认鲍照为七言歌行的关键推进者，其杂言乐府直接影响李白（李白拟行路难即承其题旨，李白已在库但不建跨时代关系条目，仅在此转述提及）；另聚焦其寒门身份与门阀制度的关系、元嘉三大家（与谢灵运颜延之并称）的诗史比较及生平系年考证。具体论著引文须取得许可后补入，本卷暂作中立转述。
