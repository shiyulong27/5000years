    context: 旅途登岸致书其妹，四面分写山川湖泽庐山云水，滔滔何穷漫漫安竭与孤鹤寒啸游鸿远吟诸句雄视千古，是南朝山水文中第一等的笔墨。
    attribution: 确凿
    excerpt: 吾自发寒雨，全行日少，加秋潦浩汗，山溪猥至，渡溯无边，险径游历，栈石星饭，结荷水宿。……南则积山万状，争气负高……西则回江永指，长波天合。滔滔何穷，漫漫安竭！
    text_display: excerpt
    themes: [山水, 行役, 手足之情]
