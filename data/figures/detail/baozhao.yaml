    place: 临川王义庆藩镇（荆州或江州）
    summary: 始尝谒义庆未见知，欲贡诗言志，人止之曰卿位尚卑不可轻忤大王。照勃然曰千载上有英才异士沉没而不闻者安可数哉！大丈夫岂可遂蕴智慧，使兰艾不辨，终日碌碌，与燕雀相随乎。
    confidence: 存疑
    dispute: 本传不系此事年份；义庆历镇荆州、江州，谒见地点与年份均系学界推定（通行谓元嘉十六年前后于江州）。
    source_ids: [src-nanshi-vol13]
  - stage: 东海寒素与贡诗言志
    stage_order: 4
    title: 奏诗，义庆奇之赐帛二十匹，擢国侍郎
    date:
      text: 元嘉年间，紧接贡诗之后
      year: 430
      range_end: 444
      precision: 约
    place: 临川王义庆藩镇
    summary: 于是奏诗，义庆奇之，赐帛二十匹，寻擢为国侍郎，甚见知赏——以一首诗强取仕进之门，寒门文士的成名范式由此立。
    source_ids: [src-nanshi-vol13]

