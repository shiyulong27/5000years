  - stage: 贬谪荆蛮与通州唱和
    stage_order: 15
    title: 自虢州征还膳部员外郎，令狐楚叹为今代鲍谢
    date:
      text: 元和十四年（819年）
      year: 819
      precision: 精确
    place: 长安
    summary: 十四年自虢州长史征还为膳部员外郎。宰相令狐楚一代文宗雅知稹之辞学，谓尝览足下制作所恨不多迟之久矣；稹因献诗文自叙十余年邅回，楚深称赏以为今代之鲍谢也。
    source_ids: [src-jts-vol166]

  # ── 阶段四：穆宗朝骤贵与短命拜相 ────────────────────
  - stage: 穆宗朝骤贵与短命拜相
    stage_order: 16
    title: 崔潭峻奏连昌宫辞，即日知制诰
    date:
      text: 长庆初（约821年）
      year: 821
      precision: 约
    place: 长安
    summary: 荆南监军崔潭峻素礼接稹。长庆初潭峻归朝，出稹连昌宫辞等百余篇奏御，穆宗大悦问稹安在，对曰今为南宫散郎，即日转祠部郎中知制诰。旧书谓朝廷以书命不由相府甚鄙之，然辞诰所出夐然与古为侔盛传于代；新书谓其变诏书体务纯厚明切盛传一时，然其进非公议为士类訾薄。
    confidence: 确定
    source_ids: [src-jts-vol166, src-xts-vol174]
  - stage: 穆宗朝骤贵与短命拜相
    stage_order: 17
    title: 召入翰林承旨，裴度三疏论劾
    date:
      text: 长庆元年—二年间（约821—822年）
      year: 821
      range_end: 822
      precision: 范围
    place: 长安
    summary: 居无何召入翰林为中书舍人承旨学士。中人争与稹交，知枢密魏弘简尤相善。河东节度使裴度三上疏言稹与弘简为刎颈之交谋乱朝政，陛下欲平贼当先清朝廷乃可；穆宗顾中外人情乃罢稹内职授工部侍郎，然恩顾未衰。
    source_ids: [src-jts-vol166, src-xts-vol174]
  - stage: 穆宗朝骤贵与短命拜相
    stage_order: 18
    title: 拜同中书门下平章事，朝野轻笑
    date:
      text: 长庆二年（822年）
      year: 822
      precision: 精确
    place: 长安
    summary: 长庆二年拜同中书门下平章事，诏下之日朝野无不轻笑之（新书作朝野杂然轻笑）。时王廷凑朱克融连兵围牛元翼于深州，稹欲有所立以报上。
    source_ids: [src-jts-vol166, src-xts-vol174]
  - stage: 穆宗朝骤贵与短命拜相
    stage_order: 19
    title: 于方案发，与裴度俱罢相出同州
    date:
      text: 长庆二年（822年）
      year: 822
      precision: 精确
    place: 长安→同州
    summary: 和王傅于方献奇士反间计解深州围，稹然之。李赏知其谋，以稹与裴度有隙告度云于方为稹所使欲结客刺度；神策军中尉奏其事，三司讯鞫害裴事无验而前事尽露，俱罢稹度平章事，出稹为同州刺史。谏官上疏言责度太重稹太轻，上心怜稹止削长春宫使。新书明指李逢吉阴令李赏构陷以并中之。
    confidence: 存疑
    dispute: 告变主使两史记述不同——旧书泛称李赏告变，新书指为李逢吉设计；于方案背后党争实情后世聚讼。
    source_ids: [src-jts-vol166, src-xts-vol174]

  # ── 阶段五：出镇东南与暴卒武昌 ──────────────────────
  - stage: 出镇东南与暴卒武昌
    stage_order: 20
    title: 刺同州，上表自叙生平
    date:
      text: 长庆二年末—四年间（822—824年在郡二年）
      year: 822
      range_end: 824
      precision: 范围
    place: 同州
    summary: 在郡二年。至同州因表谢上，自叙八岁丧父家贫无业、独立性成遂无交结、屡陈时政为宰相憎诸事，为研究其生平的第一手材料。
    source_ids: [src-jts-vol166]
  - stage: 出镇东南与暴卒武昌
    stage_order: 21
    title: 移镇越州，兰亭绝唱与惠政
    date:
      text: "约823—829年之间（凡在越八年）"
      year: 823
      range_end: 829
      precision: 范围
    place: 越州（会稽）
    summary: 改授越州刺史兼御史大夫浙东观察使。会稽山水奇秀，所辟幕职皆当时文士，镜湖秦望之游月三四焉；副使窦巩海内诗名，与稹酬唱最多至今称兰亭绝唱。新书独记明州岁贡蚶役邮子万人不胜其疲，稹奏罢之。放意娱游稍不修边幅，以渎货闻于时。时白居易刺杭州，杭越邻境篇咏往来不间旬浃，尝会境上数日而别。
    confidence: 存疑
    dispute: 就任越州确年两史未系年；通行谱系作长庆三年（823），与在郡二年改授的记述略有出入，区间著录。
    source_ids: [src-jts-vol166, src-xts-vol174, src-qts-baijuyi]
  - stage: 出镇东南与暴卒武昌
    stage_order: 22
    title: 入为尚书左丞，振纲纪而不厌众望
    date:
      text: 太和三年九月（829年）
      year: 829
      precision: 精确
    place: 长安
    summary: 就加检校礼部尚书后入为尚书左丞，振举纪纲出郎官颇乖公议者七人；新书谓务振纲纪出郎官尤无状者七人。然以稹素无检操人情不厌服。会宰相王播仓卒而卒，稹大为路歧经营相位，讫不遂。
    source_ids: [src-jts-vol166, src-xts-vol174]
  - stage: 出镇东南与暴卒武昌
    stage_order: 23
    title: 出镇武昌军节度使
    date:
      text: 太和四年正月（830年）
      year: 830
      precision: 精确
    place: 鄂州（武昌）
    summary: 检校户部尚书兼鄂州刺史御史大夫武昌军节度使。此为其最后一任，去京师而终老于镇。
    source_ids: [src-jts-vol166]
  - stage: 出镇东南与暴卒武昌
    stage_order: 24
    title: 暴疾一日卒于镇，年五十三
    date:
      text: 太和五年七月二十二日（831年）
      year: 831
      precision: 精确
    place: 武昌军节度使任所（鄂州）
    summary: 五年七月二十二日暴疾一日而卒于镇，时年五十三，赠尚书右仆射。有子道护时年三岁，仲兄积营护丧事。所著诗赋诏册铭诔论议等杂文一百卷号元氏长庆集，又著古今刑政书三百卷号类集并行于代。新唐书史臣总评其始言事峭直欲以立名，中见斥废十年通道不坚乃丧所守，附宦贵得宰相居位才三月罢，晚节弥沮丧加廉节不饰云。
    source_ids: [src-jts-vol166, src-xts-vol174]

works:
  - work_id: lisiwuqi-qisi
    title: 离思五首·其四
    alt_titles: [离思]
    genre: 七言绝句
    date:
      text: 作年无考，通说系于元和四年韦丛卒后悼亡期内
      precision: 未知
    place: ""
    context: 曾经沧海难为水除却巫山不是云以极致比喻写不可替代之情，通说与其悼亡妻韦丛的遣悲怀同旨；亦有主张为早年恋人双文（莺莺原型）而作者。
    attribution: 确凿
    excerpt: 曾经沧海难为水，除却巫山不是云。取次花丛懒回顾，半缘修道半缘君。
    text_display: full
    themes: [悼亡, 爱情, 比喻]
    influence: 曾經滄海由此成为汉语成语；中国爱情诗中被引用频率最高的绝句之一。
    confidence: 存疑
    dispute: 所悼对象有亡妻韦丛说与早年恋人双文说之争；全唐诗著录卷次亦有四百二十二卷与四百一十二卷两见之异（维基文库离思五首页与单篇页分系）。
    source_ids: [src-qts-yuanzhen]
  - work_id: qianbeihuai-sanqi-er
    title: 遣悲怀三首（其二）
    alt_titles: [遣悲怀]
    genre: 七言律诗（组诗选一）
    date:
      text: "约809年后（元和四年韦丛卒后，通说）"
      year: 809
      precision: 约
    place: ""
    context: 悼亡妻韦丛组诗三首之二，以昔日戏言身后意起笔，收于诚知此恨人人有贫贱夫妻百事哀，为贫贱夫妻患难情分的千古定评。
    attribution: 确凿
    excerpt: 昔日戏言身后意，今朝都到眼前来。……尚想旧情怜婢仆，也曾因梦送钱财。诚知此恨人人有，贫贱夫妻百事哀。
    text_display: excerpt
    themes: [悼亡, 夫妻]
    influence: 贫贱夫妻百事哀成为汉语中描述患难夫妻的经典语汇。
    confidence: 存疑
    dispute: 组诗作年系通行推断；文字有版本异文（全唐诗注今朝皆到眼前来一作都）。
    source_ids: [src-qts-yuanzhen]
  - work_id: wen-letian-shou-jiangzhou-sima
    title: 闻乐天授江州司马
    alt_titles: []
    genre: 七言绝句
    date:
      text: "约815年秋（通州司马任上）"
      year: 815
      precision: 约
    place: 通州
    context: 白居易贬江州司马的消息传至通州，元稹残灯病榻间闻讯而作；垂死病中惊坐起一句将挚友命运的震动写到极处，与白居易琵琶行江州司马青衫湿互为镜像。
    attribution: 确凿
    excerpt: 残灯无焰影幢幢，此夕闻君谪九江。垂死病中惊坐起，暗风吹雨入寒窗。
    text_display: full
    themes: [友情, 谪迁]
    influence: 元白生死之交最著名的一首见证诗。
    confidence: 存疑
    dispute: 系年从通说；全唐诗注第三句惊坐起一作仍怅望、第四句吹雨一作吹面。
    source_ids: [src-qts-yuanzhen]
  - work_id: chou-letian-pinmeng-weizhi
    title: 酬乐天频梦微之
    alt_titles: []
    genre: 七言绝句
    date:
      text: "约816—817年之间（通州贬所）"
      year: 816
      range_end: 817
      precision: 范围
    place: 通州
    context: 白居易屡梦元稹寄诗相问，元稹答以我今因病魂颠倒惟梦闲人不梦君——病中连梦也无力的处境反衬相念之深，是通江唱和中的名对。
    attribution: 确凿
    excerpt: 山水万重书断绝，念君怜我梦相闻。我今因病魂颠倒，惟梦闲人不梦君！
    text_display: full
    themes: [友情, 梦]
    influence: 以无梦写深情的名笔，常与其闻乐天授江州司马并举为元白交谊双璧。
    confidence: 存疑
    dispute: 作年系据通州贬期与唱和脉络推定，无确切系年记载。
    source_ids: [src-qts-yuanzhen]
  - work_id: xinggong
    title: 行宫
    alt_titles: []
    genre: 五言绝句
    date:
      text: 作年无考
      precision: 未知
    place: 洛阳上阳宫（一说）
    context: 寥落古行宫二十字写尽天宝盛世与当下荒凉的白头对照，白头宫女闲坐说玄宗为以小见大的典范。
    attribution: 确凿
    excerpt: 寥落古行宫，宫花寂寞红。白头宫女在，闲坐说玄宗。
    text_display: full
    themes: [咏史, 盛衰]
    influence: 被历代选家推为五绝压卷级作品之一，说玄宗成为盛衰感喟的通用意象。
    confidence: 存疑
    dispute: 本诗作年与行宫所指地望（上阳宫洛阳行宫说为主）均有讨论，正史与本人文集无本事记载。
    source_ids: [src-qts-yuanzhen]
  - work_id: juhua
    title: 菊花
    alt_titles: []
    genre: 七言绝句
    date:
      text: 作年无考（一说贞元十八年前后的早期作品）
      precision: 未知
    place: ""
    context: 秋丛绕舍似陶家用陶渊明典写爱菊成痴，不是花中偏爱菊此花开尽更无花从花期角度翻出新意。
    attribution: 确凿
    excerpt: 秋丛绕舍似陶家，遍绕篱边日渐斜。不是花中偏爱菊，此花开尽更无花。
    text_display: full
    themes: [咏物]
    influence: 咏菊诗中最广为传诵的一首。
    confidence: 存疑
    dispute: 作年无确切系年，早期作品说系后人推定。
    source_ids: [src-qts-yuanzhen]
  - work_id: lianchang-gongci
    title: 连昌宫词
    alt_titles: []
    genre: 七言古诗（歌行）
    date:
      text: 作年有元和十三年说与长庆初进御前作说等
      year: 818
      precision: 约
    place: 连昌宫（故址在寿安，一说通州追忆之作）
    context: 借连昌宫兴废铺叙安史之乱前后治乱对比，结以老翁此意望和平努力庙谟休用兵。旧唐书载长庆初崔潭峻出稹连昌宫词等百余篇奏御，穆宗大悦，此诗遂为元稹骤贵的敲门砖。
    attribution: 确凿
    excerpt: 连昌宫中满宫竹，岁久无人森似束。又有墙头千叶桃，风动落花红蔌蔌。……努力庙谟休用兵。
    text_display: excerpt
    themes: [咏史, 讽谕, 兴衰]
    influence: 元稹歌行的代表作，与白居易长恨歌并为中唐叙事歌行双峰。
    confidence: 存疑
    dispute: 作年与写作地点历来聚讼（元和十三年于通州说、长庆初说等）；是否纪实游连昌宫亦存疑。
    source_ids: [src-jts-vol166, src-qts-yuanzhen]
  - work_id: yingying-zhuan
    title: 莺莺传
    alt_titles: [会真记]
    genre: 传奇（唐传奇小说）
    date:
      text: "约贞元末—元和初（799—806年间，通说）"
      year: 799
      range_end: 806
      precision: 范围
    place: 长安
    context: 叙张生与崔莺莺始乱终弃故事，为唐传奇名篇。传中莺莺答诗明月三五夜（待月西厢下迎风户半开拂墙花影动疑是玉人来）为西厢故事的核心意象源头。
    attribution: 确凿
    excerpt: 待月西厢下，迎风户半开。拂墙花影动，疑是玉人来。
    text_display: excerpt
    themes: [爱情, 传奇]
    influence: 金董解元西厢记诸宫调、元王实甫杂剧西厢记皆源出于此，是中国戏曲第一爱情经典的上游文本。
    confidence: 存疑
    dispute: 张生是否元稹自寓（自传说）为唐宋以来著名的学术争议，至今聚讼未决；传末忍情议论对张生的辩护立场亦被历代批评。
    source_ids: [src-jts-vol166, src-qts-yuanzhen]
  - work_id: mingyue-sanwuye
    title: 明月三五夜
    alt_titles: []
    genre: 五言绝句（莺莺传中诗）
    date:
      text: "随莺莺传创作，约799—806年间"
      year: 799
      range_end: 806
      precision: 范围
    place: 长安
    context: 莺莺传中崔莺莺邀张生逾墙相会之诗，明月三五夜点明传中幽会的时间设定；虽托名小说人物口吻，实出元稹手笔，为传中流传最广的四句。
    attribution: 托名
    excerpt: 待月西厢下，迎风户半开。拂墙花影动，疑是玉人来。
    text_display: full
    themes: [爱情, 密约]
    influence: 西厢之名直接由此而来；待月西厢成为才子佳人叙事的原型场景。
    confidence: 确定
    dispute: 诗以小说人物莺莺名义出现，作者归属元稹无疑，故标托名层以免误作独立抒情诗。
    source_ids: [src-jts-vol166]
  - work_id: yuan-shi-changqing-ji
    title: 元氏长庆集
    alt_titles: []
    genre: 别集（诗赋诏册铭诔论议杂文一百卷）
    date:
      text: 长庆末编删文稿（约823—824年）
      year: 823
      range_end: 824
      precision: 范围
    place: 越州
    context: 旧唐书载长庆末因编删其文稿作自叙，又载所著杂文一百卷号元氏长庆集并行于代；集中保存与白居易的大量往还诗及制诰表状，为研究中唐诗坛的第一手文献。今传本经宋人重辑为六十卷。
    attribution: 确凿
    excerpt: ""
    text_display: none
    themes: [别集]
    influence: 元白唱和与元和体的核心文献载体；白氏长庆集之名即仿此而来。
    confidence: 确定
    source_ids: [src-jts-vol166]

