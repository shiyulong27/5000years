    comment: 离思遣悲怀菊花行宫等长期入选中小学语文教材与诗词普及读本，曾经沧海难为水、贫贱夫妻百事哀进入日常语言；莺莺传作为西厢故事源头进入文学史通识叙述。教材版本信息随学期变动，录入时须另行核验当期篇目。
