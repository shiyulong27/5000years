relations:
  - relation_type: 挚友
    target_id: baijuyi
    direction: 双向
    period:
      text: "约803年同官秘省订交，至831年元稹先卒，唱和终身"
      year: 803
      range_end: 831
      precision: 范围
    evidence: 旧唐书本传：与太原白居易友善，工为诗善状咏风态物色，当时言诗者称元白焉，号为元和体；白居易贬江州、元稹量移通州，虽通江悬邈而二人来往赠答，江南为之纸贵。白居易累疏切谏元稹贬江陵案；与元稹书自述小通则以诗相戒小穷则以诗相勉索居则以诗相慰同处则以诗相娱，并拟编元白往还集。元稹刺越时与杭邻境篇咏往来不间旬浃，会境上数日而别；又为白居易编白氏长庆集五十卷作序。元稹卒后白居易为撰祭文墓志，两人唱和集事实见于两唐书。
    confidence: 确定
    source_ids: [src-jts-vol166, src-xts-vol174, src-qts-yuanzhen]

reception:
  - era: 同时代
    evaluator: 令狐楚
    quote: 楚深称赏，以为今代之鲍、谢也。
    text_display: excerpt
    comment: 一代文宗令狐楚主动致函索文并以鲍照谢灵运相许，见旧唐书本传，是元稹文学地位的权威同时代认证。
    source_ids: [src-jts-vol166]
  - era: 同时代
    evaluator: 穆宗东宫宫廷
    quote: 穆宗皇帝在东宫，有妃嫔左右尝诵稹歌诗以为乐曲者……宫中呼为元才子。
    text_display: excerpt
    comment: 旧书所记穆宗潜邸妃嫔传唱其诗事；新书概括为穆宗在东宫妃嫔近习皆诵之宫中呼元才子，足见其诗传播深入禁中，为其后来骤贵的舆论基础。
    source_ids: [src-jts-vol166, src-xts-vol174]
  - era: 历代批评
    evaluator: 新唐书史臣（宋祁）
    quote: 稹始言事峭直，欲以立名，中见斥废十年，通道不坚，乃丧所守。附宦贵得宰相，居位才三月罢。晚节弥沮丧，加廉节不饰云。
    text_display: excerpt
    comment: 新唐书卷末史论对元稹政治人格的总评，肯定其早年峭直立名而痛责晚节不饰；同卷赞曰更以逢吉险邪稹浮躁并讥。这一褒贬框架深刻影响后世对元稹的政治评价。
    confidence: 确定
    source_ids: [src-xts-vol174]
