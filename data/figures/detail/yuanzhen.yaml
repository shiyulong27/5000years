    quote: ""
    text_display: none
    comment: 近现代研究聚焦三条主线——元和体与元白唱和的传播机制研究、莺莺传张生自寓说的持续聚讼（涉及元稹生平与唐代进士风流观）、以及其依附宦官骤相骤罢的政治评价翻转问题；具体论著引文须逐条取得许可后补入，本卷暂作中立转述。
