profile:
  courtesy_name: 乐天
  art_name: 香山居士（晚岁又自号醉吟先生）
  aliases: [诗魔, 白二十二, 醉吟先生]
  gender: 男
  ethnicity: ""
  ancestry: 太原白氏，北齐五兵尚书白建之后；建以功赐田韩城，子孙家焉，至祖温徙居下邽（今陕西渭南）
  birthplace: 新郑（河南道郑州新郑县）
  death_place: 洛阳（卒于履道里私第，遗命葬龙门香山如满师塔之侧）
  offices: [秘书省校书郎, 盩厔县尉, 翰林学士, 左拾遗, 京兆府户曹参军, 太子左赞善大夫, 江州司马, 忠州刺史, 司门员外郎, 主客郎中知制诰, 中书舍人, 杭州刺史, 太子左庶子分司东都, 苏州刺史, 秘书监, 刑部侍郎, 太子宾客分司, 河南尹, 太子少傅, 刑部尚书致仕]
  fields: [文学]
  roles: [诗人]
  summary: 中唐诗坛巨擘与新乐府运动主将，主张文章合为时而著歌诗合为事而作；一生辗转于谏官直声、江州贬谪与杭苏惠政之间，晚年退居洛阳香山。

timeline:
  # ── 阶段一：早岁苦学 ──────────────────────────────
  - stage: 早岁苦学
    stage_order: 1
