reception:
  - era: 同时代
    evaluator: 顾况
    quote: 吾谓斯文遂绝，今复得子矣！
    text_display: excerpt
    comment: 新旧唐书均载顾况览其文迎门礼遇之事，文字小异；为白氏少年才名的同时代权威见证，亦奠定其早慧叙事的原型。
    source_ids: [src-jts-vol166, src-xts-vol119]
  - era: 历代批评
    evaluator: 杜牧（新唐书赞所引）
    quote: 纤艳不逞，非庄士雅人所为。流传人间，子父女母交口教授，淫言媟语入人肌骨不可去。
    text_display: excerpt
    comment: 新唐书史臣于赞中引杜牧语以纠其失，谓救所失不得不云；这是中唐以降针对元和体末流纤艳之风最尖锐的批评，与史臣观居易始以直道奋完节自高的褒语并存。
    source_ids: [src-xts-vol119]
  - era: 近现代学术
    evaluator: 学界综述
    quote: ""
    text_display: none
    comment: 近现代研究聚焦新乐府运动的理论与实践、江州贬谪作为思想分期节点、元白次韵相酬与元和体的传播机制、旧唐书卒年大中之误的史源考辨等议题；具体论著引文须逐条取得许可后补入，本卷暂作中立转述。
    source_ids: []
  - era: 教科书与公共文化
    evaluator: 通用语文教育与大众传播
    quote: ""
    text_display: none
    comment: 赋得古原草送别卖炭翁钱塘湖春行等长期入选中小学语文教材；西湖白堤虽非其捍湖故堤（白沙堤唐前已有），民间仍以之名寄托对白氏惠政的记忆。教材版本信息随学期变动，录入时须另行核验当期篇目。
    source_ids: []
  - era: 影视与网络
    evaluator: 大众影视与网络传播
    quote: ""
    text_display: none
    comment: 长恨歌琵琶行持续被改编为影视戏曲舞剧与流行歌曲，长恨歌主题实景演出成为文旅品牌；网络语境中绿蚁新醅酒与野火烧不尽成为高频引用文本。具体改编作品随档期变动，不作确证著录。
