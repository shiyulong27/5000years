# | 温李并称 | 旧唐书同卷李商隐传：與太原溫庭筠南郡段成式齊名時號「三十六」文思清麗庭筠過之；新唐书卷203李商隐传：時溫庭筠段成式倶用是相誇號「三十六體」 | 确定 |
# | 品行定评 | 旧唐书李商隐传：而俱無持操恃才詭激爲當涂者所薄名宦不進坎壈終身 | 确定 |
# | 襄阳幕府 | 旧唐书：徐商鎮襄陽往依之署爲巡官；新唐书卷91同 | 确定 |
# | 广陵事件 | 旧唐书：路由廣陵……乞索於楊子院醉而犯夜爲虞候所擊敗面折齒……令狐綯捕虞候治之……乃兩釋之自是汙行聞于京師 | 确定 |
# | 雪冤与晚境 | 旧唐书：致書公卿間雪寃屬徐商知政事頗爲言之無何商罷相……貶爲方城尉再遷隋縣尉卒；新唐书卷91：會商罷楊收疾之遂廢卒 | 确定（卒年卒地两史皆无确载） |
# | 词史地位 | 花间集实取：卷一首列「菩薩蠻 溫助教庭筠」十四首；歐陽炯《花間集敘》：近代溫飛卿復有金筌集……乃命之爲花間集時大蜀廣政三年 | 确定 |
# | 温八叉／宣宗微行／中书堂坐将军 | 两唐书正文均无载，属唐宋笔记层（《北梦琐言》《云溪友议》系统），本次未实取原文 | 笔记层存疑，仅作转述 |
