  courtesy_name: 飛卿
  art_name: 温八叉（时人绰号层，谓八叉手而成八韵；正史无载，见笔记层转述）
  aliases: [温助教（花间集题署）]
  gender: 男
  ethnicity: ""
  ancestry: 太原祁（旧唐书止称太原人；祁县世系据新唐书卷91温大雅传并州祁人一支，src-xts-vol091）
  birthplace: 太原祁县（今山西省祁县，据籍贯推定）
  death_place: 卒地无确载（两史止记贬隋县尉后卒，通行说系于随县一带）
  offices: [襄阳徐商幕巡官, 方城尉, 隋县尉]
  fields: [文学]
  roles: [词人, 诗人]
  summary: 花间鼻祖，第一个大量倚声填词的文人；侧艳词章与科场失意纠缠的一生，「温李」并称中的另一半，也是晚唐才高德薄争议的千年样本。

timeline:
  # ── 阶段一：太原祁县与少年才名 ────────────────────
  - stage: 太原祁与少年才名
    stage_order: 1
