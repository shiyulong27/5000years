  - work_id: shang-shan-zao-xing
    title: 商山早行
    alt_titles: []
    genre: 诗（五言律诗）
    date:
      text: 系年无定说，一般系于离长安东南行途中
      year: 850
      precision: 约
    place: 商山道中
    context: 客行悲故乡的羁旅早行图。颔联鸡声茅店月人迹板桥霜以十个名词意象叠加，不着动词而霜晨气象全出，为宋人梅尧臣状难写之景如在目前的先声。
    attribution: 确凿
    excerpt: 晨起动征铎，客行悲故乡。鸡声茅店月，人迹板桥霜。槲叶落山路，枳花明驿墙。因思杜陵梦，凫雁满回塘。
    text_display: full
    themes: [羁旅, 早行, 名物对仗]
    influence: 鸡声茅店月人迹板桥霜为唐诗最著名的名词意象并置名联，长期入选语文教材；枳花明一作照，文本据维基文库全唐诗卷581系统实取。
