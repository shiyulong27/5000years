    target_id: lishangyin
    direction: 双向
    period:
      text: 大中年间并称已成，号「温李」「三十六」
      year: 847
      range_end: 858
      precision: 范围
    evidence: 旧唐书卷190下李商隐传明载：与太原温庭筠、南郡段成式齐名，时号「三十六」；文思清丽，庭筠过之；而俱无持操，恃才诡激，为当涂者所薄，名宦不进，坎壈终身。新唐书卷203李商隐传：时温庭筠、段成式俱用是相夸，号「三十六体」。新唐书卷91附传另记与李商隐皆有名号「温李」。
    confidence: 确定
    dispute: 「三十六」「三十六体」与「温李」均两唐书有明文，惟各卷表述略异。
    source_ids: [src-jts-vol190b, src-xts-vol203, src-xts-vol091]

reception:
  - era: 历代批评
    evaluator: 欧阳炯《花间集叙》（赵崇祚辑《花间集》卷首）
    quote: 在明皇朝则有李太白应制清平乐词四首，近代温飞卿复有《金筌集》。迩来作者，无愧前人。……因集近来诗客曲子词五百首，分为十卷……昔郢人有歌阳春者，号为绝唱，乃命之为花间集。
    text_display: excerpt
    comment: 花间集叙全文经维基文库实取（时大蜀广政三年夏四月），温庭筠词冠于全书卷一之首、题署「温助教庭筠」，这是词史上第一次明确的宗主定位——花间一体以温词为范型。
    confidence: 确定
    source_ids: [src-huajianji]
  - era: 历代批评
    evaluator: 张惠言《词选序》及《词选》评语（经王国维《人间词话》注引实取）
    quote: 唐之词人，温庭筠最高，其言深美闳约。（《词选序》）此感士不遇也，篇法仿佛《长门赋》。「照花」四句，《离骚》初服之意。（评菩萨蛮）
    text_display: excerpt
    comment: 常州词派将温词读成楚骚寄托传统，把这位「侧艳」词人抬入风雅比兴谱系；原文经维基文库人间词话注①②实取转引。
    confidence: 确定
    source_ids: []
  - era: 近现代学术
    evaluator: 刘熙载《艺概》、周济《介存斋论词杂著》、王国维《人间词话》
    quote: 温飞卿词精妙绝人，然类不出乎绮怨。（刘熙载）毛嫱西施，天下美妇人也。严妆佳，淡妆亦佳……飞卿，严妆也。（周济）「画屏金鹧鸪」，飞卿语也，其词品似之。……温飞卿之词，句秀也。（王国维）
    text_display: excerpt
    comment: 近代词学的三家定位：精妙而限于绮怨、浓妆式的形式之美、句秀——共同点是不取张惠言的寄托说而直面其艺术本体；诸条均经维基文库人间词话及其注文实取。
    confidence: 确定
    source_ids: []
  - era: 近现代学术
    evaluator: 学界综述
    quote: ""
    text_display: none
    comment: 近现代研究围绕三条主线展开：温词是否别有寄托的百年之争、花间鼻祖与词体成立史的定位、生卒年与行迹谱系的考订（如温飞卿系年一类的专门研究）；具体论著引文须取得许可后补入，本层暂作中立转述。
    source_ids: []
  - era: 教科书与公共文化
    evaluator: 通用语文教育与大众传播
    quote: ""
    text_display: none
    comment: 商山早行（鸡声茅店月人迹板桥霜）长期入选语文教材，瑶瑟怨入选唐诗三百首系统的通行选本；教材篇目随学期变动，录入时须另行核验当期版本。
    source_ids: []
  - era: 影视与网络
    evaluator: 大众传播综述
    quote: ""
    text_display: none
    comment: 影视剧中的温庭筠形象多为晚唐才子轶事（考场枪手、狎游风流）的戏剧化敷演，不作信史依据；网络传播集中于其闺情词名句，暂无可靠专门条目可引。
    source_ids: []

