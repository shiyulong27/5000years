  - work_id: guo-chen-lin-mu
    title: 过陈琳墓
    alt_titles: []
    genre: 诗（七言律诗）
    date:
      text: 系年无定说，或系漫游江淮间
      year: 850
      precision: 约
    place: 陈琳墓（今江苏境内，一说）
    context: 词客有灵应识我霸才无主始怜君，借吊三国文士浇自身块垒；莫怪临风倍惆怅欲将书剑学从军，怀才不遇之愤溢于言表。
    attribution: 确凿
    excerpt: 曾于青史见遗文，今日飘蓬过古坟。词客有灵应识我，霸才无主始怜君。……莫怪临风倍惆怅，欲将书剑学从军。
    text_display: excerpt
    themes: [怀古, 怀才不遇]
    influence: 霸才无主一联被历代评家视为温庭筠一生遭际的自我写照；文本据维基文库全唐诗卷578系统实取，飘蓬一作飘零。
    confidence: 存疑
    dispute: 系年与墓地所在均无定说。
