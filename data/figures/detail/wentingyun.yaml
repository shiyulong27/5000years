    context: 十四首中唯一以送别直陈相思起笔者，柳丝袅娜春无力，花落子规啼绿窗残梦迷，情致较他阕为显豁。
    attribution: 确凿
    excerpt: 玉楼明月长相忆，柳丝袅娜春无力。门外草萋萋，送君闻马嘶。……花落子规啼，绿窗残梦迷。
    text_display: excerpt
    themes: [离情, 春夜, 相忆]
    influence: 温词中少数被评家许为「直抒而仍含蓄」的名篇。
    source_ids: [src-huajianji]

  - work_id: geng-lou-zi-yu-lu-xiang-hong-la-lei
    title: 更漏子·玉炉香红蜡泪
    alt_titles: [更漏子·其六（组词）]
    genre: 词（小令）
    date:
      text: 创作年代不详
      precision: 未知
    place: ""
    context: 上片室内香烛眉鬓，下片忽转梧桐三更雨，不道离情正苦，一叶叶一声声空阶滴到明——以雨声写彻夜无眠，声情俱绝。
    attribution: 确凿
    excerpt: 玉炉香，红蜡泪，偏照画堂秋思。……梧桐树，三更雨，不道离情正苦。一叶叶，一声声，空阶滴到明。
    text_display: excerpt
    themes: [秋夜, 离情, 声景]
    influence: 空阶滴到明被视为以景语收束离愁的千古典范，后世雨打梧桐意象的经典源头之一。
    source_ids: [src-huajianji]

  - work_id: geng-lou-zi-liu-si-chang-chun-yu-xi
    title: 更漏子·柳丝长春雨细
