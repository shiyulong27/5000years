    place: 利州（今四川广元）
    context: 数丛沙草群鸥散万顷江田一鹭飞，渡口暮色的开阔画卷；尾联谁解乘舟寻范蠡五湖烟水独忘机，于山水间寄江湖忘机之想。
    attribution: 确凿
    excerpt: 澹然空水对斜晖，曲岛苍茫接翠微。……数丛沙草群鸥散，万顷江田一鹭飞。谁解乘舟寻范蠡，五湖烟水独忘机。
    text_display: excerpt
    themes: [渡口, 江湖之思, 山水]
    influence: 中二联为晚唐写景律句名对；文本据维基文库全唐诗卷578系统实取，波上一作坡上。
