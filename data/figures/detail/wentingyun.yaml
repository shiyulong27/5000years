    summary: 温庭筠生于太原温氏祁县房。两唐书本传均未系年，通行说法以约812年生为主流，另有约801年等异说。
    confidence: 存疑
    dispute: 生年诸说不一：约812年为主流，另有约801年生说等；正史无载，一律按异说著录。
    source_ids: [src-jts-vol190b]
  - stage: 太原祁与少年才名
    stage_order: 2
    title: 本名岐，字飞卿，彦博之裔
    date:
      text: 家世背景，具体年份不详
      precision: 未知
    place: ""
    summary: 旧唐书本传记其本名岐字飞卿、太原人；新唐书则将其附于宰相温大雅温彦博传后，称彦博裔孙，世系由此上接贞观名臣。旧唐书止言太原人，未言祁县。
    source_ids: [src-jts-vol190b, src-xts-vol091]
  - stage: 太原祁与少年才名
    stage_order: 3
    title: 少敏悟，苦心砚席，尤长诗赋
    date:
      text: 少年至青年时期，具体年代不详
      precision: 未知
    place: 太原、长安之间
    summary: 旧唐书谓其苦心砚席尤长于诗赋；新唐书谓其少敏悟工为辞章、思神速多为为人作文——文思神速成为他一生最鲜明的标签，也埋下替人枪试的祸根。
    source_ids: [src-jts-vol190b, src-xts-vol091]

  # ── 阶段二：长安应举累试不第 ──────────────────────
  - stage: 长安应举累试不第
    stage_order: 4
    title: 大中初应进士，初至京师翕然推重
    date:
      text: 约大中初年（约847年起）
      year: 847
      precision: 约
    place: 长安
    summary: 旧唐书明载大中初应进士，初至京师人士翕然推重——才名先立，功名未就，是他此后二十余年的基本处境。
    source_ids: [src-jts-vol190b]
  - stage: 长安应举累试不第
    stage_order: 5
    title: 士行尘杂，能逐弦吹之音为侧艳之词
    date:
      text: 大中年间应举期间
      year: 847
      range_end: 859
      precision: 范围
    place: 长安
    summary: 旧唐书评其士行尘杂不修边幅，能逐弦吹之音为侧艳之词——精通音律而作词供歌席之用，正是这一「侧艳」标签使他为礼法士族所轻，也成为他开创词体的起点。
    source_ids: [src-jts-vol190b]
  - stage: 长安应举累试不第
    stage_order: 6
    title: 与裴諴令狐滈辈蒲饮酣醉，累年不第
    date:
      text: 约大中年间，屡举屡败
      year: 847
      range_end: 859
      precision: 范围
    place: 长安
    summary: 旧唐书直书其与公卿家无赖子弟裴諴、令狐滈之徒相与蒲饮酣醉终日，由是累年不第；新唐书亦记其薄于行无检幅，又多作侧辞艳曲，蒲饮狎昵。放浪形骸与屡败科场互为因果。
    source_ids: [src-jts-vol190b]
  - stage: 长安应举累试不第
    stage_order: 7
    title: 试有司廉视尤谨，私占授者已八人
    date:
      text: 大中末（约858—859年前后）
      year: 858
      range_end: 859
      precision: 范围
    place: 长安
    summary: 据新唐书卷91附传：大中末考试有司防范极严，温庭筠不乐，上书千余言自辩，然而当日私下为人作弊传递者已达八人，执政鄙其所为，仅授方山尉。「温八叉」（八叉手而成八韵）的绰号即出于此类科场速才传闻，属笔记层，两唐书正文无载。
    confidence: 存疑
    dispute: 正史仅存「思神速多为人作文」「私占授者已八人」之概括（新唐书卷91）；「温八叉」「温八吟」绰号及考场代人作文细节主要见于唐宋笔记，属传闻层不足为信史。
    source_ids: [src-xts-vol091]

  # ── 阶段三：干谒交游与令狐绹恩怨 ──────────────────
  - stage: 干谒交游与令狐绹恩怨
    stage_order: 8
    title: 与李商隐齐名，号「温李」
    date:
      text: 大中年间并称已成
      year: 847
      range_end: 858
      precision: 范围
    place: 长安
    summary: 旧唐书同卷李商隐传明载：与太原温庭筠、南郡段成式齐名，时号「三十六」，又称文思清丽庭筠过之；新唐书卷91记与李商隐皆有名号「温李」，卷203则记三人俪偶相夸号「三十六体」。温李并称是同时代的公论而非后世追认。
    source_ids: [src-jts-vol190b, src-xts-vol203]
  - stage: 干谒交游与令狐绹恩怨
    stage_order: 9
    title: 恃才诡激，为当涂者所薄
    date:
      text: 终身定评，大中年间最烈
      year: 847
      range_end: 859
      precision: 范围
    place: 长安
    summary: 旧唐书总断二人：俱无持操，恃才诡激，为当涂者所薄，名宦不进，坎壈终身——这是正史对温李的共同判词，也解释了两人同归潦倒的命运结构。
    source_ids: [src-jts-vol190b]
  - stage: 干谒交游与令狐绹恩怨
    stage_order: 10
    title: 怨令狐绹不为成名，过府不肯谒
    date:
      text: 咸通中（约860年代前期）
      year: 860
      range_end: 866
      precision: 范围
    place: 长安、扬州
    summary: 旧唐书记其失意归江东时心怨令狐绹在位时不为成名；新唐书亦记令狐绹方镇淮南，庭筠怨其居中时不为助力，过府不肯謁。与权相令狐绹的交恶是温庭筠仕途绝路的关键；至于「中书堂内坐将军」讥语、宣宗微行逆旅相遇等著名轶事均出笔记，正史无载，仅作存疑转述。
    confidence: 存疑
    dispute: 与令狐绹交恶的正史骨架可信；「中书堂内坐将军」与宣宗微行事属《云溪友议》《北梦琐言》一类笔记层，未经本次实取，不足为史实。
    source_ids: [src-jts-vol190b]

  # ── 阶段四：幕府晚境潦倒 ──────────────────────────
  - stage: 幕府晚境潦倒
    stage_order: 11
    title: 往依徐商，署襄阳巡官
    date:
      text: 约大中末至咸通初（约856—861年前后）
      year: 856
      range_end: 861
      precision: 范围
    place: 襄阳
    summary: 徐商镇襄阳，温庭筠往依之，署为巡官——漂泊半生始得一幕职安身处。两唐书记载一致，此期亦为其创作相对集中的安稳岁月。
    confidence: 存疑
    dispute: 入幕确切年份两史未系年，从徐商镇襄阳任期推定为约856—861年之间。
    source_ids: [src-jts-vol190b]
  - stage: 幕府晚境潦倒
    stage_order: 12
    title: 失意归江东，广陵醉犯夜被击败面折齿
    date:
      text: 咸通中（约860年代前期）
      year: 860
      range_end: 866
      precision: 范围
    place: 广陵（扬州）、江东
    summary: 咸通中失意归江东路由广陵，与新进少年狂游狭邪，乞索于扬子院，醉而犯夜，被虞候击得败面折齿；诉至官府，令狐绹捕虞候治之却极言其狭邪丑迹，两人各打处理，自此污行闻于京师——晚年最狼狈的一幕，正史不讳。
    source_ids: [src-jts-vol190b]
  - stage: 幕府晚境潦倒
    stage_order: 13
    title: 致书公卿雪冤，徐商执政颇右之
    date:
      text: 约咸通前期
      year: 861
      range_end: 866
      precision: 范围
    place: 长安
    summary: 庭筠自至长安，致书公卿间雪冤；适逢旧主徐商拜相，颇为言之，一度有望起复——命运最后一次向他开门。
    source_ids: [src-jts-vol190b]
  - stage: 幕府晚境潦倒
    stage_order: 14
    title: 商罢相杨收疾之，贬方城尉再迁隋县尉
    date:
      text: 约咸通中（约865—866年前后）
      year: 865
      range_end: 866
      precision: 范围
    place: 方城、随县
    summary: 无何商罢相，旧唐书记「收怒之」（即杨收），贬为方城尉，再迁隋县尉；新唐书径记会商罢杨收疾之遂废卒。一生终于县尉微官。
    confidence: 存疑
    dispute: 贬谪次第两史一致，但系年只能框定于咸通中后期；「大中十三年授随县尉」等细目系后世谱牒之说，非正史明文。
    source_ids: [src-jts-vol190b]
  - stage: 幕府晚境潦倒
    stage_order: 15
    title: 卒，年约五十余
    date:
      text: 约866年（另有约870年等异说）
      year: 866
      precision: 约
    place: 隋县一带（卒地无确载）
    summary: 旧唐书止书一「卒」字，新唐书止书「遂废卒」。旧唐书评曰：庭筠著述颇多，而诗赋韵格清拔，文士称之——潦倒而终，文章不朽。
    confidence: 存疑
    dispute: 卒年诸说不一：约866年为主流，另有约870年说等；卒地两史无载，通行说系于隋县尉任上前后。子宪后以进士擢第，弟庭皓咸通中死于庞勋之难。
    source_ids: [src-jts-vol190b]

  # ── 阶段五：身后花间尊奉 ─────────────────────────
  - stage: 身后花间尊奉
    stage_order: 16
    title: 后蜀广政三年，《花间集》尊其为卷首
    date:
      text: "940年"
      year: 940
      precision: 精确
    place: 成都
    summary: 后蜀广政三年赵崇祚辑《花间集》，欧阳炯作叙，追述「近代温飞卿复有《金筌集》」，所集五百首十卷以温庭筠《菩萨蛮》冠于卷一之首，题署「温助教庭筠」——身后七十余年，这位科场弃儿被尊为一代词宗开山。
    source_ids: [src-huajianji]
  - stage: 身后花间尊奉
    stage_order: 17
    title: 词体鼻祖地位的千年确立
    date:
      text: 五代至今
      year: 940
      precision: 约
    place: ""
    summary: 六十六首词居《花间集》各家之冠，与韦庄并为花间双璧；此后「温韦」并称、婉约一体溯源于飞卿，文人词的传统由此正式开启——生前侧艳之讥，身后竟成百代词人之祖。
    confidence: 有争议
    dispute: 「花间鼻祖」「词体鼻祖」为历代词学共识性定位，但近现代学界对其词有无寄托（张惠言比兴说与王国维反拨）争论不休，详见接受史层。
    source_ids: [src-huajianji]

works:
  - work_id: pu-sa-man-xiao-shan-chong-die
    title: 菩萨蛮·小山重叠金明灭
    alt_titles: []
    genre: 词（小令）
    date:
      text: 创作年代无定说，或系应举流连长安时期
      year: 840
      precision: 约
    place: ""
    context: 《花间集》全书第一首。小山重叠金明灭鬓云欲度香腮雪，以器物与光色拼合闺中人晓起的慵懒，懒起画蛾眉弄妆梳洗迟，结于双双金鹧鸪的反衬。
    attribution: 确凿
    excerpt: 小山重叠金明灭，鬓云欲度香腮雪。懒起画蛾眉，弄妆梳洗迟。……新贴绣罗襦，双双金鹧鸪。
    text_display: excerpt
    themes: [闺情, 侧艳, 工笔密丽]
    influence: 《花间集》卷一首列之作，文人词的开山标志；清代张惠言读出「感士不遇」的比兴，近代王国维则以「画屏金鹧鸪」状其词品。
    confidence: 存疑
    dispute: 文本据维基文库花间集卷一实取（贴一作帖）。是否别有寄托聚讼百年：张惠言谓此感士不遇也篇法仿佛长门赋照花四句离骚初服之意，王国维一派斥为穿凿；系年为约估。
    source_ids: [src-huajianji]

