      year: 803
      range_end: 858
      precision: 范围
    evidence: 李商隐有《杜司勋》诗称刻意伤春复伤别，人间唯有杜司勋，对杜牧诗推崇备至；二人直接交往的其他史料阙如，后世以小李杜并举。
    inferred: true
    confidence: 存疑
    dispute: 小李杜并称系后世文学史归纳而非唐人成说；二人交往的直接记录不足，《杜司勋》仅证单向推崇。
