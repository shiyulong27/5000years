reception:
  - era: 同时代
    evaluator: 两唐书本传所录时论
    quote: "与太原温庭筠、南郡段成式齐名，时号「三十六」。"
    text_display: excerpt
    comment: 新唐书称三十六体，谓三人俱以俪偶章奏相夸；此为对其骈文与今体成就的同时代定位。
    source_ids: [src-jts-vol190b, src-xts-vol203]
  - era: 同时代
