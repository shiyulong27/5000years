works:
  - work_id: jin-se
    title: 锦瑟
    alt_titles: []
    genre: 七言律诗
    date:
      text: 创作年代无定论，多系于晚年
      precision: 未知
    place: ""
    context: 以锦瑟五十弦起兴，中间化用庄生梦蝶、望帝啼鹃、沧海珠泪、蓝田玉烟诸意象，尾联归于追忆惘然。诗旨自宋代以来即为聚讼焦点。
    attribution: 确凿
    excerpt: 锦瑟无端五十弦，一弦一柱思华年。庄生晓梦迷蝴蝶，望帝春心托杜鹃。沧海月明珠有泪，蓝田日暖玉生烟。此情可待成追忆，只是当时已惘然。
    text_display: full
    themes: [追忆, 朦胧]
    influence: 其朦胧诗风的代表，被视为中国诗歌多义性的经典个案。
    confidence: 有争议
    dispute: 本事历来聚讼：悼亡说、自伤身世说、诗集自序说、咏瑟适怨清和说、政治寄托说长期并立而无定论；本卷不作裁决。
    source_ids: [src-qts-lishangyin]
  - work_id: ye-yu-ji-bei
    title: 夜雨寄北
    alt_titles: [夜雨寄内]
    genre: 七言绝句
    date:
      text: 约大中年间客居巴蜀时期
      year: 851
      range_end: 856
      precision: 范围
    place: 巴山（具体地点不详）
    context: 身在巴山秋雨之夜，遥想他日共剪西窗烛、重话今宵的情景，时空往复回环。
    attribution: 确凿
    excerpt: 君问归期未有期，巴山夜雨涨秋池。何当共剪西窗烛，却话巴山夜雨时。
    text_display: full
    themes: [相思, 巴蜀]
    influence: 时空交错手法脍炙人口，巴山夜雨成为羁旅相思的经典语汇。
    confidence: 有争议
    dispute: 题目一作夜雨寄内，受赠对象历来有寄妻王氏与寄长安友人两说；若系东川幕时期王氏已卒，寄内说遂生扞格，故亦有主张作于入蜀之前者。作年作地均无定论。
    source_ids: [src-qts-lishangyin]
  - work_id: wuti-xiangjian
    title: 无题·相见时难别亦难
    alt_titles: []
    genre: 七言律诗
    date:
      text: 创作年代不详
      precision: 未知
    place: ""
    context: 以相见时难别亦难起笔，春蚕蜡炬两句写至死不渝之情，蓬山万里寄青鸟之思。
    attribution: 确凿
    excerpt: 相见时难别亦难，东风无力百花残。春蚕到死丝方尽，蜡炬成灰泪始干。晓镜但愁云鬓改，夜吟应觉月光寒。蓬山此去无多路，青鸟殷勤为探看。
    text_display: full
    themes: [爱情, 无题]
    influence: 春蚕到死丝方尽成为献身精神的千古名句。
    confidence: 有争议
    dispute: 无题诗本事自唐以来即不可确考，或谓艳情本事、或谓政治寄托、或谓借情喻道，诸说并立；本条仅录文本层面事实。
    source_ids: [src-qts-lishangyin]
