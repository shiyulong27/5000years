    title: 无题·昨夜星辰昨夜风
    alt_titles: []
    genre: 七言律诗
    date:
      text: 创作年代不详
      precision: 未知
    place: ""
    context: 追忆昨夜画楼西畔一场宴集，身无彩凤双飞翼、心有灵犀一点通写阻隔中的默契相通。
    attribution: 确凿
    excerpt: 昨夜星辰昨夜风，画楼西畔桂堂东。身无彩凤双飞翼，心有灵犀一点通。隔座送钩春酒暖，分曹射覆蜡灯红。嗟余听鼓应官去，走马兰台类转蓬。
    text_display: full
    themes: [爱情, 追忆, 无题]
    influence: 心有灵犀成为心意相通的通用成语。
    confidence: 有争议
    dispute: 所忆对象与场合无考，本事有宴席邂逅、寄托身世诸说；尾联听鼓应官所涉职任年代亦难坐实。
    source_ids: [src-qts-lishangyin]
  - work_id: deng-le-you-yuan
    title: 登乐游原
    alt_titles: [乐游原]
    genre: 五言绝句
    date:
      text: 创作年代不详
      precision: 未知
    place: 长安乐游原
    context: 向晚意不适而驱车登古原，面对夕阳发出无限好与近黄昏的并置感慨。
    attribution: 确凿
    excerpt: 向晚意不适，驱车登古原。夕阳无限好，只是近黄昏。
    text_display: full
    themes: [夕阳, 抒怀]
    influence: 夕阳无限好成为晚唐气象与迟暮美感的象征性表达。
    confidence: 存疑
    dispute: 系年无考；末句「只是」作转折抑或正是之义，历代解读有分歧。
    source_ids: [src-qts-lishangyin]
  - work_id: jia-sheng
    title: 贾生
    alt_titles: []
    genre: 七言绝句
    date:
      text: 创作年代不详
      precision: 未知
    place: ""
    context: 咏贾谊宣室召对故事，夜半前席却不问苍生问鬼神，托古讽时而寓才士不遇之慨。
    attribution: 确凿
    excerpt: 宣室求贤访逐臣，贾生才调更无伦。可怜夜半虚前席，不问苍生问鬼神。
    text_display: full
    themes: [咏史, 不遇]
    influence: 翻案咏史的典范，寄寓晚唐士人对君主求贤名实不符的讽喻。
    confidence: 存疑
    dispute: 托古讽时的主旨大体公认，然所刺具体时事为何，诸家所指不一。
    source_ids: [src-qts-lishangyin]
  - work_id: ma-wei
    title: 马嵬二首（其二）
    alt_titles: [马嵬]
    genre: 七言律诗
    date:
      text: 创作年代不详
      precision: 未知
    place: ""
    context: 咏玄宗幸蜀马嵬之变，以海外更九州起兴，对比四纪天子不及卢家莫愁，讽帝王爱情神话之虚妄。
    attribution: 确凿
    excerpt: 海外徒闻更九州，他生未卜此生休。……此日六军同驻马，当时七夕笑牵牛。如何四纪为天子，不及卢家有莫愁。
    text_display: excerpt
    themes: [咏史, 讽喻]
    influence: 晚唐咏马嵬诸作中最负盛名的一首。
    confidence: 存疑
    dispute: 系年无定论；讽刺锋芒所向（玄宗本人抑或时政影射）历代解说有别。
    source_ids: [src-qts-lishangyin]
  - work_id: wan-qing
    title: 晚晴
    alt_titles: []
    genre: 五言律诗
    date:
      text: 约851年寓梓州初期
      year: 851
      precision: 约
    place: 梓州
    context: 久雨初晴，幽草得天怜而人间重晚晴，于晚岁失路之际写出澄明欣慰之境。
    attribution: 确凿
    excerpt: 天意怜幽草，人间重晚晴。
    text_display: excerpt
    themes: [晚晴, 自况]
    influence: 人间重晚晴成为历经忧患后珍惜晴光的通用语。
    confidence: 存疑
    dispute: 系于初入东川幕时期系通行说法，仍有异说。
    source_ids: [src-qts-lishangyin]
  - work_id: chang-e
    title: 嫦娥
    alt_titles: []
    genre: 七言绝句
    date:
      text: 创作年代不详
      precision: 未知
    place: ""
    context: 写烛影星沉之夜，悬想嫦娥偷灵药后碧海青天夜夜心的孤寂。
    attribution: 确凿
    excerpt: 云母屏风烛影深，长河渐落晓星沉。嫦娥应悔偷灵药，碧海青天夜夜心。
    text_display: full
    themes: [孤寂, 神话]
    influence: 以仙境写孤独的代表作，碧海青天成为永恒寂寞的意象。
    confidence: 有争议
    dispute: 主旨有咏女道士、自伤不遇、悼亡、泛咏孤高等诸说，历来无定论。
    source_ids: [src-qts-lishangyin]
