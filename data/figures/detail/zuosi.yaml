    context: 杖策寻访隐士而岩穴无结构丘中有鸣琴，寻隐不遇反悟山林之美；非必丝与竹山水有清音谓自然之声胜过人工音乐，结以聊欲投吾簪的弃官之想。
    attribution: 确凿
    excerpt: 杖策招隐士，荒涂横古今。……非必丝与竹，山水有清音。何事待啸歌，灌木自悲吟。……踌躇足力烦，聊欲投吾簪。
    text_display: excerpt
    themes: [招隐, 山水清音, 弃官]
    influence: 非必丝与竹山水有清音是以山水入诗审美的先声，下开东晋南朝山水诗一路；两首均录入文选。
    source_ids: [src-wenxuan]

  - work_id: yong-shi-ba-shou-zhi-qi
    title: 咏史八首·其七（主父宦不达）
    alt_titles: []
    genre: 五言诗（咏史）
    date:
      text: 组诗之七，创作年代无定说
      precision: 未知
    place: ""
    context: 连举主父偃朱买臣陈平司马相如四人微时困顿的史事——四贤岂不伟当其未遇时忧在填沟壑，归结为英雄有屯邅由来自古昔何世无奇才遗之在草泽，为埋没草泽的奇才作总申诉。
    attribution: 确凿
    excerpt: 英雄有屯邅，由来自古昔。何世无奇才？遗之在草泽。
    text_display: excerpt
    themes: [咏史, 不遇之士, 草泽遗才]
    influence: 何世无奇才遗之在草泽成为历代论人才埋没的常引名句。
    source_ids: [src-wenxuan]

