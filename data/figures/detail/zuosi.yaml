# 左思全景详卷（schema v1）
# 史料审计表（实取证据；来源登记见 data/sources.yaml）：
#
# | 事实点 | 晋书·卷九十二·文苑·左思传（维基文库实取） | 结论与置信 |
# |---|---|---|
# | 名号籍贯 | 左思字太沖齊國臨淄人也；其先齊之公族有左右公子因為氏焉；家世儒學；父雍起小吏以能擢授殿中侍御史 | 确定 |
# | 少年勤学 | 思小學鐘、胡書及鼓琴並不成；雍謂友人曰思所曉解不及我少時；思遂感激勤學兼善陰陽之術 | 确定 |
# | 形貌性情 | 貌寢口訥而辭藻壯麗；不好交遊惟以閒居為事 | 确定 |
# | 齐都赋 | 造《齊都賦》一年乃成 | 确定；赋文已佚 |
# | 妹入宫移家 | 復欲賦三都會妹芬入宮移家京師乃詣著作郎張載訪岷邛之事 | 确定；入宫系年本传此处无载（通行系泰始八年前后） |
# | 构思十年 | 遂構思十年門庭籓溷皆著筆紙遇得一句即便疏之；自以所見不博求為秘書郎 | 确定；起讫年份无载 |
# | 序注推重 | 及賦成時人未之重；安定皇甫謐有高譽思造而示之謐稱善為其賦序；張載為注《魏都》劉逵注《吳》《蜀》；陳留衛權又為思賦作《略解》 | 确定 |
# | 洛阳纸贵 | 司空張華見而歎曰班張之流也使讀之者盡而有餘久而更新；於是豪貴之家競相傳寫洛陽為之紙貴 | 确定 |
# | 陆机叹服 | 初陸機入洛欲為此賦聞思作之撫掌而笑與弟雲書曰此間有傖父欲作三都賦須其成當以覆酒甕耳；及思賦出機絕歎伏以為不能加也遂輟筆焉 | 确定 |
# | 贾谧讲汉书 | 秘書監賈謐請講《漢書》；謐誅退居宜春裏專意典籍 | 确定；「二十四友」之称见晋书贾谧传（卷40），本次未实取该卷，按转述层存疑 |
# | 记室督辞疾 | 齊王冏命為記室督辭疾不就 | 确定；系年无载 |
# | 适冀州病卒 | 及張方縱暴都邑舉家適冀州；數歲以疾終 | 确定；卒年正史不载（学界推定约305） |
# | 作品文本 | 咏史八首（文选卷21）、招隐诗二首（文选卷22）、三都赋序（文选卷4）均维基文库实取；娇女诗（玉台新咏页）与悼离赠妹诗二首（单篇页未标出处）已实取惟来源未登记，暂列注释待补 | 公版原文层 |
#
