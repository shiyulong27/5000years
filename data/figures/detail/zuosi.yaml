reception:
  - era: 同时代
    evaluator: 陆机
    quote: 此间有伧父，欲作《三都赋》，须其成，当以覆酒瓮耳。——及思赋出，机绝叹伏，以为不能加也，遂辍笔焉。
    text_display: excerpt
    comment: 本传直引的两段合观——先讥后服再到搁笔，是同时代最强对手给出的最高承认，也是覆酒瓮典故的出处。
    source_ids: [src-jinshi-vol92]
  - era: 同时代
    evaluator: 张华
    quote: 班张之流也。使读之者尽而有馀，久而更新。
    text_display: excerpt
    comment: 本传直引的当朝重臣文坛巨擘之评，将其直接接续班固张衡的大赋正统；其后豪贵竞相传写遂有洛阳纸贵。
    source_ids: [src-jinshi-vol92]
  - era: 同时代
    evaluator: 刘逵（注《吴》《蜀》序）
    quote: 观中古以来为赋者多矣……至若此赋，拟议数家，傅辞会义，抑多精致，非夫研核者不能练其旨，非夫博物者不能统其异。
    text_display: excerpt
    comment: 本传转录的注家评语，指出三都赋研核博物之难，代表当时专业读者对其征实写法的认可。
    source_ids: [src-jinshi-vol92]
  - era: 历代批评
    evaluator: 钟嵘《诗品》、刘勰《文心雕龙》（转述层）
    quote: ""
    text_display: none
    comment: 通行评价谓钟嵘诗品列左思为上品并有文典以怨颇为精切得讽谕之致之评；文心雕龙才略篇谓其尽锐于三都拔萃于咏史——两条评语本次未在维基文库实取原文，暂按学界转述层著录。
    confidence: 存疑
    dispute: 诗品与文心雕龙评语原文待实取核验后方可升格为引文层。
    source_ids: []
  - era: 近现代学术
    evaluator: 学界综述
    quote: ""
    text_display: none
    comment: 近现代研究公认其为咏史诗传统的奠基人——咏史八首使咏史从敷衍史实转为寄托身世，寒士文学的代表声音；三都赋则被视为京都大赋的终结者。具体论著引文须取得许可后补入，本卷暂作中立转述。
    source_ids: []
  - era: 教科书与公共文化
    evaluator: 通用语文教育与大众传播
    quote: ""
    text_display: none
    comment: 成语洛阳纸贵进入国民语汇，是罕见以出版传播盛况凝成的成语；郁郁涧底松长期入选教材与选本，成为门阀制度批判的教科书级文本。教材篇目随学期变动录入时须另行核验当期版本。
    source_ids: []
  - era: 影视与网络
    evaluator: 大众传播综述
    quote: ""
    text_display: none
    comment: 影视剧中的左思多为竹林名士题材或世说新语式轶事的配角化敷演，不作信史依据；网络传播集中于洛阳纸贵与覆酒瓮两个段子，暂无可靠专门条目可引。
    source_ids: []

