  - work_id: san-du-fu
    title: 三都赋（蜀都赋、吴都赋、魏都赋）
    alt_titles: [蜀都赋, 吴都赋, 魏都赋]
    genre: 京都大赋
    date:
      text: 构思十年，约280—291年之间写成
      year: 280
      range_end: 291
      precision: 范围
    place: 洛阳
    context: 分咏蜀吴魏三国都城物产形胜，以魏都归于一统收束；山川城邑稽之地图鸟兽草木验之方志的征实写法，是对汉赋虚夸传统的自觉矫正。赋成而豪贵竞相传写洛阳为之纸贵。
    attribution: 确凿
    excerpt: ""
    text_display: none
    themes: [京都赋, 征实, 一统理想]
    influence: 被视为汉代以来京都大赋的压轴之作，张华评为班张之流，陆机为之辍笔；洛阳纸贵的本事所在。
    confidence: 有争议
    dispute: 正文全篇收录于文选卷四至卷六（目录级实取确认），本次未逐字核对赋文正文；皇甫谧作序之说与谧卒年的矛盾历来有考辨。
    source_ids: [src-wenxuan, src-jinshi-vol92]

  - work_id: san-du-fu-xu
    title: 三都赋序
    alt_titles: []
    genre: 赋序（论体文）
    date:
      text: 与三都赋同时，约291年前后
      year: 291
      precision: 约
    place: 洛阳
    context: 开篇盖诗有六义焉其二曰赋引扬雄诗人之赋丽以则与班固赋者古诗之流也立论；历数相如赋上林而引卢橘夏熟等假称珍怪之失，提出美物者贵依其本赞事者宜本其实的征实纲领。
    attribution: 确凿
    excerpt: 盖诗有六义焉，其二曰赋。……美物者贵依其本，赞事者宜本其实。匪本匪实，览者奚信？
    text_display: excerpt
    themes: [赋论, 征实, 批判虚夸]
    influence: 西晋文学批评的重要文献，征实主张与其访岷邛、检方志的写作实践互证，对后世纪实文论影响深远。
    source_ids: [src-wenxuan]

