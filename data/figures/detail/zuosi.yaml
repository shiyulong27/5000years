works:
  - work_id: yong-shi-ba-shou-zhi-er
    title: 咏史八首·其二（郁郁涧底松）
    alt_titles: []
    genre: 五言诗（咏史）
    date:
      text: 创作年代无定说，一般认为作于滞洛期间
      precision: 未知
    place: ""
    context: 以涧底松与山上苗起兴，世胄蹑高位英俊沉下僚直斥门阀制度压抑人才，金张七叶珥汉貂与冯唐白首不见招用史实对照，为寒士不平的最强音。
    attribution: 确凿
    excerpt: 郁郁涧底松，离离山上苗。以彼径寸茎，荫此百尺条。世胄蹑高位，英俊沉下僚。地势使之然，由来非一朝。金张籍旧业，七叶珥汉貂。冯公岂不伟，白首不见招。
    text_display: full
    themes: [咏史, 门阀批判, 寒士不平]
    influence: 中国咏史诗由咏史实转向借古抒怀、托古讽今的奠基之作；郁郁涧底松成为寒门才士的经典意象。
    source_ids: [src-wenxuan]

  - work_id: yong-shi-ba-shou-zhi-yi
    title: 咏史八首·其一（弱冠弄柔翰）
    alt_titles: []
    genre: 五言诗（咏史）
    date:
      text: 组诗之首，创作年代无定说
      precision: 未知
    place: ""
    context: 自述文武兼资的少年抱负——著论准过秦作赋拟子虚的文学自信，与长啸激清风志若无东吴的功业幻想；结句功成不受爵长揖归田庐已埋下功成身退的主调。
    attribution: 确凿
    excerpt: 弱冠弄柔翰，卓荦观群书。著论准过秦，作赋拟子虚。……铅刀贵一割，梦想骋良图。……功成不受爵，长揖归田庐。
    text_display: excerpt
    themes: [咏史, 自述怀抱, 功成身退]
    influence: 八首组诗的总纲，确立了左思咏史连章体、以我观史的写法。
    source_ids: [src-wenxuan]

  - work_id: yong-shi-ba-shou-zhi-wu
    title: 咏史八首·其五（皓天舒白日）
    alt_titles: []
    genre: 五言诗（咏史）
    date:
      text: 创作年代无定说
      precision: 未知
    place: ""
    context: 写帝城王侯宅第的煊赫与攀龙客的自省，被褐出阊阖高步追许由作结，尾联振衣千仞岗濯足万里流以极目天地的姿态写精神超越。
    attribution: 确凿
    excerpt: 皓天舒白日，灵景耀神州。……被褐出阊阖，高步追许由。振衣千仞岗，濯足万里流。
