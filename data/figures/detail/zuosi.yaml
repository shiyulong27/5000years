    summary: 遂构思十年，门庭藩溷皆著笔纸，遇得一句即便疏之；自以所见不博求为秘书郎——为增广见识自请掌秘阁图书，门旁篱厕处处挂纸笔的苦吟已成创作执着的千古意象。
    confidence: 存疑
    dispute: 构思十年的起讫年份正史无载，系据平吴（280）后素材齐备与赋成年代的通行框架推定。
    source_ids: [src-jinshi-vol92]
  - stage: 十年乃成洛阳纸贵
    stage_order: 9
    title: 赋成未重，皇甫谧称善为序
    date:
      text: 赋成之初，约291年前后
      year: 291
      precision: 约
    place: 洛阳
    summary: 及赋成时人未之重；思自以其作不谢班张恐以人废言，遂造高誉的皇甫谧出示，谧称善为其赋序；张载注魏都刘逵注吴蜀，卫权又作略解——借名公序注破以人废言之局。
    confidence: 存疑
    dispute: 赋成与作序的确切年份正史无载，系学界推定；皇甫谧卒于太康三年（282）与序赋之说的时间矛盾，历来有考辨异说。
