      precision: 范围
    place: 江淮一带（推定）
    context: 自度曲。小序自陈：予颇喜自制曲，初率意为长短句然后协以律，故前后阕多不同；又引桓大司马昔年种柳语谓深爱之。树若有情时会得青青如此为千古奇语。
    attribution: 确凿
    excerpt: 渐吹尽、枝头香絮，是处人家，绿深门户。……阅人多矣，谁得似长亭树？树若有情时，不会得青青如此！
    text_display: excerpt
    themes: [离别, 柳]
    influence: 自度曲旁谱今存（见白石道人歌曲），可据以复原宋代词乐旋律，为音乐史孤本级材料。
    confidence: 存疑
    dispute: 创作年代无小序纪年，系年诸家有分歧。
    source_ids: [src-baishidaoren]
  - work_id: chuye-gu-shihu
    title: 除夜自石湖归苕溪十首（其一）
    alt_titles: [除夜自石湖归苕溪]
    genre: 七言绝句（组诗）
    date:
      text: 绍熙二年岁末除夕（辛亥冬，公历已入1192年初）
      year: 1191
      range_end: 1192
      precision: 范围
    place: 苏州至湖州苕溪水路
    context: 辛亥冬辞别范成大石湖别墅，除夜乘舟归苕溪，一路雪消梅放而成组诗十首，杨万里盛赏其有裁云缝月之妙思（此评语见转引层）。其一写细草穿沙一夜梅香，萧散简远。
    attribution: 确凿
    excerpt: 细草穿沙雪半销，吴宫烟冷水迢迢。梅花竹里无人见，一夜吹香过石桥。
    text_display: full
    themes: [羁旅, 梅]
    influence: 组诗为其诗名代表作，与暗香疏影同一行旅的词、诗互证。
    confidence: 存疑
    dispute: 除夕跨辛壬之际，系年有1191与1192两算；杨万里评语系后世转引未经直接核验。
    source_ids: [src-baishidaoren]

