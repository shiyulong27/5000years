reception:
  - era: 同时代
    evaluator: 杨万里、范成大
    quote: ""
    text_display: none
    comment: 杨万里称其于文无所不工甚似陆天随，范成大称其翰墨人品皆似晋宋之雅士；二语均见后世词学文献与今人辑录的转引层，原始出处页面未直接核验，故本卷暂作中性转述留待补证。
    source_ids: []
  - era: 历代批评
    evaluator: 张炎《词源》
    quote: 词要清空，不要质实。……姜白石词如野云孤飞，去留无迹。
    text_display: excerpt
    comment: 词源卷下以清空质实对举，举白石为清空一格的代表，又称其疏影暗香扬州慢等曲不惟清虚且又骚雅读之使人神观飞越；此段原文已于维基文库／中国哲学书电子化计划之白石道人歌曲疏证附词源条实取得手。
    source_ids: [src-baishidaoren]
  - era: 近现代学术
    evaluator: 学界综述
    quote: ""
    text_display: none
    comment: 近现代研究聚焦白石旁谱：白石道人歌曲所存十七首自度曲工尺旁谱为宋代词乐唯一成体系的乐谱文献，自清代以来校勘译解不绝，涉及燕乐宫调、旁谱符号与旋律复原诸议题；具体论著引文须逐条取得许可后补入，本卷暂作中立转述。
    source_ids: []
