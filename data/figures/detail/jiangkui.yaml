  # ── 阶段二：过扬州自度曲 ────────────────────────────
  - stage: 过扬州自度曲
    stage_order: 4
    title: 淳熙丙申冬至过维扬，自度扬州慢
    date:
      text: 淳熙三年冬至日（1176）
      year: 1176
      precision: 精确
    place: 扬州
    summary: 词前小序自证：淳熙丙申至日予过维扬，夜雪初霁荠麦弥望，入其城则四顾萧条寒水自碧暮色渐起戍角悲吟，因自度此曲，千岩老人以为有黍离之悲也。金兵屡南侵后的扬州劫景由此定格为词史名篇。
    source_ids: [src-baishidaoren]

  # ── 阶段三：依萧德藻居湖州与交游 ────────────────────
  - stage: 依萧德藻居湖州与交游
    stage_order: 5
    title: 千岩老人萧德藻赏识，以侄女妻之
    date:
      text: 约1186年前后
      year: 1186
      precision: 约
    place: 长沙
    summary: 诗人萧德藻（号千岩老人）激赏其才，约为淳熙十三年前后相识于长沙，遂以兄女妻之。扬州慢小序中千岩老人语即出此人。
    confidence: 存疑
    dispute: 定交与联姻确年系学界通说推排；婚事记载出自后世年谱传记层。
    source_ids: []
  - stage: 依萧德藻居湖州与交游
    stage_order: 6
    title: 随萧德藻移居湖州，卜居苕溪之上
    date:
      text: 约1187年起
      year: 1187
      precision: 约
    place: 湖州苕溪
    summary: 依萧氏寓居湖州，卜居苕溪之上，与弁山白石洞天为邻，因号白石道人。此后往来苏杭间。同年丁未冬过吴松作点绛唇，有第四桥边拟共天随住句，致意隐居于此的唐贤陆龟蒙。
    confidence: 存疑
    dispute: 移居确年从通说；白石道人之号的得名缘由另有异说。
    source_ids: [src-baishidaoren]
  - stage: 依萧德藻居湖州与交游
    stage_order: 7
    title: 得杨万里范成大赏爱，出入石湖
    date:
      text: 约1186—1191年之间
      year: 1186
      range_end: 1191
      precision: 范围
    place: 杭州、苏州石湖
    summary: 由萧德藻之介结识杨万里、范成大一辈前辈诗人，杨万里称其于文无所不工甚似陆天随，范成大称其翰墨人品皆似晋宋之雅士。绍熙辛亥之冬载雪诣石湖，止既月授简索句，作暗香疏影两曲，石湖把玩不已使工妓肄习之。
    confidence: 存疑
    dispute: 二家评语见后世词学文献转引，原始出处页面未直接核验；定交先后亦据交游网络推定。
    source_ids: [src-baishidaoren]
  - stage: 依萧德藻居湖州与交游
    stage_order: 8
    title: 己酉吴兴载酒，感遇成琵琶仙
    date:
      text: 淳熙十六年（1189）
      year: 1189
      precision: 精确
    place: 吴兴（湖州）
    summary: 小序自证：己酉岁予与萧时父载酒南郭感遇成歌。舟中误认歌女似旧曲桃根桃叶而生怀人之思，为自创新调琵琶仙。
    source_ids: [src-baishidaoren]
  - stage: 依萧德藻居湖州与交游
    stage_order: 9
    title: 客居合肥与寄怀之作
    date:
      text: 绍熙二年前后数年间往返
      year: 1190
      range_end: 1192
      precision: 范围
    place: 合肥
    summary: 自度曲淡黄柳小序自述客居合肥南城赤阑桥之西，巷陌凄凉与江左异，唯柳色夹道依依可怜，因度此阕以纾客怀。合肥情事为其词中怀人主题的重要背景。
    confidence: 存疑
    dispute: 往返合肥的次数与情事细节均系后人考索，本卷仅据小序著录客居事实。
    source_ids: [src-baishidaoren]

  # ── 阶段四：进大乐议与杭州晚年 ──────────────────────
  - stage: 进大乐议与杭州晚年
    stage_order: 10
    title: 丙辰岁与张功甫会饮赋齐天乐
    date:
      text: 庆元二年秋（1196）
      year: 1196
      precision: 精确
    place: 杭州
    summary: 小序自证：丙辰岁与张功甫会饮张达可之堂，闻屋壁间蟋蟀有声，功甫约予同赋以授歌者。庾郎先自吟愁赋一阕为咏物词名篇。
    source_ids: [src-baishidaoren]
  - stage: 进大乐议与杭州晚年
    stage_order: 11
    title: 进大乐议论雅乐，免解试礼部不第
    date:
      text: 约1197—1200年之间
      year: 1197
      range_end: 1200
      precision: 范围
    place: 杭州
    summary: 以布衣上书论雅乐，进大乐议并献琴瑟考古图，时南渡后乐典久亡，其议诏付太常；朝廷曾予免解应试礼部而不第，终身布衣如故。此为其一生唯一一次接近仕途的事件。
    confidence: 存疑
    dispute: 上书确年在庆元三年前后诸说不一；免解试礼部不第事出自宋史乐志与笔记层，细节未经本卷直接核验原页。
    source_ids: []
  - stage: 进大乐议与杭州晚年
    stage_order: 12
    title: 移居杭州，依张鉴十年
    date:
      text: 约庆元、嘉泰之交起，前后十年
      year: 1200
      range_end: 1210
      precision: 范围
    place: 杭州
    summary: 晚岁移居杭州，贵胄张鉴（字平甫）怜其贫与之分资，相依近十年；张鉴死后生计益窘。依人岁月与迁居确年俱系年谱推排。
    confidence: 存疑
    dispute: 张鉴资助始末与十年之数出自传记层材料，无一手文献可核。
    source_ids: []
  - stage: 进大乐议与杭州晚年
    stage_order: 13
    title: 贫病旅食浙东，卒于杭州
    date:
      text: "约1221年"
      year: 1221
      precision: 约
    place: 杭州
    summary: 张鉴殁后贫病交加，旅食浙东，尝客游嘉兴金陵等地；约嘉定十四年前后卒于杭州，葬钱塘门外。身后赖友人营葬之说流传而葬地细节难考。
    confidence: 存疑
    dispute: 卒年约1221系学界通说，亦有1209与1224诸异说；卒地为杭州推定，营葬细节出自笔记传记层不足确证。
    source_ids: []

works:
  - work_id: yangzhou-man
    title: 扬州慢·淮左名都
    alt_titles: [扬州慢]
    genre: 词（自度曲，中吕宫）
    date:
      text: 淳熙三年冬至日（1176）
      year: 1176
      precision: 精确
    place: 扬州
    context: 自序纪年：淳熙丙申至日予过维扬，夜雪初霁荠麦弥望……予怀怆然感慨今昔，因自度此曲，千岩老人以为有黍离之悲也。写金兵南侵后扬州的废池乔木清角吹寒，为其最早的自度曲。
    attribution: 确凿
    excerpt: 二十四桥仍在，波心荡、冷月无声。念桥边红药，年年知为谁生？
    text_display: excerpt
    themes: [黍离之悲, 怀古]
    influence: 自创词牌而小序自带系年证据，成为姜词编年的锚点；黍离之悲自此成为咏兵燹后城市荒残的经典范式。
    source_ids: [src-baishidaoren]

  - work_id: an-xiang
    title: 暗香·旧时月色
    alt_titles: [暗香]
    genre: 词（自度曲，仙吕宫）
    date:
      text: 绍熙二年冬（1191）
      year: 1191
      precision: 精确
    place: 苏州石湖
    context: 自度曲。小序自证：辛亥之冬予载雪诣石湖，止既月授简索句且徵新声，作此两曲，石湖把玩不已，使工妓肄习之音节谐婉，乃名之曰暗香疏影。
    attribution: 确凿
    excerpt: 旧时月色，算几番照我，梅边吹笛？唤起玉人，不管清寒与攀摘。……长记曾携手处，千树压、西湖寒碧。
    text_display: excerpt
    themes: [咏梅, 忆旧]
    influence: 咏梅词双璧之一，张炎词源举为清空骚雅的范例；调名取林逋暗香浮动月黄昏意。
    source_ids: [src-baishidaoren]
  - work_id: shu-ying
    title: 疏影·苔枝缀玉
    alt_titles: [疏影]
    genre: 词（自度曲，仙吕宫）
    date:
      text: 绍熙二年冬（1191）
      year: 1191
      precision: 精确
    place: 苏州石湖
    context: 暗香姊妹篇，同出辛亥石湖之会小序。咏苔梅而用昭君佩环、寿阳梅妆诸典，写尽幽独身世之感。
    attribution: 确凿
    excerpt: 苔枝缀玉，有翠禽小小，枝上同宿。客里相逢，篱角黄昏，无言自倚修竹。
    text_display: excerpt
    themes: [咏梅, 幽独]
    influence: 与暗香并为骚雅词派典范文本，历代和作蜂起。
    source_ids: [src-baishidaoren]
  - work_id: dianjiangchun-dingwei
    title: 点绛唇·丁未冬过吴松作
    alt_titles: [点绛唇·燕雁无心]
    genre: 词
    date:
      text: 淳熙十四年冬（1187）
      year: 1187
      precision: 精确
    place: 吴松（今苏州吴江一带）
    context: 词题自带系年：丁未冬过吴松作。时往返湖苏之间，经晚唐陆龟蒙隐居故地而凭阑怀古，拟共天随住致其心仪。
    attribution: 确凿
    excerpt: 燕雁无心，太湖西畔随云去。数峰清苦。商略黄昏雨。第四桥边，拟共天随住。今何许。凭阑怀古。残柳参差舞。
    text_display: full
    themes: [怀古, 羁旅]
    influence: 四十一字小令而苍茫无尽，被推为南宋小令绝唱之一。
    source_ids: [src-baishidaoren]
  - work_id: qitianle-qishuai
    title: 齐天乐·蟋蟀
    alt_titles: [齐天乐·庾郎先自吟愁赋]
    genre: 词
    date:
      text: 庆元二年秋（1196）
      year: 1196
      precision: 精确
    place: 杭州
    context: 小序自证：丙辰岁与张功父会饮张达可之堂，闻屋壁间蟋蟀有声，功甫约予同赋以授歌者。以虫声串起思妇、迁客、离宫吊月诸般人间哀怨。
    attribution: 确凿
    excerpt: 庾郎先自吟愁赋，凄凄更闻私语。露湿铜铺，苔侵石井，都是曾听伊处。……写入琴丝，一声声更苦。
    text_display: excerpt
    themes: [咏物, 秋思]
    influence: 咏蟋蟀词的压卷之作，笑篱落呼灯以儿女之乐反衬有心人之苦为论词者津津乐道。
    source_ids: [src-baishidaoren]
  - work_id: pipaxian
    title: 琵琶仙·双桨来时
    alt_titles: [琵琶仙]
    genre: 词（自度曲）
    date:
      text: 淳熙十六年（1189）
      year: 1189
      precision: 精确
    place: 吴兴（湖州）
    context: 自度曲。小序自证：《吴都赋》云户藏烟浦家具画船，唯吴兴为然……己酉岁予与萧时父载酒南郭感遇成歌。舟中误认似旧曲桃根桃叶之人而生怀人之思。
    attribution: 确凿
    excerpt: 双桨来时，有人似、旧曲桃根桃叶。歌扇轻约飞花，蛾眉正奇绝。……十里扬州，三生杜牧，前事休说。
    text_display: excerpt
    themes: [怀人, 春游]
    influence: 张炎词源许其离情当在全在情景交炼得言外意。
    source_ids: [src-baishidaoren]
  - work_id: danhuang-liu
    title: 淡黄柳·空城晓角
    alt_titles: [淡黄柳]
    genre: 词（自度曲）
    date:
      text: 绍熙二年春（1191）
      year: 1191
      precision: 约
    place: 合肥
    context: 自度曲。小序自证：客居合肥南城赤阑桥之西，巷陌凄凉与江左异，唯柳色夹道依依可怜，因度此阕以纾客怀。
    attribution: 确凿
    excerpt: 空城晓角，吹入垂杨陌。马上单衣寒恻恻。看尽鹅黄嫩绿，都是江南旧相识。……燕燕飞来，问春何在？唯有池塘自碧。
    text_display: excerpt
    themes: [客怀, 柳]
    influence: 边城合肥的空城意象与其黍离之悲一脉相通。
    confidence: 存疑
    dispute: 系年从绍熙二年春通说。
    source_ids: [src-baishidaoren]
