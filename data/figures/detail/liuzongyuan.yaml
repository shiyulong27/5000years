  - stage: 柳州刺史四年
    stage_order: 11
    title: 革男女质钱乡法，出私钱赎归其父母
    date:
      text: 柳州任内约815—819年之间
      year: 815
      range_end: 819
      precision: 范围
    place: 柳州
    summary: 柳州土俗以男女质钱过期则没入钱主，宗元革其乡法，其已没者仍出私钱赎之归其父母；新唐书补载设方计悉赎归之、尤贫者令书庸视直足相当还其质。与其后韩愈在袁州设法赎没男女归其父母的做法先后同揆。
    source_ids: [src-jts-vol160, src-xts-vol168]
  - stage: 柳州刺史四年
    stage_order: 12
    title: 江岭进士不远数千里师从，时号柳柳州
    date:
      text: 柳州任内约815—819年之间
      year: 815
      range_end: 819
      precision: 范围
    place: 柳州
    summary: 江岭间为进士者不远数千里皆随宗元师法，凡经其门必为名士；新唐书称经指授者为文辞皆有法。著述之盛名动于时，世号柳柳州。
    source_ids: [src-jts-vol160, src-xts-vol168]
  - stage: 柳州刺史四年
    stage_order: 13
    title: 元和十四年十月五日卒，年四十七
    date:
      text: 819年10月5日（元和十四年十月五日）
      year: 819
      precision: 精确
    place: 柳州
    summary: 元和十四年十月五日卒时年四十七。子周六、周七才三四岁。观察使裴行立为营护其丧及妻子还于京师，时人义之。生卒773—819由此条与倒推闭合。
    source_ids: [src-jts-vol160]
  - stage: 柳州刺史四年
    stage_order: 14
    title: 身后：柳人怀之，庙于罗池
    date:
      text: 卒后渐起，具体年代不详
      precision: 未知
    place: 柳州
    summary: 新唐书载既没柳人怀之托言降于州之堂人有慢者辄死，庙于罗池韩愈因碑以实之。神异传闻属地方追思的附会层，旧唐书韩传直斥南人妄以柳宗元为罗池神而愈撰碑以实之为文章纰缪。
    confidence: 传说
    dispute: 罗池降神为人神化传说，正史层面仅存其庙祀事实与韩愈撰碑一事；韩愈撰碑本身在旧唐书即受批评。
