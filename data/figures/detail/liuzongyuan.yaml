works:
  - work_id: jiang-xue
    title: 江雪
    alt_titles: []
    genre: 五言绝句
    date:
      text: 永州贬谪期间约806—815年之间
      year: 806
      range_end: 815
      precision: 范围
    place: 永州
    context: 永州十年孤独处境的极简写照，千山鸟飞绝的天地间独钓寒江，清冷孤绝至极。
    attribution: 确凿
    excerpt: 千山鸟飞绝，万径人踪灭。孤舟蓑笠翁，独钓寒江雪。
    text_display: full
    themes: [山水, 孤绝]
    influence: 唐人五绝中最负盛名的雪景诗，历代山水画反复取材。
    confidence: 存疑
    dispute: 系年从永州时期通说，确切年份无载。
    source_ids: [src-qts-liuzongyuan]
  - work_id: yu-weng
    title: 渔翁
    alt_titles: []
    genre: 七言古诗
    date:
      text: 永州贬谪期间约806—815年之间
      year: 806
      range_end: 815
      precision: 范围
    place: 永州
    context: 欸乃一声山水绿以声写静，岩上无心云相逐化用陶渊明，寄托谪居中的出世之想。
    attribution: 确凿
    excerpt: 渔翁夜傍西岩宿，晓汲清湘燃楚竹。烟销日出不见人，欸乃一声山水绿。回看天际下中流，岩上无心云相逐。
    text_display: full
    themes: [山水, 隐逸]
    influence: 苏轼评其有奇趣，后世论唐诗声色之美常举此篇。
    confidence: 存疑
    dispute: 系年从永州时期通说；尾二句宋人已有删留之争（苏轼谓虽不必亦可）。
    source_ids: [src-qts-liuzongyuan]
  - work_id: shi-de-xishan-yan-youji
    title: 始得西山宴游记
    alt_titles: []
    genre: 山水游记散文
    date:
      text: "809年（文末自纪元和四年）"
      year: 809
      precision: 精确
    place: 永州西山
    context: 永州八记之首，自余为僇人居是州恒惴栗起笔，发现西山而后知吾向之未始游游于是乎始。文末自纪是岁元和四年，系年有本文内证。
    attribution: 确凿
    excerpt: 自余为僇人，居是州，恒惴栗。其隙也，则施施而行，漫漫而游。……攀援而登，箕踞而遨，则凡数州之土壤，皆在衽席之下。……然后知吾向之未始游，游于是乎始。故为之文以志。是岁元和四年也。
    text_display: excerpt
    themes: [山水游记, 谪迁心境]
    influence: 中国古代山水游记独立成体的奠基之作，永州八记自此开篇。
    source_ids: [src-jts-vol160, src-xts-vol168]
  - work_id: xiao-shi-tan-ji
    title: 小石潭记
    alt_titles: [至小丘西小石潭记]
    genre: 山水游记散文
    date:
      text: 永州期间，通说809年后
      year: 809
      precision: 约
    place: 永州
    context: 永州八记之一，潭中鱼可百许头皆若空游无所依写水之清澈至此化境；结于凄神寒骨悄怆幽邃，乐境转凄正是谪居心绪。
    attribution: 确凿
    excerpt: 从小丘西行百二十步，隔篁竹，闻水声，如鸣珮环，心乐之。……潭中鱼可百许头，皆若空游无所依。……坐潭上，四面竹树环合，寂寥无人，凄神寒骨，悄怆幽邃。
    text_display: excerpt
    themes: [山水游记, 凄清]
    influence: 中学语文经典篇目，山水游记写作范本。
    confidence: 存疑
    dispute: 具体系年无载，从元和年间西山系列之后通说。
    source_ids: [src-jts-vol160, src-xts-vol168]
  - work_id: bu-she-zhe-shuo
    title: 捕蛇者说
    alt_titles: []
    genre: 议论散文（说体）
    date:
      text: 永州贬谪期间约806—815年之间
      year: 806
      range_end: 815
      precision: 范围
    place: 永州
    context: 永州之野产异蛇起笔，借蒋氏三代宁死于毒蛇不肯死于赋敛的口述，续孔子苛政猛于虎的脉络而下，孰知赋敛之毒有甚是蛇者乎。
    attribution: 确凿
    excerpt: 永州之野产异蛇，黑质而白章，触草木尽死。……孔子曰：「苛政猛于虎也。」吾尝疑乎是，今以蒋氏观之，犹信。呜呼！孰知赋敛之毒有甚是蛇者乎！
    text_display: excerpt
    themes: [社会批判, 赋敛之毒]
    influence: 苛政猛于虎命题在唐代最有力的展开，政论散文典范。
    confidence: 存疑
    dispute: 系年从永州时期通说，确切年份无载。
    source_ids: [src-jts-vol160, src-xts-vol168]
  - work_id: qian-zhi-lv
    title: 黔之驴（三戒之一）
    alt_titles: [三戒·黔之驴]
    genre: 寓言散文
    date:
      text: 永州贬谪期间约806—815年之间
      year: 806
      range_end: 815
      precision: 范围
    place: 永州
    context: 三戒（临江之麋、黔之驴、永某氏之鼠）之一，庞然大物技止此耳，讽刺无德无能而虚张声势者。
    attribution: 确凿
    excerpt: 黔无驴，有好事者船载以入。至则无可用，放之山下。……驴不胜怒，蹄之。虎因喜，计之曰：「技止此耳！」因跳踉大㘎，断其喉，尽其肉，乃去。
    text_display: excerpt
    themes: [寓言, 讽喻]
    influence: 黔驴技穷成语之所本，中国寓言文学的高峰之作。
    confidence: 存疑
    dispute: 系年从永州时期通说。
    source_ids: [src-jts-vol160, src-xts-vol168]
  - work_id: zhongshu-guo-tuo-zhuan
    title: 种树郭橐驼传
    alt_titles: []
    genre: 传记体寓言散文
    date:
      text: 长安时期为主流说，年代不详
      precision: 未知
    place: 长安（一说）
    context: 借病偻种树人郭橐驼顺木之天以致其性之说，转入官理之弊——虽曰爱之其实害之，虽曰忧之其实仇之，讽扰民之政。
    attribution: 确凿
    excerpt: 郭橐驼，不知始何名。病偻，隆然伏行，有类橐驼者，故乡人号之驼。……虽曰爱之，其实害之；虽曰忧之，其实仇之。
    text_display: excerpt
    themes: [寓言, 政论]
    influence: 以种树之道移之官理的名文，为政贵在无为烦令的古典表述。
    confidence: 存疑
    dispute: 作年无载，从长安时期通说，亦有贬前贬后不同系年意见。
    source_ids: [src-jts-vol160]
  - work_id: feng-jian-lun
    title: 封建论
    alt_titles: []
    genre: 政论散文
    date:
      text: 创作年代无定论，多系于贬永州后
      precision: 未知
    place: ""
    context: 系统论证分封非圣人意也势也，郡县制胜于封建，是其历史政治思想的纲领性文本。
    attribution: 确凿
    excerpt: 彼封建者，更古圣王尧、舜、禹、汤、文、武而莫能去之。盖非不欲去之也，势不可也。……故封建非圣人意也，势也。
    text_display: excerpt
    themes: [政论, 历史观]
    influence: 古代论封建郡县之争的第一等文字，苏轼称其出入诸家。
    confidence: 存疑
    dispute: 作年有永州说、长安说诸解，无定论。
    source_ids: [src-jts-vol160, src-xts-vol168]
  - work_id: yongzhou-tielubu-zhi
    title: 永州铁炉步志
    alt_titles: []
    genre: 杂记散文
    date:
      text: 永州贬谪期间，确切年份不详
      precision: 未知
    place: 永州
    context: 由永州北郭地名铁炉步而炉亡已久、名存实亡发端，讽世人名实不相副、求其义于其末的社会现象，是小题大作的杂文名篇。
    attribution: 确凿
    excerpt: 江之浒，凡舟可縻而上下者曰步。永州北郭有步，曰铁炉步。
    text_display: excerpt
    themes: [杂文, 名实之辨]
    influence: 因小见大的杂记体示范。
    source_ids: [src-jts-vol160]
  - work_id: deng-liuzhou-chenglou
    title: 登柳州城楼寄漳汀封连四州
    alt_titles: []
    genre: 七言律诗
    date:
      text: 约815年初抵柳州
      year: 815
      precision: 约
    place: 柳州城楼
    context: 元和十年例移刺史后初登城楼，寄刘禹锡（连州）、韩泰（漳州）、韩晔（汀州）、陈谏（封州）四位同难战友。岭树重遮千里目江流曲似九回肠，把共来百越文身地的离散写得沉痛之极。
    attribution: 确凿
    excerpt: 城上高楼接大荒，海天愁思正茫茫。惊风乱飐芙蓉水，密雨斜侵薜荔墙。岭树重遮千里目，江流曲似九回肠。共来百越文身地，犹自音书滞一乡。
    text_display: full
    themes: [贬谪, 友朋离散]
    influence: 唐代贬谪律诗的压卷之作，与让播事件同一背景下的诗证。
    confidence: 存疑
    dispute: 系年从元和十年夏秋抵柳州后通说。
    source_ids: [src-qts-liuzongyuan, src-jts-vol160]
  - work_id: bie-she-di-zong-yi
    title: 别舍弟宗一
    alt_titles: []
    genre: 七言律诗
    date:
      text: 约816年
      year: 816
      precision: 约
    place: 柳州
    context: 送堂弟柳宗一离开柳州赴江陵，零落残魂倍黯然起笔，一身去国六千里万死投荒十二年总括半生贬谪。
    attribution: 确凿
    excerpt: 零落残魂倍黯然，双垂别泪越江边。一身去国六千里，万死投荒十二年。桂岭瘴来云似墨，洞庭春尽水如天。欲知此后相思梦，长在荆门郢树烟。
    text_display: full
    themes: [离别, 贬谪]
    influence: 万死投荒一联为贬谪文学中最沉重的自况。
    confidence: 存疑
    dispute: 系年诸家有元和十一年（816）与十一年前后之别。
    source_ids: [src-qts-liuzongyuan]

