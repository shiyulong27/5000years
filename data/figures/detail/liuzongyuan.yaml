relations:
  - relation_type: 挚友
    target_id: liuyuxi
    direction: 双向
    period:
      text: 约803年同为御史订交，历永贞同贬至819年柳卒，生死之交
      year: 803
      range_end: 819
      precision: 范围
    evidence: 正史铁证：旧唐书柳传载元和十年刘禹锡得播州，宗元谓所亲曰禹锡有母年高……吾于禹锡为执友胡忍见其若是，即草章奏请以柳州授禹锡自往播州，会裴度亦奏禹锡终易连州；刘传同卷互见裴度奏母老改连州事。旧唐书史臣曰并以「宗元、禹锡」并举论其文学。登柳州城楼寄漳汀封连四州即寄禹锡之作。
    source_ids: [src-jts-vol160, src-qts-liuzongyuan]
  - relation_type: 社群
    target_id: hanyu
    direction: 双向
    period:
      text: 同倡古文的同道，交往见于贞元元和之际
      year: 800
      range_end: 819
      precision: 范围
    evidence: 韩柳并称为古文运动双璧。新唐书载韩愈评其文曰雄深雅健似司马子长崔蔡不足多也；柳殁后柳人庙于罗池，愈因碑以实之。但须并记另一面：旧唐书韩传将此事列为愈之纰缪——若南人妄以柳宗元为罗池神而愈撰碑以实之，与讳辨毛颖传同遭史臣非议，即韩愈本人因此碑受到传统史学批评。
    confidence: 确定
    source_ids: [src-xts-vol168, src-jts-vol160]
  - relation_type: 同僚
    target_id: liuyuxi
    direction: 双向
    period:
      text: 803—805年同朝为御史、同预永贞革新
      year: 803
      range_end: 805
      precision: 范围
    evidence: 二人同为监察御史（贞元十九年），永贞间同引禁中图事，时号二王刘柳；败后同贬司马，元和十年同例移刺史。挚友条之外单列同僚履历层。
    source_ids: [src-jts-vol160, src-xts-vol168]

reception:
  - era: 同时代
    evaluator: 裴行立与柳州士民
    quote: 观察使裴行立为营护其丧及妻子还于京师，时人义之。
    text_display: excerpt
    comment: 旧唐书所记身后哀荣，营护还葬出自非亲故的观察使，时人义之为同时代人对其人格的直接裁定。
    source_ids: [src-jts-vol160]
  - era: 同时代
    evaluator: 江岭间进士群体
    quote: 凡经其门，必为名士。
    text_display: excerpt
    comment: 旧唐书载江岭间为进士者不远数千里皆随宗元师法，衡阳以南进士多以宗元为师，是其晚年文坛影响的实录。
    source_ids: [src-jts-vol160]
  - era: 历代批评
    evaluator: 旧唐书史臣
    quote: 贞元、太和之间，以文学耸动搢绅之伍者，宗元、禹锡而已。……而蹈道不谨，昵比小人，自致流离，前隳素业。
    text_display: excerpt
    comment: 五代史臣才高而党败的双重评价，代表传统史学对永贞党争的政治批评立场；新唐书赞曰亦责宗元等橈节从之徼幸一时。两种批评与后世对其文学的推崇长期并存。
    source_ids: [src-jts-vol160, src-xts-vol168]
  - era: 历代批评
    evaluator: 韩愈
    quote: 雄深雅健，似司马子长，崔、蔡不足多也。
    text_display: excerpt
    comment: 新唐书所录韩愈对柳文的最高评价，以司马迁拟之，为韩柳并尊格局的最早权威判断之一。
    source_ids: [src-xts-vol168]
  - era: 近现代学术
    evaluator: 学界综述
    quote: ""
    text_display: none
    comment: 近现代研究聚焦永贞革新的政治评价再检讨、柳的唯物主义无神论思想（贞符天说封建论）、永州八记的系年与文体开创、韩柳优劣论的历史变迁等议题；具体论著引文须取得许可后补入，本卷暂作中立转述。
    source_ids: []
  - era: 教科书与公共文化
    evaluator: 通用语文教育与大众传播
    quote: ""
    text_display: none
    comment: 小石潭记江雪捕蛇者说黔之驴等长期入选中小学语文教材，唐宋八大家概念中位列首位（按生年）。柳侯祠为全国重点文物保护单位。教材版本信息随学期变动，录入时须另行核验当期篇目。
    source_ids: []
  - era: 影视与网络
    evaluator: 大众传播综述
