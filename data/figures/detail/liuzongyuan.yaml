    source_ids: [src-xts-vol168]
  - stage: 永州十年
    stage_order: 10
    title: 例移柳州刺史，请以柳州授禹锡自往播州
    date:
      text: "815年"
      year: 815
      precision: 精确
    place: 长安诏下
    summary: 元和十年例移为柳州刺史。时刘禹锡得播州刺史，制书下，宗元谓所亲曰：禹锡有母年高今为郡蛮方西南绝域往复万里，如母子异方便为永诀，吾于禹锡为执友胡忍见其若是。即草章奏请以柳州授禹锡自往播州。会裴度亦奏其事，禹锡终易连州。
    source_ids: [src-jts-vol160, src-xts-vol168]

