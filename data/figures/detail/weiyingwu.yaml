# |---|---|---|
# | 名号籍贯 | 韋應物京兆長安人 | 确定；无正史本传，此为正史外最权威小传 |
# | 三卫郎经历 | 少以三衛郎事明皇晚更折節讀書 | 确定 |
# | 历职 | 永泰中授京兆功曹遷洛陽丞；大曆十四年自鄠令制除櫟陽令以疾辭不就；建中三年拜比部員外郎出爲滁州刺史；久之調江州追赴闕改左司郎中復出爲蘇州刺史 | 确定；惟诸任起讫年份小传多不系年，仅大历十四年有明确纪年 |
# | 性情交游 | 應物性高潔所在焚香埽地而坐唯顧況劉長卿丘丹秦系皎然之儔得廁賓客與之酬倡 | 确定；顾况刘长卿等未入 figures.yaml 故不建关系 |
# | 诗史定位 | 其詩閑澹簡遠人比之陶潛稱陶韋云 | 确定；陶韦并称为唐人公论而非后人追封 |
#
# | 事实点 | 唐才子传层（《唐才子傳/卷四》维基文库实取） | 结论与置信 |
# |---|---|---|
# | 少年气质 | 應物京兆人也尚俠初以三衛郎事玄宗及崩始悔折節讀書 | 笔记层确定；「及崩」指玄宗崩（762），悔悟折节系于是年后 |
# | 性情 | 為性高潔鮮食寡欲所居必焚香掃地而坐冥心象外 | 笔记层确定 |
# | 历职异文 | 天寶時扈從遊幸；永泰中任洛陽丞遷京兆府功曹；大曆十四年自鄠縣令制除櫟陽令以疾辭歸寓善福寺精舍；建中二年由前資除比部員外郎出為滁州刺史；居傾之改江州刺史追赴闕改左司郎中或媢其進媒孽之貞元初又出為蘇州刺史罷居永定齋心屏除人事 | 笔记层；与全唐诗小传两处抵牾——功曹洛阳丞先后互倒、比部员外郎系年建中二/三年之差，均按存疑著录 |
# | 太仆少卿条 | 大和中以太僕少卿兼御史中丞為諸道鹽鐵轉運江淮留後 | 年代抵牾存疑；韦应物卒于贞元间，「大和中」（827—835）于时序不可能，学界视为辛文房误记 |
# | 自述诗 | 晚歲逢楊開府贈詩言事曰少事武皇帝無賴恃恩私……讀書事已晚把筆學題詩 | 作品文本层；其少年豪纵的自供状 |
# | 论云 | 獨應物馳驟建安以還各有風韻自成一家之體清深雅麗雖詩人之盛亦罕其倫 | 元人批评层 |
#
# | 事实点 | 白居易书层（《與元九書》维基文库实取，全唐文卷675/白氏長慶集卷45系统） | 结论与置信 |
# |---|---|---|
# | 白居易评语 | 如近歲韋蘇州歌行才麗之外頗近興諷其五言詩又高雅閑澹自成一家之體今之秉筆者誰能及之然當蘇州在時人亦未甚愛重必待身後然人貴之 | 确定（逐字实取）；同时代人评韦的第一手文献 |
#
# | 事实点 | 作品文本层（维基文库单篇页与全唐诗卷186/187/188/192/193实取） | 结论与置信 |
# |---|---|---|
# | 诗歌文本 | 滁州西涧寄李儋元锡秋夜寄丘二十二员外淮上喜会梁川故人赋得暮雨送李胄观田家拟古诗十二首寺居独夜寄崔主簿郡斋雨中与诸文士燕集与友生野饮效陶体效陶彭泽燕李录事 | 通行本层；各篇异文一作随页注录，未深校善本 |
