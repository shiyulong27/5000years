reception:
  - era: 同时代
    evaluator: 白居易《与元九书》
    quote: 如近岁韦苏州歌行，才丽之外，颇近兴讽；其五言诗又高雅闲澹，自成一家之体，今之秉笔者谁能及之！然当苏州在时，人亦未甚爱重，必待身后，然人贵之。
    text_display: excerpt
    comment: 元和十年白居易贬江州司马后致元稹书中逐字实取的评语，代表同时代人对韦应物歌行兴讽与五言闲澹两面价值的最高定位，并记录了韦诗身前寂寞身后贵的接受事实。
    confidence: 确定
    source_ids: [src-bai-yuanyujiushu]
  - era: 历代批评
    evaluator: 辛文房《唐才子传》卷四论云
    quote: 诗律自沈、宋之下，日益靡嫚……独应物驰骤建安以还，各有风韵，自成一家之体，清深雅丽，虽诗人之盛，亦罕其伦。
    text_display: excerpt
    comment: 元人将韦应物置于沈宋靡嫚之后的诗史低点作对照，许其驰骤建安自成一家，是通代视野下的经典化判断。
    confidence: 确定
    source_ids: [src-tangcaizizhuan]
  - era: 历代批评
    evaluator: 苏轼（转述层）
    quote: ""
    text_display: none
    comment: 相传苏轼有乐天长短三千首却爱韦郎五字诗之句，以韦应物五言为学诗正途；该句本轮未能在维基文库实取原文，按转述层著录，出处待核后再升格为引文。
    confidence: 存疑
    dispute: 所引诗句出处篇目待核，暂不作信据使用。
    source_ids: []
  - era: 近现代学术
    evaluator: 学界综述
    quote: ""
    text_display: none
    comment: 近现代研究将其纳入陶潜——王维——韦应物——柳宗元的山水田园诗谱系（陶王韦柳并称），聚焦其三卫郎到刺史的人生断层与诗风关系、韦集版本源流等议题；具体论著引文须取得许可后补入，本卷暂作中立转述。唐人已有其诗闲澹简远人比之陶潜称陶韦云（全唐诗小传）的先声。
    source_ids: []
  - era: 教科书与公共文化
    evaluator: 通用语文教育与大众传播
    quote: ""
    text_display: none
    comment: 滁州西涧长期入选语文教材与大众读本，野渡无人舟自横成为国民名句；秋夜寄丘二十二员外亦常见于启蒙读物。教材篇目随学期变动，录入时须另行核验当期版本。
    source_ids: []
  - era: 影视与网络
    evaluator: 大众传播综述
    quote: ""
    text_display: none
    comment: 影视剧中韦应物多为背景式文人形象，无可靠专门作品可引；网络传播集中于滁州西涧与邑有流亡愧俸钱两类名句，暂无可信专门条目可依。
    source_ids: []

