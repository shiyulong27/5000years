id: weiyingwu

profile:
  courtesy_name: （史无明载）
  art_name: 韦苏州（任所尊称）
  aliases: [韦左司, 韦江州, 陶韦]
  gender: 男
  ethnicity: ""
  ancestry: 京兆杜陵（据《元和姓纂》韦氏京兆房通说，小传作京兆长安人）
  birthplace: 京兆长安
  death_place: 无确载（罢苏州刺史后罢居永定，事迹渐晦）
  offices: [三卫郎, 洛阳丞, 京兆府功曹, 鄠县令, 栎阳令（以疾辞不就）, 比部员外郎, 滁州刺史, 江州刺史, 左司郎中, 苏州刺史]
  fields: [文学]
  roles: [诗人]
  summary: 山水田园诗继陶潜王维之后的关键一环，唐人称陶韦；「邑有流亡愧俸钱」的仁者之言与「高雅闲淡自成一家之体」的诗风，使他成为大历诗坛最干净的一个人。

timeline:
  # ── 阶段一：京兆少年与三卫郎侍玄宗 ────────────────
  - stage: 京兆少年与三卫郎侍玄宗
    stage_order: 1
    title: 出生于京兆长安
    date:
      text: 约737年（推定）
      year: 737
      precision: 约
    place: 京兆长安
    summary: 韦应物生于京兆长安。生年无任何史料明载，学界据天宝中已得侍卫之职及其自述「与君十五侍皇闱」倒推，通说约开元二十五年前后（约737）。
    confidence: 存疑
    dispute: 生年为纯推定值，诸家年谱出入数年；本卷从通说约737著录。
    source_ids: [src-qts-weiyingwu]
  - stage: 京兆少年与三卫郎侍玄宗
    stage_order: 2
    title: 少以三卫郎事玄宗，扈从游幸
    date:
      text: 天宝年间，具体起讫不详
      year: 742
      range_end: 755
      precision: 范围
    place: 长安宫廷
    summary: 小传载少以三卫郎事明皇，唐才子传谓尚侠，天宝时扈从游幸。《燕李录事》自述与君十五侍皇闱，晓拂炉烟上赤墀……雪下骊山沐浴时；《逢杨开府》更自供少事武皇帝，无赖恃恩私，身作里中横，家藏亡命儿——是少年豪纵的亲笔供状。
    source_ids: [src-qts-weiyingwu, src-tangcaizizhuan]

  # ── 阶段二：安史乱后折节读书 ────────────────────
  - stage: 安史乱后折节读书
    stage_order: 3
    title: 玄宗崩，始悔，折节读书
    date:
      text: "762年玄宗崩之后"
      year: 762
      precision: 约
    place: 长安
    summary: 唐才子传载初以三卫郎事玄宗，及崩，始悔，折节读书——小传则总括为晚更折节读书。三卫建制随天宝乱世瓦解，其凭荫入仕的旧路断绝，遂由斗鸡走马的贵游少年转向案头灯火。
    confidence: 存疑
    dispute: 悔悟折节的确切年份笔记只系于玄宗崩后，具体转变过程无考。
    source_ids: [src-tangcaizizhuan, src-qts-weiyingwu]
  - stage: 安史乱后折节读书
    stage_order: 4
    title: 折节读书，行迹晦暗不明
    date:
      text: 约763—765年之间
      year: 763
      range_end: 765
      precision: 范围
    place: 长安一带
    summary: 自述读书事已晚，把笔学题诗，两府始收迹，南宫谬见推——由武职余荫转入文官序列的过渡期，史料几近空白，只能从其晚年追忆诗中钩沉。
    confidence: 存疑
    dispute: 此期无直接记载，行迹系据《逢杨开府》追述逆推。
    source_ids: [src-tangcaizizhuan]

  # ── 阶段三：州县与台省历职 ──────────────────────
  - stage: 州县与台省历职
    stage_order: 5
    title: 永泰中历洛阳丞与京兆府功曹
    date:
      text: 永泰年间（约765—766）
      year: 765
      range_end: 766
      precision: 范围
    place: 洛阳、长安
    summary: 全唐诗小传作永泰中授京兆功曹迁洛阳丞，唐才子传作永泰中任洛阳丞迁京兆府功曹——两源对两官先后记载互倒，孰是难决，要之永泰中已再入仕途。
    confidence: 存疑
    dispute: 功曹与洛阳丞的先后次序两说互倒；本卷从小传著录而不下断语。
    source_ids: [src-qts-weiyingwu, src-tangcaizizhuan]
  - stage: 州县与台省历职
    stage_order: 6
    title: 大历十四年自鄠令制除栎阳令，以疾辞归，寓善福寺精舍
    date:
      text: "779年"
      year: 779
      precision: 精确
    place: 鄠县、栎阳、长安沣上善福寺
    summary: 小传载大历十四年自鄠令制除栎阳令，以疾辞不就；唐才子传补出辞归后的去向——寓善福寺精舍。卷中沣上、善福寺诸诗即此期前后所作，焚香扫地而坐的生活方式已成常态。
    source_ids: [src-qts-weiyingwu, src-tangcaizizhuan]
  - stage: 州县与台省历职
    stage_order: 7
    title: 建中中拜比部员外郎
    date:
      text: 约781—782年之间
      year: 781
      range_end: 782
      precision: 范围
    place: 长安
    summary: 由前资除比部员外郎，重回台省。系年两源有一年之差：全唐诗小传作建中三年，唐才子传作建中二年。
    confidence: 存疑
    dispute: 比部员外郎之除，小传系建中三年、唐才子传系建中二年，本卷按范围著录。
    source_ids: [src-qts-weiyingwu, src-tangcaizizhuan]

  # ── 阶段四：三州刺史 ────────────────────────────
  - stage: 三州刺史
    stage_order: 8
    title: 出为滁州刺史
    date:
      text: 约782—783年之间
      year: 782
      range_end: 783
      precision: 范围
    place: 滁州
    summary: 出为滁州刺史，是其第一个方镇之任。滁州西涧、寄李儋元锡等名作皆系于此期前后。
    confidence: 存疑
    dispute: 出刺滁州的具体年份小传不系年，据比部员外郎除年与滁州任次第推定。
    source_ids: [src-qts-weiyingwu]
  - stage: 三州刺史
    stage_order: 9
    title: 滁州任上作滁州西涧等
    date:
      text: 约783年（滁州任期内，系年从通说）
      year: 783
      precision: 约
    place: 滁州西涧
    summary: 独怜幽草涧边生，上有黄鹂深树鸣。春潮带雨晚来急，野渡无人舟自横——幽草野渡的自况成为中唐山水绝句的极则。同期的寄李儋元锡写出邑有流亡愧俸钱，身多疾病思田里与闻道欲来相问讯，西楼望月几回圆皆刺史任上的仁者之言。
    confidence: 存疑
    dispute: 滁州西涧与寄李儋元锡均无原注系年，从滁州任上通说；亦有学者系寄李儋元锡于江州任。
    source_ids: [src-qts-weiyingwu]
  - stage: 三州刺史
    stage_order: 10
    title: 改江州刺史
    date:
      text: 约784—785年之间
      year: 784
      range_end: 785
      precision: 范围
    place: 江州
    summary: 居倾之改江州刺史（唐才子传语），小传作久之调江州。由滁徙江，仍在江南西道地方任上。
    confidence: 存疑
    dispute: 徙江州年份系据滁州任期与后续赴阙时间倒推。
    source_ids: [src-qts-weiyingwu, src-tangcaizizhuan]
  - stage: 三州刺史
    stage_order: 11
    title: 追赴阙，改左司郎中
    date:
      text: 约786—787年之间
      year: 786
      range_end: 787
      precision: 范围
    place: 长安
    summary: 追赴阙改左司郎中；唐才子传特书或媢其进，媒孽之——升迁遭人中伤，为再度外放埋下伏线。世称韦左司由此。
    confidence: 存疑
    dispute: 除左司郎中年份无载，据贞元纪元前后仕历节奏推定。
    source_ids: [src-qts-weiyingwu, src-tangcaizizhuan]
  - stage: 三州刺史
    stage_order: 12
    title: 贞元初复出为苏州刺史
    date:
      text: 约787—788年之间（贞元初）
      year: 787
      range_end: 788
      precision: 范围
    place: 苏州
    summary: 复出为苏州刺史，世称韦苏州由此定名。郡斋雨中与诸文士燕集即苏州任上之作——兵卫森画戟，燕寝凝清香，而自惭居处崇，未睹斯民康，宴集中仍不忘民瘼。
    confidence: 存疑
    dispute: 始刺苏州年份诸谱互有出入，从贞元初通说。
    source_ids: [src-qts-weiyingwu]
  - stage: 三州刺史
    stage_order: 13
    title: 苏州任上与文士酬倡
    date:
      text: 约788—790年之间
      year: 788
      range_end: 790
      precision: 范围
    place: 苏州
    summary: 小传载性高洁，唯顾况、刘长卿、丘丹、秦系、皎然之俦得厕宾客，与之酬倡——其交游圈尽在方外与诗客之间，吴中盛文史群彦今汪洋即此时风会。
    confidence: 存疑
    dispute: 具体酬倡年份无考，按苏州任内框定。
    source_ids: [src-qts-weiyingwu]

  # ── 阶段五：罢官寓居与事迹渐晦 ──────────────────
  - stage: 罢官寓居与事迹渐晦
    stage_order: 14
    title: 罢苏州刺史，罢居永定
    date:
      text: 约790—791年之后（推定）
      year: 790
      range_end: 791
      precision: 范围
    place: 永定（一说苏州永定寺）
    summary: 罢郡后贫无所归，寓居永定，斋心屏除人事——唐才子传八字写尽其晚境。身后丧葬之事史无一字。
    confidence: 存疑
    dispute: 罢任与寓居年份系据贞元仕历推定；寓居地永定通说为苏州永定寺，亦有异说。
    source_ids: [src-tangcaizizhuan]
  - stage: 罢官寓居与事迹渐晦
    stage_order: 15
    title: 卒年无确载，约贞元末
    date:
      text: 约791年后（推定）
      year: 791
      precision: 约
    place: ""
    summary: 韦应物无正史本传，卒年无确载。学界据其贞元间犹在世的最晚行迹，推定卒于贞元末年（约791年之后），享年约五十五六。
    confidence: 存疑
    dispute: 卒年为纯推定值，诸家有贞元七八年前后至贞元末诸说；唐才子传大和中以太仆少卿兼御史中丞为诸道盐铁转运江淮留后一条与卒年抵牾（大和系827—835年号），学界公认为辛文房误记，本卷不采。
    source_ids: [src-qts-weiyingwu, src-tangcaizizhuan]

works:
  - work_id: chu-zhou-xi-jian
    title: 滁州西涧
    alt_titles: [西涧]
    genre: 七言绝句
    date:
      text: 约783年，滁州任内（通说）
      year: 783
      precision: 约
    place: 滁州西涧
    context: 幽草黄鹂春潮野渡，末句野渡无人舟自横以无所求待的姿态自况，是中唐山水绝句的极则。
    attribution: 确凿
    excerpt: 独怜幽草涧边生，上有黄鹂深树鸣。春潮带雨晚来急，野渡无人舟自横。
    text_display: full
    themes: [山水, 闲淡, 自况]
    influence: 入选历代选本与语文教材，野渡无人舟自横成为国民名句；宋人已以其诗镇渡江风波（冷斋夜话所记，笔记层）。
    confidence: 确定
    dispute: 维基文库单篇页注幽草一作芳草、生一作行、深树一作处，文本有小异而无碍句意。
    source_ids: [src-qts-weiyingwu]

  - work_id: ji-li-dan-yuan-xi
    title: 寄李儋元锡
    alt_titles: []
    genre: 七言律诗
    date:
      text: 刺史任上（滁州说为主流，一说江州）
      year: 783
      precision: 约
    place: 滁州（一说江州）
    context: 世事茫茫难自料写乱后士人的普遍惶惑，邑有流亡愧俸钱则是刺史对治下饥民的道德自省，被后世目为仁者之言。
    attribution: 确凿
    excerpt: 身多疾病思田里，邑有流亡愧俸钱。闻道欲来相问讯，西楼望月几回圆。
    text_display: excerpt
    themes: [忧民, 官德, 怀友]
    influence: 宋代即传为名篇；邑有流亡愧俸钱成为历代循吏自警的格言。
    confidence: 确定
    dispute: 受诗对象李儋元锡生平简略；系年有滁州、江州两说。
    source_ids: [src-qts-weiyingwu]

  - work_id: qiu-ye-ji-qiu-er-shi-er-yuan-wai
    title: 秋夜寄丘二十二员外
    alt_titles: [秋夜寄邱员外]
    genre: 五言绝句
    date:
      text: 创作年代无定说
      precision: 未知
    place: ""
    context: 前两句写自己秋夜散步咏凉天，后两句悬想临平山中的隐者应未眠——隔地的悬想使二十字有两地空翠。
    attribution: 确凿
    excerpt: 怀君属秋夜，散步咏凉天。山空松子落，幽人应未眠。
    text_display: full
    themes: [怀友, 秋夜, 隐逸]
    influence: 五绝中以淡语致远的典范，历代选本必收。
    source_ids: [src-qts-weiyingwu]

