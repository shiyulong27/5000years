- id: fengdao-shizong-0954
  date: "0954"
  title: 周世宗北征，冯道切谏
  category: 政治
  tags: [后周, 冯道, 北汉, 边疆]
  importance: 4
  summary: 后周世宗即位后，北汉刘旻进攻上党，冯道认为新君即位且国有大丧而切谏出兵；柴荣仍亲征并击退北汉与辽军。
  confidence: 确定
  dispute: 《新五代史·冯道传》记载冯道切谏及世宗不令其随征；“周世宗斥冯道”是后世篇名的评价性概括，史料可直接核实的是劝谏、亲征和战果，不补造具体斥责对白。
  sources: [新五代史·冯道传, 旧五代史·冯道传]
