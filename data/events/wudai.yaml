- id: tang-伶官干政-0923
  date: "0923"
  title: 后唐伶人参与政务
  category: 政治
  tags: [后唐, 伶官, 权力结构]
  importance: 4
  summary: 后唐庄宗长期亲近伶人，景进等出入宫掖并参与军机国政，伶人由此获得超出宫廷演出的政治影响。
  confidence: 有争议
  dispute: 《新五代史·伶官传》以庄宗一朝连续叙事记载伶人用事及政局后果，未给每段经历独立公历年份；此处以923年后唐建立作为展示锚点，不补造具体日期。
  related_dynasties: [wudai, houtang]
  sources: [新五代史·伶官传]

