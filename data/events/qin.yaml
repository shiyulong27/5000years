  title: 秦灭六国，统一中国
  category: 政治
  importance: 5
  summary: |
    秦王政灭齐，天下一统，自称始皇帝。废分封行郡县，
    书同文、车同轨、统一度量衡，中央集权制度自此确立。
  confidence: 确定
  sources: [史记·秦始皇本纪]

