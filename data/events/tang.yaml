- id: tang-618
  date: "0618"
  title: 李渊建唐
  category: 政治
  importance: 5
  summary: 李渊于长安称帝，国号唐。隋末群雄并起，唐室逐步削平割据，一统天下。
  confidence: 确定
  sources: [旧唐书·高祖纪]

- id: xuanwu-626
  date: "0626"
  title: 玄武门之变，翌年改元贞观
  category: 政治
  importance: 4
  summary: 李世民发兵玄武门，杀兄建成、弟元吉，旋即位，是为贞观之治之始。
  confidence: 确定
  sources: [旧唐书·太宗纪]

- id: xuanzang-west-629
  date: "0629"
  title: 玄奘西行
  category: 文化
  importance: 4
  summary: 玄奘自长安西行求法，历十七年取经归来，译经传法，著《大唐西域记》。
  confidence: 有争议
  dispute: 西行年份诸传不一，此处从贞观三年说。

- id: wuzetian-690
  date: "0690"
  title: 武则天称帝，改国号周
  category: 政治
  importance: 5
  summary: 武则天废唐睿宗自立，改国号为周，为中国历史唯一正统女皇帝。
  confidence: 确定
  sources: [旧唐书·则天皇后纪]

- id: kaiyuan-713
  date: "0713"
  title: 开元纪元始
  category: 政治
  importance: 4
  summary: 唐玄宗改元开元，励精图治，社会经济文化臻于极盛，史称开元盛世。
  confidence: 确定

- id: anshi-755
  date: "0755"
  title: 安史之乱爆发
  category: 战争
  importance: 5
  summary: 安禄山、史思明起兵范阳，唐由盛转衰，此后藩镇割据、国势日蹙。
  confidence: 确定
  sources: [旧唐书·玄宗纪]

- id: two-tax-780
  date: "0780"
  title: 两税法行
  category: 经济
  importance: 4
  summary: 宰相杨炎废租庸调，行两税法，按资产征税、分夏秋两征，为唐后期财政之基。
  confidence: 确定
  sources: [旧唐书·食货志]

- id: huichang-845
  date: "0845"
  title: 会昌灭佛
  category: 文化
  importance: 3
  summary: 唐武宗会昌年间下诏毁佛，拆寺还俗僧尼，为唐代限佛之最。
  confidence: 确定

- id: huangchao-875
  date: "0875"
  title: 黄巢起义
  category: 战争
  importance: 4
  summary: 黄巢聚众起义，转战大半个中国，攻陷长安，虽败而唐室元气大伤。
  confidence: 确定
