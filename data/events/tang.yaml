- id: tang-618
  date: "0618"
  title: 李渊建唐
  category: 政治
  importance: 5
  summary: 李渊于长安称帝，国号唐。隋末群雄并起，唐室逐步削平割据，一统天下。
  confidence: 确定
  sources: [旧唐书·高祖纪]

- id: xuanwu-626
  date: "0626"
  title: 玄武门之变，翌年改元贞观
  category: 政治
  importance: 4
  summary: 李世民发兵玄武门，杀兄建成、弟元吉，旋即位，是为贞观之治之始。
  confidence: 确定
  sources: [旧唐书·太宗纪]

- id: xuanzang-west-629
  date: "0629"
  title: 玄奘西行
  category: 文化
  importance: 4
  summary: 玄奘自长安西行求法，历十七年取经归来，译经传法，著《大唐西域记》。
  confidence: 有争议
  dispute: 西行年份诸传不一，此处从贞观三年说。

- id: fangmou-duduan
  date: "0630"
  title: 房谋杜断，贞观名相
  category: 政治
  tags: [贞观之治, 典故]
  importance: 4
  summary: 宰相房玄龄善于谋划，杜如晦善于决断，二人同心辅佐唐太宗开创贞观盛世，史称「房谋杜断」。
  confidence: 确定
  sources: [旧唐书·房玄龄传]

- id: wencheng-tibet
  date: "0641"
  title: 文成公主入藏
  category: 政治
  tags: [唐蕃, 民族, 和亲]
  importance: 4
  summary: 唐太宗遣文成公主嫁吐蕃（tǔ bō）赞普松赞干布（sōng zàn gān bù），带去先进中原文化与技术，促进汉藏文化交流。
  confidence: 确定
  sources: [旧唐书·吐蕃传]

- id: weizheng-zhijian
  date: "0643"
  title: 魏征逝世，太宗痛失人镜
  category: 政治
  tags: [贞观之治, 典故]
  importance: 4
  summary: 谏议大夫魏征直言敢谏几数百事，卒后太宗恸哭称「以铜为镜可以正衣冠，以人为镜可以明得失，魏征没朕亡一镜矣」。
  confidence: 确定
  sources: [旧唐书·魏征传]

