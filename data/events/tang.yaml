  title: 武则天称帝，改国号周
  category: 政治
  importance: 5
  summary: 武则天废唐睿宗自立，改国号为周，为中国历史唯一正统女皇帝。
  confidence: 确定
  sources: [旧唐书·则天皇后纪]

- id: kaiyuan-713
  date: "0713"
  title: 开元纪元始
  category: 政治
  importance: 4
  summary: 唐玄宗改元开元，励精图治，社会经济文化臻于极盛，史称开元盛世。
  confidence: 确定

- id: libai-tuoxue
  date: "0742"
  title: 李白供奉翰林，高力士脱靴
  category: 文化
  tags: [李白, 典故]
  importance: 4
  summary: 李白入长安供奉翰林，玄宗沉醉沉香亭召作《清平调》，李白醉中命权宦高力士脱靴，彰显诗仙傲骨。
  confidence: 有争议
  dispute: |
    李白奉诏入京任翰林供奉在天宝元年（742），但「命高力士脱靴、
    杨国忠研墨」系后世野史轶闻，正史不载；杨国忠当时亦未显贵。
  sources: [旧唐书·李白传]

