- id: luoyang-relocate-494
  date: "0494"
  title: 北魏孝文帝迁都洛阳
  category: 政治
  importance: 4
  summary: 孝文帝自平城迁都洛阳，禁胡服、断北语、改汉姓，全面汉化，加速民族融合。
  confidence: 确定
  dispute: |
    迁都时点有 493 与 494 两说。孝文帝太和十七年（493）正式下诏，
    次年（494）大驾至于洛阳并定都，此处取定都之 494 说。

