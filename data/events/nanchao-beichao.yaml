  title: 刘裕代晋，刘宋建立
  category: 政治
  importance: 4
  summary: 刘裕废晋恭帝自立，国号宋，南朝自此始。南方政权由门阀共治转向寒门武人当权。
  confidence: 确定
  sources: [宋书·武帝本纪]

- id: beiwei-unify-439
