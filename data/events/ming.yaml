- id: zhuyuanzhang-ming-1368
  date: "1368"
  title: 朱元璋建明，定都应天
  category: 政治
  importance: 5
  summary: 朱元璋于应天府（今南京）称帝，国号大明，建元洪武，同年收复大都。
  confidence: 确定
  sources: [明史·太祖纪]

