- id: ming-1368
  date: "1368"
  title: 朱元璋建明，定都应天
  category: 政治
  importance: 5
  summary: 朱元璋即帝位于应天（今南京），国号明，是为明太祖。废丞相、设厂卫，皇权极于一人。
  confidence: 确定
  sources: [明史·太祖纪]

