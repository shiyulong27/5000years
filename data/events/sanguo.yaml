  title: 曹植七步成诗
  category: 文化
  tags: [建安文学, 典故]
  importance: 4
  summary: 魏文帝曹丕逼迫弟曹植七步之内作诗，曹植应声作「煮豆燃豆萁（qí），豆在釜中泣」，表达兄弟相残之悲痛。
  confidence: 传说
  dispute: 典故源自《世说新语·文学》，正史《三国志》未载，具体地点年代系传说推定。

