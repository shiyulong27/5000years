- id: jieting-jiji
  related_dynasties: [shu, wei]
  date: "0228"
  title: 街亭失守与马谡被处置
  category: 战争
  tags: [蜀汉, 北伐, 街亭, 马谡]
  importance: 4
  summary: 马谡违背诸葛亮部署，依托南山而不据城；魏将张郃断绝蜀军汲水道路并将其击破，诸葛亮退回汉中，随后追究马谡责任。
  confidence: 有争议
  dispute: |
    《三国志·张郃传》记马谡依阻南山、张郃断绝汲道；《诸葛亮传》记“戮谡以谢众”，《马良传》附马谡传则记马谡下狱物故、诸葛亮为之流涕。
    本条保留街亭失守和处置的基本过程，不用“挥泪斩马谡”合并不同记载，也不把“舍水上山”写作原文逐字表述。
  sources: [三国志·张郃传, 三国志·诸葛亮传, 三国志·马良传附马谡传]

