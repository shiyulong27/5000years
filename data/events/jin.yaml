- id: zutixibei-320
  date: "0320"
  title: 祖逖北伐
  category: 战争
  importance: 3
  summary: 中流击楫，誓复中原。收复黄河以南部分失地，惜功败垂成。
  confidence: 有争议
  dispute: |
    北伐为317–321年间的过程，非单一事件；此条系于320，
    即黄河以南大体收复之时。《晋书》本传编年与《通鉴》
    略有出入。

- id: wangxizhi-353
  date: "0353-03-03"
  title: 王羲之作《兰亭集序》
  category: 文化
  importance: 5
  summary: 会稽山阴之兰亭修禊，序文书法并称绝品，后世奉为行书第一。
  confidence: 有争议
  dispute: |
    日期从永和九年上巳修禊的传统说法（另有永和十一年等少数说）。
    序文与书法真伪自南朝以降屡有论辩，以郭沫若与高二适的
    「兰亭论辩」最著；真迹传随葬昭陵，存世皆唐摹本。
  sources: [晋书·王羲之传]

