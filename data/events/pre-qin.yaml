- id: confucius
  date: "-0551"
  title: 孔子生
  category: 文化
  importance: 5
  summary: 儒家之祖。其学说此后两千余年为中国思想之主干。
  confidence: 有争议
  dispute: |
    生年有前551与前552两说：《公羊》《穀梁》系于鲁襄公二十一年，
    《史记》系于二十二年。后世多从《史记》。

- id: warring-states
  date: "-0475"
  title: 战国之世始
  category: 战争
  importance: 4
  summary: 七雄并立，百家争鸣。中国思想史上最活跃的时代。
  confidence: 有争议
  dispute: |
    战国起点为后世史家约定：前475（《史记》六国表）、前481
    （《春秋》绝笔之翌）、前403（三家分晋受封为侯，《通鉴》
    所始）诸说并存。此处采前475说。

