- id: xia-founding
  date: "-2070"
  title: 禹传位于启，夏朝建立
  category: 政治
  tags: [制度, 王朝更替]
  importance: 5
  summary: 世袭制取代禅让制，中国进入王朝时代。
  confidence: 有争议
  dispute: |
    三重争议叠加：
    一、夏是否为信史。二里头遗址被多数中国学者视为夏文化遗存，
    但迄今未出土自证性文字，西方学界普遍持保留态度。
    二、年代。此处采夏商周断代工程说（前2070），该工程结论
    本身在学界争议甚大，另有前2100、前1900 等说。
    三、禅让转世袭的过程。《史记》称启继禹位，
    《竹书纪年》则载「益干启位，启杀之」，与禅让叙事相悖。
  sources: [史记·夏本纪, 竹书纪年]

