- id: huangdi-chiyou
  date: "-2698"
  title: 涿鹿之战，黄帝败蚩尤
  category: 战争
  tags: [民族, 传说]
  importance: 4
  summary: 华夏与东夷集团的传说性决战，后世奉为华夏共同体的起点。
  confidence: 传说
  dispute: |
    纯属传说，无任何考古或同时代文字支撑。战场地望、参战方、
    年代皆无定说。此条录入是因其在文化记忆中的分量，
    而非因其为史实。

- id: yao-shun-shanrang
  date: "-2259"
  title: 尧禅位于舜
  category: 政治
  tags: [制度, 传说]
  importance: 4
  summary: 儒家理想中的权力交接典范，与后世世袭制形成对照。
  confidence: 传说
  dispute: |
    《尚书》《孟子》述为禅让美谈；《竹书纪年》则载「昔尧德衰，
    为舜所囚」，直指政变。两说方向相反，皆无实证。
    禅让叙事的政治功能大于其史实性。

- id: dayu-zhishui
  date: "-2208"
  title: 大禹治水
  category: 灾害
  tags: [水利, 传说]
  importance: 5
  summary: 疏而不堵，十三年而水患平。禹因治水之功受舜禅让。
  confidence: 传说
  dispute: |
    治水传说可能反映了新石器晚期黄河流域的真实洪水记忆——
    地质证据显示约前1920年确有特大洪水。但将其与禹其人、
    与夏的建立挂钩，属后世的历史化建构。

- id: xia-founding
  date: "-2070"
  title: 禹传位于启，夏朝建立
  category: 政治
  tags: [制度, 王朝更替]
  importance: 5
  summary: 世袭制取代禅让制，中国进入王朝时代。
  confidence: 有争议
  dispute: |
    三重争议叠加：
    一、夏是否为信史。二里头遗址被多数中国学者视为夏文化遗存，
    但迄今未出土自证性文字，西方学界普遍持保留态度。
    二、年代。此处采夏商周断代工程说（前2070），该工程结论
    本身在学界争议甚大，另有前2100、前1900 等说。
    三、禅让转世袭的过程。《史记》称启继禹位，
    《竹书纪年》则载「益干启位，启杀之」，与禅让叙事相悖。
  sources: [史记·夏本纪, 竹书纪年]

- id: shang-founding
  date: "-1600"
  title: 商汤灭夏
  category: 政治
  importance: 5
  summary: 鸣条之战，桀奔南巢，夏亡。
  confidence: 有争议
  dispute: |
    鸣条之战与桀奔南巢皆出自传世文献，无同时代文字可证；
    夏本身的信史地位亦有争议（见 xia-founding 条）。年代采
    夏商周断代工程说（前1600），另有前1550 等说。

- id: oracle-bone
  date: "-1300"
