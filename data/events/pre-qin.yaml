  confidence: 确定

- id: zhou-founding
  date: "-1046"
  title: 武王伐纣，周朝建立
  category: 政治
  importance: 5
  summary: 牧野之战商亡。分封建国，制礼作乐。
  confidence: 有争议
  dispute: |
    牧野之战年代历来聚讼，自前1130至前1018凡四十余说。
    此处采夏商周断代工程说（前1046），前1044、前1027
