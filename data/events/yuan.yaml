- id: mongol-unification-1206
  date: "1206"
  title: 铁木真统一蒙古诸部
  category: 政治
  tags: [蒙古, 政权形成, 元明过渡]
  importance: 5
  summary: 铁木真在漠北诸部大会中被推举为成吉思汗，蒙古诸部由此形成统一的政治军事组织，随后展开对外扩张。
  confidence: 确定
  dispute: 1206年大会及称号的具体仪式细节主要见《蒙古秘史》等记载；本事件只承载统一与政权形成，不补传奇对白。
  sources: [蒙古秘史, 元史·太祖纪]

