  summary: 中华民国临时参议院通过、临时大总统孙中山正式公布《中华民国临时约法》。约法明确规定「中华民国之主权属于国民全体」，确立三权分立与责任内阁制，规定人民享有人身、言论、集会、结社等自由与平等权利，是中国历史上第一部具有资产阶级共和国宪法性质的根本大法，具有不可磨灭的民主法治启蒙意义。
