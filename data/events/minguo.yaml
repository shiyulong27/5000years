- id: cn-republic-of-china-established-191201
  date: '1912-01-01'
  title: 孙中山在南京宣誓就任临时大总统，民国建立
  category: 政治
  importance: 5
  summary: 孙中山在南京原两江总督署宣誓就任中华民国临时大总统，宣告中华民国临时政府正式成立。大会定都南京，改用公历（以1912年为中华民国元年），确立红黄蓝白黑「五色旗」为国旗，开创了中国历史上也是亚洲历史上第一个民主共和国，翻开了中华民族现代文明史的崭新篇章。
