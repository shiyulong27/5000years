- id: cn-twenty-one-demands-191505
  date: '1915-05-09'
  title: 袁世凯屈服日本「二十一条」，全国定为五九国耻
  category: 政治
  importance: 5
  summary: 日本驻华公使日置益趁一战欧美无暇东顾向袁世凯直接递交企图全面灭亡中国的密约「二十一条」，内容包括吞并山东、控制南满及东蒙、合办汉冶萍公司、长江沿岸要港不租借他国及聘用日本政治军事财政顾问等。袁世凯政府在最后通牒逼迫下接受前四号条款，激起全国四万万民众罢市、抵制日货的爱国怒潮，5月9日被定为「五九国耻日」。
