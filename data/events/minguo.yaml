  category: 文化
  importance: 5
  summary: 胡适在《新青年》发表《文学改良刍议》，首倡「不用典、不用套语、不讲对仗、不避俗字俗语」等文学改良八事，主张「白话文学之为中国文学之正宗」。陈独秀随即发表《文学革命论》高举「文学革命军三大主义」，钱玄同、刘半农、鲁迅等起而响应，彻底打破了文言文垄断两千余年的表达枷锁，现代汉语白话文与现代文学由此蓬勃诞生。
