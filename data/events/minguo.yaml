  importance: 5
  summary: 陈独秀在上海创办《青年杂志》（次年改名《新青年》），发表著名发刊词《敬告青年》，大声疾呼「国人而欲脱蒙昧时代，羞为浅化之民也，则急起直追，当以科学与人权（民主）并重」。新文化运动高举「德先生」（民主）与「赛先生」（科学）两面大旗，向腐朽封建伦理礼教发起猛烈冲击，开启了近代中国最深刻的思想解放与文化启蒙狂飙运动。
