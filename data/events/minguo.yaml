  summary: 袁世凯公然称帝改国号为「中华帝国」（洪宪元年）。蔡锷潜离北京返回昆明，与云南都督唐继尧、李烈钧等联衔通电全国宣告云南独立，成立护国军誓师讨伐帝制。蔡锷亲率护国第一军出师四川，在泸州、纳溪同北洋精锐血战数月屡创敌军；贵州、广西、广东等省相继响应独立，掀起波澜壮阔的全民护国讨袁反帝制运动。
