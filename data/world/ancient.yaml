- id: w-egypt-pyramid
  date: "-2560"
  title: 吉萨大金字塔建成
  category: 文化
  importance: 5
  summary: 胡夫金字塔，古代世界七大奇迹中唯一留存至今者。
  confidence: 有争议
  dispute: |
    年代依胡夫在位年推定，埃及年表各家重建相差数十年；
    建造方式本身亦无定论。

- id: w-hammurabi
  date: "-1754"
  title: 《汉谟拉比法典》颁行
  category: 政治
  importance: 5
  summary: 现存最完整的古代成文法典之一。
  confidence: 有争议
  dispute: |
    汉谟拉比年代有高、中、低三套年表，此处采中年代说
    （在位前1792–前1750），法典颁于其在位后期；
    高、低年代说各相差数十年。

- id: w-troy
  date: "-1200"
  title: 特洛伊战争
  category: 战争
  importance: 3
  summary: 荷马史诗所记，考古上确有其城毁于此时。
  confidence: 有争议
  dispute: |
    荷马所述战争是否史实无从证实；考古所能确认者，为特洛伊城
    （VIIa层）约前1180年毁于兵燹。年代为约值。

- id: w-rome-republic
  date: "-0509"
  title: 罗马共和国建立
  category: 政治
  importance: 5
  summary: 驱逐末代国王，行元老院与执政官之制。
  confidence: 有争议
  dispute: |
    前509为后世罗马史家的推定，早期史事半属传说；今学界多认为
    共和体制的形成是渐进过程，此年具象征意义。

- id: w-buddha
  date: "-0486"
  title: 释迦牟尼涅槃
  category: 文化
  importance: 5
  summary: 佛教自此传布，数百年后经西域入华。
  confidence: 有争议
  dispute: |
    佛陀生卒年有前566–前486（传统说）与约前480–前400（修正说）
    两大系统，相差数十年。此处采传统说。

