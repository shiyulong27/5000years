  concurrent: true
  summary: 太祖驱元建制，永乐迁都北京，中后期宦官专权、党争酷烈，终亡于李自成与清。

# ── 清：由极盛到三千年未有之变局 ───────────────────────────────
- id: qing
  name: 清
  start: "1636"
  end: "1912"
  capital: 北京
  color: "#a04000"
  # 1636–1644 与明并存，入关前后与南明政权亦有重叠，故声明
  concurrent: true
  summary: 由后金改称大清入主中原，康雍乾三朝鼎盛，晚清遭列强冲击，变法自强不果，终为辛亥革命终结。
