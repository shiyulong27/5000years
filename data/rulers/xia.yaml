# 夏代君主。
#
# 整个夏代的君主世系皆出自《史记·夏本纪》与《竹书纪年》，
# 二者在世系、年数上多有出入，且无出土文字可证。
# 故全部标 confidence: 有争议，年代为推定值而非确考。
#
# 按传统文献世系完整收录十七王。

- dynasty: xia
  temple_name: 禹
  name: 姒文命
  reign_start: "-2070"
  reign_end: "-2061"
  era_names: []
  tags: [帝王]
  note: 治水有功，受舜禅让
  role: founder
  confidence: 有争议
  dispute: |
    禹的历史性存疑。传世文献将其记为治水英雄与夏的奠基者，
    但顾颉刚等疑古派认为禹原为神话人物，后被历史化。
    遂公盨铭文（西周中期）已有「天命禹敷土」之语，
    可证西周时禹的传说已成形，但不足以证明夏初实有其人。

- dynasty: xia
  temple_name: 启
  name: 姒启
  reign_start: "-2061"
  reign_end: "-2052"
  era_names: []
  tags: [帝王]
  note: 首位世袭君主，家天下之始
  confidence: 有争议
  dispute: |
    继位方式有两说。《史记》称禹传位于益，益让于启；
    《竹书纪年》则载「益干启位，启杀之」。
    前者维护禅让叙事，后者直言武力夺位，两说不可调和。

