# 西周君主。
#
# 收录武王至幽王十二王。前841年国人暴动后，厉王出奔，周公、召公
# 「共和行政」或共伯和摄政，传统材料对主持者解释不同；该阶段不是一位
# 名为「共和」的君王，故不伪造 ruler 记录，而由事件数据呈现。
# 前841年以前的逐王绝对年代主要采用夏商周断代工程框架，仍有争议；
# 前841年以后进入中国传统纪年的连续年份体系。

- dynasty: xizhou
  temple_name: 周武王
  name: 姬发
  reign_start: "-1046"
  reign_end: "-1043"
  era_names: []
  tags: [帝王]
  note: 牧野克商，建立周朝并推行分封
  role: founder
  confidence: 有争议
  dispute: 牧野之战及武王在位年代有前1046、前1044、前1027等多种方案；此处采用夏商周断代工程框架。

