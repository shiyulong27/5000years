# 商代君主。
#
# 按《史记·殷本纪》的传统王序收录三十位实际即位者。太丁为汤太子，
# 但早卒未即位，故不计入「历任君王」；将其计入时才会出现「三十一王」口径。
# 晚商王名与大体先后次序可由殷墟甲骨卜辞互证，早商主要依赖传世文献。
# 下列绝对年代用于时间线定位，综合《竹书纪年》与夏商周断代工程框架，
# 不代表学界已有逐王纪年的定论。

- dynasty: shang
  temple_name: 汤
  name: 子履
  reign_start: "-1600"
  reign_end: "-1546"
  era_names: []
  tags: [帝王]
  note: 鸣条之战灭夏建商，传统称成汤、商汤
  role: founder
  confidence: 有争议
  dispute: 商汤建国年代与在位年数均无同时代文字可证；前1600年采用本项目的断代框架。

