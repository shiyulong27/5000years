  notes: 2026-08-26 实取成功（oldid=2016348）：字鹏举相州汤阴人、宣和四年应真定募、运用之妙存乎一心答宗泽、冻死不拆屋饿死不卤掠与撼山易撼岳家军难、麻札刀斫马足破郾城、十二金字牌十年之力废于一旦、裂裳示背尽忠报国四大字（注意非俗说精忠）、莫须有三字何以服天下、檜手書小紙付獄年三十九、论赞高宗忍自弃其中原故忍杀飞等关键句逐字在手。
